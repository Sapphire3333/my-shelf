<title>__TITLE__</title>
<style>
/*APP_CSS*/
</style>
<style>
/* ---- the mock's own frame. Everything above is My Shelf's stylesheet,
   inlined by new_mock.py, so the stage below wears the app's real classes. ---- */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1917; --card:#292524; --ink:#e8e6e3; --mut:#a8a29e; --faint:#979089;
  --line:#44403c; --teal:#2dd4bf; --teal-d:#5eead4; --rose:#fb7185;
  --warn-bg:#42320f; --warn-ink:#fcd34d; --teal-ink:#5eead4; --amber-ink:#e0a33a;
  color-scheme:dark}}
body{background:var(--bg);color:var(--ink);margin:0}
.mk{max-width:1120px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px;min-width:0}
.mk h1{font:600 24px/1.2 Georgia,"Times New Roman",serif;margin:0;text-wrap:balance}
.mk .mk-lede{color:var(--mut);margin:6px 0 0;max-width:66ch}
.mk-qs{display:grid;gap:14px}
.mk-q{display:grid;gap:6px;min-width:0}
.mk-q h2{font:700 12px/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0}
.mk-seg{display:flex;flex-wrap:wrap;gap:6px}
.mk-seg button{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:8px;cursor:pointer;text-align:left}
.mk-seg button[aria-pressed="true"]{background:var(--teal-d);border-color:var(--teal-d);color:#fff;font-weight:600}
[data-theme="dark"] .mk-seg button[aria-pressed="true"]{color:#1c1917}
.mk-seg button:focus-visible,.mk-sl input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mk-pick{font-size:11px;font-weight:700;margin-left:6px;letter-spacing:.03em;opacity:.9}
.mk-say{font-size:14px;color:var(--mut);margin:0;max-width:66ch}
.mk-sl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mk-sl input{flex:1 1 180px;min-width:0;accent-color:var(--teal)}
.mk-sl output{font-variant-numeric:tabular-nums;font-weight:700;min-width:6ch}
.mk-stage{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;min-width:0}
.mk-stage > #app{transform-origin:0 0;margin:0}
.mk-diff{font-size:13px;color:var(--mut);margin:0;max-width:72ch}
</style>

<div class="mk">
  <header><h1>__TITLE__</h1><p class="mk-lede" id="mkLede"></p></header>
  <div class="mk-qs" id="mkQs"></div>
  <div class="mk-stage" id="mkStage"><div id="app"><div id="main"></div></div></div>
  <p class="mk-diff" id="mkDiff"></p>
</div>

<script>
/* ================= FILL IN — the only part a mock changes ================= */

/* One or two sentences: what is being decided, in the reader's words. */
const LEDE = "What this page lets you compare, in a sentence.";

/* One entry per decision: [key, heading, [[value, label, myPick?], ...]].
   Mark exactly one option per question as the pick. */
const QUESTIONS = [
  ["genre", "Where the genre sits", [["side", "Beside the title"], ["under", "Under the author", true]]],
];

/* Wherever the real question is HOW MUCH: [key, heading, min, max, step, start, unit]. */
const SLIDERS = [
  ["lines", "Lines of blurb", 0, 5, 1, 3, ""],
];

/* Optional line under a question for the chosen value, keyed "key:value".
   Say what it means in practice, with an example, not an abstract trade-off. */
const SAYS = {
  "genre:side": "As today: the genre chip stands in its own column on the right.",
  "genre:under": "The chip joins the line under the author, so the title gets the full width.",
};

/* Where this page is not the app, and which way that cuts. */
const DIFFERS = "Where this mock differs from the app: covers are flat colour here, so the real thing looks busier, not calmer.";

/* Returns the stage's HTML for state s — s.device is "computer" or "phone",
   plus one value per question and slider. Build it from the app's own markup
   (copy what rowHtml(b) and friends return in the running app), not an
   imitation of it. The row below is rowHtml's real output for an invented book. */
function draw(s){
  const chip = `<span class="chip" style="background:#ededec;border-color:#d4d2d0;color:#524d49">Fantasy</span>`;
  const blurb = "An invented blurb, long enough to need several lines: a lighthouse keeper finds a door in the rocks that was not there yesterday, and behind it a staircase going down further than the cliff is tall. What she brings back up changes the village, the harbour and, eventually, the sea.";
  const row = (title, author, pct) => `<div class="row">
    <div class="thumb"><span class="gencov" style="background:linear-gradient(160deg,#6b617be6,#6b617b)"><i style="background:#ffffff54"></i><b style="color:#ffffff">${title}</b></span></div>
    <div class="rmain">
      <div class="rtitle serif">${title}</div>
      <div class="rauth">${author}<span class="rser own">320 p.</span></div>
      <div class="chiprow">${s.genre === "under" ? chip : ""}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap">
        <span class="prog" style="width:88px"><i style="width:${pct}%"></i></span><span class="rr">${pct}% · p.${Math.round(3.2 * pct)} of 320</span></div>
    </div>
    ${s.genre === "side" ? `<div class="rside"><div class="rgen">${chip}</div></div>` : ""}
    ${s.lines ? `<div class="rsum" style="-webkit-line-clamp:${s.lines}">${blurb}</div>` : ""}
  </div>`;
  return `<div class="wrap" style="padding:12px 0">${row("An Invented Title", "A. N. Author", 38)}${row("Another Made-Up Book", "B. Writer", 72)}</div>`;
}

/* ================= the frame — leave alone ================= */

/* Layout px, i.e. screen width divided by the text size — the number the
   app's own buckets (applyWidthClass) are cut on. Computer = the sweep's
   widest pass, scaled down to fit the room. The phones are drawn as wide as
   a phone's screen and no wider: full-bleed when the page is read ON a phone,
   phone-sized on a computer — never a small frame inside a phone. */
const DEVICES = {
  computer: {label: "Computer", layout: 1588, vw: "wide", phone: "0"},
  phone: {label: "Phone", layout: 412, vw: "tiny", phone: "1"},
  phoneBig: {label: "Phone, big text", layout: 190, vw: "micro", phone: "1"},
};
const PHONE_SCREEN = 440;
const S = {device: "computer"};
for (const [k, , opts] of QUESTIONS) S[k] = (opts.find(o => o[2]) || opts[0])[0];
for (const [k, , , , , start] of SLIDERS) S[k] = start;

const root = document.documentElement;
const darkQ = matchMedia("(prefers-color-scheme: dark)");
function theme(){ root.setAttribute("data-theme", darkQ.matches ? "dark" : "light"); }
theme();
darkQ.addEventListener("change", theme);

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function controls(){
  const qs = [["device", "Seen on", Object.entries(DEVICES).map(([k, d]) => [k, d.label])], ...QUESTIONS];
  let h = "";
  for (const [k, title, opts] of qs){
    h += `<section class="mk-q"><h2>${esc(title)}</h2><div class="mk-seg">`
      + opts.map(([v, label, pick]) => `<button type="button" data-k="${k}" data-v="${esc(v)}" aria-pressed="${S[k] === v}">${esc(label)}${pick ? '<span class="mk-pick">my pick</span>' : ""}</button>`).join("")
      + `</div>${SAYS[k + ":" + S[k]] ? `<p class="mk-say">${SAYS[k + ":" + S[k]]}</p>` : ""}</section>`;
  }
  for (const [k, title, min, max, step, , unit] of SLIDERS){
    h += `<section class="mk-q"><h2>${esc(title)}</h2><div class="mk-sl">
      <input type="range" data-s="${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}" aria-label="${esc(title)}">
      <output>${S[k]}${unit || ""}</output></div></section>`;
  }
  const box = document.getElementById("mkQs");
  box.innerHTML = h;
  box.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { S[b.dataset.k] = b.dataset.v; controls(); render(); });
  box.querySelectorAll("[data-s]").forEach(r => r.oninput = () => {
    S[r.dataset.s] = +r.value;
    r.nextElementSibling.textContent = r.value + (SLIDERS.find(x => x[0] === r.dataset.s)[6] || "");
    render();
  });
}

function fit(){
  const d = DEVICES[S.device], stage = document.getElementById("mkStage"), app = document.getElementById("app");
  const room = stage.clientWidth;
  const z = d.phone === "1" ? Math.min(room, PHONE_SCREEN) / d.layout : Math.min(1, room / d.layout);
  app.style.width = d.layout + "px";
  app.style.zoom = z.toFixed(3);
  app.style.margin = d.phone === "1" ? "0 auto" : "0";
}

function render(){
  const d = DEVICES[S.device];
  root.setAttribute("data-vw", d.vw);
  root.setAttribute("data-phone", d.phone);
  document.getElementById("main").innerHTML = draw(S);
  fit();
}

document.getElementById("mkLede").textContent = LEDE;
document.getElementById("mkDiff").textContent = DIFFERS;
addEventListener("resize", fit);
controls();
render();
</script>
