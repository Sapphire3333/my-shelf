<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>A page of a shelf</title>
<style>
  /* A read-only page made from one file in the public "shares" bucket. The file's
     name is the part after # in the address, and a # is never sent to a server.
     It holds only what shareSnapshot in index.html chose to put in it. */
  :root{--bg:#faf7f2;--card:#fff;--ink:#292524;--mut:#6a635d;--line:#e7e5e4;--amber:#92400e;--amberbg:#fef3c7;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--ink:#e8e6e3;--mut:#a8a29e;--line:#44403c;--amber:#fcd34d;--amberbg:#422006;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
  h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px;overflow-wrap:anywhere}
  .say{color:var(--mut);font-size:14px;margin:0 0 18px}
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,46%),1fr));gap:16px 12px}
  .bk{min-width:0}
  .cov{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0003;background:var(--line)}
  .cov img{display:block;width:100%;height:100%;object-fit:cover}
  .gen{position:absolute;inset:0;display:flex;align-items:center;padding:10px 10px 10px 16px;color:#fff;font:600 14px/1.25 Georgia,"Times New Roman",serif;overflow:hidden;overflow-wrap:anywhere}
  .gen::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:3px;background:#ffffff54}
  .t{font:600 15px/1.25 Georgia,"Times New Roman",serif;margin-top:6px;overflow-wrap:anywhere}
  .a{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
  .m{display:inline-block;margin-top:3px;background:var(--amberbg);color:var(--amber);font-weight:600;font-size:13px;border-radius:6px;padding:0 7px}
  footer{color:var(--mut);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<main id="page" aria-live="polite"><p class="say">Opening…</p></main>
<noscript><p style="padding:16px">This page needs JavaScript to show the books.</p></noscript>
<script src="./config.js"></script>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeColor=c=>/^#[0-9a-f]{3,8}$/i.test(String(c||""))?c:"#5b5d78";
const safeCover=c=>/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(String(c||""))?c:"";
const longDay=d=>{const t=new Date(String(d)+"T12:00");return isNaN(t)?"":t.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});};
function drawShare(data){
  const list=Array.isArray(data&&data.books)?data.books:[];
  document.title=String(data&&data.title||"A page of a shelf").slice(0,80);
  const when=longDay(data&&data.at);
  document.getElementById("page").innerHTML=`<h1>${esc(data&&data.title||"A page of a shelf")}</h1>
    <p class="say">${list.length.toLocaleString()} ${list.length===1?"book":"books"} from someone's shelf${when?`, as it stood on ${esc(when)}`:""}.</p>
    <div class="wall">${list.map(b=>{const c=safeCover(b&&b.c),hasMark=b&&b.m!=null&&isFinite(Number(b.m));
      return `<div class="bk"><div class="cov">${c?`<img src="${c}" alt="" loading="lazy">`:`<div class="gen" style="background:${safeColor(b&&b.g)}">${esc(b&&b.t)}</div>`}</div>
        <div class="t">${esc(b&&b.t)}</div>${b&&b.a?`<div class="a">${esc(b.a)}</div>`:""}${hasMark?`<span class="m">★ ${esc(Number(b.m))}</span>`:""}</div>`;}).join("")}</div>
    <footer>Read only. Made with My Shelf.</footer>`;
}
function shareGone(){
  document.getElementById("page").innerHTML=`<h1>This page isn't here</h1><p class="say">It may have been taken down, or the link may be cut short. Ask whoever sent it for the link again.</p>`;
}
(async()=>{
  const key=location.hash.replace(/^#/,"");
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(key)||typeof CFG==="undefined"||!CFG.url){shareGone();return;}
  try{
    const r=await fetch(`${String(CFG.url).replace(/\/+$/,"")}/storage/v1/object/public/shares/${key}.json`);
    if(!r.ok)throw new Error("gone");
    drawShare(await r.json());
  }catch(e){shareGone();}
})();
</script>
</body>
</html>
