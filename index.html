          <div class="inrow" style="gap:6px">
            <button class="entfav${en.favorite?" on":""}" data-efav="${en.id}" title="${en.favorite?"One of your favourite stories":"Mark this story as a favourite"}">${en.favorite?"♥":"♡"}</button>
            <span class="boxbtn entsub" style="cursor:default">Status <select class="entsel" data-est="${en.id}" title="Where this story is up to, if it differs from the collection">
              <option value=""${(!en.dnf&&!en.status)?" selected":""}>same</option>
              ${STATUSES.map(([k,l])=>`<option value="${k}"${(!en.dnf&&en.status===k)?" selected":""}>${esc(l)}</option>`).join("")}
              <option value="dnf"${en.dnf?" selected":""}>Did not finish</option>
            </select></span>
            <span class="boxbtn entsub" style="cursor:default;flex:1;min-width:96px">Author <input class="entsel" data-eau="${en.id}" value="${esc(en.author||"")}" placeholder="same${cur.author?" — "+esc(cur.author):""}" title="Its own author, if it differs from the collection's" style="flex:1"></span>
            <button class="btn entsub" data-egen="${en.id}" title="Genres for this story on its own">Genres · ${entOwnGenres(en)?en.genres.length:"same"}</button>
          </div>
          <div class="entreads" data-enrw="${en.id}">${readListHtml(en,en.id,false)}</div>
          <div class="entrich" contenteditable="true" data-es="${en.id}" data-ph="Summary…"></div>
          <div class="entrich" contenteditable="true" data-eno="${en.id}" data-ph="Notes…"></div>
        </div>
      </div>`).join("")||'<span class="none">Nothing added yet.</span>';
    const find=id=>cur.entries.find(x=>x.id===id);
    qa("[data-et]",list).forEach(el=>el.addEventListener("input",()=>{find(el.dataset.et).title=el.value;scheduleSave();}));
    qa("[data-er]",list).forEach(el=>el.addEventListener("input",()=>{const v=el.value;
      find(el.dataset.er).rating=v===""?null:Math.min(10,Math.max(0,parseFloat(v)||0));
      if(syncCollRating(cur)){const f=q("#fRate");if(f)f.value=cur.rating;}
      refreshRate();scheduleSave();}));
    qa("[data-ep]",list).forEach(el=>el.addEventListener("input",()=>{const v=el.value;
      find(el.dataset.ep).pages=v===""?"":Math.max(1,parseInt(v)||0);sumEntryPages();scheduleSave();}));
    qa("[data-es]",list).forEach(el=>{el.innerHTML=find(el.dataset.es).summary||"";
      el.addEventListener("input",()=>{find(el.dataset.es).summary=el.innerHTML;scheduleSave();});});
    qa("[data-eno]",list).forEach(el=>{el.innerHTML=find(el.dataset.eno).notes||"";
      el.addEventListener("input",()=>{find(el.dataset.eno).notes=el.innerHTML;scheduleSave();});});
    qa("[data-efav]",list).forEach(el=>el.onclick=()=>{
      const en=find(el.dataset.efav);en.favorite=!en.favorite;renderEntries();scheduleSave();});
    qa("[data-est]",list).forEach(el=>el.addEventListener("change",()=>{
      /* choosing a stage for a story opens or closes a reading of it, the same
         way choosing one for a book does */
      markEntStatus(cur,find(el.dataset.est),el.value);
      renderEntReads(el.dataset.est);scheduleSave();}));
    /* one story's readings, redrawn where they sit without disturbing the rest */
    function renderEntReads(id){
      const w=q(`[data-enrw="${id}"]`,list);const en=find(id);
      if(!w||!en)return;
      w.innerHTML=readListHtml(en,en.id,false);
      wireEntReads(w,en);
    }
    function wireEntReads(w,en){
      qa("[data-rst],[data-ren]",w).forEach(el=>el.addEventListener("input",()=>{
        const r=readsOf(en).find(x=>x.id===(el.dataset.ren||el.dataset.rst));
        if(!r)return;
        if(el.dataset.ren)r.end=el.value;else r.start=el.value;
        syncReads(en);scheduleSave();}));
      qa("[data-rdel]",w).forEach(el=>el.onclick=()=>{
        const rs=readsOf(en),i=rs.findIndex(x=>x.id===el.dataset.rdel);
        if(i<0)return;
        const gone=rs.splice(i,1)[0];
        /* struck off the reading it was in the middle of: the story is no longer
           being read, and must say so itself rather than fall quiet and take the
           collection's word for it */
        if(gone&&gone.open&&en.status==="reading")en.status=doneReads(en).length?"finished":"want";
        syncReads(en);renderEntries();scheduleSave();});
      qa("[data-radd]",w).forEach(el=>el.onclick=()=>{
        readsOf(en).push({id:uid(),start:"",end:""});
        syncReads(en);renderEntReads(en.id);scheduleSave();});
    }
    qa("[data-enrw]",list).forEach(w=>wireEntReads(w,find(w.dataset.enrw)));
    qa("[data-eau]",list).forEach(el=>el.addEventListener("input",()=>{
      find(el.dataset.eau).author=el.value;scheduleSave();}));
    qa("[data-egen]",list).forEach(el=>el.onclick=()=>openEntGenres(el.dataset.egen));
    qa("[data-ec]",list).forEach(el=>el.onclick=()=>{pendingEnt=el.dataset.ec;q("#entCoverFile").click();});
    qa("[data-ex]",list).forEach(el=>el.onclick=()=>{
      const en=find(el.dataset.ex);if(!en)return;
      if(!confirm(`Remove “${en.title||"Untitled"}” from this collection?`))return;
      if(SYNC.on&&en.cover)enqueue({kind:"imgDel",key:cur.id+"|"+en.id});
      delete curEnt[en.id];
      cur.entries=cur.entries.filter(x=>x.id!==en.id);
      renderEntries();scheduleSave();
    });
    const move=(id,dir)=>{
      const i=cur.entries.findIndex(x=>x.id===id);
      const j=i+dir;
      if(i<0||j<0||j>=cur.entries.length)return;
      [cur.entries[i],cur.entries[j]]=[cur.entries[j],cur.entries[i]];
      renderEntries();scheduleSave();
    };
    qa("[data-eu]",list).forEach(el=>el.onclick=()=>move(el.dataset.eu,-1));
    qa("[data-ed]",list).forEach(el=>el.onclick=()=>move(el.dataset.ed,1));
    qa("[data-ef]",list).forEach(el=>el.onclick=()=>{const e2=find(el.dataset.ef);if(e2)openFetchPanel(e2);});
    /* type a position into the number and the story jumps there */
    qa("[data-en]",list).forEach(el=>el.addEventListener("change",()=>{
      const i=cur.entries.findIndex(x=>x.id===el.dataset.en);
      if(i<0)return;
      let p=Math.round(parseFloat(el.value));
      if(!p||p-1===i){renderEntries();return;}
      p=Math.max(0,Math.min(cur.entries.length-1,p-1));
      const [en]=cur.entries.splice(i,1);
      cur.entries.splice(p,0,en);
      renderEntries();scheduleSave();
    }));
    q("#entAdd").onclick=()=>{
      cur.entries.push(blankEntry());renderEntries();scheduleSave();
      const ins=qa("[data-et]",q("#entList"));if(ins.length)ins[ins.length-1].focus();
    };
    q("#entFold").onclick=openFoldPanel;
    q("#entOrder").onclick=openOrderPanel;
    sumEntryPages();
    syncCollRating(cur);
    const fr=q("#fRate");if(fr&&!cur.ratingOwn&&cur.rating!=null)fr.value=cur.rating;
    refreshRate();
  }
  /* tap the rows 1, 2, 3… then Save — used for a collection's stories and for
     the +/−/quote lists */
  function showOrderPanel(opts){
    const box=q("#orderPanel");box.hidden=false;
    let seq=[];   /* row ids in tap order */
    const draw=()=>{
      box.innerHTML=`
        <div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⇅ ${esc(opts.title)}</b>
          <button class="btn" id="odClose" style="margin-left:auto;padding:4px 10px">Cancel</button></div>
        <div class="hint" style="margin:0 0 7px">Tap them one by one — they're numbered 1, 2, 3… as you go. Tap a numbered one to take it back out. Anything left unnumbered keeps its current order, after the numbered ones.</div>
        ${opts.rows.map(row=>{
          const n=seq.indexOf(row.id);
          return `<button class="snap" data-od="${esc(row.id)}" style="width:100%;cursor:pointer;${n>=0?"border-color:var(--teal)":""}">
            <b class="cnt" style="flex:none;${n>=0?"background:var(--teal);color:#fff":""}">${n>=0?n+1:"·"}</b>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;text-align:left">${esc(row.text)||"(empty)"}</span>
          </button>`;}).join("")}
        <div class="hrow2" style="margin-top:9px">
          <button class="btn pri" id="odSave" ${seq.length?"":"disabled"}>Save this order</button>
          <button class="btn" id="odReset" ${seq.length?"":"disabled"}>Start over</button>
        </div>`;
      q("#odClose",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
      q("#odReset",box).onclick=()=>{seq=[];draw();};
      qa("[data-od]",box).forEach(b=>b.onclick=()=>{
        const id=b.dataset.od;
        const i=seq.indexOf(id);
        if(i>=0)seq.splice(i,1);else seq.push(id);
        draw();
      });
      q("#odSave",box).onclick=()=>{
        if(!seq.length)return;
        box.hidden=true;box.innerHTML="";
        opts.onSave(seq);
      };
    };
    draw();
  }
  function openOrderPanel(){
    showOrderPanel({title:"Tap the stories in the order you want",
      rows:cur.entries.map(en=>({id:en.id,text:en.title||"Untitled"})),
      onSave:ids=>{
        const picked=ids.map(id=>cur.entries.find(e=>e.id===id)).filter(Boolean);
        const rest=cur.entries.filter(e=>!ids.includes(e.id));
        cur.entries=[...picked,...rest];
        renderEntries();scheduleSave();
      }});
  }
  /* quotes, likes and dislikes — same tap-to-number ordering */
  function openListOrder(key){
    if((cur[key]||[]).length<2)return;
    const LBL={pros:"liked points",cons:"disliked points",meh:"middling points",quotes:"quotes"};
    showOrderPanel({title:`Tap the ${LBL[key]||"items"} in the order you want`,
      rows:cur[key].map((html,i)=>({id:String(i),text:stripHtml(html).slice(0,90)})),
      onSave:ids=>{
        const idx=ids.map(Number);
        const picked=idx.map(i=>cur[key][i]);
        const rest=cur[key].filter((_,i)=>idx.indexOf(i)<0);
        cur[key]=[...picked,...rest];
        renderList(key);scheduleSave();
      }});
  }
  /* pick a book that has its own page and fold it into this collection */
  function openFoldPanel(){
    const box=q("#foldPanel");box.hidden=false;
    let fq="";
    const draw=()=>{
      const ql=fq.trim().toLowerCase();
      const pool=books.filter(b=>b.id!==cur.id&&!isColl(b)
        &&(!ql||(b.title||"").toLowerCase().includes(ql)||(b.author||"").toLowerCase().includes(ql)))
        .sort((a,b)=>(a.title||"").localeCompare(b.title||""));
      box.innerHTML=`
        <div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⤵ Fold a book into this collection</b>
          <button class="btn" id="fdClose" style="margin-left:auto;padding:4px 10px">Close</button></div>
        <div class="hint" style="margin:0 0 7px">Its notes, rating, pages and cover become a story in here; its own page moves to Recently deleted (restorable for ${TRASH_DAYS} days).</div>
        <input class="field" id="fdSearch" placeholder="Search by title or author…" value="${esc(fq)}" style="font-size:13px;padding:7px 11px;margin-bottom:7px">
        ${pool.slice(0,30).map(b=>`<div class="snap" style="padding:6px 10px">
          <div style="min-width:0;flex:1"><div class="when" style="font-size:13px">${esc(b.title)||"Untitled"}</div>
            <div class="meta">${esc(b.author)||"Unknown author"}${b.rating!=null?` · ★ ${Number(b.rating).toFixed(1)}`:""}</div></div>
          <button class="btn" data-fb="${b.id}" style="padding:3px 9px">Fold in</button>
        </div>`).join("")||'<div class="none">Nothing matches.</div>'}
        ${pool.length>30?`<div class="none" style="margin-top:5px">…and ${pool.length-30} more — search to narrow it.</div>`:""}`;
      q("#fdClose",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
      const se=q("#fdSearch",box);
      se.oninput=()=>{fq=se.value;draw();
        const s2=q("#fdSearch",box);if(s2){s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length);}};
      qa("[data-fb]",box).forEach(btn=>btn.onclick=async()=>{
        const b=books.find(x=>x.id===btn.dataset.fb);if(!b)return;
        if(!confirm(`Fold “${b.title||"Untitled"}” into this collection?\n\nIts own page moves to Recently deleted — notes, rating, pages, cover, the stage it's at and the day you finished it all carry over.`))return;
        btn.disabled=true;
        /* the collection may have no author yet — take this book's, so nothing
           is lost into a "same as the collection" that means same as nothing */
        if(!String(cur.author||"").trim()&&String(b.author||"").trim())cur.author=String(b.author).trim();
        const {en,coverData}=await bookToEntry(b,cur.id,statusOf(cur),cur.author,cur.dnf);
        cur.entries.push(en);
        if(coverData)curEnt[en.id]=coverData;
        await retireBook(b);
        if(SYNC.on)flushQueue();
        renderEntries();scheduleSave();
        draw();
      });
    };
    draw();
  }
  renderEntries();

  /* status segmented */
  function renderStatus(){
    q("#statusSeg").innerHTML=STATUSES.map(([id,l])=>{
      const on=statusOf(cur)===id;
      const cls=on?(id==="finished"?"fin":id==="reading"?"rea":"wan"):"";
      return `<button class="${cls}" data-st="${id}">${l}</button>`;}).join("");
    /* choosing a stage here opens or closes a reading, exactly as it does on the
       shelf and on the book's own page — one rule, wherever you happen to be */
    qa("[data-st]").forEach(x=>x.onclick=()=>{
      markStatus(cur,x.dataset.st);
      /* saying it is finished says it is not set aside — the DNF button here has
         to agree, as the one on the shelf and on the book's own page already do */
      const d=q("#fDnf");if(d)d.classList.toggle("dnfon",!!cur.dnf);
      renderStatus();renderProgress();renderDnf();renderReads();scheduleSave();});
  }
  renderStatus();

  /* the readings themselves — the dates behind the stage you just chose */
  function renderReads(){
    const w=q("#readWrap");if(!w)return;
    const n=timesRead(cur);
    w.innerHTML=`<div class="lbl" style="margin:2px 0 4px">Readings${n>1?` — you've been through it ${n} times`:""}</div>`+readListHtml(cur,cur.id);
    qa("[data-rst],[data-ren]",w).forEach(el=>el.addEventListener("input",()=>{
      const r=readsOf(cur).find(x=>x.id===(el.dataset.ren||el.dataset.rst));
      if(!r)return;
      if(el.dataset.ren)r.end=el.value;else r.start=el.value;
      syncReads(cur);scheduleSave();
    }));
    qa("[data-rdel]",w).forEach(el=>el.onclick=()=>{
      const rs=readsOf(cur),i=rs.findIndex(x=>x.id===el.dataset.rdel);
      if(i<0)return;
      const gone=rs.splice(i,1)[0];
      /* strike off the reading you were in the middle of and you are no longer in
         the middle of it — otherwise the shelf would still say READING */
      if(gone&&gone.open&&statusOf(cur)==="reading"&&!cur.dnf){
        cur.status=doneReads(cur).length?"finished":"want";renderStatus();renderProgress();
      }
      syncReads(cur);renderReads();scheduleSave();
    });
    qa("[data-radd]",w).forEach(el=>el.onclick=()=>{
      readsOf(cur).push({id:uid(),start:"",end:""});
      syncReads(cur);renderReads();scheduleSave();
    });
  }
  renderReads();

  /* how far in — only while you're actually reading it */
  function progBarUI(){
    const p=pctOf(cur);
    const bar=q("#progBar"),lab=q("#progPct");
    if(bar)bar.style.width=(p||0)+"%";
    if(lab)lab.textContent=p==null?"":p+"%";
  }
  function renderProgress(){
    const w=q("#progWrap");
    if(statusOf(cur)!=="reading"){w.innerHTML="";return;}
    const total=parseInt(cur.pages)||0;
    w.innerHTML=`<div class="inrow">
      <span class="boxbtn" style="cursor:default">On page
        <input type="number" id="fProg" min="0" ${total?`max="${total}"`:""} placeholder="–" value="${esc(String(cur.progress||""))}" style="border:none;width:60px;text-align:center;font-weight:600">
        <span class="lbl" id="progOf">${total?`of ${total}`:"— add a page count below"}</span>
      </span>
      ${total?`<span class="prog" style="flex:1;min-width:110px"><i id="progBar" style="width:0%"></i></span><b id="progPct" style="font-size:12px;color:var(--mut);width:34px"></b>`:""}
    </div>`;
    q("#fProg",w).addEventListener("input",e=>{
      setProgress(cur,e.target.value);
      progBarUI();scheduleSave();
    });
    progBarUI();
  }
  renderProgress();

  /* DNF panel */
  function renderDnf(){
    const w=q("#dnfWrap");
    if(!cur.dnf){w.innerHTML="";return;}
    const all=[...DEFAULT_DNF,...dnfCustom];
    w.innerHTML=`<div class="dnfbox"><div class="cap">Why it wasn't finished</div>
      <div>${all.map(r=>`<button class="rsn ${cur.dnfReasons.includes(r)?"on":""}" data-r="${esc(r)}">${cur.dnfReasons.includes(r)?"✓ ":""}${esc(r)}</button>`).join("")}</div>
      <div class="inrow" style="margin-top:8px"><input class="field" id="dnfIn" placeholder="Add your own reason…" style="flex:1;font-size:13px;padding:7px 10px">
      <button class="pill on2" id="dnfAdd" style="border:none">Add</button></div></div>`;
    qa("[data-r]",w).forEach(x=>x.onclick=()=>{const r=x.dataset.r;
      cur.dnfReasons=cur.dnfReasons.includes(r)?cur.dnfReasons.filter(y=>y!==r):[...cur.dnfReasons,r];
      renderDnf();scheduleSave();});
    q("#dnfAdd",w).onclick=()=>{const v=q("#dnfIn",w).value.trim();if(!v)return;
      if(![...DEFAULT_DNF,...dnfCustom].includes(v)){dnfCustom.push(v);saveMeta();}
      if(!cur.dnfReasons.includes(v))cur.dnfReasons.push(v);
      renderDnf();scheduleSave();};
    q("#dnfIn",w).addEventListener("keydown",e=>{if(e.key==="Enter")q("#dnfAdd",w).click();});
  }
  renderDnf();

  /* audience — tick as many as fit */
  function renderAud(){
    const w=q("#audWrap");
    const mine=audsOf(cur);
    const audAll=[...new Set([...DEFAULT_AUD,...audCustom,...mine])];
    w.innerHTML=`<div class="lbl" style="display:block;margin-bottom:3px">Who it's for${mine.length>1?` — ${mine.length} picked`:""}</div><div>
      ${audAll.map(a=>{const on=mine.indexOf(a)>=0;
        return `<button class="rsn ${on?"on":""}" data-a="${esc(a)}">${on?"✓ ":""}${esc(a)}</button>`;}).join("")}
      <input id="audIn" class="addin" style="width:150px;display:inline-block;margin:2px 0 0 2px" placeholder="Add… (Enter)"></div>`;
    qa("[data-a]",w).forEach(x=>x.onclick=()=>{
      const a=x.dataset.a,list=audsOf(cur);
      setAuds(cur,list.indexOf(a)>=0?list.filter(y=>y!==a):[...list,a]);
      renderAud();scheduleSave();});
    wireAddIn(q("#audIn",w),v=>{
      if(![...DEFAULT_AUD,...audCustom].includes(v)){audCustom.push(v);saveMeta();}
      const list=audsOf(cur);
      if(list.indexOf(v)<0)setAuds(cur,[...list,v]);
      renderAud();scheduleSave();});
  }
  renderAud();

  /* keywords */
  function addKw(t){
    const v=titleCase((t||"").trim());if(!v)return;
    if(cur.keywords.some(k=>k.toLowerCase()===v.toLowerCase()))return;
    cur.keywords.push(v);renderKw();scheduleSave();
  }
  /* Every keyword the shelf knows, kept in one vocabulary so the same one gets
     reused rather than retyped: alphabetical, narrowed as you type, tap to add. */
  function knownKeywords(){
    return [...new Set([...books.flatMap(b=>b.keywords||[]),...Object.keys(kwColors)])]
      .filter(Boolean).sort((a,b)=>a.localeCompare(b));
  }
  function renderKwSug(){
    const box=q("#kwSug");if(!box)return;
    const inp=q("#kwIn");
    const typed=(inp?inp.value:"").trim().toLowerCase();
    const mine=new Set(cur.keywords.map(k=>k.toLowerCase()));
    const pool=knownKeywords().filter(k=>!mine.has(k.toLowerCase()));
    const shown=typed?pool.filter(k=>k.toLowerCase().includes(typed)):pool;
    const exact=typed&&knownKeywords().some(k=>k.toLowerCase()===typed);
    /* gathered by family, so a long list stays navigable */
    const fams={};
    shown.forEach(k=>{const c=kwCats[k]||"";(fams[c]=fams[c]||[]).push(k);});
    const named=Object.keys(fams).filter(Boolean).sort((a,b)=>a.localeCompare(b));
    const chips=list=>list.map(k=>`<span class="kw" data-ks="${esc(k)}" style="cursor:pointer;${kwStyle(k)}">${esc(k)}</span>`).join("");
    box.innerHTML=(shown.length
        ?`<div class="lbl" style="display:block;margin:6px 0 3px">${typed?`Matching (${shown.length})`:`Already in use (${shown.length}) — tap to add`}</div>
          <div class="kwpick">${named.map(c=>
              `<div class="kwfam"><span class="kwfamname"${catColors[c]?` style="color:${catColors[c]}"`:""}>${esc(c)}</span>${chips(fams[c])}</div>`).join("")
            }${fams[""]&&fams[""].length?`<div class="kwfam">${named.length?'<span class="kwfamname">Loose</span>':""}${chips(fams[""])}</div>`:""}</div>`
        :(typed?`<div class="lbl" style="margin-top:6px">Nothing like that yet — press Enter to make it.</div>`:""))
      +(typed&&!exact&&shown.length?`<div class="lbl" style="margin-top:4px">…or press Enter for a new one.</div>`:"");
    qa("[data-ks]",box).forEach(x=>x.onclick=()=>addKw(x.dataset.ks));
  }
  function renderKw(){
    const w=q("#kwWrap");
    const others=[...new Set(books.flatMap(b=>b.id===cur.id?[]:(b.keywords||[])))];
    const btext=stripHtml([cur.title,cur.summary,cur.canvasText,...(cur.quotes||[]),...(cur.pros||[]),...(cur.cons||[]),...(cur.meh||[]),
      ...(cur.pads||[]).map(p=>p.html||""),...(cur.entries||[]).map(en=>(en.title||"")+" "+(en.summary||"")+" "+(en.notes||""))].join(" ")).toLowerCase();
    const sug=others.filter(k=>!cur.keywords.some(x=>x.toLowerCase()===k.toLowerCase())&&btext.includes(k.toLowerCase())).slice(0,10);
    w.innerHTML=`<div class="lbl" style="display:block;margin:10px 0 3px">Keywords</div>
      <div class="chiprow">${(()=>{const kbr=new Set(cur.kwBreaks||[]);
        return cur.keywords.map((k,i)=>
          `<span class="kw" data-kedit="${esc(k)}" style="font-size:12px;padding:2px 7px;${kwStyle(k)}">`
          +(tagEdit?`<button class="chmv" data-kmv="${i}|-1" title="Move it left">◀</button>`:"")
          +esc(k)
          +(tagEdit?`<button class="chmv" data-kmv="${i}|1" title="Move it right">▶</button>`
            +`<button class="chmv ${kbr.has(k)?"on":""}" data-kbr="${esc(k)}" title="${kbr.has(k)?"Let the next one sit beside this":"Start a new row after this"}">↵</button>`:"")
          +` <button class="x" data-kx="${i}" style="cursor:pointer;opacity:.6;background:none;border:none;color:inherit;font:inherit;padding:0" title="Remove this keyword">✕</button></span>`
          +(kbr.has(k)?'<span class="rowbreak"></span>':"")).join("");})()}</div>
      <input id="kwIn" class="addin" placeholder='Search your keywords, or type a new one… (Enter)'>
      <div id="kwSug"></div>
      ${sug.length?`<div class="hint" style="margin-top:6px">Turning up in this book's own writing: ${sug.map(k=>`<span class="kw" data-ks2="${esc(k)}" style="cursor:pointer;font-size:11px;padding:1px 6px;border-style:dashed">＋ ${esc(k)}</span>`).join("")}</div>`:""}`;
    qa("[data-kx]",w).forEach(x=>x.onclick=e=>{e.stopPropagation();
      const gone=cur.keywords[+x.dataset.kx];
      cur.keywords.splice(+x.dataset.kx,1);
      cur.kwBreaks=(cur.kwBreaks||[]).filter(k=>k!==gone);
      renderKw();scheduleSave();});
    qa("[data-kmv]",w).forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      const [i,d]=x.dataset.kmv.split("|").map(Number),j=i+d;
      if(j<0||j>=cur.keywords.length)return;
      const a=cur.keywords;[a[i],a[j]]=[a[j],a[i]];
      renderKw();scheduleSave();});
    qa("[data-kbr]",w).forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      const k=x.dataset.kbr,s=new Set(cur.kwBreaks||[]);
      s.has(k)?s.delete(k):s.add(k);
      cur.kwBreaks=[...s];
      renderKw();scheduleSave();});
    qa("[data-kedit]",w).forEach(x=>x.onclick=e=>{
      if(e.target.closest("[data-kx],[data-kmv],[data-kbr]")||!tagEdit)return;
      openTagEditor("keyword",x.dataset.kedit);});
    makeChipsDraggable(w,"[data-kedit]",
      ()=>cur.keywords,l=>{cur.keywords=l;renderKw();},scheduleSave);
    qa("[data-ks2]",w).forEach(x=>x.onclick=()=>addKw(x.dataset.ks2));
    const ki=q("#kwIn",w);
    /* only the list below redraws as you type, so the box keeps your cursor */
    ki.addEventListener("input",renderKwSug);
    ki.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim()){addKw(e.target.value);e.target.value="";}});
    renderKwSug();
  }
  renderKw();

  /* Drag a chip to where you want it. The list itself is reordered as you pass
     over the others and redrawn each time, so we follow the chip by name rather
     than by element — the element you grabbed stops existing almost at once. */
  function makeChipsDraggable(root,sel,getList,setList,onDone){
    qa(sel,root).forEach(el=>el.addEventListener("pointerdown",e=>{
      if(!tagEdit)return;
      if(e.target.closest("[data-gx],[data-kx],[data-gmv],[data-kmv],[data-gbr],[data-kbr]"))return;
      e.preventDefault();
      const held=el.getAttribute(sel.replace(/[\[\]]/g,""));
      if(held==null)return;
      let moved=false;
      const mv=ev=>{
        const t=document.elementFromPoint(ev.clientX,ev.clientY);
        const over=t&&t.closest&&t.closest(sel);
        if(!over)return;
        const name=over.getAttribute(sel.replace(/[\[\]]/g,""));
        if(name==null||name===held)return;
        const list=getList();
        const from=list.indexOf(held),to=list.indexOf(name);
        if(from<0||to<0)return;
        list.splice(to,0,list.splice(from,1)[0]);
        moved=true;setList(list);
      };
      const up=()=>{
        window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        if(moved&&onDone)onDone();
      };
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    }));
  }

  /* ---- editing a genre or keyword everywhere it appears ---- */
  const nextMod=b=>Math.max(Date.now(),((b&&b.modified)||0)+1,((b&&SYNC.seen[b.id])||0)+1);
  /* rewrite one label across every book; the open book is left to its own autosave */
  async function relabel(field,oldN,newN){
    for(const b of books){
      if(b.id===cur.id)continue;
      const list=b[field]||[];
      if(list.indexOf(oldN)<0)continue;
      b[field]=[...new Set(list.map(x=>x===oldN?newN:x))].filter(Boolean);
      b.modified=nextMod(b);
      await dbPut("books",b);
      if(SYNC.on)enqueue({kind:"book",id:b.id});
    }
    if((cur[field]||[]).indexOf(oldN)>=0)
      cur[field]=[...new Set(cur[field].map(x=>x===oldN?newN:x))].filter(Boolean);
  }
  async function renameGenre(oldN,newN,color){
    newN=(newN||"").trim();
    const renaming=newN&&newN!==oldN;
    if(renaming){
      genres[newN]=color||genres[newN]||genres[oldN]||"#78716c";
      delete genres[oldN];
      await relabel("genres",oldN,newN);
      /* the group's picture is filed under the name — take it with us */
      const ok="genre|"+oldN,nk="genre|"+newN;
      if(groupArt[ok]&&!groupArt[nk]){groupArt[nk]=groupArt[ok];delete groupArt[ok];saveGroupArt();}
    }else if(color)genres[oldN]=color;
    saveMeta();
    if(SYNC.on)flushQueue();
    renderGenres();scheduleSave();
  }
  async function renameKeyword(oldN,newN){
    newN=(newN||"").trim();
    if(!newN||newN===oldN)return;
    await relabel("keywords",oldN,newN);
    if(SYNC.on)flushQueue();
    renderKw();scheduleSave();
  }

      ${isG?"":`<div class="lbl" style="display:block;margin:12px 0 4px">Which family it belongs to</div>
        <div id="teCats">${allCats().map(c=>`<button class="rsn ${kwCats[name]===c?"on":""}" data-tecat="${esc(c)}">${kwCats[name]===c?"✓ ":""}${esc(c)}</button>`).join("")}
          <input id="teCatNew" class="addin" style="width:170px;display:inline-block;margin:2px 0 0 2px" placeholder="New family… (Enter)"></div>
        <div class="hint" style="margin:5px 0 0">A family gathers keywords of a kind — Setting, Characters, Themes — and can carry one colour for all of them.</div>`}

    const tp=q("#tePlain",box);
    if(tp)tp.onclick=async()=>{

    q("#teDel",box).onclick=async()=>{
      if(!confirm(`Remove “${name}” from ${used} book${used===1?"":"s"} and from the ${isG?"genre":"keyword"} list?\n\nThe books themselves are untouched. Undo can bring it back.`))return;

      if(SYNC.on)flushQueue();

    };
    q("#teSave",box).onclick=async()=>{
      /* read everything off the panel before emptying it */
      const nn=titleCase(q("#teName",box).value.trim());
      const wholeFamily=!!(q("#teCatCol",box)&&q("#teCatCol",box).checked);
      box.hidden=true;box.innerHTML="";
      if(isG)await renameGenre(name,nn,color);
      else{
        const key=nn||name;
        /* the family and the colour travel with the name */
        if(cat)kwCats[key]=cat;else delete kwCats[key];
        if(nn&&nn!==name)delete kwCats[name];
        if(wholeFamily&&cat&&color){
          catColors[cat]=color;
          delete kwColors[key];        /* let it take the family's colour */
        }else{
          if(color&&color!==catColors[cat])kwColors[key]=color;else delete kwColors[key];
        }
        if(nn&&nn!==name)delete kwColors[name];
        saveKwColors();saveKwCats();
        await renameKeyword(name,nn);
        renderKw();
      }
    };
  }
  q("#tagEditTog").onclick=()=>{
    tagEdit=!tagEdit;
    page.classList.toggle("tagedit",tagEdit);
    q("#tagEditTog").textContent=tagEdit?"✓ Done":"✎ Edit names & colours";

  /* genres */
  let pendingGenre=null;
  function renderGenres(){
    /* breaks are remembered by name, so shuffling the chips doesn't move them */
    const gbr=new Set(cur.genreBreaks||[]);
    q("#genChips").className="chiprow";
    q("#genChips").innerHTML=cur.genres.map((g,i)=>
      `<span class="chip big" data-gedit="${esc(g)}" style="${chipStyle(genres[g])}">`

      +` <button class="x" data-gx="${esc(g)}" style="cursor:pointer;background:none;border:none;color:inherit;font:inherit;padding:0" title="Take this genre off">✕</button></span>`

    qa("[data-gbr]").forEach(x=>x.onclick=e=>{

    qa("[data-gedit]").forEach(x=>x.onclick=e=>{

    makeChipsDraggable(q("#genChips"),"[data-gedit]",

  q("#fGenre").addEventListener("input",()=>{pendingGenre=null;renderGenres();});
  q("#fGenre").addEventListener("keydown",e=>{if(e.key==="Enter")addGenre(q("#fGenre").value,null);});

  /* lists */
  function renderList(key){

}

/* =============== backup, snapshots & storage =============== */
const fmtBytes=n=>{if(n==null)return "–";const u=["B","KB","MB","GB"];let i=0,v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++;}
  return (i===0||v>=10?Math.round(v):v.toFixed(1))+" "+u[i];};
const fmtWhen=t=>new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});

async function storageInfo(){
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    return {usage:e.usage||0,quota:e.quota||0};}}catch(e){}
  return null;
}
function saveSettings(){dbPut("meta",{k:"settings",v:settings});}

/* one shared shape for export, snapshots and import — keeps the old file compatible */
async function buildBackup(){
  const covers={};(await dbAll("covers")).forEach(c=>covers[c.id]=c.data);
  const images={};(await dbAll("images")).forEach(i=>images[i.key]=i.data);
  return {app:"my-shelf",version:1,exported:new Date().toISOString(),
    index:books.map(b=>({id:b.id})),books,genres,dnfReasons:dnfCustom,audiences:audCustom,
    backgrounds:bgList,padskins:padList,fandoms,groupArt,kwColors,kwCats,catColors,libArt,covers,images};
}
function downloadJson(json,name){
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function exportBackup(){
  const msg=q("#busyMsg");if(msg)msg.textContent="Packing your shelf…";
  try{
    downloadJson(JSON.stringify(await buildBackup()),`my-shelf-backup-${new Date().toISOString().slice(0,10)}.json`);
    lastExport=Date.now();dbPut("meta",{k:"lastExport",v:lastExport});
    const n=q("#expAge");if(n){n.textContent="Last exported backup: just now";n.style.color="";}
  }catch(e){alert("Export ran into a problem — try again.");}
  if(q("#busyMsg"))q("#busyMsg").textContent="";
}
/* a backup file is the one input that may come from outside this app — strip
   anything that could run (event handlers, scripts) before it reaches innerHTML */
function cleanHtml(h){
  if(typeof h!=="string"||h.indexOf("<")<0)return h;
  const t=document.createElement("template");t.innerHTML=h;
  t.content.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n=>n.remove());
  t.content.querySelectorAll("*").forEach(n=>{
    for(const a of [...n.attributes]){
      const nm=a.name.toLowerCase();
      if(nm.indexOf("on")===0||((nm==="href"||nm==="src")&&/^\s*(javascript:|data:text\/html)/i.test(a.value)))n.removeAttribute(a.name);
    }
  });
  return t.innerHTML;
}
function sanitizeBook(b){
  b.summary=cleanHtml(b.summary);b.canvasText=cleanHtml(b.canvasText);
  ["pros","cons","meh","quotes"].forEach(k=>{if(Array.isArray(b[k]))b[k]=b[k].map(cleanHtml);});
  (b.pads||[]).forEach(p=>{p.html=cleanHtml(p.html);});
  (b.entries||[]).forEach(en=>{en.summary=cleanHtml(en.summary);en.notes=cleanHtml(en.notes);});
}
/* merges a backup in: existing books kept, matching ones updated */
async function applyBackup(data){
  if(!data||data.app!=="my-shelf"||!Array.isArray(data.books))throw new Error("not a shelf backup");
  /* look the whole file over before writing a word of it. A book missing its id
     used to be found halfway through, leaving the shelf half-restored and the
     message saying only that the file couldn't be read. */
  if(data.books.some(b=>!b||typeof b!=="object"||!b.id))throw new Error("not a shelf backup");
  /* stamp restored books as edited-now: "restore wins" then holds on every device,
     instead of losing a last-write race against newer cloud copies */
  const now=Date.now();
  for(const b of data.books){sanitizeBook(b);b.modified=now;await dbPut("books",b);}
  for(const[id,c]of Object.entries(data.covers||{})){await dbPut("covers",{id,data:c});coverCache.delete(id);SYNC.triedCover.delete(id);}
  for(const[k,d]of Object.entries(data.images||{}))await dbPut("images",{key:k,data:d});
  const map=new Map(books.map(b=>[b.id,b]));
  for(const b of data.books)map.set(b.id,b);
  books=[...map.values()];
  genres=Object.assign({},data.genres||{},genres);
  dnfCustom=[...new Set([...dnfCustom,...(data.dnfReasons||[])])];
  audCustom=[...new Set([...audCustom,...(data.audiences||[])])];
  const haveB=new Set(bgList.map(x=>x.id));
  (data.backgrounds||[]).forEach(x=>{if(x&&x.id&&!haveB.has(x.id))bgList.push(x);});
  const haveP=new Set(padList.map(x=>x.id));
  (data.padskins||[]).forEach(x=>{if(x&&x.id&&!haveP.has(x.id))padList.push(x);});
  const fdIn=data.fandoms||{};
  for(const f in fdIn)fandoms[f]=[...new Set([...(fandoms[f]||[]),...(fdIn[f]||[])])];
  const gaIn=data.groupArt||{};
  for(const k in gaIn)if(!groupArt[k])groupArt[k]=gaIn[k];
  const kcIn=data.kwColors||{};
  for(const k in kcIn)if(!kwColors[k])kwColors[k]=kcIn[k];
  const kcatIn=data.kwCats||{};
  for(const k in kcatIn)if(!kwCats[k])kwCats[k]=kcatIn[k];
  const ccIn=data.catColors||{};
  for(const c in ccIn)if(!catColors[c])catColors[c]=ccIn[c];
  saveKwCats();
  const haveLa=new Set(libArt.map(a=>a.id));
  (data.libArt||[]).forEach(a=>{if(a&&a.id&&!haveLa.has(a.id))libArt.push(a);});
  saveBgList();savePadList();saveFandoms();saveGroupArt();saveKwColors();saveLibArt();
  saveMeta();
  if(SYNC.on){
    for(const b of data.books){delete deletions[b.id];enqueue({kind:"book",id:b.id});}
    for(const id of Object.keys(data.covers||{}))enqueue({kind:"cover",id});
    for(const k of Object.keys(data.images||{}))enqueue({kind:"img",key:k});
    saveDeletions();flushQueue();
  }
  return data.books.length;
}

/* =============== import from Goodreads / StoryGraph =============== */
const IMPORT_SECTIONS=[["finished","Read"],["reading","Currently reading"],["want","Want to read"],["dnf","Did not finish"]];
const secOf=it=>it.dnf?"dnf":it.status;
const dupeKey=(t,a)=>((t||"")+"|"+(a||"")).toLowerCase().replace(/\s+/g," ").trim();
/* Goodreads wraps ISBNs in ="…" for Excel; keep just the digits (and a check-X) */
const cleanIsbn=s=>String(s||"").replace(/[^0-9Xx]/g,"").toUpperCase();

/* proper CSV: quoted fields, embedded commas/newlines, doubled quotes */
function parseCsv(text){
  const rows=[];let row=[],val="",inQ=false;
  text=String(text).replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){val+='"';i++;}else inQ=false;}
      else val+=c;
    }else if(c==='"')inQ=true;
    else if(c===","){row.push(val);val="";}
    else if(c==="\n"){row.push(val);rows.push(row);row=[];val="";}
    else if(c!=="\r")val+=c;
  }
  if(val!==""||row.length){row.push(val);rows.push(row);}
  return rows.filter(r=>r.some(v=>String(v).trim()!==""));
}
function csvObjects(text){
  const rows=parseCsv(text);
  if(rows.length<2)return {head:[],items:[]};
  const head=rows[0].map(h=>h.trim());
  return {head,items:rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]==null?"":String(r[i]).trim()));return o;})};
}
const csvSource=head=>head.includes("Exclusive Shelf")?"goodreads"
  :(head.includes("Read Status")||head.includes("Star Rating"))?"storygraph":null;
const cleanDate=s=>{const m=String(s||"").match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m?`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`:"";};
const splitTags=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
/* StoryGraph's "Dates Read" carries one entry per reading, and each entry is
   either a single date or a start-and-finish range — 2022/10/18-2022/10/18.
   So the export has known the day you STARTED every book all along; the app
   was reading the column with cleanDate, which takes the first date it can see
   and throws the rest of the line away. */
function parseDatesRead(s){
  const out=[];
  String(s||"").split(/[;,]/).forEach(part=>{
    const ds=String(part).match(/\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}/g)||[];
    if(!ds.length)return;
    out.push(ds.length>1?{start:cleanDate(ds[0]),end:cleanDate(ds[1])}
                        :{start:"",end:cleanDate(ds[0])});
  });
  return out;
}
/* Fold what an export knows into the readings a book already has, without ever
   contradicting one. A reading is recognised by the day it finished, so an
   export can hand a start date to a reading that only had an end. The app's own
   stand-in dated today, and any blank left to make up a re-read count, are the
   only readings allowed to be written over — they say "read, date unknown", so
   a real date is not a contradiction but an answer. Anything the export knows
   about that has no counterpart here is added; nothing here is ever removed,
   and a reading you have open is left strictly alone. */
function mergeReadings(have,want){
  const out=have.map(r=>Object.assign({},r));
  const used=new Set();
  const blank=r=>!r.open&&(r.auto||(!String(r.start||"").trim()&&!String(r.end||"").trim()));
  (want||[]).forEach(w=>{
    const wEnd=String(w.end||"").trim();
    let i=wEnd?out.findIndex((r,ix)=>!used.has(ix)&&!r.open&&String(r.end||"").trim()===wEnd):-1;
    if(i<0)i=out.findIndex((r,ix)=>!used.has(ix)&&blank(r));
    if(i<0){out.push({id:uid(),start:w.start||"",end:w.end||""});return;}
    used.add(i);
    const r=out[i];
    if(r.auto||(!String(r.start||"").trim()&&!String(r.end||"").trim())){
      r.start=w.start||"";r.end=w.end||"";delete r.auto;
    }else{
      if(!String(r.start||"").trim()&&w.start)r.start=w.start;
      if(!String(r.end||"").trim()&&w.end)r.end=w.end;
    }
  });
  return out;
}
/* the readings a staged row deserves: the ones the export actually dated, and
   where it says you read the book more often than it kept dates for, undated
   ones ahead of them to make up the count */
function readingsFromRow(it){
  const dated=((it&&it.readings)||[]).filter(r=>r&&(r.start||r.end));
  /* the row's own stage, not a guess: a book the export says you are still on
     needs its open reading, exactly as it got one before this function existed */
  if(!dated.length)return initialReadings({dateFinished:it.dateFinished,rereads:it.rereads,status:it.status||"finished",dnf:!!it.dnf});
  const out=dated.map(r=>({id:uid(),start:r.start||"",end:r.end||""}));
  const total=Math.max(out.length,Math.max(0,parseInt(it.rereads)||0)+1);
  while(out.length<total)out.unshift({id:uid(),start:"",end:""});
  /* a book the export says you are still in the middle of keeps an open one */
  if(String(it.status||"")==="reading"&&!it.dnf)out.push({id:uid(),start:"",end:"",open:true});
  return out;
}

/* exports don't always use the column name you'd expect, and capitalisation drifts */
function pickCol(o,...names){
  for(const n of names)if(o[n]!=null&&String(o[n]).trim()!=="")return o[n];
  const keys=Object.keys(o);
  for(const n of names){
    const k=keys.find(x=>x.toLowerCase().replace(/\s+/g,"")===n.toLowerCase().replace(/\s+/g,""));
    if(k&&String(o[k]).trim()!=="")return o[k];
  }
  return "";
}
const DNF_SHELF=/^(dnf|did-not-finish|did_not_finish|didnotfinish|abandoned|unfinished|not-finished|gave-up|stopped-reading)$/;
function fromGoodreads(o){
  const shelf=(o["Exclusive Shelf"]||"").toLowerCase();
  /* shelves are a comma-separated list — test each one, don't pattern-match the whole string */
  const dnf=DNF_SHELF.test(shelf)||splitTags(o["Bookshelves"]).some(s=>DNF_SHELF.test(s.toLowerCase()));
  const r=parseFloat(pickCol(o,"My Rating","Rating","Star Rating")||"0")||0;
  return {id:uid(),title:o["Title"]||"",author:o["Author"]||"",
    isbn:cleanIsbn(o["ISBN13"]||o["ISBN"]),
    status:shelf==="currently-reading"?"reading":shelf==="to-read"?"want":"finished",dnf,
    rating:r>0?Math.min(10,r*2):null,
    pages:parseInt(o["Number of Pages"]||"")||"",
    dateFinished:cleanDate(o["Date Read"]),
    rereads:Math.max(0,(parseInt(o["Read Count"]||"1")||1)-1),
    summary:o["My Review"]||"",notes:o["Private Notes"]||"",
    tags:splitTags(o["Bookshelves"]).filter(t=>!["read","to-read","currently-reading"].includes(t.toLowerCase()))};
}
function fromStorygraph(o){
  const st=(o["Read Status"]||"").toLowerCase();
  const r=parseFloat(pickCol(o,"Star Rating","Rating","My Rating")||"0")||0;
  return {id:uid(),title:o["Title"]||"",author:o["Authors"]||o["Author"]||"",
    isbn:cleanIsbn(o["ISBN/UID"]||o["ISBN"]),
    status:st==="currently-reading"?"reading":st==="to-read"?"want":"finished",
    dnf:st==="did-not-finish",
    rating:r>0?Math.min(10,r*2):null,
    pages:parseInt(o["Number of Pages"]||o["Pages"]||"")||"",
    dateFinished:cleanDate(o["Last Date Read"]||o["Dates Read"]),
    readings:parseDatesRead(o["Dates Read"]),
    rereads:Math.max(0,(parseInt(o["Read Count"]||"1")||1)-1),
    summary:o["Review"]||"",notes:o["Content Warning Description"]||"",
    tags:[...splitTags(o["Tags"]),...splitTags(o["Moods"])]};
}

let importQueue=[];
/* The staged list is written whole, and a big export makes it thousands of rows
   long — so writing it after every single row dealt with was most of the wait.
   It settles a moment after you stop instead, and is written out in full the
   moment the tab is put away, so nothing is lost by waiting. */
let impSaveT=null;
function writeImportQueue(){clearTimeout(impSaveT);impSaveT=null;dbPut("meta",{k:"importQueue",v:importQueue});}
function saveImportQueue(){clearTimeout(impSaveT);impSaveT=setTimeout(writeImportQueue,500);}
/* A staged row can already be on your shelf as a book of its own — or as one of
   the stories inside a collection. The second case is the common one and used to
   be invisible: ten entries can hold a hundred stories, and a series exported
   book by book matches none of them until something looks inside. A story is
   matched on its own title as well as on title + author, because the export
   names the author of the book while the story usually leaves that to the
   collection around it. */
/* Two names for the same person, written differently. An export names every
   author a book has — "Gina Detwiler, Priscilla Shirer" — while the book on
   your shelf, or the entry inside a collection borrowing its collection's
   author, may say only "Priscilla Evans Shirer". One word in common is enough
   to believe it is the same person; nothing in common keeps two different
   books that happen to share a title apart. */
const authorWords=s=>new Set(String(s||"").toLowerCase().replace(/[^a-z\s]/g," ")
  .split(/\s+/).filter(w=>w.length>2));
function authorsOverlap(a,b){
  const A=authorWords(a),B=authorWords(b);
  if(!A.size||!B.size)return true;      /* one side says nothing — the title carries it */
  for(const w of A)if(B.has(w))return true;
  return false;
}
/* The same book, titled differently. An export writes a book's full shelf name
   — "Unicorn Academy #7: Rosa and Crystal" — where the entry inside a
   collection is filed under the part that is actually its own, "Rosa and
   Crystal", the series being the collection around it. Each title is reduced to
   the handful of forms it might be recognised by, and both sides are compared
   on all of them. */
function titleVariants(t){
  const out=new Set();
  const add=s=>{s=String(s||"").toLowerCase().replace(/\s+/g," ").trim();if(s.length>2)out.add(s);};
  const base=String(t||"").toLowerCase().replace(/\s+/g," ").trim();
  add(base);
  const noParen=base.replace(/\s*\([^)]*\)\s*$/,"");   /* "…Title (Series #3)" */
  add(noParen);
  [base,noParen].forEach(s=>{
    const m=s.match(/^.*?#\s*\d+[^:]*:\s*(.+)$/);       /* "Series #7: Title" */
    if(m)add(m[1]);
    const c=s.indexOf(": ");
    if(c>0)add(s.slice(c+2));
  });
  return [...out];
}
function markDupes(){
  const byKey=new Map(),byIsbn=new Map(),byTitle=new Map();
  const put=(m,k,v)=>{if(k&&!m.has(k))m.set(k,v);};
  const putTitles=(t,v)=>titleVariants(t).forEach(x=>put(byTitle,x,v));
  for(const b of books){
    put(byKey,dupeKey(b.title,b.author),{b,en:null});
    /* staged rows carry digits-only ISBNs — a hand-typed hyphenated one on the
       shelf never matched until it was cleaned the same way */
    put(byIsbn,cleanIsbn(b.isbn),{b,en:null});
    putTitles(b.title,{b,en:null});
    if(!isColl(b))continue;
    for(const en of ((b.entries)||[])){
      put(byKey,dupeKey(en.title,entAuthorOf(b,en)),{b,en});
      putTitles(en.title,{b,en});
    }
  }
  importQueue.forEach(it=>{
    let hit=(it.isbn?byIsbn.get(it.isbn):null)||byKey.get(dupeKey(it.title,it.author));
    /* The title-only key was being written down and never read, so a book whose
       author is spelled differently in the export — which is most of them once
       a co-author is involved — came through as new, and "Add all" would have
       put a second copy on the shelf beside the one already there. */
    if(!hit)for(const v of titleVariants(it.title)){
      const t=byTitle.get(v);
      if(t&&authorsOverlap(it.author,t.en?entAuthorOf(t.b,t.en):t.b.author)){hit=t;break;}
    }
    it.dupe=!!hit;
    it.hitB=hit?hit.b.id:"";
    it.hitE=(hit&&hit.en)?hit.en.id:"";
  });
}
/* find the book — and the story inside it — a staged row already matches */
function importTarget(it){
  const b=books.find(x=>x.id===it.hitB);
  if(!b)return null;
  const en=it.hitE?(((b.entries)||[]).find(e=>e.id===it.hitE)||null):null;
  return {b,en};
}
/* What this row could add to what you already have, without touching anything
   you have already put there. Filling a blank is safe; overwriting is not, so
   nothing here overwrites. The stage a book is at is never touched at all — your
   shelf knows where you are up to and an export of it does not. */
function importFills(it,b,en){
  const T=en||b,f=[];
  const filled=s=>!!stripHtml(s||"").trim();
  const date=String(it.dateFinished||"").trim(),rr=Math.max(0,parseInt(it.rereads)||0);
  /* The readings are merged rather than weighed up as a whole. Asking "does it
     already have dates?" was too blunt in both directions: it let the app's own
     stand-in block a real date, and once that was fixed it still let a finish
     date you already had block the START date arriving beside it. What the
     export knows and you don't is filled in; what you have written stays. */
  const have=readsOf(T);
  const parsed=((it.readings)||[]).filter(r=>r&&(r.start||r.end));
  const want=parsed.length?parsed:(date?[{start:"",end:date}]:[]);
  const merged=mergeReadings(have,want);
  const sig=rs=>rs.map(r=>(r.start||"")+"|"+(r.end||"")+"|"+(r.open?"o":"")).join(",");
  if(sig(merged)!==sig(have)){
    const byId=new Map(have.map(r=>[r.id,r]));
    let gotStart=0,gotEnd=0;
    merged.forEach(r=>{const o=byId.get(r.id);if(!o)return;
      if(!String(o.start||"").trim()&&String(r.start||"").trim())gotStart++;
      if(!String(o.end||"").trim()&&String(r.end||"").trim())gotEnd++;});
    const added=merged.length-have.length;
    const bits=[];
    if(added>0)bits.push(added===1?"another reading":`${added} more readings`);
    if(gotStart)bits.push(gotStart===1?"the day it was started":`${gotStart} start dates`);
    if(gotEnd)bits.push(gotEnd===1?"the day it was finished":`${gotEnd} finish dates`);
    f.push({k:"readings",label:bits.join(" and ")||"its reading dates",v:merged});
  }
  if(T.rating==null&&it.rating!=null)f.push({k:"rating",label:"a rating"});
  if(!parseInt(T.pages)&&parseInt(it.pages))f.push({k:"pages",label:"the page count"});
  if(!en&&!b.isbn&&it.isbn)f.push({k:"isbn",label:"the ISBN"});
  if(!filled(T.summary)&&it.summary)f.push({k:"summary",label:"the review"});
  if(!filled(en?en.notes:b.canvasText)&&it.notes)f.push({k:"notes",label:"your notes"});
  const auth=String(it.author||"").trim();
  /* a story is only given an author of its own where it differs from the
     collection's — otherwise it would step out onto the shelf for saying the
     same thing the book it sits in already says */
  if(auth&&!String(T.author||"").trim()&&(!en||auth!==String(b.author||"").trim()))
    f.push({k:"author",label:"the author"});
  if(!en){
    const have=new Set(((b.keywords)||[]).map(k=>String(k).toLowerCase()));
    const add=((it.tags)||[]).filter(t=>t&&!have.has(String(t).toLowerCase()));
    if(add.length)f.push({k:"tags",label:add.length===1?"a tag":`${add.length} tags`,v:add});
  }
  return f;
}
function applyImportFills(it,b,en,fills){
  const T=en||b;
  for(const f of fills){
    if(f.k==="readings"){T.readings=f.v;syncReads(T);}
    else if(f.k==="rating"){T.rating=it.rating;if(en)syncCollRating(b);}
    else if(f.k==="pages")T.pages=parseInt(it.pages);
    else if(f.k==="isbn")b.isbn=it.isbn;
    else if(f.k==="summary")T.summary=esc(it.summary);
    else if(f.k==="notes"){if(en)en.notes=esc(it.notes);else b.canvasText=esc(it.notes);}
    else if(f.k==="author")T.author=String(it.author||"").trim();
    else if(f.k==="tags")b.keywords=[...((b.keywords)||[]),...f.v].slice(0,20);
  }
  return b;
}
/* fill in the blanks on the book you already have, then take the row off the
   list — dealt with is dealt with, and the rest of the list stays as it was */
async function importMerge(it){
  const t=importTarget(it);
  if(t){
    const fills=importFills(it,t.b,t.en);
    if(fills.length){
      applyImportFills(it,t.b,t.en,fills);
      t.b.modified=Math.max(Date.now(),(t.b.modified||0)+1,(SYNC.seen[t.b.id]||0)+1);
      try{await dbPut("books",t.b);}catch(e){return false;}
      if(SYNC.on)enqueue({kind:"book",id:t.b.id});
    }
  }
  importQueue=importQueue.filter(x=>x.id!==it.id);
  return true;
}
async function loadCsvFile(file){
  const text=await file.text();
  /* a file re-saved through Excel comes out in the wrong encoding, and every
     accented letter in it is already the � character — warn, don't guess */
  if(text.includes("�"))
    alert("Some letters in this file didn't survive — it was probably re-saved by another program on the way here. It still loads, but accented names may look wrong. For a clean copy, download the export again and use that file as it is.");
  const {head,items}=csvObjects(text);
  const src=csvSource(head);
  if(!src)throw new Error("That doesn't look like a Goodreads or StoryGraph export.");
  const map=src==="goodreads"?fromGoodreads:fromStorygraph;
  const staged=items.map(map).filter(it=>it.title);
  /* the same book listed twice in one file stages once */
  const inFile=new Set();
  const once=staged.filter(it=>{
    const k=it.isbn?("i:"+it.isbn):dupeKey(it.title,it.author);
    if(inFile.has(k))return false;inFile.add(k);return true;
  });
  /* A row already waiting in the list is REPLACED by the one just read, not
     skipped. The list is kept in the browser between visits, so rows staged by
     an older version of the app sat there for good — and choosing the same file
     again, which is exactly what you do when the reading of that file has been
     improved, quietly added nothing at all. The file is what is true; the
     staged row is only its shadow. The row keeps its id, so anything ticked
     stays ticked. */
  const keyOf=it=>it.isbn?("i:"+it.isbn):dupeKey(it.title,it.author);
  const have=new Map(importQueue.map(it=>[keyOf(it),it]));
  let fresh=0,updated=0;
  once.forEach(it=>{
    const old=have.get(keyOf(it));
    if(old){Object.assign(old,it,{id:old.id});updated++;}
    else{have.set(keyOf(it),it);fresh++;}
  });
  importQueue=[...have.values()];
  markDupes();saveImportQueue();
  return {src,n:staged.length,fresh,updated};
}
/* a batch that dies half-way — storage full is the realistic way — used to leave
   the button frozen on "Adding…" with no word of how far it got */
async function runBatch(items,fn,what){
  let done=0;
  try{for(const it of items){await fn(it);done++;}return true;}
  catch(e){
    alert(`${what} stopped after ${done} of ${items.length} — storage may be full.\n\nThe ${done} already done are safe. Export a backup from the Overview tab, free some space, then try the rest again.`);
    return false;
  }
}
/* staged entry -> a real book on the shelf; `extra` lets a batch land as a series */
async function importOne(it,extra){
  const b=Object.assign(blankBook(uid()),{
    title:it.title,author:it.author,isbn:it.isbn||"",status:it.status,dnf:!!it.dnf,rating:it.rating,
    pages:it.pages,dateFinished:it.dateFinished,rereads:it.rereads||0,
    readings:readingsFromRow(it),
    summary:it.summary?esc(it.summary):"",canvasText:it.notes?esc(it.notes):"",
    keywords:(it.tags||[]).slice(0,12),imported:Date.now(),modified:Date.now()},extra||{});
  syncReads(b);   /* dateFinished and rereads follow the list the export gave */
  await dbPut("books",b);
  books.unshift(b);
  if(SYNC.on)enqueue({kind:"book",id:b.id});
  importQueue=importQueue.filter(x=>x.id!==it.id);
}
/* several staged entries -> stories inside a collection you already have. The
   companion to landing a series as one new collection: once the collection
   exists, its books arrive one export at a time and belong inside it rather
   than beside it. Each story keeps its own rating, pages, dates and writing;
   its stage is recorded only where it differs from the collection's, so a
   series you have simply finished stays one row on the shelf. */
async function importIntoCollection(items,coll){
  coll.entries=coll.entries||[];
  const collSt=statusOf(coll);
  for(const it of items){
    const en=Object.assign(blankEntry(),{
      title:it.title,rating:it.rating,pages:it.pages,
      dateFinished:it.dateFinished||"",
      readings:readingsFromRow(it),
      /* the stage AND the setting-aside must both agree before a story goes
         quiet, or a book you read lands inside a series you gave up on and
         inherits "did not finish" from it */
      status:(it.status===collSt&&!!it.dnf===!!coll.dnf)?"":(it.status||""),dnf:!!it.dnf,
      summary:it.summary?esc(it.summary):"",notes:it.notes?esc(it.notes):""});
    syncReads(en);
    coll.entries.push(en);
  }
  /* a mark of your own stays yours; one that was the stories' average follows
     the stories it now has */
  syncCollRating(coll);
  coll.modified=Math.max(Date.now(),(coll.modified||0)+1,(SYNC.seen[coll.id]||0)+1);
  await dbPut("books",coll);
  if(SYNC.on)enqueue({kind:"book",id:coll.id});
  const ids=new Set(items.map(x=>x.id));
  importQueue=importQueue.filter(x=>!ids.has(x.id));
}
/* several staged entries -> ONE collection book, each as a story inside it */
/* Each story keeps the day it was read and the stage it was at. Goodreads and
   StoryGraph give a date per book, and landing a whole series as one collection
   used to throw all but the latest of them away — the stories came out with no
   dates at all and quietly borrowed the collection's. The stage is recorded only
   where it differs from the collection's, so a series you have simply finished
   stays one entry instead of scattering its books back across the shelf. */
async function importCollection(items,name){
  const status=items.every(it=>it.status==="finished"&&!it.dnf)?"finished":items.some(it=>it.status==="reading")?"reading":"want";
  const nb=Object.assign(blankBook(uid()),{
    type:"collection",title:name,series:name,
    author:items[0].author||"",
    status,
    dateFinished:items.map(it=>it.dateFinished||"").sort().pop()||"",
    keywords:[...new Set(items.flatMap(it=>it.tags||[]))].slice(0,12),
    entries:items.map(it=>syncReads(Object.assign(blankEntry(),{
      title:it.title,rating:it.rating,pages:it.pages,
      dateFinished:it.dateFinished||"",readings:readingsFromRow(it),
      status:(it.status===status&&!it.dnf)?"":(it.status||""),dnf:!!it.dnf,
      summary:it.summary?esc(it.summary):"",notes:it.notes?esc(it.notes):""}))),
    modified:Date.now()});
  await dbPut("books",nb);
  books.unshift(nb);
  if(SYNC.on)enqueue({kind:"book",id:nb.id});
  const ids=new Set(items.map(x=>x.id));
  importQueue=importQueue.filter(x=>!ids.has(x.id));
}

/* =============== look a book up online (Google Books + Open Library) =============== */
/* Both are free, keyless and CORS-friendly. StoryGraph/Goodreads have no public
   API — this is the honest way to auto-fill a blurb, tags, pages and a cover. */
/* Both sites are free and busy: they time out, rate-limit and hiccup. One attempt
   made Auto-fill look broken when it was only unlucky, so give it a few goes. */
async function fetchJson(url,tries,ms){
  let last=null;
  for(let i=0;i<(tries||3);i++){
    const ac=typeof AbortController==="function"?new AbortController():null;
    const t=ac?setTimeout(()=>ac.abort(),ms||9000):null;
    try{
      const r=await fetch(url,ac?{signal:ac.signal}:undefined);
      if(t)clearTimeout(t);
      if(r.status===429||r.status>=500)last=new Error("busy ("+r.status+")");
      /* a 403 is Google saying "quota" — parsing its error body used to come back
         as a normal answer with no items, which read as "nothing found" */
      else if(!r.ok){last=new Error("refused ("+r.status+")");break;}
      else return await r.json();
    }catch(e){if(t)clearTimeout(t);last=e;}
    if(i<(tries||3)-1)await new Promise(s=>setTimeout(s,700*(i+1)));
  }
  throw last||new Error("no answer");
}
async function fetchBookInfo(title,author,isbn){
  const out={summary:"",tags:[],pages:"",coverUrl:"",olCover:"",isbn:"",year:"",source:[],covers:[],links:[],
    blurbs:[],genres:[],gCovers:[],rating:null};
  let gErr=false,oErr=false;
  /* Both sites are asked at the same moment, and neither is given as long to
     answer. They used to be asked one after the other, each with three
     attempts at a nine-second wait — so a Google that simply hung meant half a
     minute of nothing before Open Library was so much as tried, which is the
     whole of the wait people notice. Asked together, the slow one costs only
     as long as itself. */
  const qs=isbn?`isbn:${isbn}`:`intitle:"${title}"${author?` inauthor:"${author}"`:""}`;
  /* an own key in config.js skips the shared (often exhausted) keyless quota */
  const gk=CFG.googleBooksKey&&!/YOUR_/.test(CFG.googleBooksKey)?"&key="+encodeURIComponent(CFG.googleBooksKey):"";
  const gP=fetchJson("https://www.googleapis.com/books/v1/volumes?maxResults=5&q="+encodeURIComponent(qs)+gk,2,6000);
  const oP=fetchJson("https://openlibrary.org/search.json?limit=3&fields=key,subject,cover_i,number_of_pages_median,first_publish_year,ratings_average,ratings_count&"
    +(isbn?"q="+encodeURIComponent(isbn)
    :"title="+encodeURIComponent(title)+(author?"&author="+encodeURIComponent(author):"")),2,6000);
  /* both are awaited below; this only stops a rejection being called unhandled
     while the other one is still being waited on */
  gP.catch(()=>{});oP.catch(()=>{});
  try{
    const j=await gP;
    const items=(j.items||[]).map(x=>x.volumeInfo||{});
    const vi=items.find(v=>v.description)||items[0];
    if(vi){
      /* Google blurbs sometimes arrive with <b> and <p> tags in them — shown as
         literal angle brackets once escaped, so take them out at the door */
      out.summary=stripHtml(String(vi.description||"")).trim();
      out.tags=(vi.categories||[]).flatMap(c=>String(c).split("/").map(s=>s.trim())).filter(Boolean);
      out.pages=vi.pageCount||"";
      const im=vi.imageLinks||{};
      out.coverUrl=String(im.thumbnail||im.smallThumbnail||"")
        .replace(/^http:/,"https:").replace(/&edge=curl/,"");
      out.year=String(vi.publishedDate||"").slice(0,4);
      /* Google's own image host forbids downloads (no CORS header), but its ISBN
         lets us ask Open Library — which allows them — for the same cover */
      out.isbn=((vi.industryIdentifiers||[]).map(x=>String(x.identifier||"")).find(x=>x.length===13)
        ||(vi.industryIdentifiers||[]).map(x=>String(x.identifier||"")).find(x=>x.length===10)||"");
      out.source.push("Google Books");
      const gl=vi.infoLink||vi.canonicalVolumeLink||vi.previewLink;
      if(gl)out.links.push({name:"Google Books — this book",url:String(gl).replace(/^http:/,"https:")});
    }
    /* every match, not just the best one: different editions carry different
       blurbs and covers, and one of them may be the one you want */
    items.forEach(v=>{
      const d=stripHtml(String(v.description||"")).trim();
      if(d.length>40)out.blurbs.push({text:d,from:"Google Books"+(v.publishedDate?" · "+String(v.publishedDate).slice(0,4):"")});
      const im2=v.imageLinks||{};
      const u=String(im2.thumbnail||im2.smallThumbnail||"").replace(/^http:/,"https:").replace(/&edge=curl/,"");
      if(u)out.gCovers.push(u);
      (v.categories||[]).forEach(c=>String(c).split("/").forEach(p=>{const t=p.trim();if(t)out.genres.push(t);}));
    });
  }catch(e){gErr=true;}
  try{
    /* subjects only come back when asked for explicitly via `fields` — the
       asking already started, alongside Google's, up at the top */
    const j=await oP;
    const docs=j.docs||[];
    const d=docs[0];
    /* a cover from every edition the search returned, not only the first.
       Open Library allows downloads and Google's host does not, so these are
       the candidates that can actually be applied — collecting all of them is
       what gives a real choice rather than a row of pictures that refuse. */
    out.olCovers=docs.map(x=>x&&x.cover_i).filter(Boolean)
      .map(id=>"https://covers.openlibrary.org/b/id/"+id+"-L.jpg");
    if(d){
      out.tags=[...new Set([...out.tags,...(d.subject||[]).map(s=>String(s).trim())])];
      if(!out.pages&&d.number_of_pages_median)out.pages=d.number_of_pages_median;
      if(d.cover_i)out.olCover="https://covers.openlibrary.org/b/id/"+d.cover_i+"-L.jpg";
      if(!out.year&&d.first_publish_year)out.year=String(d.first_publish_year);
      out.source.push("Open Library");
      if(d.key)out.links.push({name:"Open Library",url:"https://openlibrary.org"+d.key});
      /* Google's keyless quota is shared and often runs dry — the Open Library
         work record has a blurb of its own */
      if(d.key){
        try{
          const w=await fetchJson("https://openlibrary.org"+d.key+".json",2);
          const desc=w&&w.description;
          const txt=String(typeof desc==="string"?desc:(desc&&desc.value)||"").trim();
          if(txt){
            if(!out.summary)out.summary=txt;
            if(txt.length>40)out.blurbs.push({text:txt,from:"Open Library"});
          }
        }catch(e){}
      }
    }
  }catch(e){oErr=true;}
  out.tags=[...new Set(out.tags.map(t=>t.replace(/\s+/g," ").trim()))]
    .filter(t=>t&&t.length<=30&&!/^(fiction|general)$/i.test(t)).slice(0,15);
  /* the shelf's own genres are a shorter, tidier list than the subject tags */
  out.genres=[...new Set(out.genres.map(t=>t.replace(/\s+/g," ").trim()))]
    .filter(t=>t&&t.length<=28&&!/^(general|fiction|nonfiction|non-fiction)$/i.test(t)).slice(0,10);
  /* Google is the one with tidy categories; when it's out of quota, offer the
     first subjects instead so there's still something to pick from */
  if(!out.genres.length)out.genres=out.tags.slice(0,8);
  /* one blurb per distinct opening — editions repeat each other constantly */
  const seenB=new Set();
  out.blurbs=out.blurbs.filter(b=>{
    const k=b.text.slice(0,80).toLowerCase();
    if(seenB.has(k))return false;seenB.add(k);return true;
  }).slice(0,6);
  if(!out.summary&&out.blurbs.length)out.summary=out.blurbs[0].text;
  /* cover candidates, most-downloadable first — Open Library serves them with the
     header browsers need; Google's host doesn't, so it's only a last resort */
  /* where to read more. An ISBN gets you the book's own Goodreads page; without
     one all we can honestly offer is a search, since neither site has a public
     way to look a title up. */
  const term=(title||"")+(author?" "+author:"");
  const isbnLink=cleanIsbn(isbn||out.isbn);
  if(isbnLink)out.links.push({name:"Goodreads — this book",url:"https://www.goodreads.com/book/isbn/"+isbnLink});
  if(term.trim()){
    if(!isbnLink)out.links.push({name:"Goodreads — search",url:"https://www.goodreads.com/search?q="+encodeURIComponent(term)});
    out.links.push({name:"StoryGraph — search",url:"https://app.thestorygraph.com/browse?search_term="+encodeURIComponent(title||term)});
  }
  const isbnForCover=isbnLink;
  out.covers=[out.olCover,
    isbnForCover?`https://covers.openlibrary.org/b/isbn/${isbnForCover}-L.jpg?default=false`:"",
    ...(out.olCovers||[]),
    ...out.gCovers].filter((u,i,a)=>u&&a.indexOf(u)===i).slice(0,6);
  if(out.summary||out.tags.length||out.pages||out.covers.length)return out;
  /* nothing to show: say which it was, so "not found" doesn't mean "flaky wifi" */
  if(gErr&&oErr)throw new Error("unreachable");
  return null;
}
async function urlToDataURL(url,maxDim){
  /* the same nine-second patience fetchJson has — covers.openlibrary.org can sit
     for minutes, and this used to hold "Fetching…" hostage the whole time */
  const ac=typeof AbortController!=="undefined"?new AbortController():null;
  const t=ac?setTimeout(()=>ac.abort(),9000):null;
  let r;try{r=await fetch(url,ac?{signal:ac.signal}:undefined);}finally{if(t)clearTimeout(t);}
  if(!r.ok)throw new Error("cover fetch failed");
  const bl=await r.blob();
  if(!bl.type.startsWith("image/"))throw new Error("not an image");
  if(bl.size<1200)throw new Error("blank cover");   /* OL sends a 1px placeholder */
  return compressImage(bl,maxDim||600,.85);
}
/* try each candidate until one actually downloads */
async function fetchCoverData(urls,maxDim){
  let last=null;
  for(const u of urls||[]){
    try{return await urlToDataURL(u,maxDim);}catch(e){last=e;}
  }
  throw last||new Error("no cover");
}

/* =============== quick add — a book from pasted text or a photo =============== */
let ocrLoad=null;
function loadOcr(){
  if(window.Tesseract)return Promise.resolve();
  if(!ocrLoad)ocrLoad=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.crossOrigin="anonymous";   /* lets the service worker keep a copy for offline */
    s.onload=res;
    s.onerror=()=>{ocrLoad=null;rej(new Error("The text reader couldn't load — reading photos needs an internet connection."));};
    document.head.appendChild(s);
  });
  return ocrLoad;
}
/* best-effort guesses from a blurb / shop page / "Title by Author" — always shown
   for checking before anything is created */
function parseBookText(t){
  t=String(t||"").replace(/\r/g,"");
  const out={title:"",author:"",series:"",seriesNum:"",pages:"",summary:"",isbn:""};
  const lines=t.split("\n").map(s=>s.trim()).filter(Boolean);
  const NAME=/^[A-ZÀ-Ž][\w.'’-]*(?:\s+[A-ZÀ-Ž][\w.'’-]*){1,3}$/;
  let m=t.match(/^\s*(.{2,120}?)\s+by\s+([A-ZÀ-Ž][\w.'’-]*(?:\s+[A-ZÀ-Ž][\w.'’-]*){0,3})\s*$/m);
  if(m){out.title=m[1].trim();out.author=m[2].trim();}
  if(!out.title&&lines.length)out.title=lines[0].slice(0,120);
  if(!out.author){
    m=t.match(/\bby\s+([A-ZÀ-Ž][\w.'’-]*(?:\s+[A-ZÀ-Ž][\w.'’-]*){0,3})/);
    if(m)out.author=m[1].trim();
    else if(lines[1]&&NAME.test(lines[1]))out.author=lines[1];
  }
  m=t.match(/(\d{2,4})\s*(?:pages|pp\b|p\.)/i);if(m)out.pages=m[1];
  m=t.match(/\(([^()#,]{2,60}?)\s*(?:,|#|Book)\s*(\d+(?:\.\d+)?)\)/i);
  if(m){out.series=m[1].replace(/\bseries\b/i,"").trim();out.seriesNum=m[2];}
  else{m=t.match(/Book\s+(\d+)\s+(?:of|in)\s+(?:the\s+)?(.{2,60}?)(?:\s+series)?\s*[\n.,)]/i);
    if(m){out.seriesNum=m[1];out.series=m[2].trim();}}
  m=t.match(/ISBN[-:\s]*((?:97[89])?[\d-]{9,17}[\dX])/i);if(m)out.isbn=cleanIsbn(m[1]);
  const paras=t.split(/\n\s*\n/).map(s=>s.trim()).filter(s=>s.length>80);
  if(paras.length)out.summary=paras.sort((a,b)=>b.length-a.length)[0].slice(0,4000);
  out.title=out.title.replace(/\s*\([^)]*\)\s*$/,"").trim();
  return out;
}
function closeQuickAdd(){const box=q("#quickPanel");box.hidden=true;box.innerHTML="";}
function openQuickAdd(){
  const box=q("#quickPanel");
  if(!box.hidden){closeQuickAdd();return;}
  box.hidden=false;
  box.innerHTML=`
    <div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⚡ Quick add a book</b>
      <button class="btn" id="qaClose" style="margin-left:auto;padding:4px 10px">Close</button></div>
    <div class="hint" style="margin:0 0 7px">Paste anything — a blurb, a shop page, “Title by Author” — or give it a photo of the cover or back, and the details are filled in for you to check.</div>
    <textarea class="field" id="qaText" rows="6" placeholder="Paste text about the book here…"></textarea>
    <div class="bgdrop" id="qaDrop" style="margin-top:8px">📷 Drop, paste or choose a photo — the text is read off it (needs internet the first time)</div>
    <div class="hint" id="qaMsg" style="margin:7px 0 0;min-height:16px"></div>
    <button class="btn pri" id="qaGo" style="margin-top:8px">Read the details</button>
    <div id="qaPrev" style="margin-top:10px"></div>`;
  q("#qaClose").onclick=closeQuickAdd;
  const drop=q("#qaDrop");
  drop.onclick=()=>q("#qaFile").click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");quickOcr(e.dataTransfer.files[0]);};
  q("#qaGo").onclick=()=>{
    const t=q("#qaText").value;
    if(!t.trim()){const e=q("#qaMsg");if(e)e.textContent="Paste some text (or drop a photo) first.";return;}
    showQuickPreview(parseBookText(t));
  };
}
async function quickOcr(file){
  if(!file||!file.type.startsWith("image/"))return;
  const msg=t=>{const e=q("#qaMsg");if(e)e.textContent=t||"";};
  try{
    msg("Loading the text reader…");
    await loadOcr();
    msg("Reading the photo — this can take a little while…");
    /* English AND Latvian — a cover with diacritics came out mangled before.
       The Latvian language file is a one-time extra download, kept locally. */
    const worker=await Tesseract.createWorker("eng+lav");
    let text="";
    try{const r=await worker.recognize(file);text=(r.data&&r.data.text)||"";}
    finally{try{worker.terminate();}catch(e){}}
    if(!text.trim()){msg("No readable text found in that photo — a sharper, closer shot works best.");return;}
    const ta=q("#qaText");if(ta)ta.value=(ta.value.trim()?ta.value+"\n\n":"")+text.trim();
    msg("Read it — check what it found below:");
    showQuickPreview(parseBookText(q("#qaText")?q("#qaText").value:text));
  }catch(e){msg(e.message||"That photo couldn't be read.");}
}
function showQuickPreview(p){
  const w=q("#qaPrev");if(!w)return;
  w.innerHTML=`
    <div class="lbl" style="display:block;margin-bottom:4px">Check &amp; fix, then create:</div>
    <input class="field" id="qpT" placeholder="Title" value="${esc(p.title)}" style="margin-bottom:6px">
    <input class="field" id="qpA" placeholder="Author" value="${esc(p.author)}" style="margin-bottom:6px">
    <div class="inrow" style="margin-bottom:6px">
      <input class="field" id="qpS" placeholder="Series (optional)" value="${esc(p.series)}" style="flex:1;min-width:120px">
      <input class="mini" id="qpSN" placeholder="#" value="${esc(p.seriesNum)}" title="Number in the series">
      <input class="mini" id="qpP" placeholder="pages" value="${esc(String(p.pages||""))}" style="width:64px">
    </div>
    <select id="qpSt" class="field" style="margin-bottom:6px">
      <option value="want">Want to read</option><option value="reading">Reading now</option><option value="finished">Finished</option>
    </select>
    <textarea class="field" id="qpSum" rows="4" placeholder="Summary…">${esc(p.summary)}</textarea>
    <button class="btn pri" id="qpMake" style="margin-top:8px">＋ Create the book</button>`;
  q("#qpMake").onclick=async()=>{
    const title=q("#qpT").value.trim();
    if(!title){alert("It needs at least a title.");return;}
    const b=blankBook(uid());
    b.title=title;b.author=q("#qpA").value.trim();
    b.series=q("#qpS").value.trim();b.seriesNum=q("#qpSN").value.trim();
    if(b.series)b.type="series";
    b.pages=parseInt(q("#qpP").value)||"";
    b.status=q("#qpSt").value;
    b.isbn=p.isbn||"";
    const sum=q("#qpSum").value.trim();
    if(sum)b.summary=esc(sum).replace(/\n/g,"<br>");
    b.modified=Date.now();
    try{await dbPut("books",b);}catch(e){alert("Couldn't save — storage may be full.");return;}
    books.unshift(b);
    if(SYNC.on){enqueue({kind:"book",id:b.id});flushQueue();}
    closeQuickAdd();
    openBook(b.id,false);
  };
}
q("#qaFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)quickOcr(f);});
/* pasting an image while the quick-add panel is open reads the book off it */
document.addEventListener("paste",e=>{
  const box=q("#quickPanel");
  if(!box||box.hidden)return;
  for(const it of e.clipboardData?.items||[]){
    if(it.type.startsWith("image/")){e.preventDefault();e.stopPropagation();quickOcr(it.getAsFile());return;}
  }
},true);

async function makeSnapshot(auto){
  const json=JSON.stringify(await buildBackup());
  const snap={id:uid(),at:Date.now(),auto:!!auto,size:json.length,nbooks:books.length,data:json};
  await dbPut("snapshots",snap);
  await pruneSnapshots();
  return snap;
}
async function pruneSnapshots(){
  const autos=(await dbAll("snapshots")).filter(s=>s.auto).sort((a,b)=>b.at-a.at);
  for(const s of autos.slice(Math.max(1,settings.keepAuto|0)))await dbDel("snapshots",s.id);
}
async function maybeAutoBackup(){
  if(!settings.autoBackup||!books.length)return;
  const last=(await dbAll("snapshots")).filter(s=>s.auto).sort((a,b)=>b.at-a.at)[0];
  if(last&&Date.now()-last.at<24*3600*1000)return;
  try{await makeSnapshot(true);window.__backupFail=0;}
  catch(e){console.warn("[shelf] auto-backup skipped",e);window.__backupFail=Date.now();}
}

q("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  /* the snapshot-restore button warns and takes a safety copy first; opening a
     file is the same rewind and deserves the same care — an old export opened
     "just to look" would otherwise turn back every matching book, everywhere */
  if(books.length&&!confirm(`Bring in “${f.name}”?\n\nBooks only in the file are added. A book that is both on your shelf and in the file goes back to the file's version — on every device.\n\nA backup of right now is taken first, so you can undo this.`))return;
  const msg=q("#busyMsg");if(msg)msg.textContent="Restoring from backup…";
  try{
    if(books.length)await makeSnapshot(true);
    const n=await applyBackup(JSON.parse(await f.text()));
    render();
    alert(`Restored ${n} book${n===1?"":"s"} from the backup. Existing books were kept; matching ones were updated.${SYNC.on?" Uploading to your cloud now…":""}`);
  }catch(err){alert("That file couldn't be read as a shelf backup.");}
  if(q("#busyMsg"))q("#busyMsg").textContent="";
});
