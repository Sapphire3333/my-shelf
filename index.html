  /* autocomplete (author + series) */
  function autoComplete(inputId,sugId,key,poolFn,after){
    const inp=q(inputId),sug=q(sugId);
    const show=()=>{const v=inp.value.trim().toLowerCase();
      const pool=poolFn().filter(a=>v&&a.toLowerCase().includes(v)&&a!==inp.value);
      if(!pool.length){sug.hidden=true;return;}
      sug.innerHTML=pool.slice(0,6).map(a=>`<button data-p="${esc(a)}">${esc(a)}</button>`).join("");
      sug.hidden=false;
      qa("[data-p]",sug).forEach(x=>x.onmousedown=()=>{inp.value=x.dataset.p;cur[key]=x.dataset.p;sug.hidden=true;scheduleSave();if(after)after();});};
    inp.addEventListener("input",()=>{cur[key]=inp.value;scheduleSave();show();if(after)after();});
    inp.addEventListener("focus",show);
    inp.addEventListener("blur",()=>setTimeout(()=>sug.hidden=true,150));
  }
  autoComplete("#fAuthor","#authSug","author",()=>[...new Set(books.map(x=>(x.author||"").trim()).filter(Boolean))]);
  q("#authBooks").onclick=()=>{
    const a=(cur.author||"").trim();
    if(!a){alert("Give the book an author first.");return;}
    finishSaveThen(()=>openAuthorPanel(a));
  };

  /* ---- auto-fill from Google Books / Open Library ---- */
  const closeFetch=()=>{const p=q("#fetchPanel");if(p){p.hidden=true;p.innerHTML="";}};
  /* `en` given: look up ONE story inside a collection; absent: the whole book */
  async function openFetchPanel(en){
    const box=q("#fetchPanel");
    const head=`<div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">🔎 Auto-fill${en?" — "+esc(en.title||"this story"):""}</b>
      <button class="btn" id="fpClose" style="margin-left:auto;padding:4px 10px">Close</button></div>`;
    const wireClose=()=>{const c=q("#fpClose",box);if(c)c.onclick=closeFetch;};
    const title=((en?en.title:cur.title)||"").trim();
    if(!title){alert(`Give the ${en?"story":"book"} a title first — that's what it searches by.`);return;}
    box.hidden=false;
    box.innerHTML=head+`<div class="none">Looking up “${esc(title)}”${cur.author?" by "+esc(cur.author):""}…</div>`;
    wireClose();
    let info=null,unreachable=false;
    try{info=await fetchBookInfo(title,(cur.author||"").trim(),en?"":(cur.isbn||"").trim());}
    catch(e){unreachable=true;}
    if(box.hidden)return;   /* closed while we were fetching */
    if(!info){
      box.innerHTML=head+`<div class="none">${unreachable
        ? "Couldn't reach the book sites just now — they're free and sometimes busy. Your connection may also be down."
        : "Nothing found under that title. Try the author's name too, or a shorter title."}</div>
        <button class="btn pri" id="fpRetry" style="margin-top:9px">Try again</button>`;
      wireClose();
      q("#fpRetry",box).onclick=()=>openFetchPanel(en);
      return;
    }
    const tagSel=new Set();
    const newTags=info.tags.filter(t=>!cur.keywords.some(k=>k.toLowerCase()===t.toLowerCase()));
    const covers=info.covers||[];
    const blurbs=(info.blurbs||[]).length?info.blurbs:(info.summary?[{text:info.summary,from:info.source.join(" & ")}]:[]);
    let covI=0,blurbI=0;
    const genSel=new Set();
    const newGenres=(info.genres||[]).filter(g=>!cur.genres.some(x=>x.toLowerCase()===g.toLowerCase()));
    const hadCover=en?!!curEnt[en.id]:!!curCover;
    const hadSummary=!!stripHtml((en?en.summary:cur.summary)||"").trim();
    const curPages=en?en.pages:cur.pages;
    box.innerHTML=head+`
      ${covers.length?`<div id="fpCovRow">
        <div class="lbl" style="display:block;margin-bottom:4px">Cover${covers.length>1?` — ${covers.length} to choose from`:""}</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start">
          ${covers.map((u,i)=>`<img class="fpcov${i===0?" on":""}" data-fpcov="${i}" src="${esc(u)}" alt=""
            style="width:54px;height:78px;object-fit:cover;border-radius:6px;cursor:pointer">`).join("")}
        </div>
        <div class="hrow2" style="margin-top:7px"><button class="btn" id="fpCover">${hadCover?"Replace the cover":"Use as cover"}</button></div>
        <div class="hint" id="fpCovMsg" style="margin:4px 0 0"></div></div>`:""}
      ${blurbs.length?`<div class="lbl" style="display:block;margin:12px 0 3px">Blurb${blurbs.length>1?` <span id="fpBlurbN">1 of ${blurbs.length}</span>`:""}</div>
        ${blurbs.length>1?`<div class="hrow2" style="margin-bottom:5px">
          <button class="btn" id="fpPrev" style="padding:3px 9px">◀</button>
          <button class="btn" id="fpNext" style="padding:3px 9px">▶</button>
          <span class="none" id="fpBlurbFrom" style="font-size:12px">${esc(blurbs[0].from)}</span></div>`:""}
        <div id="fpBlurb" style="font-size:13px;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px"></div>
        <button class="btn" id="fpSum" style="margin-top:6px">${hadSummary?"Replace my summary":"Use as summary"}</button>`:""}
      ${newGenres.length?`<div class="lbl" style="display:block;margin:12px 0 3px">Genres — tick any to add to ${en?"the collection":"this book"}</div>
        <div>${newGenres.map(g=>`<button class="mg" data-fpg="${esc(g)}"><span class="bx"></span>${esc(g)}</button>`).join("")}</div>
        <button class="btn" id="fpGen" style="margin-top:6px" disabled>Add ticked as genres</button>`:""}
      ${newTags.length?`<div class="lbl" style="display:block;margin:12px 0 3px">Tags — tick the ones worth keeping${en?" (they go on the collection)":""}</div>
        <div>${newTags.map(t=>`<button class="mg" data-fpt="${esc(t)}"><span class="bx"></span>${esc(t)}</button>`).join("")}</div>
        <button class="btn" id="fpTags" style="margin-top:6px" disabled>Add ticked as keywords</button>`:""}
      ${info.pages&&String(info.pages)!==String(curPages||"")?`<div style="margin-top:11px"><button class="btn" id="fpPages">Set pages to ${info.pages}</button></div>`:""}
      <div class="hint" style="margin:11px 0 0">Found via ${info.source.join(" & ")}${info.year?` · first published ${esc(info.year)}`:""}. Nothing is applied until you press a button.</div>
      ${(info.links||[]).length?`<div class="lbl" style="display:block;margin:9px 0 4px">Read more about it</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${info.links.map(l=>
          `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener" style="text-decoration:none;padding:4px 10px;font-size:12px">${esc(l.name)} ↗</a>`).join("")}</div>`:""}`;
    wireClose();
    /* a candidate that won't even display is no use — drop it from the row, and
       hide the section if none of them show */
    qa("[data-fpcov]",box).forEach(img=>{
      img.onerror=()=>{
        img.remove();
        const left=qa("[data-fpcov]",box);
        if(!left.length){const row=q("#fpCovRow",box);if(row)row.hidden=true;return;}
        if(!left.some(x=>x.classList.contains("on"))){left[0].classList.add("on");covI=+left[0].dataset.fpcov;}
      };
      img.onclick=()=>{
        qa("[data-fpcov]",box).forEach(x=>x.classList.remove("on"));
        img.classList.add("on");covI=+img.dataset.fpcov;
        const cm=q("#fpCovMsg",box);if(cm)cm.textContent="";
        const b2=q("#fpCover",box);if(b2){b2.disabled=false;b2.textContent=hadCover?"Replace the cover":"Use as cover";}
      };
    });
    /* several blurbs: page through them and apply whichever reads best */
    const showBlurb=()=>{
      const el=q("#fpBlurb",box);if(!el)return;
      el.textContent=blurbs[blurbI].text;
      const n=q("#fpBlurbN",box);if(n)n.textContent=`${blurbI+1} of ${blurbs.length}`;
      const f=q("#fpBlurbFrom",box);if(f)f.textContent=blurbs[blurbI].from;
      const s2=q("#fpSum",box);if(s2){s2.disabled=false;s2.textContent=hadSummary?"Replace my summary":"Use as summary";}
    };
    if(blurbs.length)showBlurb();
    const pv=q("#fpPrev",box),nx=q("#fpNext",box);
    if(pv)pv.onclick=()=>{blurbI=(blurbI-1+blurbs.length)%blurbs.length;showBlurb();};
    if(nx)nx.onclick=()=>{blurbI=(blurbI+1)%blurbs.length;showBlurb();};
    qa("[data-fpg]",box).forEach(b=>b.onclick=()=>{
      const g=b.dataset.fpg;
      genSel.has(g)?genSel.delete(g):genSel.add(g);
      b.classList.toggle("on",genSel.has(g));
      q(".bx",b).textContent=genSel.has(g)?"✓":"";
      b.style.cssText=genSel.has(g)?"background:var(--teal);border-color:var(--teal);color:#fff":"";
      const gb=q("#fpGen",box);if(gb)gb.disabled=!genSel.size;
    });
    const fg=q("#fpGen",box);
    if(fg)fg.onclick=()=>{
      /* a brand new genre needs a colour; pick a settled one from its name so the
         same genre always looks the same */
      genSel.forEach(g=>{
        if(!genres[g]){
          let h=0;for(let i=0;i<g.length;i++)h=(h*31+g.charCodeAt(i))>>>0;
          genres[g]=PALETTE[h%PALETTE.length];
        }
        if(!cur.genres.includes(g))cur.genres.push(g);
      });
      saveMeta();renderGenres();scheduleSave();
      fg.textContent=`Added ${genSel.size} ✓`;fg.disabled=true;genSel.clear();
    };
    const fc=q("#fpCover",box);
    if(fc)fc.onclick=async()=>{
      fc.disabled=true;fc.textContent="Fetching…";
      try{
        /* try the chosen one first, then the rest as fallbacks */
        const order=[covers[covI],...covers.filter((u,i)=>i!==covI)].filter(Boolean);
        const data=await fetchCoverData(order,600);
        if(en){
          en.cover=true;en.coverV=Date.now();
          await dbPut("images",{key:cur.id+"|"+en.id,data,v:en.coverV});
          curEnt[en.id]=data;
          if(SYNC.on)enqueue({kind:"img",key:cur.id+"|"+en.id});
          renderEntries();
        }else{
          await dbPut("covers",{id:cur.id,data});
          curCover=data;coverCache.set(cur.id,data);SYNC.triedCover.delete(cur.id);
          renderCover();
          if(SYNC.on)enqueue({kind:"cover",id:cur.id});
          cur.coverV=Date.now();
        }
        scheduleSave();
        fc.textContent="Cover set ✓";
      }catch(e){
        fc.disabled=false;fc.textContent=hadCover?"Replace the cover":"Use as cover";
        const cm=q("#fpCovMsg",box);
        if(cm)cm.innerHTML=`Whoever hosts this picture won't let the app download it. You can still have it: <a href="${esc(covers[covI]||covers[0]||"")}" target="_blank" rel="noopener" style="color:var(--teal)">open the picture</a>, save it, then use ${en?"the story's cover box":"the cover box"} to add it.`;
      }
    };
    const fs=q("#fpSum",box);
    if(fs)fs.onclick=()=>{
      if(hadSummary&&!confirm("Replace the current summary with this blurb?"))return;
      const html=esc(blurbs[blurbI].text).replace(/\n/g,"<br>");
      if(en){en.summary=html;renderEntries();}
      else{cur.summary=html;const el=q("#fSummary");if(el)el.innerHTML=html;}
      scheduleSave();fs.textContent="Summary set ✓";fs.disabled=true;
    };
    qa("[data-fpt]",box).forEach(b=>b.onclick=()=>{
      const t=b.dataset.fpt;
      tagSel.has(t)?tagSel.delete(t):tagSel.add(t);
      b.classList.toggle("on",tagSel.has(t));
      q(".bx",b).textContent=tagSel.has(t)?"✓":"";
      b.style.cssText=tagSel.has(t)?"background:var(--teal);border-color:var(--teal);color:#fff":"";
      const ft2=q("#fpTags",box);if(ft2)ft2.disabled=!tagSel.size;
    });
    const ft=q("#fpTags",box);
    if(ft)ft.onclick=()=>{
      tagSel.forEach(addKw);
      ft.textContent=`Added ${tagSel.size} ✓`;ft.disabled=true;tagSel.clear();
    };
    const fp=q("#fpPages",box);
    if(fp)fp.onclick=()=>{
      if(en){en.pages=parseInt(info.pages)||"";renderEntries();}
      else{
        cur.pages=parseInt(info.pages)||"";
        const el=q("#fPages");if(el)el.value=cur.pages;
        renderProgress();
      }
      scheduleSave();
      fp.textContent="Pages set ✓";fp.disabled=true;
    };
  }
  q("#autoFill").onclick=()=>{const p=q("#fetchPanel");p.hidden?openFetchPanel():closeFetch();};

  /* book / fanfic / AI story */
  function renderKind(){
    q("#kindRow").innerHTML=KINDS.map(([id,l])=>
      `<label class="chk"><input type="checkbox" data-kind="${id}" ${kindOf(cur)===id?"checked":""}> ${l}</label>`).join("");
    qa("[data-kind]").forEach(x=>x.onchange=()=>{
      cur.kind=x.checked?x.dataset.kind:"book";      /* exactly one, book is the default */
      /* the link stays whatever the kind — a copy in Drive is worth keeping */
      if(cur.kind==="book"){cur.fandoms=[];cur.characters=[];}
      renderKind();renderFF();scheduleSave();
    });
  }
  /* fandoms + characters + link — only for fanfic and AI stories */
  function renderFF(){
    const w=q("#ffWrap");
    if(kindOf(cur)==="book"){w.innerHTML="";return;}
    cur.fandoms=cur.fandoms||[];cur.characters=cur.characters||[];
    const allF=Object.keys(fandoms).sort((a,b)=>a.localeCompare(b));
    const pickable=charsFor(cur.fandoms);                    /* only this fandom's cast */
    const firstF=cur.fandoms[0];
    w.innerHTML=`<div class="ffbox">
      <div class="lbl" style="display:block;margin-bottom:3px">Fandom${cur.fandoms.length>1?"s":""}</div>
      <div>${allF.map(f=>`<button class="rsn ${cur.fandoms.includes(f)?"on":""}" data-fd="${esc(f)}">${cur.fandoms.includes(f)?"✓ ":""}${esc(f)}</button>`).join("")}
        <input id="fdIn" class="addin" style="width:170px;display:inline-block;margin:2px 0 0 2px" placeholder="Add a fandom… (Enter)"></div>
      <div class="lbl" style="display:block;margin:11px 0 3px">Characters${firstF?"":" — pick a fandom first"}</div>
      <div>${pickable.map(c=>`<button class="rsn ${cur.characters.includes(c)?"on":""}" data-ch="${esc(c)}">${cur.characters.includes(c)?"✓ ":""}${esc(c)}</button>`).join("")}
        ${firstF?`<input id="chIn" class="addin" style="width:200px;display:inline-block;margin:2px 0 0 2px" placeholder="Add to ${esc(firstF)}… (Enter)">`:""}</div>
    </div>`;
    qa("[data-fd]",w).forEach(x=>x.onclick=()=>{
      const f=x.dataset.fd;
      cur.fandoms=cur.fandoms.includes(f)?cur.fandoms.filter(y=>y!==f):[...cur.fandoms,f];
      /* drop characters that no longer belong to any chosen fandom */
      const ok=new Set(charsFor(cur.fandoms));
      cur.characters=cur.characters.filter(c=>ok.has(c));
      renderFF();scheduleSave();
    });
    qa("[data-ch]",w).forEach(x=>x.onclick=()=>{
      const c=x.dataset.ch;
      cur.characters=cur.characters.includes(c)?cur.characters.filter(y=>y!==c):[...cur.characters,c];
      renderFF();scheduleSave();
    });
    q("#fdIn",w).addEventListener("keydown",e=>{
      if(e.key!=="Enter"||!e.target.value.trim())return;
      const f=titleCase(e.target.value.trim());
      if(!fandoms[f]){fandoms[f]=[];saveFandoms();}
      if(!cur.fandoms.includes(f))cur.fandoms.push(f);
      renderFF();scheduleSave();
    });
    const ci=q("#chIn",w);
    if(ci)ci.addEventListener("keydown",e=>{
      if(e.key!=="Enter"||!e.target.value.trim())return;
      const c=titleCase(e.target.value.trim());
      fandoms[firstF]=fandoms[firstF]||[];
      if(!fandoms[firstF].includes(c)){fandoms[firstF].push(c);saveFandoms();}
      if(!cur.characters.includes(c))cur.characters.push(c);
      renderFF();scheduleSave();
    });
  }
  /* Somewhere the book itself lives: a file in Drive, a shop page, a library
     record — anything with an address. Pasting one is all it takes. */
  let linkEditing=false;
  function renderLink(){
    const w=q("#linkRow");if(!w)return;
    const v=(cur.link||"").trim();
    const L=linkLabel(v);
    /* settled: just the place it goes. Editing: the address itself. */
    if(L&&!linkEditing){
      w.innerHTML=`<div class="inrow">
        <span class="lbl">Where it lives</span>
        <a class="btn linkchip" href="${esc(L.url)}" target="_blank" rel="noopener" title="${esc(L.url)}">${L.icon} ${esc(L.name)} ↗</a>
        <button class="sm" id="linkEd" title="Change the link">✎</button>
      </div>`;
      q("#linkEd",w).onclick=()=>{linkEditing=true;renderLink();
        const i=q("#fLink",w);if(i){i.focus();i.select();}};
      return;
    }
    w.innerHTML=`<div class="inrow">
      <span class="lbl">Where it lives</span>
      <input class="field" id="fLink" placeholder="Paste a link — Drive, AO3, a shop…" value="${esc(v)}" style="flex:1;min-width:150px;font-size:13px;padding:7px 10px">
      ${L?`<button class="sm" id="linkDone">Done</button>`:""}
    </div>`;
    const inp=q("#fLink",w);
    inp.addEventListener("input",e=>{cur.link=e.target.value;scheduleSave();});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){linkEditing=false;renderLink();}});
    inp.addEventListener("blur",()=>{if((cur.link||"").trim()){linkEditing=false;renderLink();}});
    const d=q("#linkDone",w);if(d)d.onclick=()=>{linkEditing=false;renderLink();};
  }
  renderKind();renderFF();renderLink();

  /* series / collection type */
  function renderSeries(){
    const w=q("#serWrap"),t=typeOf(cur);
    q("#cbSeries").checked=t==="series";
    q("#cbColl").checked=t==="collection";
    if(t==="standalone"){w.innerHTML="";return;}
    const isC=t==="collection";
    w.innerHTML=`<div class="inrow" style="margin-top:8px">
        <div class="relbox" style="flex:1;min-width:140px">
          <input class="field" id="fSeries" placeholder="${isC?"Name of the series / collection":"Series name"}" value="${esc(cur.series)}" style="font-size:14px;padding:8px 11px" autocomplete="off">
          <div class="sug" id="serSug" hidden></div>
        </div>
        ${isC?"":`<span class="lbl">book</span><input class="mini" id="fSerN" placeholder="#" value="${esc(cur.seriesNum)}">
        <span class="lbl">of</span><input class="mini" id="fSerT" placeholder="?" value="${esc(cur.seriesTotal)}">`}
      </div>
      <div id="linkWrap"></div>`;
    autoComplete("#fSeries","#serSug","series",
      ()=>[...new Set(books.map(x=>(x.series||"").trim()).filter(Boolean))],renderLinked);
    if(!isC){
      bind("#fSerN","seriesNum",v=>v.replace(/[^\d.]/g,""));
      bind("#fSerT","seriesTotal",v=>v.replace(/[^\d]/g,""));
    }
    renderLinked();
  }
  function renderLinked(){
    const w=q("#linkWrap");if(!w)return;
    const s=(cur.series||"").trim().toLowerCase();
    if(!s){w.innerHTML="";return;}
    const sibs=books.filter(b=>b.id!==cur.id&&(b.series||"").trim().toLowerCase()===s)
      .sort((a,b)=>(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0));
    if(!sibs.length){w.innerHTML='<div class="hint" style="margin-top:6px">First one under this name — anything else you give the same name links up here automatically.</div>';return;}
    w.innerHTML=`<div class="linkbox">🔗 Linked with ${sibs.length} other${sibs.length===1?"":"s"} in <b>${esc(cur.series)}</b>: ${sibs.map(b=>`<a data-go="${b.id}">${b.seriesNum?"#"+esc(b.seriesNum)+" ":""}${esc(b.title)||"Untitled"}</a>`).join(" · ")}</div>`;
    qa("[data-go]",w).forEach(a=>a.onclick=()=>finishSaveThen(()=>openBook(a.dataset.go,false)));
  }
  q("#cbSeries").onchange=e=>{
    cur.type=e.target.checked?"series":"standalone";
    if(!e.target.checked){cur.series="";cur.seriesNum="";cur.seriesTotal="";}
    renderSeries();renderEntries();scheduleSave();
  };
  q("#cbColl").onchange=e=>{
    cur.type=e.target.checked?"collection":"standalone";
    if(e.target.checked){cur.seriesNum="";cur.seriesTotal="";cur.entries=cur.entries||[];}
    else cur.series="";
    renderSeries();renderEntries();scheduleSave();
  };
  renderSeries();

  /* books / stories inside a collection */
  let pendingEnt=null;
  q("#entCoverFile").onchange=async e=>{
    const f=e.target.files[0];e.target.value="";
    const en=(cur.entries||[]).find(x=>x.id===pendingEnt);pendingEnt=null;
    if(!f||!en)return;
    let data;try{data=await compressImage(f,600,.85);}catch(err){alert("That image couldn't be read.");return;}
    const key=cur.id+"|"+en.id;
    en.coverV=Date.now();          /* version, so replacing a cover reaches other devices too */
    try{await dbPut("images",{key,data,v:en.coverV});}catch(err){alert("That cover couldn't be saved.");return;}
    curEnt[en.id]=data;en.cover=true;
    if(SYNC.on)enqueue({kind:"img",key});
    renderEntries();scheduleSave();
  };
  /* a collection's own page count is the sum of its stories, once they all have one */
  function sumEntryPages(){
    const note=q("#pagesNote");
    const ens=isColl(cur)?(cur.entries||[]):[];
    const complete=ens.length&&ens.every(en=>parseInt(en.pages)>0);
    if(note)note.hidden=!complete;
    if(!complete)return;

    if(String(cur.pages)===String(total))return;

  function renderEntries(){

      <div class="hint">Each book or story this one entry covers, with its own title, rating, summary, notes and cover.</div>

        <div class="hrow2" style="margin-top:4px">

        <div class="entmain">

            <span class="ratebox" style="padding:3px 9px">★ <input type="number" data-er="${en.id}" min="0" max="10" step="0.1" placeholder="–" value="${en.rating??""}" style="width:50px;font-size:14px"></span>
            <span class="boxbtn" style="cursor:default;padding:5px 9px">Pages <input type="number" data-ep="${en.id}" min="1" placeholder="–" value="${esc(en.pages||"")}" style="border:none;width:50px;text-align:center;font-weight:600"></span>

          </div>

          <div class="entrich" contenteditable="true" data-eno="${en.id}" data-ph="Notes…"></div>
        </div>
      </div>`).join("")||'<span class="none">Nothing added yet.</span>';
    const find=id=>cur.entries.find(x=>x.id===id);
    qa("[data-et]",list).forEach(el=>el.addEventListener("input",()=>{find(el.dataset.et).title=el.value;scheduleSave();}));
    qa("[data-er]",list).forEach(el=>el.addEventListener("input",()=>{const v=el.value;
      find(el.dataset.er).rating=v===""?null:Math.min(10,Math.max(0,parseFloat(v)||0));scheduleSave();}));
    qa("[data-ep]",list).forEach(el=>el.addEventListener("input",()=>{const v=el.value;
      find(el.dataset.ep).pages=v===""?"":Math.max(1,parseInt(v)||0);sumEntryPages();scheduleSave();}));
    qa("[data-es]",list).forEach(el=>{el.innerHTML=find(el.dataset.es).summary||"";
      el.addEventListener("input",()=>{find(el.dataset.es).summary=el.innerHTML;scheduleSave();});});
    qa("[data-eno]",list).forEach(el=>{el.innerHTML=find(el.dataset.eno).notes||"";
      el.addEventListener("input",()=>{find(el.dataset.eno).notes=el.innerHTML;scheduleSave();});});
    qa("[data-ec]",list).forEach(el=>el.onclick=()=>{pendingEnt=el.dataset.ec;q("#entCoverFile").click();});
    qa("[data-ex]",list).forEach(el=>el.onclick=()=>{
      const en=find(el.dataset.ex);if(!en)return;
      if(!confirm(`Remove “${en.title||"Untitled"}” from this collection?`))return;
      if(SYNC.on&&en.cover)enqueue({kind:"imgDel",key:cur.id+"|"+en.id});
      delete curEnt[en.id];
      cur.entries=cur.entries.filter(x=>x.id!==en.id);
      renderEntries();scheduleSave();
    });
    const move=(id,dir)=>{
      const i=cur.entries.findIndex(x=>x.id===id);
      const j=i+dir;
      if(i<0||j<0||j>=cur.entries.length)return;
      [cur.entries[i],cur.entries[j]]=[cur.entries[j],cur.entries[i]];
      renderEntries();scheduleSave();
    };
    qa("[data-eu]",list).forEach(el=>el.onclick=()=>move(el.dataset.eu,-1));
    qa("[data-ed]",list).forEach(el=>el.onclick=()=>move(el.dataset.ed,1));
    qa("[data-ef]",list).forEach(el=>el.onclick=()=>{const e2=find(el.dataset.ef);if(e2)openFetchPanel(e2);});
    /* type a position into the number and the story jumps there */
    qa("[data-en]",list).forEach(el=>el.addEventListener("change",()=>{
      const i=cur.entries.findIndex(x=>x.id===el.dataset.en);
      if(i<0)return;
      let p=Math.round(parseFloat(el.value));
      if(!p||p-1===i){renderEntries();return;}
      p=Math.max(0,Math.min(cur.entries.length-1,p-1));
      const [en]=cur.entries.splice(i,1);
      cur.entries.splice(p,0,en);
      renderEntries();scheduleSave();
    }));
    q("#entAdd").onclick=()=>{
      cur.entries.push(blankEntry());renderEntries();scheduleSave();
      const ins=qa("[data-et]",q("#entList"));if(ins.length)ins[ins.length-1].focus();

    q("#entFold").onclick=openFoldPanel;
    q("#entOrder").onclick=openOrderPanel;

  }
  /* tap the rows 1, 2, 3… then Save — used for a collection's stories and for
     the +/−/quote lists */
  function showOrderPanel(opts){
    const box=q("#orderPanel");box.hidden=false;
    let seq=[];   /* row ids in tap order */
    const draw=()=>{
      box.innerHTML=`
        <div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⇅ ${esc(opts.title)}</b>
          <button class="btn" id="odClose" style="margin-left:auto;padding:4px 10px">Cancel</button></div>
        <div class="hint" style="margin:0 0 7px">Tap them one by one — they're numbered 1, 2, 3… as you go. Tap a numbered one to take it back out. Anything left unnumbered keeps its current order, after the numbered ones.</div>
        ${opts.rows.map(row=>{
          const n=seq.indexOf(row.id);
          return `<button class="snap" data-od="${esc(row.id)}" style="width:100%;cursor:pointer;${n>=0?"border-color:var(--teal)":""}">
            <b class="cnt" style="flex:none;${n>=0?"background:var(--teal);color:#fff":""}">${n>=0?n+1:"·"}</b>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;text-align:left">${esc(row.text)||"(empty)"}</span>
          </button>`;}).join("")}
        <div class="hrow2" style="margin-top:9px">
          <button class="btn pri" id="odSave" ${seq.length?"":"disabled"}>Save this order</button>
          <button class="btn" id="odReset" ${seq.length?"":"disabled"}>Start over</button>
        </div>`;
      q("#odClose",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
      q("#odReset",box).onclick=()=>{seq=[];draw();};
      qa("[data-od]",box).forEach(b=>b.onclick=()=>{
        const id=b.dataset.od;
        const i=seq.indexOf(id);
        if(i>=0)seq.splice(i,1);else seq.push(id);
        draw();
      });
      q("#odSave",box).onclick=()=>{
        if(!seq.length)return;
        box.hidden=true;box.innerHTML="";
        opts.onSave(seq);
      };
    };
    draw();
  }
  function openOrderPanel(){
    showOrderPanel({title:"Tap the stories in the order you want",
      rows:cur.entries.map(en=>({id:en.id,text:en.title||"Untitled"})),
      onSave:ids=>{
        const picked=ids.map(id=>cur.entries.find(e=>e.id===id)).filter(Boolean);
        const rest=cur.entries.filter(e=>!ids.includes(e.id));
        cur.entries=[...picked,...rest];
        renderEntries();scheduleSave();
      }});
  }
  /* quotes, likes and dislikes — same tap-to-number ordering */
  function openListOrder(key){
    if((cur[key]||[]).length<2)return;
    const LBL={pros:"liked points",cons:"disliked points",meh:"middling points",quotes:"quotes"};
    showOrderPanel({title:`Tap the ${LBL[key]||"items"} in the order you want`,
      rows:cur[key].map((html,i)=>({id:String(i),text:stripHtml(html).slice(0,90)})),
      onSave:ids=>{
        const idx=ids.map(Number);
        const picked=idx.map(i=>cur[key][i]);
        const rest=cur[key].filter((_,i)=>idx.indexOf(i)<0);

      }});

  /* pick a book that has its own page and fold it into this collection */
  function openFoldPanel(){
    const box=q("#foldPanel");box.hidden=false;
    let fq="";
    const draw=()=>{
      const ql=fq.trim().toLowerCase();
      const pool=books.filter(b=>b.id!==cur.id&&!isColl(b)
        &&(!ql||(b.title||"").toLowerCase().includes(ql)||(b.author||"").toLowerCase().includes(ql)))
        .sort((a,b)=>(a.title||"").localeCompare(b.title||""));
      box.innerHTML=`
        <div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⤵ Fold a book into this collection</b>
          <button class="btn" id="fdClose" style="margin-left:auto;padding:4px 10px">Close</button></div>
        <div class="hint" style="margin:0 0 7px">Its notes, rating, pages and cover become a story in here; its own page moves to Recently deleted (restorable for ${TRASH_DAYS} days).</div>
        <input class="field" id="fdSearch" placeholder="Search by title or author…" value="${esc(fq)}" style="font-size:13px;padding:7px 11px;margin-bottom:7px">
        ${pool.slice(0,30).map(b=>`<div class="snap" style="padding:6px 10px">
          <div style="min-width:0;flex:1"><div class="when" style="font-size:13px">${esc(b.title)||"Untitled"}</div>
            <div class="meta">${esc(b.author)||"Unknown author"}${b.rating!=null?` · ★ ${Number(b.rating).toFixed(1)}`:""}</div></div>
          <button class="btn" data-fb="${b.id}" style="padding:3px 9px">Fold in</button>
        </div>`).join("")||'<div class="none">Nothing matches.</div>'}
        ${pool.length>30?`<div class="none" style="margin-top:5px">…and ${pool.length-30} more — search to narrow it.</div>`:""}`;
      q("#fdClose",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
      const se=q("#fdSearch",box);
      se.oninput=()=>{fq=se.value;draw();
        const s2=q("#fdSearch",box);if(s2){s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length);}};
      qa("[data-fb]",box).forEach(btn=>btn.onclick=async()=>{
        const b=books.find(x=>x.id===btn.dataset.fb);if(!b)return;
        if(!confirm(`Fold “${b.title||"Untitled"}” into this collection?\n\nIts own page moves to Recently deleted — notes, rating, pages and cover carry over.`))return;
        btn.disabled=true;
        const {en,coverData}=await bookToEntry(b,cur.id);
        cur.entries.push(en);
        if(coverData)curEnt[en.id]=coverData;
        await retireBook(b);
        if(SYNC.on)flushQueue();
        renderEntries();scheduleSave();
        draw();
      });
    };
    draw();
  }
  renderEntries();

  /* status segmented */
  function renderStatus(){
    q("#statusSeg").innerHTML=STATUSES.map(([id,l])=>{
      const on=statusOf(cur)===id;
      const cls=on?(id==="finished"?"fin":id==="reading"?"rea":"wan"):"";
      return `<button class="${cls}" data-st="${id}">${l}</button>`;}).join("");
    qa("[data-st]").forEach(x=>x.onclick=()=>{cur.status=x.dataset.st;renderStatus();renderProgress();scheduleSave();});
  }

  /* how far in — only while you're actually reading it */
  function progBarUI(){
    const p=pctOf(cur);
    const bar=q("#progBar"),lab=q("#progPct");
    if(bar)bar.style.width=(p||0)+"%";
    if(lab)lab.textContent=p==null?"":p+"%";
  }
  function renderProgress(){
    const w=q("#progWrap");
    if(statusOf(cur)!=="reading"){w.innerHTML="";return;}
    const total=parseInt(cur.pages)||0;
    w.innerHTML=`<div class="inrow">
      <span class="boxbtn" style="cursor:default">On page
        <input type="number" id="fProg" min="0" ${total?`max="${total}"`:""} placeholder="–" value="${esc(String(cur.progress||""))}" style="border:none;width:60px;text-align:center;font-weight:600">
        <span class="lbl" id="progOf">${total?`of ${total}`:"— add a page count below"}</span>
      </span>
      ${total?`<span class="prog" style="flex:1;min-width:110px"><i id="progBar" style="width:0%"></i></span><b id="progPct" style="font-size:12px;color:var(--mut);width:34px"></b>`:""}
    </div>`;
    q("#fProg",w).addEventListener("input",e=>{
      const v=e.target.value;
      cur.progress=v===""?"":Math.max(0,parseInt(v)||0);
      /* one entry per day: enough to work out a pace later, without a fuss */
      const today=new Date().toISOString().slice(0,10);
      cur.progLog=cur.progLog||[];
      const last=cur.progLog[cur.progLog.length-1];
      if(last&&last.d===today)last.p=cur.progress||0;
      else cur.progLog.push({d:today,p:cur.progress||0});
      if(cur.progLog.length>400)cur.progLog=cur.progLog.slice(-400);
      progBarUI();scheduleSave();
    });
    progBarUI();
  }
  renderProgress();

  /* DNF panel */

  /* audience — tick as many as fit */

    const audAll=[...new Set([...DEFAULT_AUD,...audCustom,...mine])];
    w.innerHTML=`<div class="lbl" style="display:block;margin-bottom:3px">Who it's for${mine.length>1?` — ${mine.length} picked`:""}</div><div>
      ${audAll.map(a=>{const on=mine.indexOf(a)>=0;

    qa("[data-a]",w).forEach(x=>x.onclick=()=>{

  /* keywords */
  function addKw(t){
    const v=titleCase((t||"").trim());if(!v)return;
    if(cur.keywords.some(k=>k.toLowerCase()===v.toLowerCase()))return;
    cur.keywords.push(v);renderKw();scheduleSave();
  }
  /* Every keyword the shelf knows, kept in one vocabulary so the same one gets
     reused rather than retyped: alphabetical, narrowed as you type, tap to add. */
  function knownKeywords(){
    return [...new Set([...books.flatMap(b=>b.keywords||[]),...Object.keys(kwColors)])]
      .filter(Boolean).sort((a,b)=>a.localeCompare(b));
  }
  function renderKwSug(){
    const box=q("#kwSug");if(!box)return;
    const inp=q("#kwIn");
    const typed=(inp?inp.value:"").trim().toLowerCase();
    const mine=new Set(cur.keywords.map(k=>k.toLowerCase()));
    const pool=knownKeywords().filter(k=>!mine.has(k.toLowerCase()));
    const shown=typed?pool.filter(k=>k.toLowerCase().includes(typed)):pool;
    const exact=typed&&knownKeywords().some(k=>k.toLowerCase()===typed);
    /* gathered by family, so a long list stays navigable */
    const fams={};
    shown.forEach(k=>{const c=kwCats[k]||"";(fams[c]=fams[c]||[]).push(k);});
    const named=Object.keys(fams).filter(Boolean).sort((a,b)=>a.localeCompare(b));
    const chips=list=>list.map(k=>`<span class="kw" data-ks="${esc(k)}" style="cursor:pointer;${kwStyle(k)}">${esc(k)}</span>`).join("");
    box.innerHTML=(shown.length
        ?`<div class="lbl" style="display:block;margin:6px 0 3px">${typed?`Matching (${shown.length})`:`Already in use (${shown.length}) — tap to add`}</div>
          <div class="kwpick">${named.map(c=>
              `<div class="kwfam"><span class="kwfamname"${catColors[c]?` style="color:${catColors[c]}"`:""}>${esc(c)}</span>${chips(fams[c])}</div>`).join("")
            }${fams[""]&&fams[""].length?`<div class="kwfam">${named.length?'<span class="kwfamname">Loose</span>':""}${chips(fams[""])}</div>`:""}</div>`
        :(typed?`<div class="lbl" style="margin-top:6px">Nothing like that yet — press Enter to make it.</div>`:""))
      +(typed&&!exact&&shown.length?`<div class="lbl" style="margin-top:4px">…or press Enter for a new one.</div>`:"");
    qa("[data-ks]",box).forEach(x=>x.onclick=()=>addKw(x.dataset.ks));
  }
  function renderKw(){
    const w=q("#kwWrap");
    const others=[...new Set(books.flatMap(b=>b.id===cur.id?[]:(b.keywords||[])))];
    const btext=stripHtml([cur.title,cur.summary,cur.canvasText,...(cur.quotes||[]),...(cur.pros||[]),...(cur.cons||[]),...(cur.meh||[]),
      ...(cur.pads||[]).map(p=>p.html||""),...(cur.entries||[]).map(en=>(en.title||"")+" "+(en.summary||"")+" "+(en.notes||""))].join(" ")).toLowerCase();
    const sug=others.filter(k=>!cur.keywords.some(x=>x.toLowerCase()===k.toLowerCase())&&btext.includes(k.toLowerCase())).slice(0,10);
    w.innerHTML=`<div class="lbl" style="display:block;margin:10px 0 3px">Keywords</div>
      <div class="chiprow">${(()=>{const kbr=new Set(cur.kwBreaks||[]);
        return cur.keywords.map((k,i)=>
          `<span class="kw" data-kedit="${esc(k)}" style="font-size:12px;padding:2px 7px;${kwStyle(k)}">`
          +(tagEdit?`<button class="chmv" data-kmv="${i}|-1" title="Move it left">◀</button>`:"")
          +esc(k)
          +(tagEdit?`<button class="chmv" data-kmv="${i}|1" title="Move it right">▶</button>`
            +`<button class="chmv ${kbr.has(k)?"on":""}" data-kbr="${esc(k)}" title="${kbr.has(k)?"Let the next one sit beside this":"Start a new row after this"}">↵</button>`:"")
          +` <span class="x" data-kx="${i}" style="cursor:pointer;opacity:.6">✕</span></span>`
          +(kbr.has(k)?'<span class="rowbreak"></span>':"")).join("");})()}</div>
      <input id="kwIn" class="addin" placeholder='Search your keywords, or type a new one… (Enter)'>
      <div id="kwSug"></div>
      ${sug.length?`<div class="hint" style="margin-top:6px">Turning up in this book's own writing: ${sug.map(k=>`<span class="kw" data-ks2="${esc(k)}" style="cursor:pointer;font-size:11px;padding:1px 6px;border-style:dashed">＋ ${esc(k)}</span>`).join("")}</div>`:""}`;
    qa("[data-kx]",w).forEach(x=>x.onclick=e=>{e.stopPropagation();
      const gone=cur.keywords[+x.dataset.kx];
      cur.keywords.splice(+x.dataset.kx,1);
      cur.kwBreaks=(cur.kwBreaks||[]).filter(k=>k!==gone);
      renderKw();scheduleSave();});
    qa("[data-kmv]",w).forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      const [i,d]=x.dataset.kmv.split("|").map(Number),j=i+d;
      if(j<0||j>=cur.keywords.length)return;
      const a=cur.keywords;[a[i],a[j]]=[a[j],a[i]];
      renderKw();scheduleSave();});
    qa("[data-kbr]",w).forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      const k=x.dataset.kbr,s=new Set(cur.kwBreaks||[]);
      s.has(k)?s.delete(k):s.add(k);
      cur.kwBreaks=[...s];
      renderKw();scheduleSave();});
    qa("[data-kedit]",w).forEach(x=>x.onclick=e=>{
      if(e.target.closest("[data-kx],[data-kmv],[data-kbr]")||!tagEdit)return;
      openTagEditor("keyword",x.dataset.kedit);});
    makeChipsDraggable(w,"[data-kedit]",
      ()=>cur.keywords,l=>{cur.keywords=l;renderKw();},scheduleSave);
    qa("[data-ks2]",w).forEach(x=>x.onclick=()=>addKw(x.dataset.ks2));
    const ki=q("#kwIn",w);
    /* only the list below redraws as you type, so the box keeps your cursor */
    ki.addEventListener("input",renderKwSug);
    ki.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim()){addKw(e.target.value);e.target.value="";}});
    renderKwSug();
  }
  renderKw();

  /* Drag a chip to where you want it. The list itself is reordered as you pass
     over the others and redrawn each time, so we follow the chip by name rather
     than by element — the element you grabbed stops existing almost at once. */
  function makeChipsDraggable(root,sel,getList,setList,onDone){
    qa(sel,root).forEach(el=>el.addEventListener("pointerdown",e=>{
      if(!tagEdit)return;
      if(e.target.closest("[data-gx],[data-kx],[data-gmv],[data-kmv],[data-gbr],[data-kbr]"))return;
      e.preventDefault();
      const held=el.getAttribute(sel.replace(/[\[\]]/g,""));
      if(held==null)return;
      let moved=false;
      const mv=ev=>{
        const t=document.elementFromPoint(ev.clientX,ev.clientY);
        const over=t&&t.closest&&t.closest(sel);
        if(!over)return;
        const name=over.getAttribute(sel.replace(/[\[\]]/g,""));
        if(name==null||name===held)return;
        const list=getList();
        const from=list.indexOf(held),to=list.indexOf(name);
        if(from<0||to<0)return;
        list.splice(to,0,list.splice(from,1)[0]);
        moved=true;setList(list);
      };
      const up=()=>{
        window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        if(moved&&onDone)onDone();
      };
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    }));
  }

  /* ---- editing a genre or keyword everywhere it appears ---- */
  const nextMod=b=>Math.max(Date.now(),((b&&b.modified)||0)+1,((b&&SYNC.seen[b.id])||0)+1);
  /* rewrite one label across every book; the open book is left to its own autosave */
  async function relabel(field,oldN,newN){
    for(const b of books){
      if(b.id===cur.id)continue;
      const list=b[field]||[];
      if(list.indexOf(oldN)<0)continue;
      b[field]=[...new Set(list.map(x=>x===oldN?newN:x))].filter(Boolean);
      b.modified=nextMod(b);
      await dbPut("books",b);
      if(SYNC.on)enqueue({kind:"book",id:b.id});
    }
    if((cur[field]||[]).indexOf(oldN)>=0)
      cur[field]=[...new Set(cur[field].map(x=>x===oldN?newN:x))].filter(Boolean);
  }
  async function renameGenre(oldN,newN,color){
    newN=(newN||"").trim();
    const renaming=newN&&newN!==oldN;
    if(renaming){
      genres[newN]=color||genres[newN]||genres[oldN]||"#78716c";
      delete genres[oldN];
      await relabel("genres",oldN,newN);
      /* the group's picture is filed under the name — take it with us */
      const ok="genre|"+oldN,nk="genre|"+newN;
      if(groupArt[ok]&&!groupArt[nk]){groupArt[nk]=groupArt[ok];delete groupArt[ok];saveGroupArt();}
    }else if(color)genres[oldN]=color;
    saveMeta();
    if(SYNC.on)flushQueue();
    renderGenres();scheduleSave();
  }
  async function renameKeyword(oldN,newN){
    newN=(newN||"").trim();
    if(!newN||newN===oldN)return;
    await relabel("keywords",oldN,newN);
    if(SYNC.on)flushQueue();
    renderKw();scheduleSave();
  }
  function openTagEditor(kind,name){
    const box=q("#tagPanel");box.hidden=false;
    const isG=kind==="genre";
    const used=books.filter(b=>(isG?(b.genres||[]):(b.keywords||[])).indexOf(name)>=0).length;
    let color=isG?(genres[name]||"#78716c"):(kwColors[name]||"");
    let cat=isG?"":(kwCats[name]||"");
    box.innerHTML=`
      <div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">✎ ${isG?"Genre":"Keyword"}</b>
        <button class="btn" id="teClose" style="margin-left:auto;padding:4px 10px">Cancel</button></div>
      <div class="hint" style="margin:0 0 7px">On ${used} book${used===1?"":"s"} — what you change here changes all of them.</div>
      <input class="field" id="teName" value="${esc(name)}" placeholder="Name">
      ${isG?"":`<div class="lbl" style="display:block;margin:12px 0 4px">Which family it belongs to</div>
        <div id="teCats">${allCats().map(c=>`<button class="rsn ${kwCats[name]===c?"on":""}" data-tecat="${esc(c)}">${kwCats[name]===c?"✓ ":""}${esc(c)}</button>`).join("")}
          <input id="teCatNew" class="addin" style="width:170px;display:inline-block;margin:2px 0 0 2px" placeholder="New family… (Enter)"></div>
        <div class="hint" style="margin:5px 0 0">A family gathers keywords of a kind — Setting, Characters, Themes — and can carry one colour for all of them.</div>`}
      <div class="lbl" style="display:block;margin:12px 0 6px">Colour</div>
      <div id="teCol"></div>
      ${isG?"":`<label class="chk" style="margin-top:8px;font-size:13px"><input type="checkbox" id="teCatCol"> Give this colour to the whole family</label>`}
      ${isG?"":`<div class="hint" style="margin:8px 0 0">Leave it be and this keyword stays plain grey — <button class="btn" id="tePlain" style="padding:2px 8px;font-size:12px">make it plain again</button></div>`}
      <div class="hrow2" style="margin-top:12px"><button class="btn pri" id="teSave">Save</button>
        <button class="btn danger" id="teDel" title="Take it off every book and out of the list">🗑 Remove everywhere</button></div>`;
    q("#teClose",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
    /* opens on whatever it already is — a colour if it has one, plain if it doesn't */
    drawColorPicker(q("#teCol",box),color||catColors[cat]||"",c=>{color=c;},!isG);
    const paintCats=()=>{
      qa("[data-tecat]",box).forEach(x=>{
        const on=x.dataset.tecat===cat;
        x.classList.toggle("on",on);
        x.textContent=(on?"✓ ":"")+x.dataset.tecat;
      });
    };
    qa("[data-tecat]",box).forEach(x=>x.onclick=()=>{
      cat=(cat===x.dataset.tecat)?"":x.dataset.tecat;paintCats();});
    const cn=q("#teCatNew",box);
    if(cn)cn.addEventListener("keydown",e=>{
      if(e.key!=="Enter"||!e.target.value.trim())return;
      cat=titleCase(e.target.value.trim());e.target.value="";
      const wrap=q("#teCats",box);
      if(!qa("[data-tecat]",box).some(x=>x.dataset.tecat===cat)){
        const b2=document.createElement("button");
        b2.className="rsn";b2.dataset.tecat=cat;b2.textContent=cat;
        b2.onclick=()=>{cat=(cat===b2.dataset.tecat)?"":b2.dataset.tecat;paintCats();};
        wrap.insertBefore(b2,cn);
      }
      paintCats();
    });
    const tp=q("#tePlain",box);
    if(tp)tp.onclick=async()=>{
      delete kwColors[name];saveKwColors();
      box.hidden=true;box.innerHTML="";
      renderKw();
      if(SYNC.on)flushQueue();
    };
    q("#teDel",box).onclick=async()=>{
      if(!confirm(`Remove “${name}” from ${used} book${used===1?"":"s"} and from the ${isG?"genre":"keyword"} list?\n\nThe books themselves are untouched. Undo can bring it back.`))return;
      box.hidden=true;box.innerHTML="";
      await relabel(isG?"genres":"keywords",name,"");   /* mapping to nothing drops it */
      markMetaDel((isG?"genre:":"kw:")+name);
      if(isG){delete genres[name];saveMeta();renderGenres();}
      else{delete kwColors[name];saveKwColors();renderKw();}
      if(SYNC.on)flushQueue();
      scheduleSave();
    };
    q("#teSave",box).onclick=async()=>{
      /* read everything off the panel before emptying it */
      const nn=titleCase(q("#teName",box).value.trim());
      const wholeFamily=!!(q("#teCatCol",box)&&q("#teCatCol",box).checked);
      box.hidden=true;box.innerHTML="";
      if(isG)await renameGenre(name,nn,color);
      else{
        const key=nn||name;
        /* the family and the colour travel with the name */
        if(cat)kwCats[key]=cat;else delete kwCats[key];
        if(nn&&nn!==name)delete kwCats[name];
        if(wholeFamily&&cat&&color){
          catColors[cat]=color;
          delete kwColors[key];        /* let it take the family's colour */
        }else{
          if(color&&color!==catColors[cat])kwColors[key]=color;else delete kwColors[key];
        }
        if(nn&&nn!==name)delete kwColors[name];
        saveKwColors();saveKwCats();
        await renameKeyword(name,nn);
        renderKw();
      }
    };
  }
  q("#tagEditTog").onclick=()=>{
    tagEdit=!tagEdit;
    page.classList.toggle("tagedit",tagEdit);
    q("#tagEditTog").textContent=tagEdit?"✓ Done":"✎ Edit names & colours";

  /* genres */
  let pendingGenre=null;
  function renderGenres(){
    /* breaks are remembered by name, so shuffling the chips doesn't move them */
    const gbr=new Set(cur.genreBreaks||[]);
    q("#genChips").className="chiprow";
    q("#genChips").innerHTML=cur.genres.map((g,i)=>
      `<span class="chip big" data-gedit="${esc(g)}" style="background:${genres[g]||"#78716c"}">`
      +(tagEdit?`<button class="chmv" data-gmv="${i}|-1" title="Move it left">◀</button>`:"")
      +esc(g)
      +(tagEdit?`<button class="chmv" data-gmv="${i}|1" title="Move it right">▶</button>`
        +`<button class="chmv ${gbr.has(g)?"on":""}" data-gbr="${esc(g)}" title="${gbr.has(g)?"Let the next one sit beside this":"Start a new row after this"}">↵</button>`:"")
      +` <span class="x" data-gx="${esc(g)}">✕</span></span>`
      +(gbr.has(g)?'<span class="rowbreak"></span>':"")).join("");
    qa("[data-gx]").forEach(x=>x.onclick=e=>{e.stopPropagation();
      cur.genres=cur.genres.filter(g=>g!==x.dataset.gx);
      cur.genreBreaks=(cur.genreBreaks||[]).filter(g=>g!==x.dataset.gx);
      renderGenres();scheduleSave();});
    qa("[data-gmv]").forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      const [i,d]=x.dataset.gmv.split("|").map(Number),j=i+d;
      if(j<0||j>=cur.genres.length)return;
      const a=cur.genres;[a[i],a[j]]=[a[j],a[i]];
      renderGenres();scheduleSave();});
    qa("[data-gbr]").forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      const g=x.dataset.gbr,s=new Set(cur.genreBreaks||[]);
      s.has(g)?s.delete(g):s.add(g);
      cur.genreBreaks=[...s];
      renderGenres();scheduleSave();});
    qa("[data-gedit]").forEach(x=>x.onclick=e=>{
      if(e.target.closest("[data-gx],[data-gmv],[data-gbr]")||!tagEdit)return;
      openTagEditor("genre",x.dataset.gedit);});
    makeChipsDraggable(q("#genChips"),"[data-gedit]",
      ()=>cur.genres,l=>{cur.genres=l;renderGenres();},scheduleSave);
    /* every genre you've already made is on show — typing just narrows it */
    const v=q("#fGenre").value.trim();
    const pool=Object.keys(genres).filter(g=>!cur.genres.includes(g)).sort((a,b)=>a.localeCompare(b));
    const sug=pendingGenre?[]:(v?pool.filter(g=>g.toLowerCase().includes(v.toLowerCase())):pool);
    q("#genSug").innerHTML=sug.length
      ?`<div class="lbl" style="display:block;margin-bottom:3px">${v?"Matching":"Tap to add"}</div>`
        +sug.map(g=>`<span class="chip" style="background:${genres[g]};cursor:pointer" data-gs="${esc(g)}">＋ ${esc(g)}</span>`).join("")
      :(v&&!pendingGenre?`<div class="lbl">No genre by that name yet — press Enter to make it.</div>`:"");
    qa("[data-gs]").forEach(x=>x.onclick=()=>tagEdit?openTagEditor("genre",x.dataset.gs):addGenre(x.dataset.gs,null));
    q("#genPick").innerHTML=pendingGenre?`<div class="colorpick">
      <div class="hint" style="margin:0 0 9px">Pick a colour for <b>${esc(pendingGenre)}</b> — it will look like this everywhere:</div>
      <div id="genPickCol"></div>
      <div class="hrow2" style="margin-top:11px"><button class="btn pri" id="genPickGo">Add “${esc(pendingGenre)}”</button>
        <button class="btn" id="genPickX">Cancel</button></div></div>`:"";
    if(pendingGenre){
      let chosen=PALETTE[0];
      drawColorPicker(q("#genPickCol"),PALETTE[0],c=>{chosen=c;});
      q("#genPickGo").onclick=()=>addGenre(pendingGenre,chosen);
      q("#genPickX").onclick=()=>{pendingGenre=null;renderGenres();};
    }
  }
  function addGenre(name,color){
    const clean=titleCase((name||"").trim());if(!clean)return;
    if(!genres[clean]){
      if(!color){pendingGenre=clean;renderGenres();return;}
      genres[clean]=color;unmarkMetaDel("genre:"+clean);saveMeta();
    }
    if(!cur.genres.includes(clean))cur.genres.push(clean);
    pendingGenre=null;q("#fGenre").value="";
    renderGenres();scheduleSave();
  }
  q("#fGenre").addEventListener("input",()=>{pendingGenre=null;renderGenres();});
  q("#fGenre").addEventListener("keydown",e=>{if(e.key==="Enter")addGenre(q("#fGenre").value,null);});
  renderGenres();

  /* lists */
  function renderList(key){
    const box=q("#list-"+key);

    box.innerHTML=cur[key].map((it,i)=>`<div class="li ${quote?"q":""}">

      <div contenteditable="true" data-li="${i}"></div>
      <button class="lx" data-lx="${i}">✕</button></div>`).join("");
    qa("[data-li]",box).forEach(el=>{el.innerHTML=cur[key][+el.dataset.li];
      el.addEventListener("input",()=>{cur[key][+el.dataset.li]=el.innerHTML;scheduleSave();});});
    qa("[data-lx]",box).forEach(x=>x.onclick=()=>{cur[key].splice(+x.dataset.lx,1);renderList(key);scheduleSave();});

  qa("[data-ord]").forEach(b=>b.onclick=()=>openListOrder(b.dataset.ord));
  ["pros","cons","meh","quotes"].forEach(k=>{

    q("#add-"+k).addEventListener("keydown",e=>{
      if(e.key==="Enter"&&e.target.value.trim()){

  /* cover */

  /* pictures */
  q("#imgFile").onchange=e=>{[...e.target.files].forEach(addPicture);e.target.value="";};
  page.addEventListener("paste",e=>{
    if(activeBgPicker)return;   /* background picker is open — let it take the image */
    for(const it of e.clipboardData?.items||[]){

  async function addPicture(file){
    if(!file||!file.type.startsWith("image/"))return;
    let data;try{data=await compressImage(file);}catch(err){alert("That image couldn't be read.");return;}
    const rect=page.getBoundingClientRect();

    const im={id:uid(),x:30+(cur.images.length*26)%180,y:baseY+(cur.images.length*18)%90,w:240,behind:false};
    try{await dbPut("images",{key:cur.id+"|"+im.id,data});}catch(err){alert("That image couldn't be saved.");return;}
    curImgs[im.id]=data;cur.images.push(im);
    if(SYNC.on)enqueue({kind:"img",key:cur.id+"|"+im.id});
    if(mode!=="arrange")setMode("arrange");   /* so you can place it straight away */
    renderImages();scheduleSave();
  }

  function pageMin(){
    if(fitScreen){page.style.minHeight="";return;}
    const hs=[...cur.images.map(i=>i.y+i.w*1.2+160),...(cur.pads||[]).map(p=>p.y+p.h+160)];
    if(!hs.length){page.style.minHeight="";return;}
    page.style.minHeight=Math.max(...hs)+"px";
  }

  /* ---- drawing ----
     A stroke belongs to whatever it was started on: a picture, a note, or the page.
     Picture/note strokes are kept 0..1 so they travel and scale with their surface. */
  function surfaceOf(e){
    const pad=e.target.closest?e.target.closest(".pad"):null;
    if(pad)return {kind:"pad",el:pad,obj:(cur.pads||[]).find(x=>x.id===pad.dataset.pad)};
    const sc=e.target.closest?e.target.closest(".scrap"):null;
    if(sc)return {kind:"img",el:sc,obj:(cur.images||[]).find(x=>x.id===sc.dataset.im)};
    return {kind:"page",el:page,obj:null};
  }
  /* layout size, not the tilted bounding box */
  const surfScale=surf=>surf.kind==="page"?[1,1]:[surf.el.offsetWidth||1,surf.el.offsetHeight||1];
  /* undo the surface's tilt/flip so a mark lands under the pointer */
  function surfPt(surf,cx,cy){
    const el=surf.el,r=el.getBoundingClientRect();
    if(surf.kind==="page")return [cx-r.left,cy-r.top];
    const w=el.offsetWidth||r.width||1,h=el.offsetHeight||r.height||1;
    const ox=r.left+r.width/2,oy=r.top+r.height/2;
    const o=surf.obj||{};
    const th=-(o.rot||0)*Math.PI/180;
    const dx=cx-ox,dy=cy-oy;
    let lx=dx*Math.cos(th)-dy*Math.sin(th),ly=dx*Math.sin(th)+dy*Math.cos(th);
    if(o.flipH)lx=-lx;
    if(o.flipV)ly=-ly;
    const cl=v=>Math.max(0,Math.min(1,v));
    return [cl((lx+w/2)/w),cl((ly+h/2)/h)];
  }
  function strokeStore(surf){
    if(surf.kind==="page"){cur.draw=cur.draw||[];return cur.draw;}
    if(surf.kind==="pad"){const p=cur.pads.find(x=>x.id===surf.el.dataset.pad);if(!p)return null;p.draw=p.draw||[];return p.draw;}
    const im=cur.images.find(x=>x.id===surf.el.dataset.im);if(!im)return null;im.draw=im.draw||[];return im.draw;
  }
  function paintSurface(el,strokes){
    const svg=q(".dsvg",el);if(!svg)return;
    const W=el.clientWidth,H=el.clientHeight;
    if(!W||!H)return;
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    svg.innerHTML=drawSvgHtml(strokes,W,H);
  }
  function syncDraw(){
    const il=q("#imgLayer"),pl=q("#padLayer"),dl=q("#drawLayer");
    if(il)qa(".scrap",il).forEach(el=>{const im=cur.images.find(x=>x.id===el.dataset.im);if(im)paintSurface(el,im.draw);});
    if(pl)qa(".pad",pl).forEach(el=>{const p=(cur.pads||[]).find(x=>x.id===el.dataset.pad);if(p)paintSurface(el,p.draw);});
    if(dl)dl.innerHTML=drawSvgHtml(cur.draw,1,1);
  }
  function startStroke(e){
    const surf=surfaceOf(e);
    const store=strokeStore(surf);
    if(!store)return;
    const [sx,sy]=surfScale(surf);
    if(drawTool==="erase"){
      const px=surfPt(surf,e.clientX,e.clientY);
      const hit=[...store].reverse().find(s=>nearStroke(s,[px[0]*sx,px[1]*sy],sx,sy));
      if(hit){store.splice(store.indexOf(hit),1);syncDraw();scheduleSave();}
      return;
    }
    e.preventDefault();
    const s={t:drawTool,c:drawColor,w:drawWidth,pts:[surfPt(surf,e.clientX,e.clientY)]};
    if(drawTool==="hl")s.o=hlAlpha;      /* each highlight keeps the dimness it was drawn with */
    store.push(s);
    const mv=ev=>{
      const p=surfPt(surf,ev.clientX,ev.clientY);
      if(s.t==="pen"||s.t==="hl")s.pts.push(p);else s.pts[1]=p;
      syncDraw();
    };
    const up=()=>{
      window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
      if(s.pts.length<2)s.pts.push([...s.pts[0]]);
      syncDraw();scheduleSave();
    };
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  }
  /* #edPage is only the middle text column, so listening on it left the empty
     margins undrawable — listen on the window instead and let page strokes run
     past the column's edges (they're stored relative to it, negatives included) */
  if(window.__drawDown)document.removeEventListener("pointerdown",window.__drawDown);
  window.__drawDown=e=>{
    if(mode!=="draw")return;
    if(drawTool==="hl"&&hlMode!=="free")return;   /* those work on selected text instead */
    if(!document.body.contains(page)){document.removeEventListener("pointerdown",window.__drawDown);window.__drawDown=null;return;}
    const t=e.target;
    if(t&&t.closest&&t.closest(".edbar,.bgpanel,.modebar,.imenu,.sbar,.pbar"))return;
    startStroke(e);
  };
  document.addEventListener("pointerdown",window.__drawDown);
  function setDrawUI(){
    qa("[data-dt]").forEach(b=>b.classList.toggle("on",b.dataset.dt===drawTool));
    const isHl=drawTool==="hl";
    const hw=q("#hlWrap");if(hw)hw.hidden=!isHl;
    const hm=q("#hlModeWrap");if(hm)hm.hidden=!isHl;
    qa("[data-hlm]").forEach(b=>b.classList.toggle("on",b.dataset.hlm===hlMode));
    /* working on text needs the writing selectable again, and the pen out of the way */
    page.classList.toggle("hlsel",mode==="draw"&&isHl&&hlMode!=="free");
    renderColStrip();
  }
  qa("[data-hlm]").forEach(b=>b.onclick=()=>{hlMode=b.dataset.hlm;setDrawUI();});
  qa("[data-dt]").forEach(b=>b.onclick=()=>{
    const was=drawTool;drawTool=b.dataset.dt;
    /* the pen's inks go muddy once washed out, so swap palettes with the tool —
       unless you'd picked your own colour from the wheel */
    if(drawTool==="hl"&&was!=="hl"&&DRAW_SWATCHES.indexOf(drawColor)>=0)drawColor=HL_SWATCHES[0];
    else if(drawTool!=="hl"&&was==="hl"&&HL_SWATCHES.indexOf(drawColor)>=0)drawColor=DRAW_SWATCHES[0];
    setDrawUI();
  });
  q("#dw").oninput=e=>{drawWidth=+e.target.value;};
  q("#hlDim").oninput=e=>{hlAlpha=+e.target.value/100;};
  q("#dclear").onclick=()=>{
    if(!confirm("Rub out every mark on this page, its pictures and its notes? The Undo button can bring them back."))return;
    cur.draw=[];
    (cur.images||[]).forEach(im=>im.draw=[]);
    (cur.pads||[]).forEach(p=>p.draw=[]);
    syncDraw();scheduleSave();
  };
  setDrawUI();

  /* ---- how far left/right things may roam ----
     x stays measured from the text column's left edge (so nothing already placed
     moves), but the range now reaches the whole window — including the empty
     margins either side. On a phone the margins are ~0, so it collapses to the
     column by itself and nothing ends up off-screen. */
  function xRange(w){
    const r=page.getBoundingClientRect();
    const lo=-r.left+8;
    const hi=window.innerWidth-r.left-(w||0)-8;   /* whole item stays in view — no sideways scrollbar */
    return [lo,Math.max(lo,hi)];
  }
  /* render-time only: keeps a desktop-placed item reachable on a narrow phone
     without rewriting what you actually chose. The allowance matters — the range
     depends on the window width, which changes by a scrollbar's worth when the
     page grows, and clamping to it every render nudged things off their spot. */
  function cx(v,w){
    const x=v||0,[lo,hi]=xRange(w);
    return (x<lo-40||x>hi+40)?Math.max(lo,Math.min(hi,x)):x;
  }

  /* ---- cut the background out of a picture ---- */
  function openCut(im){
    const key=cur.id+"|"+im.id;
    const orig=curImgs[im.id];
    if(!orig){alert("That picture isn't loaded yet.");return;}
    const box=q("#cutPanel");box.hidden=false;
    let tol=32,trim=true,result=null,busy=false,applied=false;
    box.innerHTML=`<div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">Cut out the background</b>
        <button class="btn" id="cutX" style="margin-left:auto;padding:4px 10px">Close</button></div>
      <div class="cutprev" id="cutPrev"><span class="none">Working…</span></div>
      <div class="opac">Amount <input type="range" id="cutTol" min="4" max="120" value="${tol}"><b id="cutTolV" style="width:34px;text-align:right">${tol}</b></div>
      <label class="chk" style="margin-top:8px;font-size:13px"><input type="checkbox" id="cutTrim" checked> Trim the empty edges away</label>
      <div class="hint" id="cutMsg" style="margin:9px 0 0">Works best when the background is one flat colour. Busy photos won't cut cleanly.</div>
      <div class="hrow2" style="margin-top:11px"><button class="btn pri" id="cutApply">Use this</button>
        <button class="btn" id="cutBack" hidden>Put the original back</button></div>`;
    const prev=q("#cutPrev",box),msg=q("#cutMsg",box);
    const run=async()=>{
      if(busy)return;busy=true;
      try{
        result=await cutOutImage(orig,tol,trim);
        prev.innerHTML=`<img src="${result.data}">`;
        msg.textContent=`Removed about ${result.pct}% of the picture — now ${result.w}×${result.h}. Drag Amount if it took too much or too little.`;
      }catch(err){
        result=null;prev.innerHTML='<span class="none">Nothing left</span>';
        msg.textContent=err.message||"That didn't work.";
      }
      busy=false;
    };
    let t=null;
    const later=()=>{clearTimeout(t);t=setTimeout(run,180);};
    q("#cutTol",box).oninput=e=>{tol=+e.target.value;q("#cutTolV",box).textContent=tol;later();};
    q("#cutTrim",box).onchange=e=>{trim=e.target.checked;later();};
    q("#cutX",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
    q("#cutApply",box).onclick=async()=>{
      if(!result)return;
      im.cut=Date.now();          /* a real change, so the book saves and other devices re-pull this picture */
      await dbPut("images",{key,data:result.data,v:im.cut});
      curImgs[im.id]=result.data;
      if(SYNC.on)enqueue({kind:"img",key});
      applied=true;q("#cutBack",box).hidden=false;
      renderImages();scheduleSave();
      msg.textContent="Done. Not right? Put the original back, or close this.";
    };
    q("#cutBack",box).onclick=async()=>{
      if(!applied)return;
      im.cut=Date.now();
      await dbPut("images",{key,data:orig,v:im.cut});
      curImgs[im.id]=orig;
      if(SYNC.on)enqueue({kind:"img",key});
      renderImages();scheduleSave();
      q("#cutBack",box).hidden=true;applied=false;
      msg.textContent="Original put back.";
    };
    run();
  }

  /* ---- crop: drag a box over the part worth keeping ---- */
  function openCrop(im){
    const key=cur.id+"|"+im.id;
    const orig=curImgs[im.id];
    if(!orig){alert("That picture isn't loaded yet.");return;}
    const box=q("#cropPanel");box.hidden=false;
    let sel=null,applied=false;      /* sel is 0..1 of the picture */
    box.innerHTML=`<div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⬚ Crop</b>
        <button class="btn" id="crX" style="margin-left:auto;padding:4px 10px">Close</button></div>
      <div class="hint" style="margin:0 0 8px">Drag a box over the part you want to keep. Everything outside it is trimmed away.</div>
      <div id="crStage" style="position:relative;display:inline-block;max-width:100%;touch-action:none;cursor:crosshair">
        <img id="crImg" src="${orig}" style="max-width:100%;max-height:300px;display:block;border-radius:8px">
        <div id="crSel" hidden style="position:absolute;border:2px solid #14b8a6;background:rgba(20,184,166,.18);pointer-events:none"></div>
      </div>
      <div class="hint" id="crMsg" style="margin:8px 0 0">Nothing selected yet.</div>
      <div class="hrow2" style="margin-top:9px">
        <button class="btn pri" id="crDo" disabled>Keep this part</button>
        <button class="btn" id="crClr" disabled>Clear</button>
        <button class="btn" id="crBack" hidden>Put the original back</button>
      </div>`;
    const stage=q("#crStage",box),selEl=q("#crSel",box),msg=q("#crMsg",box);
    const paint=()=>{
      const r=q("#crImg",box).getBoundingClientRect(),s=stage.getBoundingClientRect();
      if(!sel){selEl.hidden=true;return;}
      selEl.hidden=false;
      selEl.style.left=(r.left-s.left+sel.x*r.width)+"px";
      selEl.style.top=(r.top-s.top+sel.y*r.height)+"px";
      selEl.style.width=(sel.w*r.width)+"px";
      selEl.style.height=(sel.h*r.height)+"px";
    };
    stage.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const r=q("#crImg",box).getBoundingClientRect();
      const cl=v=>Math.max(0,Math.min(1,v));
      const x0=cl((e.clientX-r.left)/r.width),y0=cl((e.clientY-r.top)/r.height);
      const mv=ev=>{
        const x1=cl((ev.clientX-r.left)/r.width),y1=cl((ev.clientY-r.top)/r.height);
        sel={x:Math.min(x0,x1),y:Math.min(y0,y1),w:Math.abs(x1-x0),h:Math.abs(y1-y0)};
        paint();
      };
      const up=()=>{
        window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        const ok=sel&&sel.w>.02&&sel.h>.02;
        if(!ok){sel=null;paint();}
        q("#crDo",box).disabled=!ok;q("#crClr",box).disabled=!ok;
        msg.textContent=ok?`Keeping about ${Math.round(sel.w*100)}% across and ${Math.round(sel.h*100)}% down.`
          :"Drag a bigger box — that one was too small.";
      };
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    });
    q("#crClr",box).onclick=()=>{sel=null;paint();q("#crDo",box).disabled=true;q("#crClr",box).disabled=true;msg.textContent="Nothing selected yet.";};
    q("#crX",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
    q("#crDo",box).onclick=()=>{
      if(!sel)return;
      const img=new Image();
      img.onload=async()=>{
        const W=img.naturalWidth,H=img.naturalHeight;
        const sx=Math.round(sel.x*W),sy=Math.round(sel.y*H);
        const sw=Math.max(1,Math.round(sel.w*W)),sh=Math.max(1,Math.round(sel.h*H));
        const c=document.createElement("canvas");c.width=sw;c.height=sh;
        c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
        /* keep PNG if it was one — a cut-out picture's transparency must survive */
        const png=/^data:image\/png/i.test(orig);
        const data=png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.88);
        im.cut=Date.now();
        try{await dbPut("images",{key,data,v:im.cut});}
        catch(err){alert("That didn't fit — storage may be full.");return;}
        curImgs[im.id]=data;
        if(SYNC.on)enqueue({kind:"img",key});
        applied=true;q("#crBack",box).hidden=false;
        sel=null;paint();
        q("#crDo",box).disabled=true;q("#crClr",box).disabled=true;
        const ci=q("#crImg",box);if(ci)ci.src=data;
        msg.textContent=`Cropped to ${sw}×${sh}. Crop again, or close.`;
        renderImages();scheduleSave();
      };
      img.onerror=()=>{msg.textContent="That picture couldn't be read.";};
      img.src=curImgs[im.id];
    };
    q("#crBack",box).onclick=async()=>{
      if(!applied)return;
      im.cut=Date.now();
      await dbPut("images",{key,data:orig,v:im.cut});
      curImgs[im.id]=orig;
      if(SYNC.on)enqueue({kind:"img",key});
      const ci=q("#crImg",box);if(ci)ci.src=orig;
      q("#crBack",box).hidden=true;applied=false;sel=null;paint();
      msg.textContent="Original put back.";
      renderImages();scheduleSave();
    };
  }

  /* only one item's ⋯ menu open at a time */
  function closeItemMenus(except){
    qa(".imenu",page).forEach(m=>{if(m!==except)m.hidden=true;});
  }
  page.addEventListener("pointerdown",e=>{if(!e.target.closest(".imenu,.smore,.pmore"))closeItemMenus(null);});

  /* ---- stacking: pictures and notes share one order, so either can sit on top ---- */
  const zOf=o=>o.z||0;
  const allItems=()=>[...(cur.images||[]),...(cur.pads||[])];
  function normZ(){
    allItems().sort((a,b)=>zOf(a)-zOf(b)).forEach((o,i)=>o.z=i);
  }
  function toFront(o){o.z=1e6;normZ();renderImages();renderPads();scheduleSave();}
  function toBack(o){o.z=-1e6;normZ();renderImages();renderPads();scheduleSave();}

  /* drag the amber handle to tilt; double-click it to straighten. Shift snaps to 15°. */
  function startRot(handle,el,obj){
    if(!handle)return;
    handle.ondblclick=e=>{e.stopPropagation();obj.rot=0;el.style.transform=xform(obj);syncDraw();scheduleSave();};
    handle.addEventListener("pointerdown",e=>{
      if(mode!=="arrange")return;
      e.preventDefault();e.stopPropagation();
      const r=el.getBoundingClientRect();
      const ox=r.left+r.width/2,oy=r.top+r.height/2;
      const a0=Math.atan2(e.clientY-oy,e.clientX-ox),r0=obj.rot||0;
      const mv=ev=>{
        let deg=r0+(Math.atan2(ev.clientY-oy,ev.clientX-ox)-a0)*180/Math.PI;
        if(ev.shiftKey)deg=Math.round(deg/15)*15;
        obj.rot=Math.round(deg*10)/10;
        el.style.transform=xform(obj);
      };
      const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        syncDraw();scheduleSave();};
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    });
  }

  /* notepad pages */
  function addPad(){
    cur.pads=cur.pads||[];
    const rect=page.getBoundingClientRect();
    const baseY=Math.max(20,-rect.top+160);
    const n=cur.pads.length;
    const p={id:uid(),x:30+(n*26)%180,y:baseY+(n*18)%90,w:220,h:170,

        <div class="padshape ${sh!=="none"?"shaped":""}" style="${padStyle(p.skin)}${sh!=="none"?`;clip-path:url(#pc-${sh})`:""}">

    qa(".pad",layer).forEach(el=>{

      const pmenu=q(".imenu",el);
      q(".pmore",el).onclick=e=>{e.stopPropagation();closeItemMenus(pmenu);pmenu.hidden=!pmenu.hidden;};
      q(".pflh",el).onclick=e=>{e.stopPropagation();p.flipH=!p.flipH;el.style.transform=xform(p);pmenu.hidden=true;scheduleSave();};
      q(".pflv",el).onclick=e=>{e.stopPropagation();p.flipV=!p.flipV;el.style.transform=xform(p);pmenu.hidden=true;scheduleSave();};
      q(".pfront",el).onclick=e=>{e.stopPropagation();toFront(p);};
      q(".pback",el).onclick=e=>{e.stopPropagation();toBack(p);};
      q(".pskin",el).onclick=e=>{e.stopPropagation();
        const bp=q("#bgPanel");bp.hidden=true;bp.innerHTML="";q("#edBg").classList.remove("on");
        const box=q("#padPanel");box.hidden=false;
        drawPadPicker(box,p,()=>{settings.lastPadSkin=p.skin;settings.lastPadShape=p.shape;saveSettings();renderPads();scheduleSave();});
      };
      startRot(q(".rot",el),el,p);
      /* `how` is "drag" or "resize" — do NOT name it `mode`, that's the editor's mode */
      const startDrag=(e,how)=>{
        if(mode!=="arrange")return;
        if(e.target.closest(".pbar"))return;
        e.preventDefault();
        const sx=e.clientX,sy=e.clientY,x=cx(p.x,p.w),y=p.y,w=p.w,h=p.h;
        const [loX,hiX]=xRange(p.w);
        const mv=ev=>{
          if(how==="drag"){p.x=Math.min(hiX,Math.max(loX,x+ev.clientX-sx));p.y=Math.max(0,y+ev.clientY-sy);}
          else{p.w=Math.max(90,Math.min(1200,w+ev.clientX-sx));p.h=Math.max(70,Math.min(1400,h+ev.clientY-sy));}
          el.style.left=p.x+"px";el.style.top=p.y+"px";el.style.width=p.w+"px";el.style.height=p.h+"px";};
        const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);pageMin();syncDraw();scheduleSave();};
        window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);};
      el.addEventListener("pointerdown",e=>{
        if(e.target.closest(".prs"))startDrag(e,"resize");else startDrag(e,"drag");});
    });

  q("#edPad").onclick=addPad;
  function renderImages(){
    const layer=q("#imgLayer");
    layer.innerHTML=cur.images.map(im=>curImgs[im.id]?`
      <div class="scrap ${im.behind?"bh":""}" data-im="${im.id}" style="left:${cx(im.x,im.w)}px;top:${im.y}px;width:${im.w}px;transform:${xform(im)};z-index:${10+Math.min(34,zOf(im))}">
        <img src="${curImgs[im.id]}" draggable="false">
        <svg class="dsvg" preserveAspectRatio="none"></svg>
        <div class="sbar ${im.y<46?"below":""}">
          <button class="sfade ${im.behind?"on":""}" title="${im.behind?"Make fully visible":"Fade so text shows through"}">◐</button>
          <button class="smore" title="Flip, layer…">⋯</button>
          <button class="sdel" title="Delete this picture">✕</button>
        </div>
        <div class="imenu" hidden>
          <button class="sflh">⇄ Flip across</button>
          <button class="sflv">⇅ Flip upside down</button>
          <button class="sfront">⬆ Bring to front</button>
          <button class="sback">⬇ Send to back</button>

    qa(".scrap",layer).forEach(el=>{
      const im=cur.images.find(i=>i.id===el.dataset.im);

      q(".sflh",el).onclick=e=>{e.stopPropagation();im.flipH=!im.flipH;el.style.transform=xform(im);smenu.hidden=true;scheduleSave();};
      q(".sflv",el).onclick=e=>{e.stopPropagation();im.flipV=!im.flipV;el.style.transform=xform(im);smenu.hidden=true;scheduleSave();};
      q(".sfront",el).onclick=e=>{e.stopPropagation();toFront(im);};
      q(".sback",el).onclick=e=>{e.stopPropagation();toBack(im);};
      q(".scrop",el).onclick=e=>{e.stopPropagation();smenu.hidden=true;openCrop(im);};
      q(".scut",el).onclick=e=>{e.stopPropagation();smenu.hidden=true;openCut(im);};
      startRot(q(".rot",el),el,im);
      q(".sdel",el).onclick=e=>{e.stopPropagation();

        if(SYNC.on)enqueue({kind:"imgDel",key:cur.id+"|"+im.id});
        cur.images=cur.images.filter(i=>i.id!==im.id);renderImages();scheduleSave();};
      /* `how` is "drag" or "resize" — do NOT name it `mode`, that's the editor's mode */
      const startDrag=(e,how)=>{
        if(mode!=="arrange")return;
        if(e.target.closest(".sbar"))return;
        e.preventDefault();
        const sx=e.clientX,sy=e.clientY,x=cx(im.x,im.w),y=im.y,w=im.w;
        const [loX,hiX]=xRange(im.w);
        const mv=ev=>{
          if(how==="drag"){im.x=Math.min(hiX,Math.max(loX,x+ev.clientX-sx));im.y=Math.max(0,y+ev.clientY-sy);}
          else im.w=Math.max(60,Math.min(1400,w+ev.clientX-sx));

        window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);};
      el.addEventListener("pointerdown",e=>{
        if(e.target.closest(".rs"))startDrag(e,"resize");else startDrag(e,"drag");});
      const im2=q("img",el);if(im2)im2.addEventListener("load",syncDraw);

  applyFit();       /* and the fit-to-screen layout */

/* =============== backup, snapshots & storage =============== */
const fmtBytes=n=>{if(n==null)return "–";const u=["B","KB","MB","GB"];let i=0,v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++;}
  return (i===0||v>=10?Math.round(v):v.toFixed(1))+" "+u[i];};
const fmtWhen=t=>new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});

async function storageInfo(){
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    return {usage:e.usage||0,quota:e.quota||0};}}catch(e){}
  return null;
}
function saveSettings(){dbPut("meta",{k:"settings",v:settings});}

/* one shared shape for export, snapshots and import — keeps the old file compatible */
async function buildBackup(){
  const covers={};(await dbAll("covers")).forEach(c=>covers[c.id]=c.data);
  const images={};(await dbAll("images")).forEach(i=>images[i.key]=i.data);
  return {app:"my-shelf",version:1,exported:new Date().toISOString(),
    index:books.map(b=>({id:b.id})),books,genres,dnfReasons:dnfCustom,audiences:audCustom,
    backgrounds:bgList,padskins:padList,fandoms,groupArt,kwColors,kwCats,catColors,libArt,covers,images};
}
function downloadJson(json,name){
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function exportBackup(){
  const msg=q("#busyMsg");if(msg)msg.textContent="Packing your shelf…";
  try{
    downloadJson(JSON.stringify(await buildBackup()),`my-shelf-backup-${new Date().toISOString().slice(0,10)}.json`);
  }catch(e){alert("Export ran into a problem — try again.");}
  if(q("#busyMsg"))q("#busyMsg").textContent="";
}
/* a backup file is the one input that may come from outside this app — strip
   anything that could run (event handlers, scripts) before it reaches innerHTML */
function cleanHtml(h){
  if(typeof h!=="string"||h.indexOf("<")<0)return h;
  const t=document.createElement("template");t.innerHTML=h;
  t.content.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n=>n.remove());
  t.content.querySelectorAll("*").forEach(n=>{
    for(const a of [...n.attributes]){
      const nm=a.name.toLowerCase();

    }
  });
  return t.innerHTML;
}

/* merges a backup in: existing books kept, matching ones updated */
async function applyBackup(data){
  if(!data||data.app!=="my-shelf"||!Array.isArray(data.books))throw new Error("not a shelf backup");
  /* stamp restored books as edited-now: "restore wins" then holds on every device,
     instead of losing a last-write race against newer cloud copies */
  const now=Date.now();
  for(const b of data.books){sanitizeBook(b);b.modified=now;await dbPut("books",b);}
  for(const[id,c]of Object.entries(data.covers||{})){await dbPut("covers",{id,data:c});coverCache.delete(id);SYNC.triedCover.delete(id);}
  for(const[k,d]of Object.entries(data.images||{}))await dbPut("images",{key:k,data:d});
  const map=new Map(books.map(b=>[b.id,b]));
  for(const b of data.books)map.set(b.id,b);
  books=[...map.values()];
  genres=Object.assign({},data.genres||{},genres);
  dnfCustom=[...new Set([...dnfCustom,...(data.dnfReasons||[])])];
  audCustom=[...new Set([...audCustom,...(data.audiences||[])])];
  const haveB=new Set(bgList.map(x=>x.id));
  (data.backgrounds||[]).forEach(x=>{if(x&&x.id&&!haveB.has(x.id))bgList.push(x);});
  const haveP=new Set(padList.map(x=>x.id));
  (data.padskins||[]).forEach(x=>{if(x&&x.id&&!haveP.has(x.id))padList.push(x);});
  const fdIn=data.fandoms||{};
  for(const f in fdIn)fandoms[f]=[...new Set([...(fandoms[f]||[]),...(fdIn[f]||[])])];
  const gaIn=data.groupArt||{};
  for(const k in gaIn)if(!groupArt[k])groupArt[k]=gaIn[k];
  const kcIn=data.kwColors||{};
  for(const k in kcIn)if(!kwColors[k])kwColors[k]=kcIn[k];
  const kcatIn=data.kwCats||{};
  for(const k in kcatIn)if(!kwCats[k])kwCats[k]=kcatIn[k];
  const ccIn=data.catColors||{};
  for(const c in ccIn)if(!catColors[c])catColors[c]=ccIn[c];
  saveKwCats();
  const haveLa=new Set(libArt.map(a=>a.id));
  (data.libArt||[]).forEach(a=>{if(a&&a.id&&!haveLa.has(a.id))libArt.push(a);});
  saveBgList();savePadList();saveFandoms();saveGroupArt();saveKwColors();saveLibArt();
  saveMeta();
  if(SYNC.on){
    for(const b of data.books){delete deletions[b.id];enqueue({kind:"book",id:b.id});}
    for(const id of Object.keys(data.covers||{}))enqueue({kind:"cover",id});
    for(const k of Object.keys(data.images||{}))enqueue({kind:"img",key:k});
    saveDeletions();flushQueue();
  }
  return data.books.length;
}
