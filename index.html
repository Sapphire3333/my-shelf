async function initSync(){
  if(!syncConfigured()){SYNC.on=false;render();return;}
  try{SYNC.supa=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}
  catch(e){console.warn("[shelf] supabase init failed",e);SYNC.on=false;render();return;}
  SYNC.on=true;
  window.addEventListener("online",()=>{setSync("syncing");flushQueue().then(pullAll);});
  window.addEventListener("offline",()=>setSync("offline"));
  SYNC.supa.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_IN"&&session&&session.user){
      if(!SYNC.user){
        SYNC.user=session.user;render();
        checkAccount(session.user).then(ok=>{if(ok)flushQueue().then(pullAll);});
      }else SYNC.user=session.user;
    }else if(event==="SIGNED_OUT"){SYNC.user=null;renderLogin();}
    else if(session&&session.user){SYNC.user=session.user;}
  });
  const {data}=await SYNC.supa.auth.getSession();
  if(data&&data.session&&data.session.user){
    SYNC.user=data.session.user;render();
    if(await checkAccount(SYNC.user))flushQueue().then(pullAll);
  }else{
    renderLogin();
  }
}

/* Two copies of the app in one browser quietly overwrite each other's saves
   and upload queue — each tab holds its own picture of the shelf and writes it
   whole. There is no safe way to referee that, so at least say it out loud. */
try{
  const tabBC=new BroadcastChannel("my-shelf-tab");
  const warnTwoTabs=()=>{
    if(window.__twoTabs)return;window.__twoTabs=true;
    const w=document.createElement("div");
    w.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:500;background:#7f1d1d;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center";
    w.textContent="My Shelf is open in another tab. Two tabs overwrite each other's saves — please keep just one.";
    document.body.appendChild(w);
    setTimeout(()=>{w.remove();window.__twoTabs=false;},12000);
  };
  tabBC.onmessage=e=>{
    if(e.data==="hello"){warnTwoTabs();tabBC.postMessage("here");}
    else if(e.data==="here")warnTwoTabs();
  };
  tabBC.postMessage("hello");
}catch(e){}

/* Phones kill background tabs without warning and throttle timers, so the 700ms
   autosave may never fire — commit the open book the moment the tab goes hidden.
   Coming back is the natural moment to fetch what other devices did meanwhile. */
let lastFocusPull=0;
function onHidden(){
  if(view==="book"&&cur){clearTimeout(saveTimer);commitCur();}
  if(impSaveT)writeImportQueue();   /* a staged list waiting on its timer */
  if(qSaveT)writeSyncQueue();       /* and the uploads still to go */
}
let lastMaint=0,hiddenAt=0;
/* everything this device might not have heard about yet, asked for on purpose.
   Pulling was only ever a side effect of arriving, coming back or coming
   online, and none of those fire when a phone simply resumes an app it never
   really closed — so there was no way to ask. */
function syncNow(){
  if(!SYNC.on||!SYNC.user)return Promise.resolve();
  lastFocusPull=Date.now();
  return flushQueue().then(pullAll).catch(e=>{console.warn("[shelf] sync now",e);});
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();onHidden();return;}
  /* away for a moment is not the same as away since yesterday: a page that has
     actually been put down is worth a fresh look however recently it last ran */
  const wasAway=hiddenAt&&Date.now()-hiddenAt>10000;
  if(SYNC.on&&SYNC.user&&navigator.onLine&&(wasAway||Date.now()-lastFocusPull>60000)){
    lastFocusPull=Date.now();
    flushQueue().then(pullAll);
  }
  /* the "daily" backup and the 30-day bin used to be checked only at launch — a
     tab or installed app left open for a week never did either */
  if(Date.now()-lastMaint>3600000){lastMaint=Date.now();maybeAutoBackup();purgeTrash();}
});
window.addEventListener("pagehide",onHidden);
/* a phone bringing the app back from its own memory fires this and often
   nothing else — without it the shelf could sit for days showing yesterday */
window.addEventListener("pageshow",e=>{
  if(SYNC.on&&SYNC.user&&navigator.onLine&&(e.persisted||hiddenAt))syncNow();

/* Ctrl+Z / Ctrl+Y work app-wide when you're not inside a text field
   (inside one, the browser's own text undo stays in charge) */
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k!=="z"&&k!=="y")return;
  const t=e.target;
  if(t&&(t.isContentEditable||/^(input|textarea|select)$/i.test(t.tagName||"")))return;
  e.preventDefault();
  /* through finishSaveThen, like the ↶ button: a half-second-old edit still on
     the autosave timer must land before the undo counts back from it */
  if(k==="y"||e.shiftKey)finishSaveThen(doRedo);else finishSaveThen(doUndo);
});

   matching the name ignoring case. Runs at boot and whenever the library draws,

function repairGroupArt(){
  let moved=false;
  try{
    for(const k of Object.keys(groupArt)){
      const i=k.indexOf("|");if(i<0)continue;
      const kind=k.slice(0,i),label=k.slice(i+1);
      if(kind!=="genre"||genres[label])continue;
      const match=Object.keys(genres).find(g=>g.toLowerCase()===label.toLowerCase());
      if(match&&!groupArt[kind+"|"+match]){
        groupArt[kind+"|"+match]=groupArt[k];
        delete groupArt[k];moved=true;
      }
    }
  }catch(e){}
  if(moved)dbPut("meta",{k:"groupArt",v:groupArt});
  return moved;
}

   slider or the wheel doesn't rebuild the control under your finger. */
function drawColorPicker(box,start,onChange,allowPlain){
  /* start where it already is: the colour it has now, or no colour at all */
  let base=(start&&/^#[0-9a-f]{3,6}$/i.test(start))?start:(allowPlain?null:PALETTE[0]);
  let muted=false,bright=100;
  /* untouched settings hand back exactly the colour we were given — no round-trip drift */

    <div class="hrow2" style="gap:6px;margin-bottom:8px">
      <button class="pill on" data-cpm="0">Bright</button>
      <button class="pill" data-cpm="1">Muted</button>

      <span class="chip big" id="cpPrev" style="margin-left:auto">Preview</span>
    </div>

    </div>
    <div class="hrow2" style="margin-top:10px;gap:8px">
      <input type="color" id="cpWheel" value="${eff()}" title="Any colour you like">
      <span class="lbl">or pick any colour at all</span>
    </div>
    <div class="opac" style="margin-top:8px">Brightness
      <input type="range" id="cpB" min="55" max="145" value="100">
      <b id="cpBV" style="width:44px;text-align:right">100%</b></div>`;
  const refresh=()=>{
    const c=eff();
    const pv=q("#cpPrev",box);
    if(pv){
      pv.textContent=c?"Preview":"No colour";
      pv.style.background=c||"#e7e5e4";
      pv.style.color=c?inkOn(c):"#57534e";
    }
    qa("[data-cpc]",box).forEach(b=>{
      const bc=b.dataset.cpc;
      b.style.background=shadeOf(muted?mutedOf(bc):bc,bright);
      b.style.outline=bc===base?"2px solid var(--ink)":"";
      b.style.outlineOffset="2px";
    });
    qa("[data-cpm]",box).forEach(b=>b.classList.toggle("on",base!=null&&(b.dataset.cpm==="1")===muted));
    const pl=q("[data-cpplain]",box);if(pl)pl.classList.toggle("on",base==null);
    const bv=q("#cpBV",box);if(bv)bv.textContent=bright+"%";
    const w=q("#cpWheel",box);if(w&&document.activeElement!==w)w.value=c;
    if(onChange)onChange(c);
  };
  qa("[data-cpm]",box).forEach(b=>b.onclick=()=>{muted=b.dataset.cpm==="1";if(base==null)base=PALETTE[0];refresh();});
  qa("[data-cpc]",box).forEach(b=>b.onclick=()=>{base=b.dataset.cpc;refresh();});
  const plain=q("[data-cpplain]",box);
  if(plain)plain.onclick=()=>{base=null;muted=false;bright=100;
    const s=q("#cpB",box);if(s)s.value=100;refresh();};
  q("#cpWheel",box).oninput=e=>{base=e.target.value;muted=false;bright=100;
    const s=q("#cpB",box);if(s)s.value=100;refresh();};
  q("#cpB",box).oninput=e=>{bright=+e.target.value;refresh();};
  refresh();
  return eff;
}

/* =============== undo / redo =============== */
const HIST={undo:[],redo:[]};
function pushOp(op){HIST.undo.push(op);if(HIST.undo.length>50)HIST.undo.shift();HIST.redo=[];refreshHistBtns();}
function refreshHistBtns(){
  const u=q("#uBtn"),r=q("#rBtn");
  if(u)u.disabled=!HIST.undo.length;
  if(r)r.disabled=!HIST.redo.length;
}
async function applyOp(op,inv){
  if(op.t==="book"||op.t==="del"){
    const body=op.t==="del"?(inv?op.body:null):(inv?op.before:op.after);
    const id=op.t==="del"?op.body.id:op.id;
    const knownKeys=imgKeysOf((op.t==="del"?op.body:op.after)||null);
    if(body){
      const clone=JSON.parse(JSON.stringify(body));
      /* stamped as edited-now, same as restoreTrash: an undo carrying its old time
         would lose the sync race to the version it undid — the other device still
         holds that newer copy and would quietly put it back */
      clone.modified=Math.max(Date.now(),(clone.modified||0)+1,(SYNC.seen[id]||0)+1);
      await dbPut("books",clone);
      const i=books.findIndex(x=>x.id===id);
      if(i>=0)books[i]=clone;else books.unshift(clone);
      if(SYNC.on){if(deletions[id]){delete deletions[id];saveDeletions();}enqueue({kind:"book",id});enqueue({kind:"cover",id});imgKeysOf(clone).forEach(key=>enqueue({kind:"img",key}));}
    }else{
      await dbDel("books",id);
      books=books.filter(x=>x.id!==id);
      if(SYNC.on){deletions[id]=Date.now();saveDeletions();enqueue({kind:"bookDel",id});enqueue({kind:"coverDel",id});knownKeys.forEach(key=>enqueue({kind:"imgDel",key}));}
    }
    if(view==="book"&&cur&&cur.id===id){
      if(!body){view="library";render();}else{openBook(id,false,true);}
      refreshHistBtns();return;
    }
  }
  if(op.t==="meta"){
    const v=inv?op.before:op.after;
    genres=JSON.parse(JSON.stringify(v.genres));
    dnfCustom=[...v.dnfCustom];audCustom=[...v.audCustom];
    metaSnap=JSON.stringify({genres,dnfCustom,audCustom});
    dbPut("meta",{k:"genres",v:genres});dbPut("meta",{k:"dnfReasons",v:dnfCustom});dbPut("meta",{k:"audiences",v:audCustom});
    enqueue({kind:"meta",key:"genres"});enqueue({kind:"meta",key:"dnfReasons"});enqueue({kind:"meta",key:"audiences"});
    if(view==="book"&&cur){openBook(cur.id,false,true);refreshHistBtns();return;}
  }
  render();refreshHistBtns();
}
async function doUndo(){const op=HIST.undo.pop();if(!op)return;HIST.redo.push(op);await applyOp(op,true);}
async function doRedo(){const op=HIST.redo.pop();if(!op)return;HIST.undo.push(op);await applyOp(op,false);}

/* =============== router =============== */
/* The phone's back button and the browser's arrow are the same gesture, and both
   used to leave the app outright. Each screen is now a step in the browser's own
   history, so back walks the app: form -> the book -> where you came from. */
let navRestoring=false;
function syncHistory(){
  if(navRestoring)return;
  const st={v:view,b:view==="book"&&cur?cur.id:null,m:view==="book"?bookMode:null};
  const h=history.state;
  if(h&&h.v===st.v&&h.b===st.b&&h.m===st.m)return;
  /* Reading a book and writing in it are two faces of the same page, not two
     places you travelled to. Swapping between them used to add a step, so back
     put you into the other face first and only left the book on a second press.
     Same book, only the mode changed -> replace the step rather than add one. */
  const sameSpot=h&&h.v===st.v&&h.b===st.b;
  try{(h&&!sameSpot)?history.pushState(st,""):history.replaceState(st,"");}catch(e){}
}
window.addEventListener("popstate",async e=>{
  const st=e.state;
  navRestoring=true;
  /* backing out of the form is still leaving it — save what was typed */
  if(view==="book"&&bookMode==="edit"&&cur){clearTimeout(saveTimer);try{await commitCur();}catch(err){}}
  try{
    if(st&&st.v==="book"&&st.b&&books.some(x=>x.id===st.b)){
      if(!cur||cur.id!==st.b)await openBook(st.b,false);
      view="book";bookMode=st.m||"view";renderBook();
    }else{
      view=(st&&st.v&&st.v!=="book")?st.v:"library";
      cur=null;render();
    }
  }catch(err){console.warn("[shelf] back",err);}
  finally{navRestoring=false;}
});

/* A reload should leave you where you were standing. syncHistory already writes
   the spot into history.state on every render, and the browser keeps that across
   a reload — a hard one included — so the same shape popstate restores works
   here. Opening the app fresh, from the home screen or a new tab, carries no
   state at all and still starts on the Overview, which is the wanted difference
   between reloading and launching.
   It runs once, on the first render of the session, whichever way the app got
   there: straight in, or out the far side of the sign-in screen. */
let bootRestored=false;
function restoreFromHistory(){
  const st=history.state;
  if(!st||!st.v)return false;
  if(st.v==="book"&&st.b&&books.some(x=>x.id===st.b)){
    navRestoring=true;
    openBook(st.b,false)
      .then(()=>{view="book";bookMode=st.m||"view";renderBook();})
      .catch(()=>{view="overview";render();})
      .finally(()=>{navRestoring=false;});
    return true;   /* this render is being taken over */
  }
  if(st.v!=="book")view=st.v;
  return false;
}
function render(){
  if(!bootRestored){bootRestored=true;if(restoreFromHistory())return;}
  if(view==="book"){renderBook();return;}
  const favN=favUnits(),dnfN=books.filter(b=>b.dnf).length;
  q("#app").innerHTML=`
  <div class="wrap">
    <header>
      <div class="hrow">
        <div>
          <h1 class="serif">My Shelf</h1>
          <div class="sub">${shelfUnits()} on the shelf · ${favN} favorites · ${dnfN} DNF</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
          <button class="addbtn" id="addBook">+ Add book</button>
          <button class="btn" id="quickAdd" style="padding:4px 10px;font-size:12px" title="Paste a blurb or drop a photo — the details are read off it">⚡ From text / photo</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab ${view==="overview"?"on":""}" data-v="overview">🗂 Overview</button>
        <button class="tab ${view==="library"?"on":""}" data-v="library">📚 Library</button>
        <button class="tab ${view==="search"?"on":""}" data-v="search">🔍 Search</button>
        <button class="tab ${view==="insights"?"on":""}" data-v="insights">✨ Insights</button>
        <button class="tab ${view==="pick"?"on":""}" data-v="pick">🎲 Pick</button>
        <button class="tab ${view==="history"?"on":""}" data-v="history">🕘 History</button>
      </div>
      <div class="bkrow">
        <button id="uBtn" disabled>↶ Undo</button>
        <button id="rBtn" disabled>↷ Redo</button>
        <span id="busyMsg" class="busy"></span>
        <span id="syncStat" class="syncstat"></span>
        <span class="sizectl">${sizeCtrlHtml()}</span>
      </div>
      ${SYNC.on&&SYNC.user?`<div class="acct"><span class="who">Signed in as ${esc(SYNC.user.email||"")}</span><button class="out" id="signOut">Sign out</button></div>`:""}
    </header>
    <main id="main"></main>
    <div class="foot">${SYNC.on?"Your library syncs to your own private cloud and is kept on this device too.":"Everything is saved in this browser on this PC."} Export a backup now and then — it's your safety net.</div>
  </div>`;
  q("#addBook").onclick=()=>openBook(uid(),true);
  q("#quickAdd").onclick=openQuickAdd;
  qa(".tab").forEach(t=>t.onclick=async()=>{
    /* leaving a book by tab: save what was typed, then let go of the editor's
       copy — a stale one left behind could be written back over later edits */
    if(view==="book"&&cur){clearTimeout(saveTimer);try{await commitCur();}catch(e){}cur=null;}
    view=t.dataset.v;render();window.scrollTo(0,0);
  });
  q("#uBtn").onclick=()=>finishSaveThen(doUndo);q("#rBtn").onclick=()=>finishSaveThen(doRedo);refreshHistBtns();
  wireSizeCtrl();
  const so=q("#signOut");if(so)so.onclick=signOut;updateSyncUI();
  applyBg();
  if(view==="library")renderLibrary();else if(view==="overview")renderHub();else if(view==="history")renderHistory();else if(view==="insights")renderInsights();else if(view==="pick")renderPick();else renderSearchView();
  closeFabMenu();   /* a jump list from the previous page would point at nothing */
  updateFab();
  syncHistory();
}
/* redraw only what sits under the tabs. Opening the little stage disc on a
   cover used to rebuild the entire page — header, tabs and all — twice per
   tap, and with every cover embedded in the HTML that was the whole shelf
   parsed again for a 180px popover. */
function renderMain(){
  if(view==="book"){renderBook();return;}
  if(!q("#main")){render();return;}
  if(view==="library")renderLibrary();else if(view==="overview")renderHub();else if(view==="history")renderHistory();else if(view==="insights")renderInsights();else if(view==="pick")renderPick();else renderSearchView();
  updateFab();
}

/* what's worth jumping to depends on where you are: a book's parts, or the
   headings of however the library is grouped just now */
function fabSections(){

function closeFabMenu(){const m=q("#fabMenu");if(m){m.hidden=true;m.innerHTML="";}}

/* =============== shared row / card html =============== */
/* A chip's ink follows its own colour. `.chip` sets white, which was fine while
   genre colours came only from the palette, but you can pick any colour you like
   and white on a pale one cannot be read at all. inkOn already decides this for
   keywords; genres simply never asked it. */
const chipStyle=c=>{const col=c||"#78716c";return `background:${col};color:${inkOn(col)}`;};
const chipHtml=(g,small)=>`<span class="chip${small?"":" big"}" style="${chipStyle(genres[g])}">${esc(g)}</span>`;
/* the number is the point; the tint just saves you reading it */
const rateBand=r=>r<5?"lo":r<8?"mid":"hi";
const rateHtml=r=>r==null||r===""?"":`<span class="rate ${rateBand(Number(r))}">★ ${Number(r).toFixed(1)}</span>`;
const pctOf=b=>{const t=parseInt(b.pages)||0,a=parseInt(b.progress)||0;
  return t&&a?Math.max(0,Math.min(100,Math.round(a/t*100))):null;};
/* Where you are in a book, and the daily trail behind it — one entry per day,
   enough to work out a pace later without keeping a fuss of it. Shared, because
   the page can be changed in two places now and both must leave the same trail. */
function setProgress(b,v){
  b.progress=(v===""||v==null)?"":Math.max(0,parseInt(v)||0);
  const today=new Date().toISOString().slice(0,10);
  b.progLog=b.progLog||[];
  const last=b.progLog[b.progLog.length-1];
  if(last&&last.d===today)last.p=b.progress||0;
  else b.progLog.push({d:today,p:b.progress||0});
  if(b.progLog.length>400)b.progLog=b.progLog.slice(-400);
}
const progHtml=b=>{
  if(statusOf(b)!=="reading")return "";
  const p=pctOf(b);if(p==null)return "";
  return `<div style="display:flex;align-items:center;gap:6px;margin-top:4px">
    <span class="prog" style="width:88px"><i style="width:${p}%"></i></span>
    <span class="rr">${p}% · p.${esc(String(b.progress))} of ${esc(String(b.pages))}</span></div>`;
};
const stBadge=b=>{const s=statusOf(b);return s==="reading"?'<span class="bst reading">READING</span>':s==="want"?'<span class="bst want">WANT</span>':"";};
/* every stage gets a mark, finished included */
const stSym=b=>b.dnf?"✕":statusOf(b)==="finished"?"✓":statusOf(b)==="reading"?"📖":"★";
const stName=b=>b.dnf?"Did not finish":statusOf(b)==="finished"?"Finished":statusOf(b)==="reading"?"Reading now":"Want to read";
let stPickFor=null;   /* which row has its stage chooser open */

/* `note` is the whole little line at the end of a row — "edited 3 Aug 2026" on
   the edit log, "finished 2 Mar 2026" on the reading timeline. The caller says
   what it means; the row only shows it. */
function rowHtml(b,withDel,note){
  return `<div class="row" data-open="${b.id}" tabindex="0" role="button" aria-label="${esc(b.title)||"Untitled"}${b.author?" — "+esc(b.author):""}">
    ${stPickFor===b.id&&!b._story?`<div class="stpick">
      ${STATUSES.map(([k,l])=>`<button data-setst="${b.id}|${k}" class="${!b.dnf&&statusOf(b)===k?"on":""}">${k==="finished"?"✓":k==="reading"?"📖":"★"} ${l}</button>`).join("")}
      <button data-setst="${b.id}|dnf" class="${b.dnf?"on":""}">✕ Did not finish</button>
    </div>`:""}
    <div class="thumb" data-cover="${b.id}"${b._cover?` data-covkey="${esc(b._cover)}"`:""}>${coverInner(b,false)}${withDel&&!b._story?`<button class="stdot ${b.dnf?"dnf":statusOf(b)}" data-cyc="${b.id}" title="${stName(b)} — tap to change">${stSym(b)}</button>`:""}${b.favorite?`<span class="favdot${b._story?" story":""}">♥</span>`:""}</div>
    <div class="rmain">
      <div class="rtitle serif">${esc(b.title)||"Untitled"} ${(()=>{const L=linkLabel(b.link);
        return L?`<a class="tlink" data-ext href="${esc(L.url)}" target="_blank" rel="noopener" title="Read it — ${esc(L.name)}">📖</a>`:"";})()} ${isColl(b)?`<span class="bst coll">COLLECTION · ${(b.entries||[]).length}</span>`:""}${(()=>{const st=collStrays(b);
        return st.length?`<button class="bst stray" data-stray="${b.id}" title="${st.length} ${st.length===1?"story has genres":"stories have genres"} of their own — tap to see which">! ${st.length}</button>`:"";})()} ${b._story?`<span class="bst instory" title="A story inside ${esc(b._in)} — opening it takes you to the collection">📚 in ${esc(b._in)}</span>`:""} ${b.dnf?'<span class="bdnf">DNF</span>':""}</div>
      <div class="rauth">${kindOf(b)!=="book"?`<span class="bst kind">${kindOf(b)==="fanfic"?"FANFIC":"AI"}</span> `:""}${esc(b.author)||(kindOf(b)==="ai"?"":"Unknown author")}${(b.fandoms||[]).length?` <span class="rser">${(b.fandoms||[]).map(esc).join(", ")}${(b.characters||[]).length?" · "+(b.characters||[]).map(esc).join(", "):""}</span>`:""}${b.series?` <span class="rser">${esc(b.series)}${b.seriesNum?" #"+esc(b.seriesNum):""}</span>`:""}${b.pages?` <span class="rser">· ${esc(String(b.pages))} p.</span>`:""}</div>
      <div class="chiprow">${(()=>{const br=new Set(b.kwBreaks||[]);
        return (b.keywords||[]).map(k=>`<span class="kw" style="${kwStyle(k)}">${esc(k)}</span>`
          +(br.has(k)?'<span class="rowbreak"></span>':"")).join("");})()}</div>
      ${progHtml(b)}
    </div>
    <div class="rside">${rateHtml(b.rating)}${(b.genres||[]).length?`<div class="rgen">${(()=>{const br=new Set(b.genreBreaks||[]);
      return (b.genres||[]).map(g=>chipHtml(g,true)+(br.has(g)?'<span class="rowbreak"></span>':"")).join("");})()}</div>`:""}${note?`<span class="rr">${esc(note)}</span>`:""}${timesRead(b)>1?`<span class="rr">read ×${timesRead(b)}</span>`:""}${withDel&&!b._story?`<button class="rdel" data-del="${b.id}" title="Delete this book — it waits in Recently deleted for 30 days" aria-label="Delete ${esc(b.title)||"this book"}">✕</button>`:""}</div>
  </div>`;
}
function gridHtml(b){
  const s=statusOf(b);
  return `<div class="gcard" data-open="${b.id}" tabindex="0" role="button" aria-label="${esc(b.title)||"Untitled"}${b.author?" — "+esc(b.author):""}">
    <div class="gcov" data-cover="${b.id}"${b._cover?` data-covkey="${esc(b._cover)}"`:""}>${coverInner(b,true)}
      ${b.favorite?`<span class="gfav${b._story?" story":""}">♥</span>`:""}
      ${s!=="finished"?`<span class="gst ${s}">${s==="reading"?"READING":"WANT"}</span>`:""}
      ${b.rating!=null?`<span class="grate ${rateBand(Number(b.rating))}">★ ${Number(b.rating).toFixed(1)}</span>`:""}
      ${b.dnf?'<span class="gdnf">DNF</span>':""}
    </div>
    <div class="gtitle serif">${isColl(b)?"📚 ":""}${b._story?"📖 ":""}${esc(b.title)||"Untitled"}</div>
    <div class="gauth">${esc(b.author)}</div>
  </div>`;
}
/* A coverless book still gets a face: its title set in the serif on its first
   genre's colour, with a pale spine down the left. Fanfics and AI stories, which
   rarely have real covers, are the ones this dresses up most. */
const GENPAL=["#8c6f5e","#5e7a8c","#6f8c5e","#8c5e7a","#7a6f8c","#8c7f5e"];
function genCoverHtml(b,withAuthor){
  const t=b.title||"Untitled";
  let col=genres[(b.genres||[])[0]]||null;
  if(!col){ /* no genre: a steady colour picked from the title, not a random one */
    let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;
    col=GENPAL[h%GENPAL.length];
  }
  /* pale genre colours need dark ink — the same rule the chips already follow.
     White-on-pastel made every coverless book in a pastel genre unreadable. */
  const ink=inkOn(col);
  const dim=ink==="#292524"?"#292524cc":"#ffffffd0";
  const spine=ink==="#292524"?"#00000026":"#ffffff54";
  return `<span class="gencov" style="background:linear-gradient(160deg,${col}e6,${col})"><i style="background:${spine}"></i><b style="color:${ink}${ink==="#292524"?";text-shadow:none":""}">${esc(t)}</b>${withAuthor&&b.author?`<em style="color:${dim}">${esc(b.author)}</em>`:""}</span>`;
}
/* A cover we already hold goes straight into the markup. Waiting for the
   hydrate pass meant every redraw showed the drawn stand-in for a moment and
   then swapped — a blink across the whole shelf on every render. */
function coverInner(b,withAuthor){
  const c=coverCache.get(b.id);
  return typeof c==="string"&&c?`<img src="${c}" alt="">`:genCoverHtml(b,withAuthor);
}
async function hydrateCovers(root){
  const els=qa("[data-cover]",root);
  const one=async el=>{
    /* a story that has stepped out of its collection keeps its own picture,
       which lives among the images rather than the covers */
    const key=el.dataset.covkey;
    if(key){
      let s2=coverCache.get(key);
      if(s2===undefined){s2=await loadImgData(key);coverCache.set(key,s2||null);}
      if(s2){
        const shown0=el.querySelector("img");
        if(!shown0||shown0.getAttribute("src")!==s2){
          const keep=[...el.children].filter(c=>c.tagName!=="IMG"&&!c.classList.contains("gencov")).map(c=>c.outerHTML).join("");
          el.innerHTML=`<img src="${s2}" alt="">`+keep;
        }
        return;
      }
    }
    const id=el.dataset.cover;
    let src=coverCache.get(id);
    if(src===undefined){const r=await dbGet("covers",id);src=r?r.data:null;coverCache.set(id,src);}
    if(src==null&&SYNC.on&&SYNC.user&&navigator.onLine&&!SYNC.triedCover.has(id)){
      SYNC.triedCover.add(id);
      try{const {data,error}=await SYNC.supa.storage.from("shelf").download(coverPath(id));
        if(!error&&data){src=await blobToDataURL(data);await dbPut("covers",{id,data:src});coverCache.set(id,src);}}catch(e){}
    }
    /* the drawn stand-in must not survive a real cover arriving — but if this
       cover is already on screen, leave the DOM alone: replacing it re-decodes
       the picture and makes the shelf blink for no reason */
    const shown=el.querySelector("img");
    if(src&&(!shown||shown.getAttribute("src")!==src)){
      const overlays=[...el.children].filter(c=>c.tagName!=="IMG"&&!c.classList.contains("gencov")).map(c=>c.outerHTML).join("");
      el.innerHTML=`<img src="${src}" alt="">`+overlays;
    }
  };
  /* a few at a time — strictly one-by-one made big libraries paint covers slowly */
  for(let i=0;i<els.length;i+=6)await Promise.all(els.slice(i,i+6).map(one));
}
/* pick the stage from a list — a single click was too easy to do by accident */
async function setStatus(id,what){
  const b=books.find(x=>x.id===id);if(!b)return;
  markStatus(b,what);
  b.modified=Math.max(Date.now(),(b.modified||0)+1,(SYNC.seen[b.id]||0)+1);
  await dbPut("books",b);
  if(SYNC.on){enqueue({kind:"book",id:b.id});flushQueue();}
  stPickFor=null;refreshShelfSub();renderMain();
}
function wireOpen(root,withDel){
  /* rows and cards are divs, so the keyboard needs telling they are buttons —
     without this a keyboard user could not open a book at all */
  root.onkeydown=e=>{
    if(e.key!=="Enter"&&e.key!==" ")return;
    const op=e.target.closest&&e.target.closest("[data-open]");
    if(op&&e.target===op){e.preventDefault();openBook(op.dataset.open,false);}
  };
  root.onclick=e=>{
    /* the little ↗ opens the book's own link instead of the book's page */
    if(e.target.closest("a[data-ext]")){e.stopPropagation();return;}
    const set=e.target.closest("[data-setst]");
    if(set){e.stopPropagation();const [id,what]=set.dataset.setst.split("|");setStatus(id,what);return;}
    const cyc=e.target.closest("[data-cyc]");
    if(cyc){e.stopPropagation();stPickFor=stPickFor===cyc.dataset.cyc?null:cyc.dataset.cyc;renderMain();return;}
    const del=e.target.closest("[data-del]");
    if(del){e.stopPropagation();deleteBookById(del.dataset.del);return;}
    /* the ! sits inside the row, so it has to answer before the row does */
    const stray=e.target.closest("[data-stray]");
    if(stray){e.stopPropagation();openStrayPanel(stray.dataset.stray);return;}
    const op=e.target.closest("[data-open]");
    if(op)openBook(op.dataset.open,false);
  };
}

/* =============== author panel — see, tidy and group one author's books =============== */
/* Fold several existing books into ONE collection entry. Their notes, ratings,
   pages and covers become the collection's stories; their own pages go to the
   bin (30 days, restorable) so nothing shows up twice. */
/* turn an existing book into a collection entry — cover copied under the collection */
/* What it was is kept, not thrown away. A book folded in used to lose the stage
   it was at and the day it was finished, so a book you were halfway through
   came out the other side saying it was finished on some other book's date —
   the collection's, which is the only date there was left. It keeps its own
   now. The stage is written down only where it differs from the collection's,
   because a story that agrees with the book it sits in should stay inside it
   rather than step out onto the shelf on its own. */
async function bookToEntry(b,collId,collStatus,collAuthor,collDnf){
  const en=blankEntry();
  en.title=b.title;en.rating=b.rating;en.pages=b.pages;
  /* the author came across as nothing at all. A story says only what differs
     from its collection, and the name was never written down either way — so a
     book folded into a collection that had no author lost its author entirely,
     and "same as the collection" meant same as nothing. */
  const ba=String(b.author||"").trim();
  if(ba&&ba!==String(collAuthor||"").trim())en.author=ba;
  en.summary=b.summary||"";en.notes=b.canvasText||"";
  /* every reading travels, not just the last date one of them ended on. Folding
     a book in used to keep its finish date and quietly drop the day it was
     started, along with every re-read it had recorded. */
  en.readings=readsOf(b).map(r=>Object.assign({},r,{id:uid()}));
  syncReads(en);
  en.dateFinished=lastEnd(b)||String(b.dateFinished||"");
  /* "same as the collection" has to mean the same in BOTH respects. A book you
     finished, filed into a series you gave up on, said nothing about its own
     stage and so inherited "did not finish" from the collection — turning a
     book you read into one you abandoned. It only stays quiet where the stage
     and the setting-aside both agree. */
  en.status=(statusOf(b)===(collStatus||"finished")&&!!b.dnf===!!collDnf)?"":statusOf(b);
  en.dnf=!!b.dnf;
  let coverData=null;
  const cov=await dbGet("covers",b.id);
  if(cov&&cov.data){
    en.cover=true;en.coverV=Date.now();coverData=cov.data;
    try{await dbPut("images",{key:collId+"|"+en.id,data:cov.data,v:en.coverV});
      if(SYNC.on)enqueue({kind:"img",key:collId+"|"+en.id});}catch(e){en.cover=false;coverData=null;}
  }
  return {en,coverData};
}
/* a folded-away book loses its own page: bin (30 days) + synced deletion */
async function retireBook(b){
  await toTrash(b);
  await dbDel("books",b.id);
  books=books.filter(x=>x.id!==b.id);
  if(SYNC.on){deletions[b.id]=Date.now();saveDeletions();
    enqueue({kind:"bookDel",id:b.id});enqueue({kind:"coverDel",id:b.id});
    imgKeysOf(b).forEach(key=>enqueue({kind:"imgDel",key}));}
}
/* several books at once into a collection that already exists. The same two
   steps folding one book from inside a collection has always taken — become a
   story, then let the old page go to the bin — done for a ticked handful. */
async function foldIntoCollection(ids,coll){
  if(!coll||!isColl(coll))return 0;
  coll.entries=coll.entries||[];
  const st=statusOf(coll);
  /* a collection with no author of its own takes the one its new books agree
     on, rather than leaving every one of them saying "same as the collection"
     and the collection saying nothing */
  if(!String(coll.author||"").trim()){
    const names=[...new Set(ids.map(id=>{const b=books.find(x=>x.id===id);return b?String(b.author||"").trim():"";}).filter(Boolean))];
    if(names.length===1)coll.author=names[0];
  }
  let n=0;
  for(const id of ids){
    const b=books.find(x=>x.id===id);
    if(!b||isColl(b)||b.id===coll.id)continue;
    const {en}=await bookToEntry(b,coll.id,st,coll.author,coll.dnf);
    coll.entries.push(en);
    await retireBook(b);
    n++;
  }
  if(!n)return 0;
  syncCollRating(coll);
  coll.modified=Math.max(Date.now(),(coll.modified||0)+1,(SYNC.seen[coll.id]||0)+1);
  await dbPut("books",coll);
  if(SYNC.on){enqueue({kind:"book",id:coll.id});flushQueue();}
  return n;
}
async function makeCollectionFrom(ids,name,author){
  const sel=ids.map(id=>books.find(b=>b.id===id)).filter(Boolean);
  if(!sel.length)return null;
  sel.sort((a,b)=>(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0)
    ||(a.dateFinished||"9999").localeCompare(b.dateFinished||"9999")||(a.created||0)-(b.created||0));
  const nb=blankBook(uid());
  nb.type="collection";nb.title=name;nb.series=name;
  nb.author=author||sel[0].author||"";
  nb.kind=kindOf(sel[0]);
  nb.genres=[...new Set(sel.flatMap(b=>b.genres||[]))];
  nb.keywords=[...new Set(sel.flatMap(b=>b.keywords||[]))].slice(0,20);
  nb.favorite=sel.some(b=>b.favorite);
  nb.status=sel.every(b=>statusOf(b)==="finished")?"finished":sel.some(b=>statusOf(b)==="reading")?"reading":"want";
  nb.dateFinished=sel.map(b=>b.dateFinished||"").sort().pop()||"";
  nb.entries=[];
  for(const b of sel)nb.entries.push((await bookToEntry(b,nb.id,nb.status,nb.author,nb.dnf)).en);
  nb.modified=Date.now();
  await dbPut("books",nb);
  books.unshift(nb);
  if(SYNC.on)enqueue({kind:"book",id:nb.id});
  for(const b of sel)await retireBook(b);
  if(SYNC.on)flushQueue();
  return nb.id;
}
/* Link several existing books as a named series — each keeps its own page */
async function makeSeriesFrom(ids,name){
  /* a collection is already a named set of books — turning it into a series member
     would overwrite its own name and stop its stories counting individually */
  const sel=ids.map(id=>books.find(b=>b.id===id)).filter(b=>b&&!isColl(b));
  if(!sel.length)return 0;
  sel.sort((a,b)=>(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0)
    ||(a.dateFinished||"9999").localeCompare(b.dateFinished||"9999")||(a.created||0)-(b.created||0));
  let n=1;
  for(const b of sel){
    b.type="series";b.series=name;
    if(!b.seriesNum)b.seriesNum=String(n);
    if(!b.seriesTotal)b.seriesTotal=String(sel.length);
    n++;
    b.modified=Date.now();
    await dbPut("books",b);
    if(SYNC.on)enqueue({kind:"book",id:b.id});
  }
  if(SYNC.on)flushQueue();
  return sel.length;
}

let authSel=new Set(),authVarSel=new Set(),authFindQ="";
/* Two spellings of one person. The surname alone isn't enough: "C.S. Lewis" and
   "C.S. Lewis, Walter Hooper" share no last word, yet one plainly contains the
   other — which is exactly what a co-author tacked on looks like. */
function looksLikeSameAuthor(a,b){
  const A=String(a||"").trim().toLowerCase(),B=String(b||"").trim().toLowerCase();
  if(!A||!B||A===B)return false;
  if(A.length>=4&&B.includes(A))return true;
  if(B.length>=4&&A.includes(B))return true;
  const sa=surnameOf(a),sb=surnameOf(b);
  if(sa&&sa===sb)return true;
  /* or they share a long word — "Lewis" in both, however the rest is arranged */
  const words=s=>new Set(s.replace(/[.,]/g," ").split(/\s+/).filter(w=>w.length>3));
  const wa=words(A);
  for(const w of words(B))if(wa.has(w))return true;
  return false;
}

/* =============== library =============== */
const GROUPS=[["none","none"],["genre","genre"],["author","author"],["series","series"],["type","standalone / series / story"],["status","status"]];
const TYPES=[["standalone","Standalone"],["series","Part of a series"],["collection","Collections & their stories"]];
function sortCmp(a,b){
  if(sortBy==="newest")return(b.created||0)-(a.created||0);
  if(sortBy==="rating")return(b.rating??-1)-(a.rating??-1);
  /* favourites first, and a favourited story sits among them on its own */
  if(sortBy==="favorites")return(b.favorite?1:0)-(a.favorite?1:0)||(a.title||"").localeCompare(b.title||"");
  if(sortBy==="title")return(a.title||"").localeCompare(b.title||"");
  if(sortBy==="author")return(a.author||"").localeCompare(b.author||"");
  if(sortBy==="status"){const rk=x=>x.dnf?1:statusOf(x)==="finished"?0:statusOf(x)==="want"?2:3;
    return rk(a)-rk(b)||(a.title||"").localeCompare(b.title||"");}
  if(sortBy==="genre"){const g=x=>((x.genres||[])[0]||"").toLowerCase();const ga=g(a),gb=g(b);
    if(ga&&!gb)return -1;if(!ga&&gb)return 1;
    return ga.localeCompare(gb)||(a.title||"").localeCompare(b.title||"");}
  if(sortBy==="type"){const rk=x=>typeOf(x)==="standalone"?0:typeOf(x)==="series"?1:2;
    return rk(a)-rk(b)||(a.series||"").localeCompare(b.series||"")
      ||(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0)||(a.title||"").localeCompare(b.title||"");}
  return 0;
}
/* -> [{label,color?,items[]}] in display order */
/* All three switches are remembered per grouping, not once for the whole
   library: the big pictures are worth having under Genre, where you set them
   yourself, and usually not under Author, where there are none to show. */
const gartShutFor=()=>{const v=settings.gartShutBy;
  return v&&typeof v==="object"?!!v[groupBy]:false;};
const gavActFor=()=>{const v=settings.gavActBy;
  return (v&&typeof v==="object"?v[groupBy]:settings.gavAct)==="filter";};
/* Whether the heading row is pictures or plain names. Left unanswered it keeps
   the old behaviour — pictures only where a heading has one of its own — so
   nothing changes anywhere until you actually choose. Answered, you can have
   pictures under Author too, where every one is borrowed from a book. */
const gavPicsFor=anyArt=>{const v=settings.gavPicsBy;
  const said=v&&typeof v==="object"?v[groupBy]:undefined;
  return said===undefined?anyArt:!!said;};
const setGartShut=on=>{const v=settings.gartShutBy=(typeof settings.gartShutBy==="object"&&settings.gartShutBy)||{};
  v[groupBy]=on;saveSettings();};
const setGavAct=filter=>{const v=settings.gavActBy=(typeof settings.gavActBy==="object"&&settings.gavActBy)||{};
  v[groupBy]=filter?"filter":"jump";saveSettings();};
const setGavPics=on=>{const v=settings.gavPicsBy=(typeof settings.gavPicsBy==="object"&&settings.gavPicsBy)||{};
  v[groupBy]=on;saveSettings();};

/* A heading with no picture of its own borrows one from inside it: the cover of
   its best book. Several candidates are offered rather than one, because whether
   a book actually has a cover is only known once the database answers — the
   hydrator walks them in order and takes the first that does. */
const coverPicks=items=>items.slice()
  .sort((a,b)=>(b.rating||0)-(a.rating||0)||(b.favorite?1:0)-(a.favorite?1:0)||(b.created||0)-(a.created||0))
  /* a story standing in for a genre lends its own picture, not its collection's;
     without one it falls back to the collection's id and so to its cover */
  .slice(0,6).map(b=>b._cover?"img:"+b._cover:b.id).join(",");

function groupsFor(list){
  const out=[];
  if(groupBy==="genre"){
    const map={},none=[];
    list.forEach(b=>{const gs=b.genres||[];if(!gs.length)none.push(b);gs.forEach(g=>(map[g]=map[g]||[]).push(b));});
    Object.keys(map).sort((a,b)=>a.localeCompare(b)).forEach(k=>out.push({label:k,color:genres[k]||"#78716c",items:map[k]}));
    if(none.length)out.push({label:"No genre yet",color:"#a8a29e",items:none});
  }else if(groupBy==="author"){
    const map={};
    list.forEach(b=>{const a=(b.author||"").trim()||"Unknown author";(map[a]=map[a]||[]).push(b);});
    Object.keys(map).sort((a,b)=>lastName(a).localeCompare(lastName(b))||a.localeCompare(b)).forEach(k=>out.push({label:k,items:map[k]}));
  }else if(groupBy==="series"){
    const map={},none=[];
    list.forEach(b=>{const s=(b.series||"").trim();if(s)(map[s]=map[s]||[]).push(b);else none.push(b);});
    Object.keys(map).sort((a,b)=>a.localeCompare(b)).forEach(k=>{
      const items=map[k].slice().sort((x,y)=>(parseFloat(x.seriesNum)||0)-(parseFloat(y.seriesNum)||0));
      /* how much of the series is on the shelf, and which numbers are absent */
      const total=Math.max(0,...items.map(b=>parseInt(b.seriesTotal)||0));
      let note="";
      if(total){
        const have=new Set(items.map(b=>parseFloat(b.seriesNum)).filter(n=>!isNaN(n)));
        const missing=[];
        for(let i=1;i<=total;i++)if(!have.has(i))missing.push(i);
        note=`${items.length} of ${total}`+(missing.length&&missing.length<=6?` · missing #${missing.join(", #")}`:"");
      }
      out.push({label:k,items,note});
    });
    if(none.length)out.push({label:"Not in a series",items:none});
  }else if(groupBy==="type"){
    TYPES.forEach(([k,l])=>{const items=list.filter(b=>typeOf(b)===k);if(items.length)out.push({label:l,items});});
  }else if(groupBy==="status"){
    STATUSES.forEach(([k,l])=>{const items=list.filter(b=>statusOf(b)===k);if(items.length)out.push({label:l,items});});
  }
  return out;
}

        <button class="laybtn" id="layTog">${layout==="list"?"▦ Grid":"☰ List"}</button></div>`;
      html+=`<div class="pills"><span class="lbl">Group under headings:</span>${GROUPS.map(([id,l])=>`<button class="pill ${groupBy===id?"on":""}" data-gb="${id}">${l.charAt(0).toUpperCase()+l.slice(1)}</button>`).join("")}</div>`;
      html+=`<div class="pills"><button class="pill ${libSelMode?"on":""}" id="selTog" title="Tick several books, then group them or give them genres">☑ Select books</button>
        ${rawN?`<button class="pill ${onlyRaw?"on":""}" id="rawTog" title="Books an import brought in that you haven't opened and added anything to yet">⭱ Straight from an import <b>${rawN}</b></button>`:""}
        <button class="pill ${libArtMode?"on":""}" id="artTog" title="Put pictures anywhere on this page — including the empty margins">🖼 Pictures${libArt.length?` <b>${libArt.length}</b>`:""}</button>
        ${libArtMode?`<button class="pill" id="artAdd">＋ Add a picture</button><span class="lbl">…or just paste one</span>`:""}</div>`;
    }
    if(libSelMode)html+=`<div class="hcard" style="margin-bottom:9px"><div class="hrow2">
      <b style="font-size:13px">${libSel.size} ticked</b>
      <button class="btn" id="selSer" ${libSel.size>1?"":"disabled"}>🔗 Link as a series…</button>
      <button class="btn" id="selColl" ${libSel.size>1?"":"disabled"}>📚 Fold into one collection…</button>
      ${collsOnShelf().length?`<button class="btn" id="selInto" ${libSel.size?"":"disabled"} title="Put them inside a collection you already have">📥 Into a collection…</button>`:""}
      ${(()=>{const n=list.filter(b=>!b._story).length;
        return n?`<button class="btn" id="selAll" title="Tick everything the shelf is showing right now — a filter or the find box narrows what that means">✓ Tick all ${n}</button>`:"";})()}
      <button class="btn" id="selNone" ${libSel.size?"":"disabled"}>Untick all</button></div>
      <div class="hrow2" style="margin-top:7px">
        <span class="lbl">Give them all:</span>
        <button class="btn" id="selGen" ${libSel.size?"":"disabled"}>🏷 a genre…</button>
        <button class="btn" id="selAud" ${libSel.size?"":"disabled"}>👥 an audience…</button>
        <button class="btn" id="selKw" ${libSel.size?"":"disabled"}>＋ a keyword…</button>
      </div>
      <div id="selApply"></div>
      <div class="hint" style="margin:7px 0 0">A series keeps every book's own page. A collection folds them into one entry — the originals move to Recently deleted.</div></div>`;
  }
  /* Most people arriving at a book tracker already keep their books somewhere
     else, and the importer is one of the best things here — but an empty shelf
     used to mention only the long way round, one book typed in at a time. */
  if(!books.length)html+=`<div class="empty">📖<br>Your shelf is empty.
    <div class="hrow2" style="justify-content:center;margin-top:15px">
      <button class="btn pri" id="empAdd">＋ Add your first book</button>
      <button class="btn" id="empImp">⭱ Bring in a Goodreads or StoryGraph export</button>
    </div>
    <div class="hint" style="margin-top:10px">An export brings across ratings, page counts, dates read, rereads and reviews. Nothing is added until you pick it.</div>
  </div>`;
  else if(!list.length)html+=`<div class="none" style="text-align:center;padding:40px 0">${flc?`Nothing called “${esc(libFind.trim())}” here.`:"No books with this status yet."}</div>`;
  else if(groupBy==="none"){
    /* what you're reading right now belongs at the top, not buried by date added */
    const now=list.filter(b=>statusOf(b)==="reading"),rest=list.filter(b=>statusOf(b)!=="reading");
    if(statusFilter==="all"&&now.length&&rest.length){
      const head=(t,n)=>`<div class="grouphead"><h2 class="serif" style="margin:0;font-size:17px">${t}</h2><span class="n">${n}</span><span class="ghline"></span></div>`;
      html+=head("📖 Reading now",now.length)+booksHtml(now,true)
           +head("Everything else",rest.length)+booksHtml(rest,true);
    }else html+=booksHtml(list,true);
  }
  else{
    const gsAll=groupsFor(list);
    shownGroupKeys=gsAll.map(g=>groupBy+"|"+g.label);
    const collapsed=new Set(settings.collapsed||[]);
    const allShut=gsAll.length&&gsAll.every(g=>collapsed.has(groupBy+"|"+g.label));
    /* Tapping one of these does one of two things, and which is your choice: it
       either skips you down to that group or shows that group on its own. The
       choice is a setting; the group currently singled out is deliberately not,
       so reopening the app never leaves you staring at a library that looks like
       it has lost most of its books. */
    const picking=gavActFor();
    if(!picking)gavPick=null;
    if(gavPick&&!gsAll.some(g=>g.label===gavPick))gavPick=null;   /* it was emptied or renamed */
    const gs=gavPick?gsAll.filter(g=>g.label===gavPick):gsAll;
    /* The row along the top is how you get around, so it always stays; the only
       question is whether it reads as pictures or as plain names. Where a
       heading has a picture of its own it uses that, and where it has not it
       borrows a cover from the best book inside it, which is what makes
       pictures worth having under Author too — there every one is borrowed.
       Left unanswered the row is pictures only where some heading has its own,
       which is how it behaved before the switch existed.
       What folds is the large picture standing above each group's books further
       down: that is the one that costs a screenful. */
    const anyArt=gsAll.some(g=>groupArt[groupBy+"|"+g.label]);
    const artShut=gartShutFor();
    const many=gsAll.length>1;
    const pics=gavPicsFor(anyArt);
    html+=`<div class="pills"><button class="pill" id="collAll">${allShut?"▾ Open every group":"▸ Close every group"}</button>
      ${anyArt?`<button class="pill" id="gartTog" title="The large picture above each group's books">${artShut?"▸ Show the big pictures":"▾ Hide the big pictures"}</button>`:""}
      ${many?`<button class="pill" id="gavPics" data-pics="${pics?1:0}" title="The row of headings above: pictures, or just their names">${pics?"▭ Headings as names":"◎ Headings as pictures"}</button>`:""}
      ${many?`<button class="pill${picking?" on":""}" id="gavAct" title="What tapping one of these does">${picking?"▽ Tap shows only that":"⤓ Tap skips to it"}</button>`:""}
      ${gavPick?`<button class="pill on2" id="gavClear" title="Show every group again">✕ ${esc(gavPick)} only</button>`:""}
      <span class="lbl">Tap a heading to fold it away${groupBy==="genre"?" · give a group its own picture with 🖼":""}</span></div>`;
    if(many)html+=pics
      ?`<div class="gavatars">${gsAll.map((g,i)=>{
          const art=groupArt[groupBy+"|"+g.label];
          const col=g.color||"#78716c";
          const init=esc((g.label||"?").trim().charAt(0).toUpperCase());
          return `<button class="gavatar${gavPick===g.label?" on":""}" data-jump="${i}" data-glabel="${esc(g.label)}" title="${picking?"Show only":"Skip to"} ${esc(g.label)}">
            ${art?`<img data-gartimg="${esc(art.img)}" data-gavcol="${col}" data-gavinit="${init}" alt="">`
                 :`<img data-gavbook="${coverPicks(g.items)}" data-gavcol="${col}" data-gavinit="${init}" alt="">`}
            <span class="gavname">${esc(g.label)} <b>${g.items.length}</b></span></button>`;}).join("")}</div>`
      :`<div class="pills" style="margin-bottom:10px">${gsAll.map((g,i)=>
          `<button class="pill${gavPick===g.label?" on":""}" data-jump="${i}" data-glabel="${esc(g.label)}" title="${picking?"Show only":"Skip to"} ${esc(g.label)}"${g.color&&gavPick!==g.label?` style="border-color:${g.color}"`:""}>${esc(g.label)} <b>${g.items.length}</b></button>`).join("")}</div>`;
    html+=gs.map(g=>{
      const key=groupBy+"|"+g.label;
      const shut=collapsed.has(key);
      const art=groupArt[key];
      return `<div class="ghwrap">
        <div class="grouphead" data-gh="${esc(key)}">
          <button class="gcar" title="${shut?"Open":"Close"} this group">${shut?"▸":"▾"}</button>
          ${g.color?`<span class="chip big" style="${chipStyle(g.color)}">${esc(g.label)}</span>`
            :`<h2 class="serif" style="margin:0;font-size:17px">${esc(g.label)}</h2>`}
          <span class="n">${g.note?esc(g.note):g.items.length}</span><span class="ghline"></span>
          <button class="btn gart" data-gart="${esc(key)}" title="${art?"Change or remove this group's picture":"Give this group a picture"}" style="padding:2px 8px;font-size:12px">🖼${art?" ✓":""}</button>
        </div>
        ${art&&!shut&&!artShut?`<div class="gartbox" style="width:${Math.max(15,Math.min(100,art.w||100))}%">
            <img data-gartimg="${esc(art.img)}" alt="">
            <button class="gartx" data-gartx="${esc(key)}" title="Remove this picture">✕</button>
            <div class="gartgrip" data-gartgrip="${esc(key)}" title="Drag the corner to resize"></div>
          </div>`:""}
        ${shut?"":booksHtml(g.items,true)}
      </div>`;}).join("");
  }
  m.innerHTML=html;
  qa("[data-sf]",m).forEach(b=>b.onclick=()=>{statusFilter=b.dataset.sf;renderLibrary();});
  qa("[data-kf]",m).forEach(b=>b.onclick=()=>{const k=b.dataset.kf;
    kindFilter=kindFilter.includes(k)?kindFilter.filter(x=>x!==k):[...kindFilter,k];
    if(!kindFilter.length)kindFilter=KINDS.map(x=>x[0]);   /* never hide everything */
    renderLibrary();});
  qa("[data-sort]",m).forEach(b=>b.onclick=()=>{sortBy=b.dataset.sort;renderLibrary();});
  qa("[data-gb]",m).forEach(b=>b.onclick=()=>{groupBy=b.dataset.gb;gavPick=null;renderLibrary();});
  const lt=q("#layTog",m);if(lt)lt.onclick=()=>{layout=layout==="list"?"grid":"list";renderLibrary();};
  /* ---- group headings: fold away, and give one its own picture ---- */
  const shutSet=()=>new Set(settings.collapsed||[]);
  const saveShut=s=>{settings.collapsed=[...s];saveSettings();};
  qa("[data-gh]",m).forEach(h=>h.onclick=e=>{
    if(e.target.closest("[data-gart]"))return;
    const s=shutSet(),k=h.dataset.gh;
    s.has(k)?s.delete(k):s.add(k);
    saveShut(s);renderLibrary();
  });
  const ea=q("#empAdd",m);if(ea)ea.onclick=()=>openBook(uid(),true);
  /* the staged list lands on Overview, so go there first — otherwise the file is
     read and its books wait somewhere you are not looking */
  const ei=q("#empImp",m);if(ei)ei.onclick=()=>{view="overview";render();const f=q("#csvFile");if(f)f.click();};
  const ca=q("#collAll",m);
  if(ca)ca.onclick=()=>{
    const keys=shownGroupKeys;
    const s=shutSet();
    const allShut=keys.every(k=>s.has(k));
    keys.forEach(k=>allShut?s.delete(k):s.add(k));
    saveShut(s);renderLibrary();
  };
  const gt=q("#gartTog",m);
  if(gt)gt.onclick=()=>{setGartShut(!gartShutFor());renderLibrary();};
  const gp=q("#gavPics",m);
  if(gp)gp.onclick=()=>{setGavPics(gp.dataset.pics!=="1");renderLibrary();};
  const ga=q("#gavAct",m);
  if(ga)ga.onclick=()=>{setGavAct(!gavActFor());gavPick=null;renderLibrary();};
  const gc=q("#gavClear",m);
  if(gc)gc.onclick=()=>{gavPick=null;renderLibrary();};
  qa("[data-gart]",m).forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    pendingGart=b.dataset.gart;
    q("#gartFile").click();
  });
  qa("[data-gartx]",m).forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!confirm("Remove this group's picture?"))return;
    await clearGroupArt(b.dataset.gartx);renderLibrary();
  });
  /* drag the corner: the picture keeps its shape, only its size changes */
  qa("[data-gartgrip]",m).forEach(gr=>gr.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    const key=gr.dataset.gartgrip,boxEl=gr.parentElement;
    const full=boxEl.parentElement.getBoundingClientRect().width||1;
    const x0=e.clientX,w0=boxEl.getBoundingClientRect().width;
    const mv=ev=>{
      const pctW=Math.max(15,Math.min(100,(w0+(ev.clientX-x0))/full*100));
      boxEl.style.width=pctW+"%";
    };
    const up=()=>{
      window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
      groupArt[key]=Object.assign({},groupArt[key],{w:Math.round(parseFloat(boxEl.style.width)||100)});
      saveGroupArt();
    };
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  }));
  renderLibArt(m);
  qa("[data-jump]",m).forEach(b=>b.onclick=()=>{
    if(gavActFor()){
      const l=b.dataset.glabel;
      gavPick=gavPick===l?null:l;      /* tapping the one you are already in shows them all again */
      renderLibrary();window.scrollTo(0,0);
      return;
    }
    const h=qa("[data-gh]",m)[+b.dataset.jump];
    if(h)h.scrollIntoView({behavior:"smooth",block:"start"});
  });
  hydrateGroupArt(m);
  const stg=q("#selTog",m);
  if(stg)stg.onclick=()=>{libSelMode=!libSelMode;if(!libSelMode)libSel.clear();renderLibrary();};
  const rt=q("#rawTog",m);
  if(rt)rt.onclick=()=>{onlyRaw=!onlyRaw;renderLibrary();};
  qa("[data-bmode]",m).forEach(b=>b.onclick=()=>{
    settings.bookEdit=b.dataset.bmode==="edit";saveSettings();renderLibrary();});
  const tt=q("#toolsTog",m);
  if(tt)tt.onclick=()=>{
    settings.libTools=!settings.libTools;
    /* closing the toolbox puts the tools away with it */
    if(!settings.libTools){libSelMode=false;libSel.clear();libArtMode=false;}
    saveSettings();renderLibrary();
  };
  const lf=q("#libFind",m);
  if(lf){
    lf.oninput=()=>{
      libFind=lf.value;
      clearTimeout(lf._t);
      lf._t=setTimeout(()=>{
        const pos=lf.selectionStart;
        renderLibrary();
        /* the re-render replaced the box — hand the cursor back where it was */
        const nf=q("#libFind");if(nf){nf.focus();nf.setSelectionRange(pos,pos);}
      },160);
    };
  }
  const at=q("#artTog",m);
  if(at)at.onclick=()=>{libArtMode=!libArtMode;renderLibrary();};
  const aa=q("#artAdd",m);
  if(aa)aa.onclick=()=>q("#libArtFile").click();
  if(libSelMode){
    qa("[data-open]",m).forEach(el=>{
      const id=el.dataset.open;
      const cb=document.createElement("input");
      cb.type="checkbox";cb.className="libcb";cb.checked=libSel.has(id);
      cb.onclick=e=>{e.stopPropagation();
        if(cb.checked)libSel.add(id);else libSel.delete(id);
        renderLibrary();};
      el.insertBefore(cb,el.firstChild);
    });
    const sn=q("#selNone",m);if(sn)sn.onclick=()=>{libSel.clear();renderLibrary();};
    /* one label onto every ticked book at once */
    const applyToSel=async fn=>{
      for(const id of libSel){
        const b=books.find(x=>x.id===id);if(!b)continue;
        fn(b);
        b.modified=Math.max(Date.now(),(b.modified||0)+1,(SYNC.seen[b.id]||0)+1);
        b.touched=true;
        await dbPut("books",b);
        if(SYNC.on)enqueue({kind:"book",id:b.id});
      }
      if(SYNC.on)flushQueue();
      renderLibrary();
    };
    const panel=q("#selApply",m);
    const openApply=(title,options,onPick,allowNew)=>{
      panel.innerHTML=`<div class="hcard" style="margin-top:8px;box-shadow:none">
        <div class="lbl" style="display:block;margin-bottom:5px">${esc(title)} — goes on all ${libSel.size}</div>
        <div>${options.map(o=>`<button class="mg" data-selopt="${esc(o)}">${esc(o)}</button>`).join("")||'<span class="none">Nothing to choose from yet.</span>'}</div>
        ${allowNew?`<input class="field" id="selNew" placeholder="…or type a new one and press Enter" style="margin-top:7px;font-size:13px;padding:7px 10px">`:""}
        <button class="btn" id="selCancel" style="margin-top:7px;padding:3px 10px;font-size:12px">Cancel</button></div>`;
      qa("[data-selopt]",panel).forEach(b=>b.onclick=()=>{panel.innerHTML="";onPick(b.dataset.selopt);});
      const ni=q("#selNew",panel);
      if(ni)ni.addEventListener("keydown",e=>{
        if(e.key==="Enter"&&e.target.value.trim()){const v=titleCase(e.target.value.trim());panel.innerHTML="";onPick(v);}});
      q("#selCancel",panel).onclick=()=>{panel.innerHTML="";};
    };
    const sg=q("#selGen",m);
    if(sg)sg.onclick=()=>openApply("Which genre",Object.keys(genres).sort((a,b)=>a.localeCompare(b)),g=>{
      if(!genres[g]){let h=0;for(let i=0;i<g.length;i++)h=(h*31+g.charCodeAt(i))>>>0;genres[g]=PALETTE[h%PALETTE.length];
        unmarkMetaDel("genre:"+g);saveMeta();}
      applyToSel(b=>{b.genres=b.genres||[];if(!b.genres.includes(g))b.genres.push(g);});
    },true);
    const sa=q("#selAud",m);
    if(sa)sa.onclick=()=>openApply("Who it's for",[...new Set([...DEFAULT_AUD,...audCustom])],a=>{
      if(![...DEFAULT_AUD,...audCustom].includes(a)){audCustom.push(a);saveMeta();}
      applyToSel(b=>{const l=audsOf(b);if(l.indexOf(a)<0)setAuds(b,[...l,a]);});
    },true);
    const sk=q("#selKw",m);
    if(sk)sk.onclick=()=>openApply("Which keyword",[...new Set(books.flatMap(b=>b.keywords||[]))].sort((a,b)=>a.localeCompare(b)),k=>{
      applyToSel(b=>{b.keywords=b.keywords||[];if(!b.keywords.some(x=>x.toLowerCase()===k.toLowerCase()))b.keywords.push(k);});
    },true);
    /* everything the shelf is showing, which is not the same as everything on
       it — a status pill or the find box is how you say what "all" means */
    const sAll=q("#selAll",m);
    if(sAll)sAll.onclick=()=>{list.forEach(b=>{if(!b._story)libSel.add(b.id);});renderLibrary();};
    const ss=q("#selSer",m);
    if(ss)ss.onclick=async()=>{
      const nm=prompt("Series name — every ticked book keeps its own page, linked under this name:","");
      if(nm==null||!nm.trim())return;
      const n=await makeSeriesFrom([...libSel],nm.trim());
      if(n<libSel.size)alert(`Linked ${n} book${n===1?"":"s"}. Collections were left alone — each one is already a named set.`);
      libSel.clear();render();
    };
    const sc=q("#selColl",m);
    if(sc)sc.onclick=async()=>{
      /* a collection can't be folded into a collection — it would lose its stories */
      const ids=[...libSel].filter(id=>{const b=books.find(x=>x.id===id);return b&&!isColl(b);});
      const skipped=libSel.size-ids.length;
      if(ids.length<2){alert("Tick at least two ordinary books — collections can't be folded into another collection.");return;}
      const first=books.find(b=>b.id===ids[0]);
      const nm=prompt("Name for the collection (its title on the shelf):",(first&&first.author?first.author+" — ":"")+"collection");
      if(nm==null||!nm.trim())return;
      if(!confirm(`Fold ${ids.length} book${ids.length===1?"":"s"} into “${nm.trim()}”?${skipped?`\n\n${skipped} collection${skipped===1?"":"s"} left alone.`:""}\n\nTheir own pages move to Recently deleted — notes, ratings, pages and covers carry into the collection.`))return;
      await makeCollectionFrom(ids,nm.trim(),first?first.author:"");
      libSel.clear();render();
    };
    /* Folding books into a collection that already exists could only be done
       from inside that collection, one book at a time. Which is the wrong way
       round for the common case: you are looking at the shelf, you can see the
       four that belong together, and one of them is already the collection. */
    const si=q("#selInto",m);
    if(si)si.onclick=()=>{
      const ids=[...libSel].filter(id=>{const b=books.find(x=>x.id===id);return b&&!isColl(b);});
      const skipped=libSel.size-ids.length;
      if(!ids.length){alert("Tick at least one ordinary book — a collection can't be folded into another collection.");return;}
      const panel=q("#selApply",m);
      let iq="";
      const draw=()=>{
        const ql=iq.trim().toLowerCase();
        const pool=collsOnShelf().filter(c=>!ql||(c.title||"").toLowerCase().includes(ql)||(c.author||"").toLowerCase().includes(ql));
        panel.innerHTML=`<div class="hcard" style="margin-top:8px;box-shadow:none">
          <div class="lbl" style="display:block;margin-bottom:5px">Put ${ids.length} book${ids.length===1?"":"s"} inside…${skipped?` (${skipped} collection${skipped===1?"":"s"} ticked will be left alone)`:""}</div>
          <input class="field" id="intoQ" placeholder="Search your collections…" value="${esc(iq)}" style="font-size:13px;padding:7px 10px;margin-bottom:7px">
          ${pool.slice(0,20).map(c=>`<div class="snap" style="padding:6px 10px">
            <div style="min-width:0;flex:1"><div class="when" style="font-size:13px">${esc(c.title)||"Untitled"}</div>
              <div class="meta">${esc(c.author)||"Unknown author"} · ${(c.entries||[]).length} inside</div></div>
            <button class="btn" data-into2="${c.id}" style="padding:3px 9px">Put them in</button></div>`).join("")
            ||'<div class="none">No collection matches that.</div>'}
          ${pool.length>20?`<div class="none" style="margin-top:5px">…and ${pool.length-20} more — search to narrow it.</div>`:""}
          <button class="btn" id="intoCancel" style="margin-top:7px;padding:3px 10px;font-size:12px">Cancel</button></div>`;
        q("#intoCancel",panel).onclick=()=>{panel.innerHTML="";};
        const se=q("#intoQ",panel);
        se.oninput=()=>{iq=se.value;draw();
          const s2=q("#intoQ",panel);if(s2){s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length);}};
        qa("[data-into2]",panel).forEach(btn=>btn.onclick=async()=>{
          const coll=books.find(x=>x.id===btn.dataset.into2);if(!coll)return;
          if(!confirm(`Put ${ids.length} book${ids.length===1?"":"s"} inside “${coll.title||"Untitled"}”?\n\nEach keeps its rating, pages, cover, dates and writing. Their own pages move to Recently deleted, where they can be brought back for ${TRASH_DAYS} days.`))return;
          btn.disabled=true;
          const msg=q("#busyMsg");if(msg)msg.textContent=`Filing ${ids.length}…`;
          let n=0;
          try{n=await foldIntoCollection(ids,coll);}
          catch(e){alert("They couldn't all be filed — storage may be full. Anything already moved is safe.");}
          if(q("#busyMsg"))q("#busyMsg").textContent="";
          libSel.clear();render();
          if(n)alert(`${n} book${n===1?"":"s"} now live inside “${coll.title||"Untitled"}”.`);
        });
      };
      draw();
    };
  }
  wireOpen(m,true);
  hydrateCovers(m);
}

/* ---- loose pictures on the library page ---- */
async function addLibArt(file,at){
  if(!file||!file.type.startsWith("image/"))return null;
  let data;try{data=await compressImage(file,1800,.86);}catch(e){alert("That image couldn't be read.");return null;}
  const id=uid();
  try{await dbPut("images",{key:libArtKey(id),data});}catch(e){alert("That picture couldn't be saved — storage may be full.");return null;}
  libArt.push({id,x:(at&&at.x)||24,y:(at&&at.y)||24,w:230,group:""});
  libArtCache.set(id,data);saveLibArt();
  if(SYNC.on){enqueue({kind:"img",key:libArtKey(id)});flushQueue();}
  return id;
}
async function removeLibArt(id){

/* crop, for pictures that aren't inside a book */
function cropLibArt(a){
  const box=q("#cropPanel2");box.hidden=false;
  const orig=libArtCache.get(a.id);
  if(!orig){alert("That picture isn't loaded yet.");box.hidden=true;return;}
  let sel=null;
  box.innerHTML=`<div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⬚ Crop</b>
      <button class="btn" id="lcX" style="margin-left:auto;padding:4px 10px">Close</button></div>
    <div class="hint" style="margin:0 0 8px">Drag a box over the part you want to keep.</div>
    <div id="lcStage" style="position:relative;display:inline-block;max-width:100%;touch-action:none;cursor:crosshair">
      <img id="lcImg" src="${orig}" style="max-width:100%;max-height:300px;display:block;border-radius:8px">
      <div id="lcSel" hidden style="position:absolute;border:2px solid #14b8a6;background:rgba(20,184,166,.18);pointer-events:none"></div>
    </div>
    <div class="hint" id="lcMsg" style="margin:8px 0 0">Nothing selected yet.</div>
    <button class="btn pri" id="lcDo" style="margin-top:9px" disabled>Keep this part</button>`;
  const stage=q("#lcStage",box),selEl=q("#lcSel",box),msg=q("#lcMsg",box);
  const paint=()=>{
    const r=q("#lcImg",box).getBoundingClientRect(),s=stage.getBoundingClientRect();
    if(!sel){selEl.hidden=true;return;}
    selEl.hidden=false;
    selEl.style.left=(r.left-s.left+sel.x*r.width)+"px";
    selEl.style.top=(r.top-s.top+sel.y*r.height)+"px";
    selEl.style.width=(sel.w*r.width)+"px";selEl.style.height=(sel.h*r.height)+"px";
  };
  stage.addEventListener("pointerdown",e=>{
    e.preventDefault();
    const r=q("#lcImg",box).getBoundingClientRect();
    const cl=v=>Math.max(0,Math.min(1,v));
    const x0=cl((e.clientX-r.left)/r.width),y0=cl((e.clientY-r.top)/r.height);
    const mv=ev=>{const x1=cl((ev.clientX-r.left)/r.width),y1=cl((ev.clientY-r.top)/r.height);
      sel={x:Math.min(x0,x1),y:Math.min(y0,y1),w:Math.abs(x1-x0),h:Math.abs(y1-y0)};paint();};
    const up=()=>{
      window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
      const ok=sel&&sel.w>.02&&sel.h>.02;
      if(!ok){sel=null;paint();}
      q("#lcDo",box).disabled=!ok;
      msg.textContent=ok?`Keeping about ${Math.round(sel.w*100)}% across and ${Math.round(sel.h*100)}% down.`:"Drag a bigger box.";
    };
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  });
  q("#lcX",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
  q("#lcDo",box).onclick=()=>{
    if(!sel)return;
    const img=new Image();
    img.onload=async()=>{
      const W=img.naturalWidth,H=img.naturalHeight;
      const sx=Math.round(sel.x*W),sy=Math.round(sel.y*H);
      const sw=Math.max(1,Math.round(sel.w*W)),sh=Math.max(1,Math.round(sel.h*H));
      const c=document.createElement("canvas");c.width=sw;c.height=sh;
      c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
      const png=/^data:image\/png/i.test(orig);
      const data=png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.88);
      try{await dbPut("images",{key:libArtKey(a.id),data,v:Date.now()});}
      catch(err){alert("That didn't fit — storage may be full.");return;}
      libArtCache.set(a.id,data);
      if(SYNC.on){enqueue({kind:"img",key:libArtKey(a.id)});flushQueue();}
      box.hidden=true;box.innerHTML="";
      renderLibrary();
    };
    img.onerror=()=>{msg.textContent="That picture couldn't be read.";};
    img.src=orig;
  };
}

    disc.className="gavph";

async function hydrateGroupArt(root){
  for(const el of qa("[data-gartimg]",root)){
    const id=el.dataset.gartimg;
    let d=gartCache.get(id);
    if(d===undefined){d=await loadImgData(gartKey(id));gartCache.set(id,d);}
    if(d){el.src=d;continue;}
    gavFallback(el);
  }
  /* a heading with no picture of its own: the first of its best books that
     turns out to have a cover stands in for it, and the disc is the last resort */
  for(const el of qa("[data-gavbook]",root)){
    let src=null;
    for(const tok of (el.dataset.gavbook||"").split(",").filter(Boolean)){
      let c=coverCache.get(tok);
      if(c===undefined){
        if(tok.slice(0,4)==="img:")c=await loadImgData(tok.slice(4));
        else{const rec=await dbGet("covers",tok);c=rec?rec.data:null;}
        coverCache.set(tok,c||null);
      }
      if(c){src=c;break;}
    }
    if(src)el.src=src;else gavFallback(el);
  }
}
