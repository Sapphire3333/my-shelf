<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Shelf</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<meta name="theme-color" id="themeColor" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Shelf">
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#292524; --mut:#78716c; --faint:#a8a29e;
    --line:#e7e5e4; --teal:#0f766e; --teal-d:#115e59; --amber:#f59e0b; --rose:#e11d48;
    color-scheme:light;
  }
  /* ---- dark mode ---- */
  :root[data-theme="dark"]{
    --bg:#1c1917; --card:#292524; --ink:#e8e6e3; --mut:#a8a29e; --faint:#78716c;
    --line:#44403c; --teal:#2dd4bf; --teal-d:#5eead4; --rose:#fb7185;
    color-scheme:dark;
  }
  [data-theme="dark"] .field,[data-theme="dark"] .pill,[data-theme="dark"] .laybtn,
  [data-theme="dark"] .sug,[data-theme="dark"] .mini,[data-theme="dark"] .seg,
  [data-theme="dark"] .boxbtn,[data-theme="dark"] .ratebox,[data-theme="dark"] .rich,
  [data-theme="dark"] .addin,[data-theme="dark"] .sm,[data-theme="dark"] .aut,
  [data-theme="dark"] .rsn,[data-theme="dark"] .colorpick,[data-theme="dark"] .dnfbox,
  [data-theme="dark"] .stat,[data-theme="dark"] .spread,[data-theme="dark"] .hcard,
  [data-theme="dark"] .snap,[data-theme="dark"] .btn,[data-theme="dark"] .bgpanel,
  [data-theme="dark"] .authcard,[data-theme="dark"] .authcard input,
  [data-theme="dark"] .ent,[data-theme="dark"] .entrich,[data-theme="dark"] .rb.no{
    background:var(--card);color:var(--ink);border-color:var(--line)
  }
  [data-theme="dark"] .edbar{background:#1c1917f2}
  [data-theme="dark"] .thumb,[data-theme="dark"] .gcov,[data-theme="dark"] .cnt,
  [data-theme="dark"] .entcov,[data-theme="dark"] .bgsw-p{background:#3a3532}
  [data-theme="dark"] .tabs{background:#29252488}
  [data-theme="dark"] .tab.on{background:#44403c;color:var(--ink)}
  [data-theme="dark"] .kw{background:#3a3532;border-color:#57534e;color:#d6d3d1}
  [data-theme="dark"] .addbtn,[data-theme="dark"] .btn.pri,[data-theme="dark"] .authcard .go,
  [data-theme="dark"] .pill.on,[data-theme="dark"] .mg.on,[data-theme="dark"] .sm.on{color:#0b0f0e}
  [data-theme="dark"] .pill.on2,[data-theme="dark"] .seg button.fin,[data-theme="dark"] .rsn.on{
    background:#e7e5e4;border-color:#e7e5e4;color:#1c1917}
  [data-theme="dark"] .bdnf{background:#44403c;color:#d6d3d1}
  [data-theme="dark"] .rate{background:#422006;border-color:#854d0e;color:#fcd34d}
  [data-theme="dark"] .bst.reading{background:#134e4a;color:#5eead4}
  [data-theme="dark"] .bst.want{background:#422006;color:#fcd34d}
  [data-theme="dark"] .bst.coll{background:#3b2f5e;color:#c4b5fd}
  [data-theme="dark"] .lbox.plus{background:#0f291f;border-color:#14532d}
  [data-theme="dark"] .lbox.plus h3{color:#6ee7b7}
  [data-theme="dark"] .lbox.minus{background:#2b1417;border-color:#7f1d1d}
  [data-theme="dark"] .lbox.minus h3{color:#fda4af}
  [data-theme="dark"] .lbox.quote{background:#181a2e;border-color:#312e81}
  [data-theme="dark"] .lbox.quote h3{color:#a5b4fc}
  [data-theme="dark"] .pickbox{background:#1e1b2e;border-color:#4c1d95}
  [data-theme="dark"] .pickbox h2{color:#c4b5fd}
  [data-theme="dark"] .entbox{background:#221f2e;border-color:#4c1d95}
  [data-theme="dark"] .linkbox{background:#0f2b28;border-color:#134e4a;color:#99f6e4}
  [data-theme="dark"] .colbtn.f{background:#2b1417;border-color:#7f1d1d;color:#fda4af}
  [data-theme="dark"] .colbtn.r{background:#0f2b28;border-color:#134e4a;color:#5eead4}
  [data-theme="dark"] .colbtn.w{background:#2a1d05;border-color:#854d0e;color:#fcd34d}
  [data-theme="dark"] .colbtn.d{background:#33302d;border-color:#57534e;color:#d6d3d1}
  [data-theme="dark"] .rb.has{background:#2a1d05;border-color:#854d0e;color:var(--ink)}
  [data-theme="dark"] .savemsg.ok,[data-theme="dark"] .syncstat.ok,[data-theme="dark"] .authmsg.ok{color:#34d399}
  [data-theme="dark"] .sug button:hover,[data-theme="dark"] .btn:hover,
  [data-theme="dark"] .aut:hover{background:#134e4a}
  [data-theme="dark"] .tbtn{color:#d6d3d1}
  [data-theme="dark"] .tbtn:hover,[data-theme="dark"] .backbtn:hover{background:#44403c}
  [data-theme="dark"] .bgdrop{border-color:#57534e}
  [data-theme="dark"] .empty{border-color:#44403c}
  [data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
  *{box-sizing:border-box}
  /* the browser's own [hidden] rule loses to any class that sets display, which
     left the draw tools and the mode bar on screen in every mode */
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
  .serif{font-family:Georgia,"Times New Roman",serif}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 96px}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font:inherit;color:var(--ink)}
  input:focus,select:focus,[contenteditable]:focus{outline:none;border-color:#2dd4bf!important}
  ::placeholder{color:var(--faint)}

  /* header */
  header{padding-top:32px}
  h1{margin:0;font-size:30px}
  .sub{color:var(--mut);font-size:13px;margin-top:2px}
  .hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .addbtn{background:var(--teal);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .addbtn:hover{background:var(--teal-d)}
  .tabs{display:flex;gap:4px;background:#e7e5e488;border-radius:12px;padding:4px;margin-top:16px}
  .tab{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:500;color:var(--mut)}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .bkrow{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
  .bkrow button:hover{color:var(--teal)}
  .bkrow button:disabled{opacity:.4;cursor:default}
  .busy{color:var(--teal)}

  /* chips & badges */
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;color:#fff;font-size:12px;padding:2px 9px;margin:1px}
  .chip.big{font-size:14px;padding:4px 11px}
  .chip .x{opacity:.8;font-weight:700;padding:0 1px}
  .chip .x:hover{opacity:1}
  .rate{display:inline-flex;align-items:center;gap:3px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;font-weight:600;font-size:13px;border-radius:6px;padding:1px 7px;white-space:nowrap}
  /* how you rated it, at a glance: under 5, 5 to 8, and 8 up */
  .rate.lo{background:#fff1f2;border-color:#fda4af;color:#be123c}
  .rate.hi{background:#ecfdf5;border-color:#6ee7b7;color:#047857}
  [data-theme="dark"] .rate.lo{background:#3f1119;border-color:#9f1239;color:#fda4af}
  [data-theme="dark"] .rate.hi{background:#052e22;border-color:#047857;color:#6ee7b7}
  .grate.lo{color:#fda4af}.grate.hi{color:#6ee7b7}
  .bdnf{background:#e7e5e4;color:#57534e;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;letter-spacing:.5px}
  .bst{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
  .bst.reading{background:#ccfbf1;color:#0f766e}.bst.want{background:#fef3c7;color:#b45309}
  .fav{color:var(--rose)}

  /* library rows */
  .row{position:relative;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.15s}
  .row:hover{border-color:#5eead4;box-shadow:0 3px 8px rgba(0,0,0,.08)}
  .thumb{position:relative;overflow:visible;width:54px;height:74px;flex:none;border:1px solid var(--line);border-radius:7px;background:#f5f5f4;display:flex;align-items:center;justify-content:center;color:#d6d3d1;font-size:20px}
  .thumb img{border-radius:6px}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .rmain{flex:1;min-width:0}
  .rtitle{font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .rauth{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rser{color:var(--faint);font-size:12px}
  /* genres sit with the rating on the right; keywords stay under the title. Every
     genre is shown — the row grows taller rather than hiding any. */
  .rside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:55%}
  .rgen{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px;max-width:100%}
  @media(max-width:520px){.rside{max-width:50%}}
  /* Stage and favourite ride on the cover itself. Two boxes flanking it made the
     cover — the thing actually worth looking at — the smallest part of the row. */
  .stdot{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11px;z-index:3;
    background:#f5f5f4;color:#57534e;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.28)}
  .stdot:hover{transform:scale(1.15)}
  .stdot.finished{background:#a7f3d0;border-color:#6ee7b7;color:#065f46}
  .stdot.reading{background:#5eead4;border-color:#2dd4bf;color:#115e59}
  .stdot.want{background:#fcd34d;border-color:#f59e0b;color:#78350f}
  .stdot.dnf{background:#d6d3d1;border-color:#a8a29e;color:#44403c}
  .favdot{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;z-index:3;
    background:var(--rose);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.3)}
  /* the way through to the book, right beside its name and nothing more */
  .tlink{text-decoration:none;font-size:1.15em;line-height:1;opacity:.72;display:inline-block}
  .tlink:hover{opacity:1;transform:scale(1.14)}
  .stpick{position:absolute;left:10px;top:10px;z-index:25;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:5px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;min-width:180px}
  .stpick button{text-align:left;padding:8px 11px;border-radius:8px;font-size:13px;white-space:nowrap}
  .stpick button:hover{background:#f0fdfa}
  [data-theme="dark"] .stpick button:hover{background:#134e4a}
  .stpick button.on{background:var(--teal);color:#fff}
  .rr{font-size:10px;color:var(--faint)}
  .rdel{color:#d6d3d1;border-radius:6px;padding:2px 6px;opacity:0}
  .row:hover .rdel{opacity:1}
  @media(hover:none){.rdel{opacity:1}}
  .rdel:hover{color:var(--rose);background:#fff1f2}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
  .gcard{cursor:pointer;position:relative}
  .libcb{flex:none;width:17px;height:17px;cursor:pointer;accent-color:var(--teal)}
  .gcard .libcb{position:absolute;top:7px;left:7px;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .gcov{position:relative;aspect-ratio:2/3;border:1px solid var(--line);border-radius:10px;background:#f5f5f4;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:.15s;display:flex;align-items:center;justify-content:center;color:#d6d3d1;font-size:24px}
  .gcard:hover .gcov{border-color:#5eead4;box-shadow:0 3px 8px rgba(0,0,0,.1)}
  .gcov img{width:100%;height:100%;object-fit:cover}
  .gfav{position:absolute;top:5px;right:6px;color:var(--rose);text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .grate{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fcd34d;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px}
  .gdnf{position:absolute;bottom:4px;right:4px;background:rgba(68,64,60,.85);color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
  .gst{position:absolute;top:4px;left:4px;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
  .gst.reading{background:var(--teal);color:#fff}.gst.want{background:#fbbf24;color:#78350f}
  .gtitle{font-weight:600;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gauth{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* filter pills */
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;align-items:center}
  .pill{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:999px;padding:4px 10px}
  .pill:hover{border-color:#5eead4}
  .pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .pill.on2{background:#44403c;border-color:#44403c;color:#fff}
  .laybtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;color:var(--mut)}
  .laybtn:hover{border-color:#5eead4}

  /* generic */
  .field{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px}
  .sec h2{font-size:17px;margin:0 0 8px}
  .sec{margin-bottom:26px}
  .hint{font-size:12px;color:var(--faint);margin:2px 0 8px}
  .empty{border:2px dashed var(--line);border-radius:16px;text-align:center;padding:56px 16px;color:var(--mut)}
  .none{color:var(--faint);font-size:13px}

  /* editor */
  .edbar{position:sticky;top:0;z-index:50;background:#faf7f2f2;backdrop-filter:blur(4px);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:0 16px}
  .edbar .r1{display:flex;align-items:center;gap:8px;padding:9px 0}
  .edbar .r2{display:flex;align-items:center;gap:7px;padding:6px 0;border-top:1px solid #e7e5e4aa;flex-wrap:wrap}
  .backbtn{display:flex;align-items:center;gap:4px;color:var(--mut);border-radius:8px;padding:5px 8px}
  .backbtn:hover{background:#e7e5e4}
  .savemsg{font-size:12px;margin-left:auto}
  /* text size and the simple switch, in reach on every screen */
  .sizectl{display:inline-flex;align-items:center;gap:4px;flex:none}
  .tinybtn{padding:3px 9px;font-size:12px;line-height:1.5}
  @media(max-width:640px){.tinybtn{padding:5px 10px;font-size:13px}}
  .savemsg.ok{color:#059669}.savemsg.no{color:var(--faint)}
  .delbtn{color:var(--faint);border-radius:8px;padding:5px 8px}
  .delbtn:hover{color:var(--rose);background:#fff1f2}
  .tbtn{border:none;border-radius:6px;padding:4px 8px;color:#57534e;font-weight:700}
  .tbtn:hover{background:#e7e5e4}
  .tbtn.i{font-style:italic}.tbtn.u{text-decoration:underline}
  .cdot{width:15px;height:15px;border-radius:50%;padding:0;border:1px solid rgba(0,0,0,.1)}
  .cdot:hover{transform:scale(1.2)}
  .vline{width:1px;height:16px;background:#d6d3d1;margin:0 3px}
  .sm{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px}
  .sm:hover{border-color:#5eead4}
  .sm.on{background:var(--teal);border-color:var(--teal);color:#fff}

  .edhead{display:flex;gap:20px;flex-wrap:wrap}
  .coverbox{width:160px;height:224px;flex:none;border:2px dashed #d6d3d1;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--faint);font-size:13px;text-align:center}
  .coverbox:hover{border-color:#2dd4bf}
  .coverbox img{width:100%;height:100%;object-fit:cover}
  .edfields{flex:1;min-width:260px;display:flex;flex-direction:column;gap:11px}
  .titlein{font-size:20px;font-weight:600}
  .relbox{position:relative}
  .sug{position:absolute;z-index:40;left:0;right:0;top:100%;margin-top:3px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.12);overflow:hidden}
  .sug button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:14px}
  .sug button:hover{background:#f0fdfa}
  .inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mini{width:48px;text-align:center;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 4px;font-size:14px}
  .lbl{font-size:12px;color:var(--faint)}
  .seg{display:inline-flex;border:1px solid var(--line);background:#fff;border-radius:10px;padding:3px;gap:2px;width:fit-content}
  .seg button{border-radius:7px;padding:6px 12px;font-size:13px;color:var(--mut)}
  .seg button.fin{background:#44403c;color:#fff}.seg button.rea{background:var(--teal);color:#fff}.seg button.wan{background:#fbbf24;color:#78350f}
  .boxbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mut);font-weight:500}
  .boxbtn.favon{border-color:#fda4af;background:#fff1f2;color:var(--rose)}
  .boxbtn.dnfon{border-color:#78716c;background:#44403c;color:#fff;font-weight:700}
  .ratebox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px}
  .ratebox input{width:60px;border:none;text-align:center;font-weight:600;font-size:15px}
  .cnt{width:24px;height:24px;border-radius:7px;background:#f5f5f4;font-weight:700;color:#57534e}
  .cnt:hover{background:#e7e5e4}
  .dnfbox{border:1px solid #d6d3d1;background:#fafaf9;border-radius:10px;padding:12px}
  .dnfbox .cap{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--mut);text-transform:uppercase;margin-bottom:7px}
  .rsn{border:1px solid #d6d3d1;background:#fff;border-radius:999px;font-size:12px;padding:3px 10px;color:#57534e;margin:2px}
  .rsn.on{background:#44403c;border-color:#57534e;color:#fff}
  .colorpick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-top:8px}
  .colorpick .dots{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .colorpick .cdot{width:26px;height:26px}
  .cap2{font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--mut);text-transform:uppercase;margin:22px 0 6px}
  .rich{min-height:110px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px}
  .rich:empty:before{content:attr(data-ph);color:var(--faint);pointer-events:none}
  .lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-top:16px}
  @media(max-width:640px){.lists{grid-template-columns:1fr}}
  .lbox{border-radius:14px;border:1px solid;padding:12px}
  .lbox.plus{border-color:#a7f3d0;background:#ecfdf588}.lbox.plus h3{color:#047857}
  .lbox.minus{border-color:#fecdd3;background:#fff1f288}.lbox.minus h3{color:#be123c}
  .lbox.meh{border-color:#e7e5e4;background:#fafaf988}.lbox.meh h3{color:#78716c}
  [data-theme="dark"] .lbox.meh{background:#2a2725;border-color:#44403c}
  [data-theme="dark"] .lbox.meh h3{color:#a8a29e}
  .lbox.quote{border-color:#c7d2fe;background:#eef2ff66;margin-top:14px}.lbox.quote h3{color:#4338ca}
  .lbox h3{margin:0 0 8px;font-size:14px}
  .lhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lhead h3{margin:0}
  .ordbtn{margin-left:auto;padding:3px 9px;font-size:12px}
  .li{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-bottom:6px}
  .li .dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:7px}
  .li .qm{color:#818cf8;flex:none;font-family:Georgia,serif;font-size:17px;line-height:1.1}
  .li [contenteditable]{flex:1;min-width:0}
  .li.q [contenteditable]{font-style:italic;font-family:Georgia,serif}
  .li .lx{color:#d6d3d1;padding:0 3px;opacity:0}
  .li:hover .lx{opacity:1}
  .li .lx:hover{color:var(--rose)}
  .addin{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;font-size:13px;margin-top:4px}

  /* floating scrapbook images */
  #edPage{position:relative}
  .scrap{position:absolute;z-index:30;pointer-events:none;user-select:none}
  .scrap img{width:100%;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.18);display:block}
  .scrap.bh{opacity:.4}
  #edPage.arr .scrap{pointer-events:auto;cursor:move}
  #edPage.arr .scrap.bh{opacity:.6}
  #edPage.arr .scrap img{outline:2px solid #2dd4bf;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .sbar{position:absolute;top:-32px;left:0;display:none;gap:3px;background:#292524;border-radius:7px;padding:3px 5px}
  .sbar.below,.pbar.below{top:auto;bottom:-32px}
  #edPage.arr .sbar{display:flex}
  /* a small drop-down under a toolbar button — kept out of the flow so opening it
     can't change the toolbar's height */
  .dropmenu{position:absolute;top:100%;left:0;z-index:60;background:#292524;border-radius:9px;padding:4px;
    display:flex;flex-direction:column;min-width:170px;box-shadow:0 10px 26px rgba(0,0,0,.42)}
  .dropmenu button{color:#fff;text-align:left;padding:7px 10px;border-radius:6px;font-size:12.5px;white-space:nowrap}
  .dropmenu button:hover{background:#57534e}
  /* the ⋯ menu for the fiddlier per-item actions */
  .imenu{position:absolute;top:4px;left:4px;background:#292524;border-radius:8px;padding:4px;
    display:none;flex-direction:column;min-width:158px;z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.4)}
  #edPage.arr .imenu:not([hidden]){display:flex}
  .imenu button{color:#fff;text-align:left;padding:6px 9px;border-radius:5px;font-size:12px;white-space:nowrap}
  .imenu button:hover{background:#57534e}
  .sbar button{color:#fff;border-radius:5px;padding:2px 6px;font-size:13px}
  .sbar button:hover{background:#57534e}
  .sbar .sfade.on{background:var(--teal)}
  .sbar .sdel:hover{background:var(--rose)}
  .rs{position:absolute;right:-6px;bottom:-6px;width:15px;height:15px;background:#14b8a6;border-radius:4px;cursor:nwse-resize;display:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  #edPage.arr .rs{display:block}

  /* search page */
  .searchbox{position:relative;margin-bottom:4px}
  .searchbox .field{padding-left:36px}
  .searchbox .sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .deep{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:18px}
  .colbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid;border-radius:10px;padding:8px 12px;font-size:13px;margin:2px}
  .colbtn:disabled{opacity:.4;cursor:default}
  .colbtn.f{border-color:#fecdd3;background:#fff1f2;color:#be123c}
  .colbtn.r{border-color:#99f6e4;background:#f0fdfa;color:#0f766e}
  .colbtn.w{border-color:#fde68a;background:#fffbeb;color:#b45309}
  .colbtn.d{border-color:#a8a29e;background:#f5f5f4;color:#44403c}
  .pickbox{border:1px solid #ddd6fe;background:#f5f3ff88;border-radius:14px;padding:12px}
  .pickbox h2{color:#6d28d9}
  .pickbtn{background:#7c3aed;color:#fff;border-radius:9px;padding:6px 16px;font-weight:600;font-size:13px}
  .pickbtn:hover{background:#6d28d9}
  .aut{border:1px solid #d6d3d1;background:#fff;border-radius:999px;font-size:13px;padding:4px 11px;margin:2px}
  .aut:hover{border-color:#2dd4bf;background:#f0fdfa}
  .aut b{color:var(--teal)}
  .clearbtn{margin-left:auto;color:var(--teal);font-size:13px}
  .clearbtn:hover{text-decoration:underline}
  .heading{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .heading h2{margin:0;font-size:17px}
  .heading .n{color:var(--faint);font-size:13px}
  .rbuckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
  .rb{display:flex;justify-content:space-between;border:1px solid;border-radius:9px;padding:7px 11px;font-size:13px}
  .rb.has{border-color:#fde68a;background:#fffbeb;color:#44403c}
  .rb.has:hover{border-color:#f59e0b}
  .rb.no{border-color:var(--line);background:#fff;color:#d6d3d1;cursor:default}
  .mg{display:inline-flex;align-items:center;gap:6px;border:1px solid #d6d3d1;background:#fff;border-radius:999px;font-size:13px;padding:4px 11px;margin:2px;color:#44403c}
  .mg .bx{width:13px;height:13px;border:1px solid #a8a29e;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px}
  .mg.on{color:#fff}
  .mg.on .bx{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.2)}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .stat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}
  .stat .v{font-size:22px;font-weight:700;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .k{font-size:11px;color:var(--mut);margin-top:2px}
  .spread{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin-top:8px}
  .spread .bars{display:flex;align-items:flex-end;gap:4px;height:58px}
  .spread .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
  .spread .bar{width:100%;background:#fbbf24;border-radius:3px 3px 0 0}
  .spread .bn{font-size:9px;color:var(--faint)}
  .axis{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:3px}
  /* jump-to and back-to-top, following you down long pages */
  #fab{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #fab>button{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center}
  #fab>button:hover{border-color:#2dd4bf;background:#f0fdfa}
  [data-theme="dark"] #fab>button:hover{background:#134e4a}
  #fabMenu{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.28);max-height:58vh;overflow:auto;min-width:190px;max-width:74vw}
  #fabMenu button{display:block;width:100%;border-radius:8px;padding:8px 10px;text-align:left;font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fabMenu button:hover{background:#f0fdfa}
  [data-theme="dark"] #fabMenu button:hover{background:#134e4a}
  @media(max-width:640px){#fab{right:10px;bottom:10px}}
  /* so a jumped-to heading doesn't hide under the sticky toolbar */
  [data-gh],#secDetails,#secSummary,#secLists,#secQuotes,#secNotes,#entWrap{scroll-margin-top:150px}
  /* loose pictures over the library page — they can sit out in the margins, and
     they only take clicks while Pictures mode is on */
  #main{position:relative}
  #libArtLayer{position:absolute;left:0;top:0;width:100%;height:0;z-index:6;pointer-events:none;overflow:visible}
  .libpic{position:absolute;pointer-events:none}
  #main.artmode .libpic{pointer-events:auto;cursor:move;touch-action:none}
  .libpic img{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 2px 9px rgba(0,0,0,.2)}
  #main.artmode .libpic img{outline:2px solid #2dd4bf}
  .lptag{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;
    border-radius:5px;padding:1px 6px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
  .lpbar{position:absolute;top:-30px;left:0;display:none;gap:3px;background:#292524;border-radius:7px;padding:3px 5px}
  #main.artmode .lpbar{display:flex}
  .lpbar button{color:#fff;border-radius:5px;padding:2px 7px;font-size:12px}
  .lpbar button:hover{background:#57534e}
  .lpgrip{position:absolute;right:-7px;bottom:-7px;width:17px;height:17px;background:#14b8a6;border-radius:5px;
    display:none;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  #main.artmode .lpgrip{display:block}
  .foot{margin-top:40px;font-size:11px;color:var(--faint);text-align:center}
  .kw{display:inline-flex;align-items:center;gap:3px;border:1px solid #d6d3d1;background:#fafaf9;color:#57534e;font-weight:700;font-size:10px;border-radius:5px;padding:0 5px;margin:1px}
  /* chips you've arranged yourself: a break here means the next one starts a row,
     however much space is left on this one */
  .chiprow{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
  .rowbreak{flex-basis:100%;width:100%;height:0;margin:0}
  .chmv{padding:0 3px;font-size:10px;opacity:.75;color:inherit;line-height:1}
  .chmv:hover{opacity:1}
  .chmv.on{background:rgba(255,255,255,.35);border-radius:3px;opacity:1}
  /* the shared keyword list: long, so it scrolls in place */
  .kwpick{display:flex;flex-wrap:wrap;gap:3px;max-height:132px;overflow:auto;
    border:1px solid var(--line);border-radius:9px;padding:7px;background:var(--card)}
  .kwpick .kw:hover{border-color:#2dd4bf}
  .kwfam{display:flex;flex-wrap:wrap;gap:3px;align-items:center;width:100%}
  .kwfamname{width:100%;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--faint);margin:5px 0 1px}
  /* the way in to wherever the book actually is — deliberately hard to miss */
  .linkchip{text-decoration:none}
  /* ---- reading a book rather than editing it ---- */
  /* cover on the left, everything about the book beside it in the space that was
     going spare. Only a genuinely narrow screen stacks them. */
  .vhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
  .vcover{width:132px;height:186px;flex:none;border:1px solid var(--line);border-radius:10px;background:#f5f5f4;
    overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;color:#d6d3d1;
    box-shadow:0 2px 8px rgba(0,0,0,.1)}
  [data-theme="dark"] .vcover{background:#3a3532}
  .vcover img{width:100%;height:100%;object-fit:cover}
  .vmain{flex:1;min-width:230px;display:flex;flex-direction:column;gap:7px}
  .vtitle{font-size:27px;margin:0;line-height:1.2}
  .vauthor{font-size:15px;color:var(--mut);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .vline2{font-size:13px;color:var(--faint)}
  .vbadges{position:relative;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:1px}
  .vpick{left:0;top:calc(100% + 5px)}
  .vst:hover,.vfav:hover{border-color:#2dd4bf}
  .vst{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:7px;
    padding:3px 10px;background:#f5f5f4;color:#57534e;border:1px solid var(--line)}
  .vst.finished{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
  .vst.reading{background:#ccfbf1;border-color:#5eead4;color:#0f766e}
  .vst.want{background:#fffbeb;border-color:#fcd34d;color:#b45309}
  .vst.dnf{background:#e7e5e4;border-color:#d6d3d1;color:#44403c}
  [data-theme="dark"] .vst{background:#3a3532;border-color:#57534e;color:#d6d3d1}
  .vfav{font-size:12.5px;font-weight:700;color:var(--rose);border:1px solid #fda4af;background:#fff1f2;
    border-radius:7px;padding:3px 10px}
  [data-theme="dark"] .vfav.on{background:#2b1417;border-color:#7f1d1d}
  /* not a favourite: there, but quiet about it */
  .vfav:not(.on){color:var(--faint);border-color:var(--line);background:transparent;font-weight:400}
  .vfav:not(.on):hover{color:var(--rose)}
  .vprog{display:flex;align-items:center;gap:9px}
  .vfacts{font-size:13px;color:var(--mut)}
  .vfactgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;margin:6px 0 2px;font-size:13.5px}
  .vfactgrid dt{color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;align-self:center}
  .vfactgrid dd{margin:0;color:var(--ink)}
  .vgen,.vkw{margin-top:4px}
  .vtext{font-size:15px;line-height:1.6;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px}
  .vtext.small{font-size:13.5px;padding:9px 11px}
  .vtext img{max-width:100%;height:auto}
  /* fit-to-screen is about the scrapbook, not this — it was stacking the header
     even on a wide window, which is why the title sat under the cover */
  @media(max-width:560px){
    .vhead{grid-template-columns:1fr;gap:14px;justify-items:start}
    .vcover{width:104px;height:148px}
    .vtitle{font-size:22px}
  }
  .prog{display:inline-block;height:7px;border-radius:999px;background:var(--line);overflow:hidden;vertical-align:middle}
  .prog i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .2s}
  .ovh{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  #edPage.tagmode [contenteditable]{cursor:crosshair}
  /* editing labels: make it obvious which chips are now click-to-edit */
  #edPage.tagedit #genChips .chip,#edPage.tagedit #genSug .chip,#edPage.tagedit #kwWrap .kw{
    cursor:pointer;outline:2px dashed var(--amber);outline-offset:2px}
  #edPage.tagedit #tagEditTog{background:var(--amber);border-color:var(--amber);color:#43290b;font-weight:700}
  /* chips can be dragged into the order you want while you're editing them */
  #edPage.tagedit #genChips .chip,#edPage.tagedit #kwWrap .kw{cursor:grab;touch-action:none;user-select:none}
  #edPage.tagedit #genChips .chip:active,#edPage.tagedit #kwWrap .kw:active{cursor:grabbing}
  .sm.tag-on{background:#fbbf24;border-color:#f59e0b;color:#78350f;font-weight:700}

  /* auth + sync */
  .authwrap{max-width:400px;margin:60px auto 0;padding:0 20px}
  .authcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  .authcard h1{font-size:34px;text-align:center;margin:0}
  .authcard .tag{color:var(--mut);font-size:13px;text-align:center;margin:5px 0 20px}
  .authcard label{display:block;font-size:12px;color:var(--faint);margin:12px 0 3px}
  .authcard input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 13px}
  .authcard .go{width:100%;background:var(--teal);color:#fff;border-radius:10px;padding:12px;font-weight:600;margin-top:18px}
  .authcard .go:hover{background:var(--teal-d)}
  .authcard .go:disabled{opacity:.5;cursor:default}
  .authcard .alt{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px}
  .authcard .alt button{color:var(--teal)}
  .authcard .alt button:hover{text-decoration:underline}
  .authmsg{font-size:13px;margin-top:14px;text-align:center;min-height:18px;line-height:1.35}
  .authmsg.err{color:var(--rose)}.authmsg.ok{color:#059669}
  .acct{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:12px;flex-wrap:wrap}
  .acct .who{color:var(--faint)}
  .acct .out{color:var(--teal)}
  .acct .out:hover{text-decoration:underline}
  .syncstat{font-size:12px}
  .syncstat.ok{color:#059669}.syncstat.no{color:var(--faint)}

  /* overview hub */
  @media(min-width:900px){
    .hubcols{column-count:2;column-gap:24px}
    .hubcols .sec{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;vertical-align:top}
  }
  .hcard{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .hrow2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar{height:9px;border-radius:999px;background:#e7e5e4;overflow:hidden;margin:9px 0 7px}
  .bar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s}
  .bar i.warn{background:var(--amber)}
  .bar i.full{background:var(--rose)}
  .bignum{font-family:Georgia,serif;font-size:21px;font-weight:700}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:13px;color:var(--ink);font-weight:500}
  .btn:hover{border-color:#2dd4bf;background:#f0fdfa}
  .btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.pri:hover{background:var(--teal-d)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.danger:hover{border-color:#fda4af;background:#fff1f2;color:var(--rose)}
  .snap{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-top:6px;font-size:13px;background:#fff}
  .snap .when{font-weight:600}
  .snap .meta{color:var(--faint);font-size:12px}
  .snap .sp{margin-left:auto;display:flex;gap:6px}
  .tagx{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;background:#ccfbf1;color:#0f766e}
  .tagx.man{background:#fef3c7;color:#b45309}
  .grouphead{display:flex;align-items:center;gap:8px;margin:20px 0 8px}
  /* a group's own picture sits in the flow, so resizing it pushes the next group
     down instead of ever covering anything */
  .gcar{color:var(--mut);font-size:13px;padding:0 2px}
  .grouphead .gart{opacity:.55}
  .grouphead:hover .gart,.grouphead .gart:hover{opacity:1}
  /* the whole picture, never cropped: the width is what you drag, the height
     follows the picture's own shape, and it all sits in the flow */
  .gartbox{position:relative;margin:0 0 10px;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:#f5f5f4;max-width:100%}
  [data-theme="dark"] .gartbox{background:#3a3532}
  .gartbox img{width:100%;height:auto;display:block}
  .gartx{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;padding:0;
    background:rgba(255,255,255,.9);color:#57534e;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0}
  .gartbox:hover .gartx{opacity:1}
  .gartx:hover{color:var(--rose)}
  .gartgrip{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;touch-action:none;
    background:var(--teal);border-radius:9px 0 0 0;opacity:.8}
  .gartgrip:after{content:"⤡";position:absolute;right:4px;bottom:0;color:#fff;font-size:13px;line-height:20px}
  .gartgrip:hover{opacity:1}
  @media(hover:none){.gartx{opacity:1}}
  .grouphead .n{color:var(--faint);font-size:13px}
  .ghline{flex:1;height:1px;background:var(--line)}

  /* series / collections */
  .chkrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
  .chk{display:flex;align-items:center;gap:6px;cursor:pointer}
  .chk input{cursor:pointer}
  .linkbox{border:1px solid #99f6e4;background:#f0fdfa;border-radius:10px;padding:9px 11px;margin-top:7px;font-size:13px;color:#115e59}
  .linkbox a{color:var(--teal);cursor:pointer;text-decoration:underline}
  .linkbox a:hover{color:var(--teal-d)}
  .bst.coll{background:#ede9fe;color:#6d28d9}
  .bst.kind{background:#e0f2fe;color:#0369a1}
  [data-theme="dark"] .bst.kind{background:#0c3a52;color:#7dd3fc}
  .ffbox{border:1px solid #bae6fd;background:#f0f9ff66;border-radius:12px;padding:11px;margin-top:8px}
  [data-theme="dark"] .ffbox{background:#0c2a3a55;border-color:#0369a1}
  .entbox{border:1px solid #ddd6fe;background:#f5f3ff55;border-radius:14px;padding:12px}
  .ent{display:flex;gap:11px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;margin-bottom:8px}
  .entnum{font-family:Georgia,serif;font-weight:700;color:var(--faint);font-size:13px;flex:none;width:14px;text-align:right;padding-top:6px}
  .entcov{width:56px;height:78px;flex:none;border:1px dashed #d6d3d1;border-radius:7px;background:#fafaf9;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--faint);font-size:15px}
  .entcov:hover{border-color:#2dd4bf}
  .entcov img{width:100%;height:100%;object-fit:cover}
  .entmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .entrich{min-height:46px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;font-size:13px}
  .entrich:empty:before{content:attr(data-ph);color:var(--faint);pointer-events:none}

  /* backgrounds */
  #bgLayer{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat}
  /* the editor's pickers float over the page instead of shoving it around */
  .bgpanel{position:fixed;right:16px;top:50%;transform:translateY(-50%);width:340px;max-height:80vh;overflow:auto;
    border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;z-index:80;
    box-shadow:0 12px 40px rgba(0,0,0,.28)}
  @media(max-width:820px){
    .bgpanel{left:8px;right:8px;width:auto;top:auto;bottom:8px;transform:none;max-height:62vh}
  }
  .bgsws{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
  .bgsw{position:relative;cursor:pointer;font-size:11px;color:var(--mut);text-align:center}
  .bgsw-p{height:50px;border:2px solid var(--line);border-radius:9px;background:#faf7f2;margin-bottom:3px;background-size:cover;background-position:center}
  .bgsw:hover .bgsw-p{border-color:#5eead4}
  .bgsw.on .bgsw-p{border-color:var(--teal);box-shadow:0 0 0 2px #99f6e4}
  .bgsw span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bgx{position:absolute;top:-5px;right:-5px;background:#fff;border:1px solid var(--line);border-radius:50%;width:18px;height:18px;font-size:10px;color:var(--faint);display:none;align-items:center;justify-content:center;padding:0}
  .bgsw:hover .bgx{display:flex}
  .bgx:hover{color:var(--rose);border-color:#fda4af}
  .bgdrop{border:2px dashed #d6d3d1;border-radius:10px;padding:13px;text-align:center;color:var(--mut);font-size:13px;margin-top:10px;cursor:pointer}
  .bgdrop:hover,.bgdrop.over{border-color:#2dd4bf;background:#f0fdfa}
  .opac{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:13px;color:var(--mut)}
  .opac input[type=range]{flex:1;accent-color:var(--teal)}
  /* cut-out preview — checkerboard shows what's been made transparent */
  .cutprev{display:flex;align-items:center;justify-content:center;min-height:150px;border-radius:10px;border:1px solid var(--line);
    background-color:#fff;background-image:linear-gradient(45deg,#e7e5e4 25%,transparent 25%,transparent 75%,#e7e5e4 75%),
      linear-gradient(45deg,#e7e5e4 25%,transparent 25%,transparent 75%,#e7e5e4 75%);
    background-size:16px 16px;background-position:0 0,8px 8px;padding:8px}
  .cutprev img{max-width:100%;max-height:190px;object-fit:contain}
  /* choosing between the covers a lookup found */
  .fpcov{border:2px solid var(--line);opacity:.75;transition:.12s}
  .fpcov:hover{opacity:1;border-color:#5eead4}
  .fpcov.on{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2px #99f6e4}

  /* notepad pages */
  .pad{position:absolute;z-index:35}
  .padshape{position:absolute;inset:0;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.15);overflow:hidden;background-size:cover;background-position:center}
  .padshape.shaped{border-radius:0;box-shadow:none}
  .padtext{outline:none;font-size:14px;height:100%;overflow:auto}
  .padtext:empty:before{content:attr(data-ph);color:rgba(0,0,0,.28)}
  #edPage.arr .pad{cursor:move;outline:2px solid #2dd4bf}
  #edPage.arr .padtext{pointer-events:none;user-select:none}
  .pbar{position:absolute;top:-30px;left:0;display:none;gap:3px;background:#292524;border-radius:7px;padding:3px 5px;z-index:2}
  #edPage.arr .pad .pbar{display:flex}
  .pbar button{color:#fff;border-radius:5px;padding:2px 6px;font-size:13px}
  .pbar button:hover{background:#57534e}
  .pbar .pdel:hover{background:var(--rose)}
  .prs{position:absolute;right:-6px;bottom:-6px;width:15px;height:15px;background:#14b8a6;border-radius:4px;cursor:nwse-resize;display:none;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:2}
  #edPage.arr .prs{display:block}
  /* tilt handle (pictures + notes) */
  .rot{position:absolute;left:-7px;bottom:-7px;width:16px;height:16px;background:#f59e0b;border-radius:50%;cursor:grab;display:none;box-shadow:0 1px 3px rgba(0,0,0,.35);z-index:3}
  .rot:active{cursor:grabbing}
  #edPage.arr .rot{display:block}

  /* draw mode */
  /* fit-to-screen: the free canvas becomes a readable vertical stack */
  #edPage.fit #imgLayer,#edPage.fit #padLayer{position:static}
  #edPage.fit .scrap,#edPage.fit .pad{
    position:relative!important;left:auto!important;top:auto!important;transform:none!important;
    width:100%!important;max-width:440px;height:auto!important;margin:0 auto 14px!important;
    z-index:auto!important;opacity:1!important}
  #edPage.fit .scrap img{width:100%;height:auto}
  #edPage.fit .pad .padshape{position:relative;inset:auto;height:auto;min-height:120px}
  #edPage.fit .padtext{height:auto;min-height:96px}
  #edPage.fit #drawLayer{display:none}   /* whole-page marks can't map onto a stack */

  #drawLayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:46;overflow:visible}
  .dsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
  #edPage.draw{cursor:crosshair}
  #edPage.draw .scrap,#edPage.draw .pad{pointer-events:auto}
  #edPage.draw .padtext,#edPage.draw .rich,#edPage.draw .edhead,#edPage.draw .lists,
  #edPage.draw .lbox,#edPage.draw #entWrap,#edPage.draw .cap2,#edPage.draw .hint{pointer-events:none}
  #edPage.draw .scrap{opacity:1!important}
  /* highlighter "over text": the writing has to be selectable again */
  #edPage.draw.hlsel{cursor:text}
  #edPage.draw.hlsel .padtext,#edPage.draw.hlsel .rich,#edPage.draw.hlsel .edhead,
  #edPage.draw.hlsel .lists,#edPage.draw.hlsel .lbox,#edPage.draw.hlsel #entWrap,
  #edPage.draw.hlsel .cap2,#edPage.draw.hlsel .hint{pointer-events:auto}
  /* The mode and draw bars FLOAT below the toolbar. If they took up space in the
     bar, showing one would make the whole page reflow downwards while the
     pictures, notes and strokes — positioned against the page — stayed put, so
     everything appeared to shift the moment you entered or left a mode. */
  .edbarfloat{position:absolute;left:0;right:0;top:100%;z-index:51;padding:0 16px}
  .dbar{display:flex;align-items:center;gap:6px;padding:6px 10px;flex-wrap:wrap;
    background:var(--bg);border:1px solid var(--line);border-top:none;
    border-radius:0 0 10px 10px;box-shadow:0 6px 16px rgba(0,0,0,.14)}
  /* which mode you're in, and how to leave it */
  .modebar{display:flex;align-items:center;gap:9px;padding:7px 11px;margin:0 0 2px;border-radius:0 0 10px 10px;
    background:#0f766e;color:#fff;font-size:12.5px}

  .modebar .btn{margin-left:auto;padding:3px 11px;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
  .modebar .btn:hover{background:rgba(255,255,255,.28);border-color:#fff}
  [data-theme="dark"] .modebar{background:#115e59}
  .dtool.on{background:var(--teal);border-color:var(--teal);color:#fff}
  #dcol{width:30px;height:26px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:1px;cursor:pointer}
  #dw{width:88px;accent-color:var(--teal)}
  .dsw{width:16px;height:16px;border-radius:50%;padding:0;border:1px solid rgba(0,0,0,.15)}
  .dsw:hover{transform:scale(1.2)}
  /* one colour strip serves text and drawing — see #colStrip */
  #fmtGrp{display:contents}

  /* on touch screens, dragging/drawing must beat the browser's scroll gesture —
     without this the first finger-move scrolls the page and cancels the pointer */
  #edPage.arr .scrap,#edPage.arr .pad,#edPage.draw,.rot,.rs,.prs{touch-action:none}

  /* remove-cover button */
  .coverbox{position:relative}
  .covx{position:absolute;top:6px;right:6px;width:22px;height:22px;padding:0;border-radius:50%;
    background:#fff;border:1px solid var(--line);color:var(--mut);font-size:11px;
    display:flex;align-items:center;justify-content:center;opacity:0}
  .coverbox:hover .covx{opacity:1}
  .covx:hover{color:var(--rose);border-color:#fda4af}
  @media(hover:none){.covx{opacity:1}}
  /* ---- simple mode: the reading and writing, none of the scrapbook ---- */
  html[data-simple="1"] #imgLayer,html[data-simple="1"] #padLayer,html[data-simple="1"] #drawLayer,
  html[data-simple="1"] #libArtLayer,html[data-simple="1"] .edbarfloat,html[data-simple="1"] #tbar,

  html[data-simple="1"] .gartbox,html[data-simple="1"] .grouphead .gart,
  html[data-simple="1"] .notehint{display:none!important}
  /* Bigger type is the whole point — the zoom slider is on top of this, not
     instead of it. 16px on anything you type into also stops iOS zooming in. */
  html[data-simple="1"] body{font:17px/1.5 "Segoe UI",system-ui,sans-serif}
  html[data-simple="1"] input,html[data-simple="1"] select,html[data-simple="1"] textarea,

  html[data-simple="1"] .rich,html[data-simple="1"] .entrich{font-size:16.5px;line-height:1.55;min-height:90px}
  html[data-simple="1"] .lbl,html[data-simple="1"] .hint,html[data-simple="1"] .none,
  html[data-simple="1"] .rr,html[data-simple="1"] .meta{font-size:13px}
  html[data-simple="1"] .rtitle{font-size:17px}
  html[data-simple="1"] .rauth{font-size:14px;white-space:normal}
  html[data-simple="1"] .li{font-size:15.5px}
  html[data-simple="1"] .kw{font-size:12px;padding:2px 7px}
  html[data-simple="1"] .chip{font-size:13px;padding:3px 10px}
  html[data-simple="1"] .chip.big{font-size:14px;padding:4px 12px}
  html[data-simple="1"] .btn,html[data-simple="1"] .sm,html[data-simple="1"] .rsn,
  html[data-simple="1"] .pill{font-size:14px;padding:8px 13px}
  html[data-simple="1"] .tab{font-size:13.5px;padding:10px 4px}
  html[data-simple="1"] .titlein{font-size:21px}
  html[data-simple="1"] h1{font-size:26px}
  html[data-simple="1"] .lbox h3,html[data-simple="1"] .cap2{font-size:15px}
  html[data-simple="1"] .row{padding:14px 12px}
  html[data-simple="1"] .lists{grid-template-columns:1fr}

  /* six tabs still fit on a phone */
  @media(max-width:640px){.tab{font-size:10.5px;padding:7px 1px}}

  /* a collection entry's position is an editable number */
  input.entnum{width:30px;border:1px solid var(--line);border-radius:6px;background:#fff;
    text-align:center;padding:3px 0;-moz-appearance:textfield}

<script>
/* =============== constants & helpers =============== */
const PALETTE=["#2563eb","#0891b2","#059669","#65a30d","#ca8a04","#ea580c","#dc2626","#e11d48","#db2777","#9333ea","#7c3aed","#4f46e5","#0d9488","#b45309","#78716c","#334155"];
/* ten in every palette on purpose: the strip swaps sets as you change tool, and a
   different number of dots could rewrap the toolbar and reflow the page */
const TEXT_COLORS=["#44403c","#dc2626","#ea580c","#ca8a04","#059669","#0d9488","#2563eb","#7c3aed","#db2777","#334155"];
const DEFAULT_DNF=["Boring / lost interest","Slow pacing","Didn't like the writing style","Didn't connect with the characters","Confusing plot","Too long","Content I didn't enjoy","Not the right time for it"];
const DEFAULT_AUD=["Children","Middle Grade","Young Adult","Adult"];
/* self-contained CSS backgrounds — no external assets */
const BG_PRESETS=[
  {id:"none",name:"Plain",css:""},
  {id:"paper",name:"Old paper",css:"background-color:#f5ecd9;background-image:radial-gradient(circle at 20% 30%,rgba(170,130,70,.13),transparent 45%),radial-gradient(circle at 80% 70%,rgba(150,110,60,.13),transparent 45%)"},
  {id:"lined",name:"Lined paper",css:"background-color:#fffef7;background-image:repeating-linear-gradient(#fffef7 0 25px,#cfe3f0 25px 26px)"},
  {id:"grid",name:"Graph paper",css:"background-color:#fbfdff;background-image:repeating-linear-gradient(#e3eef7 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,#e3eef7 0 1px,transparent 1px 20px)"},
  {id:"dots",name:"Dot grid",css:"background-color:#fdfcfa;background-image:radial-gradient(#d6d3d1 1.1px,transparent 1.2px);background-size:18px 18px"},
  {id:"linen",name:"Linen",css:"background-color:#f7f3ec;background-image:repeating-linear-gradient(45deg,rgba(120,80,40,.035) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(120,80,40,.035) 0 2px,transparent 2px 5px)"},
  {id:"warm",name:"Warm wash",css:"background-image:linear-gradient(160deg,#fdf2e9,#f9e7d5 45%,#efdfd0)"},
  {id:"mint",name:"Mint wash",css:"background-image:linear-gradient(160deg,#eefbf6,#dcf5ec 50%,#cfeee4)"},
  {id:"lavender",name:"Lavender",css:"background-image:linear-gradient(160deg,#f6f3ff,#ece7fb 50%,#e2dbf7)"},
  {id:"rose",name:"Rose",css:"background-image:linear-gradient(160deg,#fff5f6,#ffe9ec 50%,#fbdbe1)"},
];
/* drawing */
const DRAW_TOOLS=[["pen","✏️","Pen — free line"],["line","╱","Straight line"],["arrow","↗","Arrow"],
  ["rect","▭","Rectangle"],["ellipse","◯","Ellipse"],["hl","🖍","Highlighter"],["erase","🧽","Rub out a mark"]];
const DRAW_SWATCHES=["#dc2626","#ea580c","#ca8a04","#059669","#0d9488","#2563eb","#7c3aed","#db2777","#44403c","#ffffff"];
/* the highlighter wants soft, washed-out inks — the pen's colours go muddy at low opacity */
const HL_SWATCHES=["#fde68a","#fdba74","#fca5a5","#f9a8d4","#d8b4fe","#a5b4fc","#93c5fd","#99f6e4","#bbf7d0","#e5e7eb"];
let drawTool="pen",drawColor="#dc2626",drawWidth=3,hlAlpha=.35,hlMode="free";
const distToSeg=(p,a,b)=>{
  const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;
  if(!L)return Math.hypot(p[0]-a[0],p[1]-a[1]);
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L;t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy));
};
/* strokes are stored 0..1 on images/notes (so they scale with them) and in px on the page */
function drawSvgHtml(strokes,sx,sy){
  return (strokes||[]).map(s=>{
    const p=(s.pts||[]).map(q2=>[q2[0]*sx,q2[1]*sy]);
    if(!p.length)return "";
    const hl=s.t==="hl";
    const w=hl?Math.max(9,s.w*4):s.w;
    const at=`stroke="${s.c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${hl?(s.o==null?.35:s.o):1}"`;
    const n=v=>v.toFixed(1);
    if(s.t==="pen"||hl)return `<polyline points="${p.map(q2=>n(q2[0])+","+n(q2[1])).join(" ")}" ${at}/>`;
    const a=p[0],b=p[1]||p[0];
    if(s.t==="line")return `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" ${at}/>`;
    if(s.t==="arrow"){
      const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=Math.max(10,s.w*3.4);
      const h1=[b[0]-L*Math.cos(ang-Math.PI/7),b[1]-L*Math.sin(ang-Math.PI/7)];
      const h2=[b[0]-L*Math.cos(ang+Math.PI/7),b[1]-L*Math.sin(ang+Math.PI/7)];
      return `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" ${at}/>`
        +`<polyline points="${n(h1[0])},${n(h1[1])} ${n(b[0])},${n(b[1])} ${n(h2[0])},${n(h2[1])}" ${at}/>`;
    }
    if(s.t==="rect")return `<rect x="${n(Math.min(a[0],b[0]))}" y="${n(Math.min(a[1],b[1]))}" width="${n(Math.abs(b[0]-a[0]))}" height="${n(Math.abs(b[1]-a[1]))}" ${at}/>`;
    if(s.t==="ellipse")return `<ellipse cx="${n((a[0]+b[0])/2)}" cy="${n((a[1]+b[1])/2)}" rx="${n(Math.abs(b[0]-a[0])/2)}" ry="${n(Math.abs(b[1]-a[1])/2)}" ${at}/>`;
    return "";
  }).join("");
}
function nearStroke(s,px,sx,sy){
  const p=(s.pts||[]).map(q2=>[q2[0]*sx,q2[1]*sy]);
  if(!p.length)return false;
  const tol=Math.max(11,(s.t==="hl"?s.w*4:s.w));
  if(s.t==="pen"||s.t==="hl")return p.some((q2,i)=>i&&distToSeg(px,p[i-1],q2)<tol)||Math.hypot(p[0][0]-px[0],p[0][1]-px[1])<tol;
  const a=p[0],b=p[1]||p[0];
  if(s.t==="line"||s.t==="arrow")return distToSeg(px,a,b)<tol;
  const x0=Math.min(a[0],b[0])-tol,x1=Math.max(a[0],b[0])+tol,y0=Math.min(a[1],b[1])-tol,y1=Math.max(a[1],b[1])+tol;
  return px[0]>=x0&&px[0]<=x1&&px[1]>=y0&&px[1]<=y1;
}

/* notepad looks — CSS only, no assets */
const PAD_SKINS=[
  {id:"yellow",name:"Yellow sticky",css:"background:#fef9c3;border:1px solid #fde68a"},
  {id:"pink",name:"Pink sticky",css:"background:#fce7f3;border:1px solid #fbcfe8"},
  {id:"blue",name:"Blue sticky",css:"background:#dbeafe;border:1px solid #bfdbfe"},

function hexToHsl(hex){

  const n=parseInt(v||"000000",16)||0;

  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;

  if(d){

    else h=(r-g)/d+4;

  const l=(mx+mn)/2;

  return {h,s:s*100,l:l*100};
}
function hslToHex(h,s,l){

  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(((h/60)%2)-1)),m=l-c/2;
  let r=0,g=0,b=0;

  else if(hh<240){g=x;b=c;}else if(hh<300){r=x;b=c;}else{r=c;b=x;}

/* Magic wand: flood the background inward from the edges, clear it, then trim to
   what's left. Great on a flat/plain backdrop, poor on a busy photo. Returns PNG
   because JPEG can't hold transparency. */
function cutOutImage(dataURL,tol,trim){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h){rej(new Error("That picture couldn't be read."));return;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const ctx=c.getContext("2d",{willReadFrequently:true});
      ctx.drawImage(img,0,0);
      let im;try{im=ctx.getImageData(0,0,w,h);}catch(e){rej(new Error("That picture couldn't be read."));return;}
      const d=im.data,n=w*h;
      /* Background colour = the most common colour around the border. Averaging the
         corners breaks the moment the subject touches one (the mean lands between
         the two colours and matches neither). */
      const tally=new Map();
      const edge=(x,y)=>{
        const p=(y*w+x)*4;
        const k=((d[p]>>4)<<8)|((d[p+1]>>4)<<4)|(d[p+2]>>4);
        const e=tally.get(k)||{n:0,r:0,g:0,b:0};
        e.n++;e.r+=d[p];e.g+=d[p+1];e.b+=d[p+2];tally.set(k,e);
      };
      for(let x=0;x<w;x++){edge(x,0);edge(x,h-1);}
      for(let y=0;y<h;y++){edge(0,y);edge(w-1,y);}
      let top=null;tally.forEach(e=>{if(!top||e.n>top.n)top=e;});
      const ref=[top.r/top.n,top.g/top.n,top.b/top.n];
      const T=tol*tol*3;
      const near=i=>{const p=i*4,a=d[p]-ref[0],b=d[p+1]-ref[1],g=d[p+2]-ref[2];return a*a+b*b+g*g<=T;};
      const seen=new Uint8Array(n),clear=new Uint8Array(n),st=[];
      const seed=(x,y)=>{const i=y*w+x;if(seen[i])return;seen[i]=1;if(near(i)){clear[i]=1;st.push(i);}};
      for(let x=0;x<w;x++){seed(x,0);seed(x,h-1);}
      for(let y=0;y<h;y++){seed(0,y);seed(w-1,y);}
      while(st.length){
        const i=st.pop(),x=i%w,y=(i/w)|0;
        const nb=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
        for(let k=0;k<4;k++){
          const nx=nb[k][0],ny=nb[k][1];
          if(nx<0||ny<0||nx>=w||ny>=h)continue;
          const j=ny*w+nx;
          if(seen[j])continue;
          seen[j]=1;
          if(near(j)){clear[j]=1;st.push(j);}
        }
      }
      let minX=w,minY=h,maxX=-1,maxY=-1,gone=0;
      for(let i=0;i<n;i++){
        if(clear[i]){d[i*4+3]=0;gone++;}
        else{const x=i%w,y=(i/w)|0;
          if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
      }
      if(maxX<0){rej(new Error("The whole picture looked like background — try a lower amount."));return;}
      ctx.putImageData(im,0,0);
      const sx=trim?minX:0,sy=trim?minY:0;
      const cw=trim?maxX-minX+1:w,ch=trim?maxY-minY+1:h;
      const o=document.createElement("canvas");o.width=cw;o.height=ch;
      o.getContext("2d").drawImage(c,sx,sy,cw,ch,0,0,cw,ch);
      res({data:o.toDataURL("image/png"),w:cw,h:ch,pct:Math.round(gone/n*100)});
    };
    img.onerror=()=>rej(new Error("That picture couldn't be read."));
    img.src=dataURL;
  });
}

async function loadSyncLocal(){
  const dq=await dbGet("meta","syncQueue");SYNC.queue=dq&&Array.isArray(dq.v)?dq.v:[];
  const dd=await dbGet("meta","deletions");deletions=dd&&dd.v?dd.v:{};
  const sm=await dbGet("meta","seenMod");SYNC.seen=sm&&sm.v?sm.v:{};
  /* tombstones only need to outlive the longest-offline device — drop ancient ones
     so the map doesn't grow forever */
  const cut=Date.now()-90*864e5;let pruned=false;
  for(const k of Object.keys(deletions))if(deletions[k]<cut){delete deletions[k];pruned=true;}
  if(pruned)dbPut("meta",{k:"deletions",v:deletions});
}
function saveQueue(){dbPut("meta",{k:"syncQueue",v:SYNC.queue});}
const opKey=o=>o.kind+":"+(o.id||o.key||"");
function enqueue(op){
  if(!SYNC.on)return;
  SYNC.queue=SYNC.queue.filter(o=>opKey(o)!==opKey(op));
  SYNC.queue.push(op);saveQueue();flushQueue();
}
function saveDeletions(){dbPut("meta",{k:"deletions",v:deletions});enqueue({kind:"meta",key:"deletions"});}

async function flushQueue(){
  if(!SYNC.on||!SYNC.user||SYNC.flushing)return;
  clearTimeout(SYNC.retryT);
  if(!navigator.onLine){setSync("offline");return;}
  if(!SYNC.queue.length){setSync("synced");return;}
  SYNC.flushing=true;setSync("syncing");
  let op=null;
  try{
    while(SYNC.queue.length){
      op=SYNC.queue[0];
      await runOp(op);
      /* remove by identity, not position — enqueue() may replace the array
         while an upload is in flight, so [0] might now be a different op */
      const i=SYNC.queue.indexOf(op);
      if(i>=0)SYNC.queue.splice(i,1);
      saveQueue();
    }
    setSync("synced");
  }catch(e){
    console.warn("[shelf] sync paused:",e&&e.message||e);
    if(op){
      op.fails=(op.fails||0)+1;
      /* one stuck op mustn't hold everything behind it hostage */
      if(op.fails>=3&&SYNC.queue.length>1&&SYNC.queue[0]===op)
        SYNC.queue.push(SYNC.queue.shift());
      saveQueue();
    }
    setSync(navigator.onLine?"error":"offline");
    /* "will retry" should be true even if the user touches nothing */
    SYNC.retryT=setTimeout(flushQueue,Math.min(6e4,5e3*((op&&op.fails)||1)));
  }finally{SYNC.flushing=false;}
}
async function runOp(op){
  const s=SYNC.supa,uid=SYNC.user.id;
  if(op.kind==="book"){
    const b=await dbGet("books",op.id);if(!b)return;
    const {error}=await s.from("books").upsert({user_id:uid,id:b.id,data:b,modified:b.modified||b.created||0});
    if(error)throw error;
  }else if(op.kind==="bookDel"){
    const {error}=await s.from("books").delete().eq("user_id",uid).eq("id",op.id);
    if(error)throw error;
  }else if(op.kind==="meta"){
    let value=op.key==="genres"?genres:op.key==="dnfReasons"?dnfCustom:op.key==="audiences"?audCustom:op.key==="deletions"?deletions:op.key==="backgrounds"?bgList:op.key==="padskins"?padList:op.key==="fandoms"?fandoms:op.key==="groupArt"?groupArt:op.key==="kwColors"?kwColors:op.key==="metaDel"?metaDel:op.key==="trashCloud"?trashCloud:op.key==="libArt"?libArt:op.key==="kwCats"?kwCats:op.key==="catColors"?catColors:null;
    if(value==null){const r=await dbGet("meta",op.key);value=r?r.v:{};}
    const {error}=await s.from("meta").upsert({user_id:uid,key:op.key,value});
    if(error)throw error;
  }else if(op.kind==="cover"){
    const c=await dbGet("covers",op.id);
    if(c&&c.data){const bl=dataURLtoBlob(c.data);
      const {error}=await s.storage.from("shelf").upload(coverPath(op.id),bl,{upsert:true,contentType:bl.type||"image/jpeg"});if(error)throw error;}
  }else if(op.kind==="coverDel"){
    await s.storage.from("shelf").remove([coverPath(op.id)]);
  }else if(op.kind==="img"){
    const im=await dbGet("images",op.key);
    if(im&&im.data){const bl=dataURLtoBlob(im.data);
      const {error}=await s.storage.from("shelf").upload(imgPath(op.key),bl,{upsert:true,contentType:bl.type||"image/jpeg"});if(error)throw error;}
  }else if(op.kind==="imgDel"){
    await s.storage.from("shelf").remove([imgPath(op.key)]);
  }
}

async function pullAll(){
  if(!SYNC.on||!SYNC.user||SYNC.pulling)return;
  if(!navigator.onLine){setSync("offline");return;}
  SYNC.pulling=true;setSync("syncing");
  try{
    const s=SYNC.supa,uid=SYNC.user.id;
    // meta first (additive merge, local edits win)
    try{
      const {data:metaRows,error:me}=await s.from("meta").select("key,value").eq("user_id",uid);
      if(!me&&metaRows){
        /* take the deletion record first, so nothing deleted elsewhere is re-added below */
        const mdRow=metaRows.find(r=>r.key==="metaDel");
        if(mdRow&&mdRow.value)for(const k in mdRow.value)metaDel[k]=Math.max(metaDel[k]||0,mdRow.value[k]);
        const gone=k=>!!metaDel[k];
        for(const row of metaRows){
          if(row.key==="genres"){const rv=row.value||{};
            for(const g in rv)if(!(g in genres)&&!gone("genre:"+g))genres[g]=rv[g];}
          else if(row.key==="dnfReasons")dnfCustom=[...new Set([...(row.value||[]),...dnfCustom])];
          else if(row.key==="audiences")audCustom=[...new Set([...(row.value||[]),...audCustom])];
          else if(row.key==="deletions"){const rv=row.value||{};for(const k in rv)deletions[k]=Math.max(deletions[k]||0,rv[k]);}
          else if(row.key==="backgrounds"){const have=new Set(bgList.map(x=>x.id));
            (row.value||[]).forEach(x=>{if(x&&x.id&&!have.has(x.id)&&!gone("bg:"+x.id))bgList.push(x);});}
          else if(row.key==="padskins"){const have=new Set(padList.map(x=>x.id));
            (row.value||[]).forEach(x=>{if(x&&x.id&&!have.has(x.id)&&!gone("pad:"+x.id))padList.push(x);});}
          else if(row.key==="fandoms"){const rv=row.value||{};
            for(const f in rv){
              if(gone("fandom:"+f))continue;
              fandoms[f]=[...new Set([...(rv[f]||[]),...(fandoms[f]||[])])];
            }}
          else if(row.key==="groupArt"){const rv=row.value||{};
            for(const k in rv)if(!groupArt[k]&&!gone("gart:"+k))groupArt[k]=rv[k];}
          else if(row.key==="kwColors"){const rv=row.value||{};
            for(const k in rv)if(!kwColors[k]&&!gone("kw:"+k))kwColors[k]=rv[k];}
          else if(row.key==="trashCloud"){const rv=row.value||{};
            for(const k in rv)if(!trashCloud[k]&&!(deletions[k]&&!rv[k]))trashCloud[k]=rv[k];}
          else if(row.key==="libArt"){const have=new Set(libArt.map(a=>a.id));
            (row.value||[]).forEach(a=>{if(a&&a.id&&!have.has(a.id)&&!gone("libart:"+a.id))libArt.push(a);});}
          else if(row.key==="kwCats"){const rv=row.value||{};
            for(const k in rv)if(!kwCats[k]&&!gone("kw:"+k))kwCats[k]=rv[k];}
          else if(row.key==="catColors"){const rv=row.value||{};
            for(const c in rv)if(!catColors[c])catColors[c]=rv[c];}
        }
        /* anything deleted here must go from the merged copies too */
        for(const k in metaDel){
          const [kind,...rest]=k.split(":");const nm=rest.join(":");
          if(kind==="genre")delete genres[nm];
          else if(kind==="kw")delete kwColors[nm];
          else if(kind==="fandom")delete fandoms[nm];
          else if(kind==="gart")delete groupArt[nm];
          else if(kind==="bg")bgList=bgList.filter(x=>x.id!==nm);
          else if(kind==="pad")padList=padList.filter(x=>x.id!==nm);
          else if(kind==="libart")libArt=libArt.filter(x=>x.id!==nm);
          else if(kind==="kw")delete kwCats[nm];
        }
        dbPut("meta",{k:"libArt",v:libArt});
        dbPut("meta",{k:"kwCats",v:kwCats});dbPut("meta",{k:"catColors",v:catColors});
        dbPut("meta",{k:"metaDel",v:metaDel});dbPut("meta",{k:"kwColors",v:kwColors});dbPut("meta",{k:"trashCloud",v:trashCloud});
        metaSnap=JSON.stringify({genres,dnfCustom,audCustom});
        dbPut("meta",{k:"genres",v:genres});dbPut("meta",{k:"dnfReasons",v:dnfCustom});dbPut("meta",{k:"audiences",v:audCustom});dbPut("meta",{k:"deletions",v:deletions});dbPut("meta",{k:"backgrounds",v:bgList});dbPut("meta",{k:"padskins",v:padList});dbPut("meta",{k:"fandoms",v:fandoms});dbPut("meta",{k:"groupArt",v:groupArt});dbPut("meta",{k:"kwColors",v:kwColors});
      }
    }catch(e){console.warn("[shelf] meta pull",e);}
    // books (per-book last-write-wins by `modified`)
    const {data:rows,error}=await s.from("books").select("id,data,modified").eq("user_id",uid);
    if(error){setSync(navigator.onLine?"error":"offline");return;}
    const localMap=new Map(books.map(b=>[b.id,b]));
    const remoteIds=new Set();
    const changed=[];
    /* A book we haven't managed to upload yet is newer than anything the cloud can
       tell us, whatever the timestamps say — clocks on two devices rarely agree.
       Same for the book open in the editor: those edits are still being typed. */
    const pending=new Set(SYNC.queue.filter(o=>o.kind==="book"&&o.id).map(o=>o.id));
    const heldBack=id=>pending.has(id)||(view==="book"&&cur&&cur.id===id);
    for(const row of rows||[]){
      remoteIds.add(row.id);
      const rb=row.data||{};rb.id=row.id;rb.modified=row.modified||rb.modified||rb.created||0;
      /* remember it even when we don't take it — the next edit here must beat it */
      if((rb.modified||0)>(SYNC.seen[row.id]||0))SYNC.seen[row.id]=rb.modified||0;
      const tomb=deletions[row.id]||0;
      if(tomb&&tomb>=(rb.modified||0))continue;
      if(heldBack(row.id))continue;
      const lb=localMap.get(row.id);
      if(!lb||(rb.modified||0)>(lb.modified||0)){
        await dbPut("books",rb);
        const i=books.findIndex(b=>b.id===row.id);
        if(i>=0)books[i]=rb;else books.push(rb);
        coverCache.delete(row.id);SYNC.triedCover.delete(row.id);
        changed.push(rb);
      }
    }
    /* covers & pictures a few at a time — one by one made a first sync crawl */
    for(let i=0;i<changed.length;i+=4)
      await Promise.all(changed.slice(i,i+4).map(syncBookAssets));
    // apply remote deletions locally
    for(const id of Object.keys(deletions)){
      if(heldBack(id))continue;
      const lb=books.find(b=>b.id===id);
      if(lb&&deletions[id]>=(lb.modified||0)){await dbDel("books",id);books=books.filter(b=>b.id!==id);}
    }
    // push up any local-only books the cloud hasn't seen yet (e.g. made offline or before first sync)
    for(const b of books){
      if(!remoteIds.has(b.id)&&!(deletions[b.id]>=(b.modified||0))){
        enqueue({kind:"book",id:b.id});enqueue({kind:"cover",id:b.id});
        imgKeysOf(b).forEach(key=>enqueue({kind:"img",key}));
      }
    }
    dbPut("meta",{k:"seenMod",v:SYNC.seen});
    setSync("synced");
    if(view!=="book")render();
  }catch(e){
    console.warn("[shelf] pull failed",e);setSync(navigator.onLine?"error":"offline");
  }finally{SYNC.pulling=false;}
}
/* "the file isn't there" — as opposed to a network hiccup, which must never delete anything */
const storeNotFound=e=>!!e&&(e.status===404||e.statusCode===404||e.statusCode==="404"||/not.?found/i.test(e.message||""));
async function syncBookAssets(b){
  const s=SYNC.supa;
  try{
    const {data,error}=await s.storage.from("shelf").download(coverPath(b.id));
    if(!error&&data){const durl=await blobToDataURL(data);await dbPut("covers",{id:b.id,data:durl});coverCache.set(b.id,durl);}
    else if(storeNotFound(error)){await dbDel("covers",b.id);coverCache.set(b.id,null);}
  }catch(e){}
  /* each image carries a version (bumped when it's cut out / replaced) so edits
     to an already-downloaded picture still reach other devices */
  const wants=[...((b.images)||[]).map(im=>({key:b.id+"|"+im.id,v:im.cut||0})),
    ...((b.entries)||[]).filter(en=>en.cover).map(en=>({key:b.id+"|"+en.id,v:en.coverV||0}))];
  for(const {key,v} of wants){
    const rec=await dbGet("images",key);
    if(rec&&(rec.v||0)>=v)continue;
    try{const {data,error}=await s.storage.from("shelf").download(imgPath(key));
      if(!error&&data)await dbPut("images",{key,data:await blobToDataURL(data),v});}catch(e){}
  }
}
/* local first, then pull from Storage if this device hasn't got it yet */
async function loadImgData(key){
  const r=await dbGet("images",key);
  if(r)return r.data;
  if(SYNC.on&&SYNC.user&&navigator.onLine){
    try{const {data,error}=await SYNC.supa.storage.from("shelf").download(imgPath(key));
      if(!error&&data){const durl=await blobToDataURL(data);await dbPut("images",{key,data:durl});return durl;}}catch(e){}
  }
  return null;
}

/* ---- auth screen ---- */
function renderLogin(msg){
  q("#app").innerHTML=`
  <div class="authwrap"><div class="authcard">
    <h1 class="serif">My Shelf</h1>
    <div class="tag">Sign in to reach your library on any device.</div>
    <label>Email</label>
    <input id="auEmail" type="email" autocomplete="username" placeholder="you@example.com">
    <label>Password</label>
    <input id="auPass" type="password" autocomplete="current-password" placeholder="Your password">
    <button class="go" id="auGo">Sign in</button>
    <div class="alt">
      <button id="auSignup">Create an account</button>
      <button id="auMagic">Email me a link instead</button>
    </div>
    <div class="alt" style="justify-content:center">
      <button id="auLocal">Use offline on this device — no account</button>
    </div>
    <div class="authmsg ${msg&&msg.err?"err":"ok"}" id="auMsg">${msg?esc(msg.text):""}</div>
  </div></div>`;
  const email=()=>q("#auEmail").value.trim(),pass=()=>q("#auPass").value;
  const setMsg=(text,err)=>{const el=q("#auMsg");el.textContent=text;el.className="authmsg "+(err?"err":"ok");};
  let mode="in";
  const busy=on=>{const g=q("#auGo");g.disabled=on;g.textContent=on?"…":(mode==="up"?"Create account":"Sign in");};
  q("#auGo").onclick=async()=>{
    if(!email()){setMsg("Enter your email.",true);return;}
    busy(true);
    try{
      if(mode==="up"){
        const {error}=await SYNC.supa.auth.signUp({email:email(),password:pass()});
        if(error)throw error;
        setMsg("Account created. If asked, confirm via the email we just sent, then sign in.",false);
        mode="in";
      }else{
        const {error}=await SYNC.supa.auth.signInWithPassword({email:email(),password:pass()});
        if(error)throw error; // onAuthStateChange takes over on success
      }
    }catch(e){setMsg(e.message||"That didn't work.",true);}
    busy(false);
  };
  q("#auSignup").onclick=()=>{mode="up";q("#auGo").textContent="Create account";
    q("#auPass").setAttribute("autocomplete","new-password");
    setMsg("Pick a password (6+ characters), then press Create account.",false);};
  /* the library lives in this browser — being signed out must never lock it away */
  q("#auLocal").onclick=()=>{SYNC.user=null;render();};
  q("#auMagic").onclick=async()=>{
    if(!email()){setMsg("Enter your email first.",true);return;}
    try{const {error}=await SYNC.supa.auth.signInWithOtp({email:email()});if(error)throw error;
      setMsg("Check your email for a one-tap sign-in link.",false);}catch(e){setMsg(e.message||"Couldn't send the link.",true);}
  };
  q("#auEmail").addEventListener("keydown",e=>{if(e.key==="Enter")q("#auPass").focus();});
  q("#auPass").addEventListener("keydown",e=>{if(e.key==="Enter")q("#auGo").click();});
}
/* the queue is kept: unsynced edits go up on the next sign-in (the account
   check below stops them landing in the wrong account) */
async function signOut(){try{await SYNC.supa.auth.signOut();}catch(e){}SYNC.user=null;renderLogin({text:"Signed out.",err:false});}

/* signing into a DIFFERENT account than this device last synced with would merge
   the local library into it and push everything up — make that an informed choice */
async function checkAccount(user){
  try{
    const r=await dbGet("meta","lastUser");
    const last=r?r.v:null;
    if(last&&last!==user.id&&books.length){
      if(!confirm(`This device holds ${books.length} book${books.length===1?"":"s"} that were synced to a different account.\n\nOK merges them into ${user.email||"this account"}'s cloud library.\nCancel signs out and leaves everything as it is.`)){
        await signOut();return false;
      }
    }
    dbPut("meta",{k:"lastUser",v:user.id});
  }catch(e){}
  return true;
}

async function initSync(){
  if(!syncConfigured()){SYNC.on=false;render();return;}
  try{SYNC.supa=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}
  catch(e){console.warn("[shelf] supabase init failed",e);SYNC.on=false;render();return;}
  SYNC.on=true;
  window.addEventListener("online",()=>{setSync("syncing");flushQueue().then(pullAll);});
  window.addEventListener("offline",()=>setSync("offline"));
  SYNC.supa.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_IN"&&session&&session.user){
      if(!SYNC.user){
        SYNC.user=session.user;render();
        checkAccount(session.user).then(ok=>{if(ok)flushQueue().then(pullAll);});
      }else SYNC.user=session.user;
    }else if(event==="SIGNED_OUT"){SYNC.user=null;renderLogin();}
    else if(session&&session.user){SYNC.user=session.user;}
  });
  const {data}=await SYNC.supa.auth.getSession();
  if(data&&data.session&&data.session.user){
    SYNC.user=data.session.user;render();
    if(await checkAccount(SYNC.user))flushQueue().then(pullAll);
  }else{
    renderLogin();
  }
}

/* =============== boot =============== */
(async function init(){
  try{db=await openDb();}catch(e){
    q("#app").innerHTML='<div class="wrap"><div class="empty">This browser blocked local storage for the file. Try opening the file in Chrome or Edge.</div></div>';return;
  }
  /* ask the browser not to evict our storage under disk pressure — without this,
     "best-effort" IndexedDB (books, covers AND the in-browser backups) can be wiped */
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  books=await dbAll("books");
  const g=await dbGet("meta","genres");genres=g?g.v:{};
  const d=await dbGet("meta","dnfReasons");dnfCustom=d?d.v:[];
  const au=await dbGet("meta","audiences");audCustom=au?au.v:[];
  const se=await dbGet("meta","settings");if(se&&se.v)settings=Object.assign(settings,se.v);
  const bl=await dbGet("meta","backgrounds");bgList=bl&&Array.isArray(bl.v)?bl.v:[];
  const pl=await dbGet("meta","padskins");padList=pl&&Array.isArray(pl.v)?pl.v:[];
  const fd=await dbGet("meta","fandoms");fandoms=fd&&fd.v?fd.v:{};
  const ga=await dbGet("meta","groupArt");groupArt=ga&&ga.v?ga.v:{};
  const kc=await dbGet("meta","kwColors");kwColors=kc&&kc.v?kc.v:{};
  repairGroupArt();
  const md=await dbGet("meta","metaDel");metaDel=md&&md.v?md.v:{};
  const tc=await dbGet("meta","trashCloud");trashCloud=tc&&tc.v?tc.v:{};
  const la=await dbGet("meta","libArt");libArt=la&&Array.isArray(la.v)?la.v:[];
  const kct=await dbGet("meta","kwCats");kwCats=kct&&kct.v?kct.v:{};
  const cc=await dbGet("meta","catColors");catColors=cc&&cc.v?cc.v:{};
  const iq=await dbGet("meta","importQueue");importQueue=iq&&Array.isArray(iq.v)?iq.v:[];
  metaSnap=JSON.stringify({genres,dnfCustom,audCustom});
  /* first run on a small screen starts simple; after that it's whatever you chose */
  if(settings.simple===undefined){
    settings.simple=window.innerWidth<700;
    if(settings.simple&&settings.fontScale==null)settings.fontScale=115;
  }
  applyTheme();applySimple();applyBg();
  try{
    const live=new Set(books.map(b=>b.id));
    const validImg=new Set();books.forEach(b=>imgKeysOf(b).forEach(k=>validImg.add(k)));
    bgList.forEach(c=>validImg.add(bgKey(c.id)));
    padList.forEach(c=>validImg.add(padKey(c.id)));
    Object.keys(groupArt).forEach(k=>{if(groupArt[k]&&groupArt[k].img)validImg.add(gartKey(groupArt[k].img));});
    libArt.forEach(a=>{if(a&&a.id)validImg.add(libArtKey(a.id));});
    for(const k of await dbAllKeys("covers"))if(!live.has(k))await dbDel("covers",k);
    for(const k of await dbAllKeys("images"))if(!validImg.has(k))await dbDel("images",k);
  }catch(e){}
  await loadSyncLocal();
  initSync();
  maybeAutoBackup();
  purgeTrash();
})();

/* Phones kill background tabs without warning and throttle timers, so the 700ms
   autosave may never fire — commit the open book the moment the tab goes hidden.
   Coming back is the natural moment to fetch what other devices did meanwhile. */
let lastFocusPull=0;
function onHidden(){
  if(view==="book"&&cur){clearTimeout(saveTimer);commitCur();}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){onHidden();return;}
  if(SYNC.on&&SYNC.user&&navigator.onLine&&Date.now()-lastFocusPull>60000){
    lastFocusPull=Date.now();
    flushQueue().then(pullAll);
  }
});
window.addEventListener("pagehide",onHidden);

/* Ctrl+Z / Ctrl+Y work app-wide when you're not inside a text field
   (inside one, the browser's own text undo stays in charge) */
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k!=="z"&&k!=="y")return;
  const t=e.target;
  if(t&&(t.isContentEditable||/^(input|textarea|select)$/i.test(t.tagName||"")))return;
  e.preventDefault();
  if(k==="y"||e.shiftKey)doRedo();else doUndo();
});

let metaSnap=null;
function saveMeta(){
  const nowS=JSON.stringify({genres,dnfCustom,audCustom});
  if(metaSnap!==null&&nowS!==metaSnap){
    pushOp({t:"meta",before:JSON.parse(metaSnap),after:JSON.parse(nowS)});
  }
  metaSnap=nowS;
  dbPut("meta",{k:"genres",v:genres});dbPut("meta",{k:"dnfReasons",v:dnfCustom});dbPut("meta",{k:"audiences",v:audCustom});
