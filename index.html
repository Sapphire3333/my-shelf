  };
}

/* =============== editor =============== */
/* The colour wheel opens a dialog, which drops focus and clears the text selection.
   Track the last selection inside an editable so we can put it back. */
let savedRange=null,savedEd=null;
function saveSel(){
  const s=window.getSelection();
  if(!s||!s.rangeCount)return;
  const n=s.getRangeAt(0).commonAncestorContainer;
  const el=n.nodeType===1?n:n.parentElement;
  const ed=el&&el.closest&&el.closest('[contenteditable="true"]');
  if(ed){savedRange=s.getRangeAt(0).cloneRange();savedEd=ed;}
}
document.addEventListener("selectionchange",saveSel);

/* "view" shows only what's filled in; "edit" is the form. A book you've never
   touched opens in the form, since it's waiting to be filled in. */
let bookMode="view";
function renderBook(){bookMode==="edit"?renderEditor():renderBookView();syncHistory();}
/* Putting the book down and picking it up the other way round puts the pen down
   too. `mode` — arranging, drawing, tagging — is a tool you have in your hand,
   and it used to be carried between the two faces: leaving the form while
   drawing left the page you read in drawing mode, crosshair and all, with no bar
   anywhere to say so and no way out but opening and closing the scrapbook. */
function setBookMode(m){bookMode=m;mode="write";renderBook();}
/* Back leaves the book for wherever you opened it from. It always went to the
   Library, which is wrong every time you arrived from somewhere else — following
   a gap out of Insights and being dropped on the shelf loses your place. The
   browser's own back button already did this properly; this is the app's button
   catching up with it. */
let cameFrom="library";
/* the back button says where it actually goes — arriving from Insights and
   reading "‹ Library" made every trip back a small surprise */
const BACK_NAMES={overview:"Overview",library:"Library",search:"Search",insights:"Insights",pick:"Pick",history:"History"};
const backLabel=()=>"‹ "+(BACK_NAMES[cameFrom]||"Library");
/* `keepPlace` means "re-read this book from storage but leave me exactly where I
   am" — which face of the page I'm on, which mode, whether it's stacked to fit,
   and how far down I'd scrolled. Undo needs it: it reloads the book to show the
   change, and reloading is what made an undo while drawing look like it had done
   nothing at all. It had worked; it just answered by closing the form, dropping
   the pen and jumping to the top of the page, so you were looking at a different
   screen when you went to check. */
async function openBook(id,fresh,keepPlace){
  if(view!=="book")cameFrom=view;
  const found=books.find(b=>b.id===id);
  /* asked to open a book that is gone (deleted since this row was drawn):
     opening a blank page under its old id would create a ghost book */
  if(!found&&!fresh)return;
  const heldFace=bookMode,heldMode=mode,heldFit=fitScreen,heldScroll=window.scrollY;
  isNew=!found;
  bookMode=keepPlace?heldFace:((!found||isRaw(found))?"edit":(settings.bookEdit?"edit":"view"));
  cur=Object.assign(blankBook(id),found?JSON.parse(JSON.stringify(found)):{});
  const c=await dbGet("covers",id);curCover=c?c.data:null;
  curImgs={};
  for(const im of cur.images||[]){const d=await loadImgData(id+"|"+im.id);if(d)curImgs[im.id]=d;}
  curEnt={};
  for(const en of cur.entries||[]){if(!en.cover)continue;const d=await loadImgData(id+"|"+en.id);if(d)curEnt[en.id]=d;}
  await preloadPads();
  mode=keepPlace?heldMode:"write";
  fitScreen=keepPlace?heldFit:((settings.fit==null)?window.innerWidth<700:!!settings.fit);   /* auto on phones, else your choice */
  view="book";renderBook();
  /* a book opens at its beginning. Replacing the page kept whatever scroll the
     library was at, which on a long collection landed you in the middle of its
     list of stories. */
  if(keepPlace){
    /* twice: once now, and once after the page has been laid out, because a page
       that hasn't got its full height back yet silently clamps the scroll */
    window.scrollTo(0,heldScroll);
    requestAnimationFrame(()=>window.scrollTo(0,heldScroll));
  }
  else if(!navRestoring)window.scrollTo(0,0);
}

function setSaved(ok){const el=q("#saveMsg");if(el){el.textContent=ok?"Saved":"Saving…";el.className="savemsg "+(ok?"ok":"no");}}
async function commitCur(){
  if(!cur){setSaved(true);return;}
  const after=JSON.parse(JSON.stringify(cur));
  const i=books.findIndex(b=>b.id===cur.id);
  /* not on the shelf and not being created right now = deleted while it was still
     open somewhere. Writing it anyway would resurrect it — on every device. */
  if(i<0&&!isNew){setSaved(true);return;}
  const before=i>=0?JSON.parse(JSON.stringify(books[i])):null;
  const strip=o=>{const c={...o};delete c.modified;return JSON.stringify(c);};
  if(before&&strip(before)===strip(after)){setSaved(true);return;}
  /* beat our previous save AND anything the cloud has shown us, so a device whose
     clock runs fast can't have its older copy win forever */
  after.modified=Math.max(Date.now(),((before&&before.modified)||0)+1,(SYNC.seen[cur.id]||0)+1);
  after.touched=true;cur.touched=true;   /* you've worked on it — no longer a raw import */
  cur.modified=after.modified;
  try{await dbPut("books",after);}
  catch(e){
    const el=q("#saveMsg");if(el){el.textContent="Couldn't save!";el.className="savemsg no";}
    if(Date.now()-(commitCur.warned||0)>60000){commitCur.warned=Date.now();
      alert("This couldn't be saved — storage may be full.\n\nExport a backup from the Overview tab, then delete some pictures or old backups.");}
    return;
  }
  pushOp({t:"book",id:cur.id,before,after:JSON.parse(JSON.stringify(after))});
  if(i>=0)books[i]=after;else books.unshift(after);
  if(SYNC.on){if(deletions[cur.id]){delete deletions[cur.id];saveDeletions();}enqueue({kind:"book",id:cur.id});}
  isNew=false;setSaved(true);
}
function scheduleSave(){
  setSaved(false);clearTimeout(saveTimer);
  saveTimer=setTimeout(commitCur,700);
}

/* ---------- the book, read rather than edited ----------
   Everything empty simply isn't here: no pickers, no "Add… (Enter)", no boxes
   waiting to be filled. What you did fill in is gathered close together. */
let vStatusOpen=false,vRateOpen=false,viewArrange=false,vReadsOpen=false;
/* pasting a picture onto the page you're reading used to be its own small copy
   of adding one. The scrapbook does it for both pages now, so this is gone and
   there is one way a picture arrives, wherever you are standing. */
/* the two things worth changing without opening the form. Saved and undoable
   exactly like an edit made inside it. */
async function quickEdit(mut){
  const stored=books.find(x=>x.id===cur.id);
  const before=stored?JSON.parse(JSON.stringify(stored)):null;
  mut(cur);
  cur.touched=true;
  cur.modified=Math.max(Date.now(),(cur.modified||0)+1,(SYNC.seen[cur.id]||0)+1);
  const after=JSON.parse(JSON.stringify(cur));
  pushOp({t:"book",id:cur.id,before,after:JSON.parse(JSON.stringify(after))});
  try{await dbPut("books",after);}catch(e){alert("Couldn't save — storage may be full.");return;}
  const i=books.findIndex(x=>x.id===cur.id);
  if(i>=0)books[i]=after;else books.unshift(after);
  if(SYNC.on){enqueue({kind:"book",id:cur.id});flushQueue();}
  renderBookView();
}

  const page=q("#edPage");

  /* the page you're on, changed where the bar already shows it. It is the number

  /* A reading on this page belongs either to the book or to one of the stories
     inside it, and the buttons on both lists look the same, so each one has to

  const readHost=(bk,hid)=>hid===bk.id?bk:(((bk.entries)||[]).find(x=>x.id===hid)||null);
  const readIn=(bk,rid)=>{
    for(const host of [bk,...((bk.entries)||[])]){

  q("#vRate").onclick=e=>{e.stopPropagation();vRateOpen=!vRateOpen;vStatusOpen=false;renderBookView();};

     same three things you can change on the collection itself */
  const findEn=(bk,id)=>((bk.entries)||[]).find(x=>x.id===id);
  qa("[data-enfav]",page).forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    quickEdit(bk=>{const en=findEn(bk,x.dataset.enfav);if(en)en.favorite=!en.favorite;});
  });
  /* the status opens the list of statuses, the way every other one on the page
     does — tapping round them in turn meant knowing the order before you could
     use it, and passing through two wrong answers to reach the right one */
  qa("[data-enst]",page).forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    vEntStatus=vEntStatus===x.dataset.enst?null:x.dataset.enst;
    vEntRate=null;
    renderBookView();
  });
  qa("[data-evst]",page).forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    const i=x.dataset.evst.indexOf("|");
    const id=x.dataset.evst.slice(0,i),v=x.dataset.evst.slice(i+1);
    vEntStatus=null;
    quickEdit(bk=>{const en=findEn(bk,id);if(!en)return;
      /* set aside is a flag beside the status, not one of them: choosing it
         clears any status, and choosing a status clears it. Choosing one also
         opens or closes a reading of this story, the way it does for a book. */
      markEntStatus(bk,en,v);});
  });
  qa("[data-enrate]",page).forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    vEntRate=vEntRate===x.dataset.enrate?null:x.dataset.enrate;
    vEntStatus=null;
    renderBookView();
  });
  qa("[data-evr]",page).forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    const [id,v]=x.dataset.evr.split("|");
    vEntRate=null;
    quickEdit(bk=>{const en=findEn(bk,id);if(en)en.rating=v==="clear"?null:Number(v);});
  });
  if(vRateOpen)setTimeout(()=>{
    const shut=ev=>{
      if(ev.target.closest&&ev.target.closest(".ratepick,#vRate"))return;
      document.removeEventListener("pointerdown",shut);
      if(vRateOpen){vRateOpen=false;if(view==="book"&&bookMode==="view")renderBookView();}
    };
    document.addEventListener("pointerdown",shut);
  },0);
  if(vStatusOpen)setTimeout(()=>{
    const shut=ev=>{
      if(ev.target.closest&&ev.target.closest(".vpick,#vStatus"))return;
      document.removeEventListener("pointerdown",shut);
      if(vStatusOpen){vStatusOpen=false;if(view==="book"&&bookMode==="view")renderBookView();}
    };
    document.addEventListener("pointerdown",shut);
  },0);
  q("#uBtn").onclick=doUndo;q("#rBtn").onclick=doRedo;refreshHistBtns();

  /* Pictures, notes and marks are content on this page, and now they are also
     worked on here. This is the same code the form runs — placing, tilting,
     layering, fading, cropping, cutting out, drawing, rubbing out — told that
     this is the reading page, so everything stands where you put it rather than
     being gathered into a row. Nothing but the drawing surfaces exists until you
     open the scrapbook, so reading a book is still only reading it. */
  wireScrapbook(page,{editor:false});
  /* tell the bar below how tall the scrapbook strip is, so it sticks underneath
     rather than beneath it. Watched rather than measured once: the strip changes
     height when the draw bar opens, and when its buttons wrap on a narrow phone. */
  if(window.__sbRO){window.__sbRO.disconnect();window.__sbRO=null;}
  const strip=q("#scrapStrip");
  /* offsetHeight, NOT the rect: --sbh is read by a rule inside the zoomed page,
     so it has to be in the page's own pixels. The rect would hand it screen ones
     and put the bar a third too low at 130% — the same two-rulers mistake. */
  const setSbh=()=>document.documentElement.style.setProperty("--sbh",
    (strip&&document.body.contains(strip)?strip.offsetHeight:0)+"px");
  setSbh();
  if(strip&&window.ResizeObserver){window.__sbRO=new ResizeObserver(setSbh);window.__sbRO.observe(strip);}
  const vs=q("#vStray");
  if(vs)vs.onclick=async()=>{
    const n=gatherStrays(cur);
    viewArrange=true;
    await quickEdit(()=>{});
    if(n)alert(`Brought ${n} back onto the page — ${n===1?"it's":"they're"} near the top left. Drag ${n===1?"it":"them"} wherever you like.`);
  };
  const vf=q("#vFit");
  if(vf){
    vf.classList.toggle("on",fitScreen);
    vf.onclick=()=>{
      fitScreen=!fitScreen;settings.fit=fitScreen;saveSettings();
      /* stacked, there is nothing to place or draw on */
      if(fitScreen)mode="write";
      renderBookView();
    };
  }
  q("#vArr").onclick=()=>{
    viewArrange=!viewArrange;
    /* opening it puts you straight into arranging, which is what you came for;
       closing it puts the pen down so a stray tap on the page can't draw */
    mode=viewArrange?"arrange":"write";
    /* same reason: stacked pictures sit in a column and can't be placed */
    if(viewArrange&&fitScreen){fitScreen=false;settings.fit=false;saveSettings();}
    renderBookView();
  };
  applyBg();closeFabMenu();updateFab();
}

/* ============ the scrapbook, shared by both faces of a book ============
   Placing, tilting, layering, fading, cropping, cutting out, drawing and rubbing
   out all used to live inside the form's own render function, written as
   closures over the form's page and the form's toolbar. That is the whole reason
   none of it could be reached from the page you actually read: outside the form
   the code did not exist at all. Which left placement in one place and every
   tool in the other, and made you walk between them.

   It lives here now and both faces call it with their own page element.
   `host.editor` says which one is asking. The form keeps pictures and notes in a
   tidy row, because a form pushes your writing a thousand pixels further down
   than the reading page does, so a spot in one is not the spot in the other; the
   reading page is where things are actually placed. Everything else is the same
   on both, down to the ids on the buttons, so none of the wiring below has to
   care where it is. Every lookup is guarded, because each page carries only the
   parts of the bar it has a use for. */
function wireScrapbook(page,host){
  host=host||{};
  /* no scrapbook bar open on the reading page means no tool in your hand — belt
     and braces against a mode arriving from somewhere else, which would leave
     this page drawing or dragging with nothing on screen to say so */
  if(!host.editor&&!viewArrange&&mode!=="write")mode="write";
  /* a note is paper you can write on, but only when nothing else is going on. In
     the form that means "not while arranging". On the reading page it also means
     "only while the scrapbook bar is open", so a stray tap on a note while you
     are simply reading can't start typing into it. */
  /* A note is paper. Writing on it is the plainest thing you can do to one, and
     it used to be the hardest: while reading you couldn't, and opening the
     scrapbook didn't help because opening it hands you the move tool — so the
     only way in was to open the scrapbook, press Done on the banner to put the
     tool down, and not close the bar. Nobody would find that.

     Now it is simply: you can write on a note wherever you can see it, unless
     you have picked up a tool that wants the same click. Arrange wants to drag
     it, Draw wants to mark it; anything else and it's paper. */
  const padWritable=()=>mode!=="arrange"&&mode!=="draw";
  /* A mark on the page itself is remembered as a place on the page — so far
     across, so far down. The form and the reading page are not the same page:
     the form stacks the cover, the title, the author, the checkboxes and the
     ratings above the spot where the reading page has your summary. The same
     remembered place is therefore a different place in each, and a mark drawn
     beside your writing turned up beside the DNF button in the form.

     Pictures and notes were taken out of this trap by standing them in a row in
     the form, but you cannot stand a scribble in a row. So marks on the page
     belong to the reading page, which is where they were drawn and where they
     sit beside what they were drawn about. In the form they are not shown and
     not drawn — the app already does exactly this in Fit mode, where the code
     says a whole-page mark cannot be mapped onto a stack. Marks on a picture or
     a note are a different matter entirely: those travel with the thing they are
     on, so they show and can be drawn in both places. */
  const pageMarks=()=>!host.editor;
  /* ---- modes: exactly one of write / arrange / draw / tag ---- */
  const MODE_HELP={
    arrange:["✥","Arranging — drag pictures and notes anywhere, even out into the margins. Amber handle tilts, ⋯ flips and layers."],
    draw:["✏️",host.editor
      ?"Drawing — draw on a picture or a note and the marks travel with it. Marks on the page itself are drawn where you read it."
      :"Drawing — marks stick to whatever you draw them on: the page, a picture, or a note."],
    tag:["🏷","Tagging — click any word, or drag a phrase, to turn it into a keyword."]
  };
  function renderModeBar(){
    const b=q("#modeBar"),info=MODE_HELP[mode];
    if(!b)return;
    if(!info){b.hidden=true;b.innerHTML="";return;}
    b.hidden=false;
    b.innerHTML=`<span>${info[0]}</span><b>${esc(info[1])}</b><button class="btn" id="modeDone">Done</button>`;
    q("#modeDone").onclick=()=>setMode("write");
  }
  function applyMode(){
    page.classList.toggle("arr",mode==="arrange");
    page.classList.toggle("draw",mode==="draw");
    page.classList.toggle("tagmode",mode==="tag");
    page.classList.toggle("edform",!!host.editor);   /* hides the whole-page marks */
    qa("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
    const db=q("#dbar");if(db)db.hidden=mode!=="draw";
    renderModeBar();
    setDrawUI();          /* the shared colour strip follows the mode */
  }
  function setMode(m){
    mode=(mode===m)?"write":m;                 /* tapping the active mode leaves it */
    /* Fit stacks everything into a column — there's nothing to drag or draw on in
       that. Asking to arrange or draw means asking for the free page back. */
    if((mode==="arrange"||mode==="draw")&&fitScreen){
      fitScreen=false;settings.fit=false;saveSettings();applyFit();
    }
    applyMode();
    renderPads();                              /* notes are writable only outside arrange */
    syncDraw();
  }
  qa("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

  /* fit-to-screen: reflow the free canvas into a readable stack */
  function applyFit(){
    page.classList.toggle("fit",fitScreen);
    const btn=q("#edFit");if(btn)btn.classList.toggle("on",fitScreen);
    if(fitScreen)page.style.minHeight="";else pageMin();
    syncDraw();
  }
  const fitBtn=q("#edFit");
  if(fitBtn)fitBtn.onclick=()=>{
    fitScreen=!fitScreen;settings.fit=fitScreen;saveSettings();
    if(fitScreen&&mode!=="write")setMode("write");   /* free-placement modes don't apply when stacked */
    applyFit();
  };
  /* One colour strip, not two: it means text colour while you're writing and ink
     while you're drawing, and swaps to the muted set for the highlighter. On the
     reading page there is no writing to colour, so it is ink or it is nothing. */
  function renderColStrip(){
    const strip=q("#colStrip");if(!strip)return;
    const drawing=mode==="draw";
    if(!drawing&&!host.editor){strip.innerHTML="";return;}
    const pal=drawing?(drawTool==="hl"?HL_SWATCHES:DRAW_SWATCHES):TEXT_COLORS;
    strip.innerHTML=pal.map(c=>`<button class="cdot" data-col="${c}" style="background:${c}" title="${drawing?"Ink":"Text"} colour"></button>`).join("");
    qa("[data-col]",strip).forEach(x=>x.onclick=()=>{
      if(mode==="draw"){drawColor=x.dataset.col;const w=q("#tcol");if(w)w.value=drawColor;}
      else if(host.editor){document.execCommand("styleWithCSS",false,true);document.execCommand("foreColor",false,x.dataset.col);}
    });
    const w=q("#tcol");if(w&&drawing)w.value=drawColor;
  }
  /* the reading page's colour box only ever means ink; the form's also means text
     colour, so the form wires its own and this leaves it alone */
  if(!host.editor){
    const tc=q("#tcol");
    if(tc)tc.addEventListener("input",e=>{drawColor=e.target.value;});
  }
  const addMenu=q("#addMenu");
  if(addMenu)q("#edAdd").onclick=e=>{e.stopPropagation();addMenu.hidden=!addMenu.hidden;};
  /* one listener, replaced on each render — the draw handler below already works
     this way. Adding a fresh anonymous one every render left hundreds behind,
     each keeping its dead copy of the page alive. */
  if(window.__addMenuDown)document.removeEventListener("pointerdown",window.__addMenuDown);
  window.__addMenuDown=e=>{
    if(!addMenu||!document.body.contains(addMenu))return;
    if(!e.target.closest||!e.target.closest("#addMenu,#edAdd"))addMenu.hidden=true;
  };
  document.addEventListener("pointerdown",window.__addMenuDown);
  if(addMenu)qa("button",addMenu).forEach(b=>b.addEventListener("click",()=>{addMenu.hidden=true;}));
  const imgBtn=q("#edImg");
  if(imgBtn)imgBtn.onclick=()=>q("#imgFile").click();
  /* pictures */
  q("#imgFile").onchange=e=>{[...e.target.files].forEach(addPicture);e.target.value="";};
  /* pasting used to be listened for on the page itself, which works in the form
     only because one of its writing boxes has the cursor — a paste is delivered
     to whatever is focused. On the reading page nothing is, so it went to the
     document and the page never heard it. Listened for on the document, both
     pages get it, and the form still gets it while you are typing. Replaced each
     render rather than added, the same as the drawing handler below. */
  if(window.__scrapPaste)document.removeEventListener("paste",window.__scrapPaste);
  window.__scrapPaste=e=>{
    if(!document.body.contains(page)){document.removeEventListener("paste",window.__scrapPaste);window.__scrapPaste=null;return;}
    if(activeBgPicker)return;   /* background picker is open — let it take the image */
    if(!host.editor&&!viewArrange)return;   /* not while you are only reading */
    for(const it of e.clipboardData?.items||[]){
      if(it.type.startsWith("image/")){e.preventDefault();addPicture(it.getAsFile());return;}}
  };
  document.addEventListener("paste",window.__scrapPaste);

  async function addPicture(file){
    if(!file||!file.type.startsWith("image/"))return;
    let data;try{data=await compressImage(file);}catch(err){alert("That image couldn't be read.");return;}
    const baseY=scrapDropY(page);
    const im={id:uid(),x:30+(cur.images.length*26)%180,y:baseY+(cur.images.length*18)%90,w:240,behind:false};
    try{await dbPut("images",{key:cur.id+"|"+im.id,data});}catch(err){alert("That image couldn't be saved.");return;}
    curImgs[im.id]=data;cur.images.push(im);
    if(SYNC.on)enqueue({kind:"img",key:cur.id+"|"+im.id});
    /* on the reading page, hand over the move tool so you can place it straight
       away. In the form there is nothing to place — it joins the row, and you
       put it where you want it on the page you read. */
    if(!host.editor&&mode!=="arrange")setMode("arrange");
    renderImages();scheduleSave();
  }

  function pageMin(){
    if(fitScreen){page.style.minHeight="";return;}
    const hs=[...cur.images.map(i=>i.y+i.w*1.2+160),...(cur.pads||[]).map(p=>p.y+p.h+160)];
    if(!hs.length){page.style.minHeight="";return;}
    page.style.minHeight=Math.max(...hs)+"px";
  }

  /* ---- drawing ----
     A stroke belongs to whatever it was started on: a picture, a note, or the page.
     Picture/note strokes are kept 0..1 so they travel and scale with their surface. */
  function surfaceOf(e){
    const pad=e.target.closest?e.target.closest(".pad"):null;
    if(pad)return {kind:"pad",el:pad,obj:(cur.pads||[]).find(x=>x.id===pad.dataset.pad)};
    const sc=e.target.closest?e.target.closest(".scrap"):null;
    if(sc)return {kind:"img",el:sc,obj:(cur.images||[]).find(x=>x.id===sc.dataset.im)};
    return {kind:"page",el:page,obj:null};
  }
  /* ---- the two kinds of pixel, and why they are not the same ----
     Bigger text is done by putting a CSS zoom on #app, so at 130% everything
     inside is drawn a third larger than it is measured. That leaves two rulers
     in play. A pointer's clientX/clientY, and anything from
     getBoundingClientRect, are SCREEN pixels — already multiplied by the zoom.
     Everything stored and laid out inside — offsetWidth, a picture's x and y, a
     mark's points — is in the page's own pixels, which are not.

     Mixing them is what put marks away from the finger. A press 340 screen-pixels
     from the page's corner was written down as 340 of the page's own pixels, and
     the page then drew it 340 x 1.3 = 442 screen-pixels along. The error is a
     third of however far you are from the top-left corner, which is why it was a
     couple of millimetres near the corner — the miss in the video — and 103px
     down beside the summary, and why it never once happened at 100%.

     So: every distance taken from a pointer is divided by this before being
     written down, and nothing measured with getBoundingClientRect is ever
     compared against a stored number without passing through it. */
  const zoomNow=()=>{
    const r=page.getBoundingClientRect(),w=page.offsetWidth||r.width||1;
    const z=(r.width||w)/w;
    return (z>0.05&&z<20)?z:1;      /* a hidden page measures 0 — don't divide by that */
  };
  /* layout size, not the tilted bounding box — offsetWidth is already in the
     page's own pixels, which is the ruler strokes are stored against */
  const surfScale=surf=>surf.kind==="page"?[1,1]:[surf.el.offsetWidth||1,surf.el.offsetHeight||1];
  /* undo the surface's tilt/flip so a mark lands under the pointer */
  function surfPt(surf,cx,cy){
    const el=surf.el,r=el.getBoundingClientRect(),z=zoomNow();
    if(surf.kind==="page")return [(cx-r.left)/z,(cy-r.top)/z];
    const w=el.offsetWidth||r.width/z||1,h=el.offsetHeight||r.height/z||1;
    const ox=r.left+r.width/2,oy=r.top+r.height/2;
    const o=surf.obj||{};
    const th=-(o.rot||0)*Math.PI/180;
    /* screen pixels out of the pointer, the page's own pixels in — the turn and
       the flips are angles and signs, which no amount of zoom changes */
    const dx=(cx-ox)/z,dy=(cy-oy)/z;
    let lx=dx*Math.cos(th)-dy*Math.sin(th),ly=dx*Math.sin(th)+dy*Math.cos(th);
    if(o.flipH)lx=-lx;
    if(o.flipV)ly=-ly;
    const cl=v=>Math.max(0,Math.min(1,v));
    return [cl((lx+w/2)/w),cl((ly+h/2)/h)];
  }
  function strokeStore(surf){
    if(surf.kind==="page"){cur.draw=cur.draw||[];return cur.draw;}
    if(surf.kind==="pad"){const p=cur.pads.find(x=>x.id===surf.el.dataset.pad);if(!p)return null;p.draw=p.draw||[];return p.draw;}
    const im=cur.images.find(x=>x.id===surf.el.dataset.im);if(!im)return null;im.draw=im.draw||[];return im.draw;
  }
  function paintSurface(el,strokes){
    const svg=q(".dsvg",el);if(!svg)return;
    const W=el.clientWidth,H=el.clientHeight;
    if(!W||!H)return;
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    svg.innerHTML=drawSvgHtml(strokes,W,H);
  }
  function syncDraw(){
    const il=q("#imgLayer"),pl=q("#padLayer"),dl=q("#drawLayer");
    if(il)qa(".scrap",il).forEach(el=>{const im=cur.images.find(x=>x.id===el.dataset.im);if(im)paintSurface(el,im.draw);});
    if(pl)qa(".pad",pl).forEach(el=>{const p=(cur.pads||[]).find(x=>x.id===el.dataset.pad);if(p)paintSurface(el,p.draw);});
    if(dl)dl.innerHTML=drawSvgHtml(cur.draw,1,1);
  }
  /* ---- the readout ----
     Twice now a mark has been reported landing away from the finger, or the
     rubber refusing to bite, and neither could be made to happen here — drawing
     measured exact to the pixel, scrolled or not. Rather than ship a third guess,
     the draw bar now says what actually happened on the machine it happened on:
     which surface the mark went to, how far it ended up from where you pressed,
     and — when nothing is rubbed out — how near the closest mark really was
     against how near it needed to be. */
  const SURF_NAME={page:"the page",img:"a picture",pad:"a note"};
  function sayDraw(msg){const el=q("#drawSay");if(el)el.textContent=msg||"";}
  const boxGap=(r,x,y)=>Math.round(Math.hypot(Math.max(r.left-x,0,x-r.right),Math.max(r.top-y,0,y-r.bottom)));
  function startStroke(e){
    const surf=surfaceOf(e);
    const store=strokeStore(surf);
    if(!store)return;
    const [sx,sy]=surfScale(surf);
    const where=SURF_NAME[surf.kind]||surf.kind;
    /* the form doesn't show marks on the page, so it mustn't make them either —
       drawing into something you can't see, at a spot that means somewhere else
       entirely, is how the mark beside your summary ended up beside DNF */
    if(surf.kind==="page"&&!pageMarks()){
      sayDraw("Marks on the page itself are made where you read the book — they sit beside your writing there, and this form puts different things in the same spot. Pictures and notes you can draw on right here.");
      return;
    }
    if(drawTool==="erase"){
      const px=surfPt(surf,e.clientX,e.clientY);
      const at=[px[0]*sx,px[1]*sy];
      /* topmost first, so two marks equally near resolve to the one lying on top */
      let hit=null,best=Infinity;
      for(let i=store.length-1;i>=0;i--){
        const d=strokeDist(store[i],at,sx,sy);
        if(d<best){best=d;hit=store[i];}
      }
      const reach=hit?strokeReach(hit):ERASE_GRAB;
      if(hit&&best<=reach){
        store.splice(store.indexOf(hit),1);syncDraw();scheduleSave();
        sayDraw(`Rubbed out a mark on ${where} — it was ${Math.round(best)}px from your finger.`);
      }else if(!store.length){
        sayDraw(`Nothing to rub out: there are no marks on ${where}.`);
      }else{
        sayDraw(`Nothing rubbed out. ${store.length} mark${store.length>1?"s":""} on ${where}, nearest ${Math.round(best)}px away — needs to be within ${reach}px.`);
      }
      return;
    }
    e.preventDefault();
    const downX=e.clientX,downY=e.clientY;
    const s={t:drawTool,c:drawColor,w:drawWidth,pts:[surfPt(surf,e.clientX,e.clientY)]};
    if(drawTool==="hl")s.o=hlAlpha;      /* each highlight keeps the dimness it was drawn with */
    store.push(s);
    /* while the pen is down, repaint only the stroke being drawn on only its own
       surface — everything already drawn is rendered once, here, and reused.
       Redrawing every mark on the page for every point made the pen lag behind
       the finger in exact proportion to how much was already drawn. */
    const isPage=surf.kind==="page";
    const others=store.filter(x=>x!==s);
    const sW=isPage?1:(surf.el.clientWidth||1),sH=isPage?1:(surf.el.clientHeight||1);
    const base=drawSvgHtml(others,sW,sH);
    const paintOne=()=>{
      if(isPage){const dl=q("#drawLayer");if(dl)dl.innerHTML=base+drawSvgHtml([s],1,1);}
      else{const svg=q(".dsvg",surf.el);if(svg){svg.setAttribute("viewBox",`0 0 ${sW} ${sH}`);svg.innerHTML=base+drawSvgHtml([s],sW,sH);}}
    };
    const mv=ev=>{
      const p=surfPt(surf,ev.clientX,ev.clientY);
      if(s.t==="pen"||s.t==="hl")s.pts.push(p);else s.pts[1]=p;
      paintOne();
    };
    const up=()=>{
      window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
      if(s.pts.length<2)s.pts.push([...s.pts[0]]);
      syncDraw();scheduleSave();
      /* measure the mark as drawn, on screen, against where the pen went down —
         the one number that settles "it lands somewhere else" either way */
      const svg=isPage?q("#drawLayer"):q(".dsvg",surf.el);
      const kid=svg&&svg.children.length?svg.children[svg.children.length-1]:null;
      const gap=kid?boxGap(kid.getBoundingClientRect(),downX,downY):null;
      sayDraw(gap==null?`Drew on ${where}.`
        :gap<=2?`Drew on ${where} — the mark is under your finger.`
        :`Drew on ${where} — but the mark landed ${gap}px away from your finger.`);
    };
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  }
  /* #edPage is only the middle text column, so listening on it left the empty
     margins undrawable — listen on the window instead and let page strokes run
     past the column's edges (they're stored relative to it, negatives included) */
  if(window.__drawDown)document.removeEventListener("pointerdown",window.__drawDown);
  /* the highlighter's two text modes need writing you can select, which only the
     form has — on the reading page the highlighter is always the freehand one,
     without touching the choice you made in the form */
  const overText=()=>host.editor&&drawTool==="hl"&&hlMode!=="free";
  window.__drawDown=e=>{
    if(mode!=="draw")return;
    if(overText())return;   /* those work on selected text instead */
    if(!document.body.contains(page)){document.removeEventListener("pointerdown",window.__drawDown);window.__drawDown=null;return;}
    const t=e.target;
    if(t&&t.closest&&t.closest(".edbar,.bgpanel,.modebar,.imenu,.sbar,.pbar"))return;
    startStroke(e);
  };
  document.addEventListener("pointerdown",window.__drawDown);
  function setDrawUI(){
    qa("[data-dt]").forEach(b=>b.classList.toggle("on",b.dataset.dt===drawTool));
    const isHl=drawTool==="hl";
    const hw=q("#hlWrap");if(hw)hw.hidden=!isHl;
    const hm=q("#hlModeWrap");if(hm)hm.hidden=!isHl||!host.editor;
    qa("[data-hlm]").forEach(b=>b.classList.toggle("on",b.dataset.hlm===hlMode));
    /* working on text needs the writing selectable again, and the pen out of the way */
    page.classList.toggle("hlsel",mode==="draw"&&overText());
    renderColStrip();
  }
  qa("[data-hlm]").forEach(b=>b.onclick=()=>{hlMode=b.dataset.hlm;setDrawUI();});
  qa("[data-dt]").forEach(b=>b.onclick=()=>{
    const was=drawTool;drawTool=b.dataset.dt;
    /* the pen's inks go muddy once washed out, so swap palettes with the tool —
       unless you'd picked your own colour from the wheel */
    if(drawTool==="hl"&&was!=="hl"&&DRAW_SWATCHES.indexOf(drawColor)>=0)drawColor=HL_SWATCHES[0];
    else if(drawTool!=="hl"&&was==="hl"&&HL_SWATCHES.indexOf(drawColor)>=0)drawColor=DRAW_SWATCHES[0];
    setDrawUI();
  });
  const dwIn=q("#dw");if(dwIn)dwIn.oninput=e=>{drawWidth=+e.target.value;};
  const hlIn=q("#hlDim");if(hlIn)hlIn.oninput=e=>{hlAlpha=+e.target.value/100;};
  const dcl=q("#dclear");
  if(dcl){
    /* in the form this must not touch the marks on the page — they aren't shown
       here, and rubbing out things you can't see is no kind of Clear all */
    dcl.title=pageMarks()?"Rub out every mark in this book":"Rub out the marks on this book's pictures and notes";
    dcl.onclick=()=>{
      if(!confirm(pageMarks()
        ?"Rub out every mark on this page, its pictures and its notes? The Undo button can bring them back."
        :"Rub out the marks on this book's pictures and notes? The marks on the page itself are left alone — they belong to the page you read, and aren't shown here. The Undo button can bring these back."))return;
      if(pageMarks())cur.draw=[];
      (cur.images||[]).forEach(im=>im.draw=[]);
      (cur.pads||[]).forEach(p=>p.draw=[]);
      syncDraw();scheduleSave();
    };
  }
  setDrawUI();

  /* ---- how far left/right things may roam ----
     x stays measured from the text column's left edge (so nothing already placed
     moves), but the range now reaches the whole window — including the empty
     margins either side. On a phone the margins are ~0, so it collapses to the
     column by itself and nothing ends up off-screen. */
  function xRange(w){
    const r=page.getBoundingClientRect(),z=zoomNow();
    /* r.left and innerWidth are screen pixels; w and the x we're bounding are the
       page's own. Divide the screen ones through, or at 130% the margins are
       reported a third wider than they are and things stray off the edge. */
    const lo=(-r.left)/z+8;
    const hi=(window.innerWidth-r.left)/z-(w||0)-8;   /* whole item stays in view — no sideways scrollbar */
    return [lo,Math.max(lo,hi)];
  }
  /* render-time only: keeps a desktop-placed item reachable on a narrow phone
     without rewriting what you actually chose. The allowance matters — the range
     depends on the window width, which changes by a scrollbar's worth when the
     page grows, and clamping to it every render nudged things off their spot. */
  function cx(v,w){
    const x=v||0,[lo,hi]=xRange(w);
    return (x<lo-40||x>hi+40)?Math.max(lo,Math.min(hi,x)):x;
  }

  /* ---- cut the background out of a picture ---- */
  function openCut(im){
    const key=cur.id+"|"+im.id;
    const orig=curImgs[im.id];
    if(!orig){alert("That picture isn't loaded yet.");return;}
    const box=q("#cutPanel");box.hidden=false;
    let tol=32,trim=true,result=null,busy=false,applied=false;
    box.innerHTML=`<div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">Cut out the background</b>
        <button class="btn" id="cutX" style="margin-left:auto;padding:4px 10px">Close</button></div>
      <div class="cutprev" id="cutPrev"><span class="none">Working…</span></div>
      <div class="opac">Amount <input type="range" id="cutTol" min="4" max="120" value="${tol}"><b id="cutTolV" style="width:34px;text-align:right">${tol}</b></div>
      <label class="chk" style="margin-top:8px;font-size:13px"><input type="checkbox" id="cutTrim" checked> Trim the empty edges away</label>
      <div class="hint" id="cutMsg" style="margin:9px 0 0">Works best when the background is one flat colour. Busy photos won't cut cleanly.</div>
      <div class="hrow2" style="margin-top:11px"><button class="btn pri" id="cutApply">Use this</button>
        <button class="btn" id="cutBack" hidden>Put the original back</button></div>`;
    const prev=q("#cutPrev",box),msg=q("#cutMsg",box);
    const run=async()=>{
      if(busy)return;busy=true;
      try{
        result=await cutOutImage(orig,tol,trim);
        prev.innerHTML=`<img src="${result.data}">`;
        msg.textContent=`Removed about ${result.pct}% of the picture — now ${result.w}×${result.h}. Drag Amount if it took too much or too little.`;
      }catch(err){
        result=null;prev.innerHTML='<span class="none">Nothing left</span>';
        msg.textContent=err.message||"That didn't work.";
      }
      busy=false;
    };
    let t=null;
    const later=()=>{clearTimeout(t);t=setTimeout(run,180);};
    q("#cutTol",box).oninput=e=>{tol=+e.target.value;q("#cutTolV",box).textContent=tol;later();};
    q("#cutTrim",box).onchange=e=>{trim=e.target.checked;later();};
    q("#cutX",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
    q("#cutApply",box).onclick=async()=>{
      if(!result)return;
      im.cut=Date.now();          /* a real change, so the book saves and other devices re-pull this picture */
      await dbPut("images",{key,data:result.data,v:im.cut});
      curImgs[im.id]=result.data;
      if(SYNC.on)enqueue({kind:"img",key});
      applied=true;q("#cutBack",box).hidden=false;
      renderImages();scheduleSave();
      msg.textContent="Done. Not right? Put the original back, or close this.";
    };
    q("#cutBack",box).onclick=async()=>{
      if(!applied)return;
      im.cut=Date.now();
      await dbPut("images",{key,data:orig,v:im.cut});
      curImgs[im.id]=orig;
      if(SYNC.on)enqueue({kind:"img",key});
      renderImages();scheduleSave();
      q("#cutBack",box).hidden=true;applied=false;
      msg.textContent="Original put back.";
    };
    run();
  }

  /* ---- crop: drag a box over the part worth keeping ---- */
  function openCrop(im){
    const key=cur.id+"|"+im.id;
    const orig=curImgs[im.id];
    if(!orig){alert("That picture isn't loaded yet.");return;}
    const box=q("#cropPanel");box.hidden=false;
    let sel=null,applied=false;      /* sel is 0..1 of the picture */
    box.innerHTML=`<div class="hrow2" style="margin-bottom:9px"><b style="font-size:13px">⬚ Crop</b>
        <button class="btn" id="crX" style="margin-left:auto;padding:4px 10px">Close</button></div>
      <div class="hint" style="margin:0 0 8px">Drag a box over the part you want to keep. Everything outside it is trimmed away.</div>
      <div id="crStage" style="position:relative;display:inline-block;max-width:100%;touch-action:none;cursor:crosshair">
        <img id="crImg" src="${orig}" style="max-width:100%;max-height:300px;display:block;border-radius:8px">
        <div id="crSel" hidden style="position:absolute;border:2px solid #14b8a6;background:rgba(20,184,166,.18);pointer-events:none"></div>
      </div>
      <div class="hint" id="crMsg" style="margin:8px 0 0">Nothing selected yet.</div>
      <div class="hrow2" style="margin-top:9px">
        <button class="btn pri" id="crDo" disabled>Keep this part</button>
        <button class="btn" id="crClr" disabled>Clear</button>
        <button class="btn" id="crBack" hidden>Put the original back</button>
      </div>`;
    const stage=q("#crStage",box),selEl=q("#crSel",box),msg=q("#crMsg",box);
    const paint=()=>{
      const r=q("#crImg",box).getBoundingClientRect(),s=stage.getBoundingClientRect();
      if(!sel){selEl.hidden=true;return;}
      selEl.hidden=false;
      selEl.style.left=(r.left-s.left+sel.x*r.width)+"px";
      selEl.style.top=(r.top-s.top+sel.y*r.height)+"px";
      selEl.style.width=(sel.w*r.width)+"px";
      selEl.style.height=(sel.h*r.height)+"px";
    };
    stage.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const r=q("#crImg",box).getBoundingClientRect();
      const cl=v=>Math.max(0,Math.min(1,v));
      const x0=cl((e.clientX-r.left)/r.width),y0=cl((e.clientY-r.top)/r.height);
      const mv=ev=>{
        const x1=cl((ev.clientX-r.left)/r.width),y1=cl((ev.clientY-r.top)/r.height);
        sel={x:Math.min(x0,x1),y:Math.min(y0,y1),w:Math.abs(x1-x0),h:Math.abs(y1-y0)};
        paint();
      };
      const up=()=>{
        window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        const ok=sel&&sel.w>.02&&sel.h>.02;
        if(!ok){sel=null;paint();}
        q("#crDo",box).disabled=!ok;q("#crClr",box).disabled=!ok;
        msg.textContent=ok?`Keeping about ${Math.round(sel.w*100)}% across and ${Math.round(sel.h*100)}% down.`
          :"Drag a bigger box — that one was too small.";
      };
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    });
    q("#crClr",box).onclick=()=>{sel=null;paint();q("#crDo",box).disabled=true;q("#crClr",box).disabled=true;msg.textContent="Nothing selected yet.";};
    q("#crX",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
    q("#crDo",box).onclick=()=>{
      if(!sel)return;
      const img=new Image();
      img.onload=async()=>{
        const W=img.naturalWidth,H=img.naturalHeight;
        const sx=Math.round(sel.x*W),sy=Math.round(sel.y*H);
        const sw=Math.max(1,Math.round(sel.w*W)),sh=Math.max(1,Math.round(sel.h*H));
        const c=document.createElement("canvas");c.width=sw;c.height=sh;
        c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
        /* keep PNG if it was one — a cut-out picture's transparency must survive */
        const png=/^data:image\/png/i.test(orig);
        const data=png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.88);
        im.cut=Date.now();
        try{await dbPut("images",{key,data,v:im.cut});}
        catch(err){alert("That didn't fit — storage may be full.");return;}
        curImgs[im.id]=data;
        if(SYNC.on)enqueue({kind:"img",key});
        applied=true;q("#crBack",box).hidden=false;
        sel=null;paint();
        q("#crDo",box).disabled=true;q("#crClr",box).disabled=true;
        const ci=q("#crImg",box);if(ci)ci.src=data;
        msg.textContent=`Cropped to ${sw}×${sh}. Crop again, or close.`;
        renderImages();scheduleSave();
      };
      img.onerror=()=>{msg.textContent="That picture couldn't be read.";};
      img.src=curImgs[im.id];
    };
    q("#crBack",box).onclick=async()=>{
      if(!applied)return;
      im.cut=Date.now();
      await dbPut("images",{key,data:orig,v:im.cut});
      curImgs[im.id]=orig;
      if(SYNC.on)enqueue({kind:"img",key});
      const ci=q("#crImg",box);if(ci)ci.src=orig;
      q("#crBack",box).hidden=true;applied=false;sel=null;paint();
      msg.textContent="Original put back.";
      renderImages();scheduleSave();
    };
  }

  /* only one item's ⋯ menu open at a time */
  function closeItemMenus(except){
    qa(".imenu",page).forEach(m=>{if(m!==except)m.hidden=true;});
  }
  page.addEventListener("pointerdown",e=>{if(!e.target.closest(".imenu,.smore,.pmore"))closeItemMenus(null);});

  /* ---- stacking: pictures and notes share one order, so either can sit on top ---- */
  const zOf=o=>o.z||0;
  const allItems=()=>[...(cur.images||[]),...(cur.pads||[])];
  function normZ(){
    allItems().sort((a,b)=>zOf(a)-zOf(b)).forEach((o,i)=>o.z=i);
  }
  function toFront(o){o.z=1e6;normZ();renderImages();renderPads();scheduleSave();}
  function toBack(o){o.z=-1e6;normZ();renderImages();renderPads();scheduleSave();}

  /* drag the amber handle to tilt; double-click it to straighten. Shift snaps to 15°. */
  function startRot(handle,el,obj){
    if(!handle)return;
    handle.ondblclick=e=>{e.stopPropagation();obj.rot=0;el.style.transform=xform(obj);syncDraw();scheduleSave();};
    handle.addEventListener("pointerdown",e=>{
      if(mode!=="arrange")return;
      e.preventDefault();e.stopPropagation();
      const r=el.getBoundingClientRect();
      const ox=r.left+r.width/2,oy=r.top+r.height/2;
      const a0=Math.atan2(e.clientY-oy,e.clientX-ox),r0=obj.rot||0;
      const mv=ev=>{
        let deg=r0+(Math.atan2(ev.clientY-oy,ev.clientX-ox)-a0)*180/Math.PI;
        if(ev.shiftKey)deg=Math.round(deg/15)*15;
        obj.rot=Math.round(deg*10)/10;
        el.style.transform=xform(obj);
      };
      const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        syncDraw();scheduleSave();};
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    });
  }

  /* notepad pages */
  function addPad(){
    cur.pads=cur.pads||[];
    const baseY=scrapDropY(page);
    const n=cur.pads.length;
    const p={id:uid(),x:30+(n*26)%180,y:baseY+(n*18)%90,w:220,h:170,
      skin:settings.lastPadSkin||"yellow",shape:settings.lastPadShape||"none",html:""};
    cur.pads.push(p);
    renderPads();scheduleSave();
    if(mode!=="arrange"){const t=q(`[data-pad="${p.id}"] .padtext`);if(t)t.focus();}
  }
  function renderPads(){
    cur.pads=cur.pads||[];
    const layer=q("#padLayer");
    /* same as the pictures: written and kept in a row in the form, placed on the
       page you read them on */
    layer.classList.toggle("strip",!!host.editor);
    const nc=q("#secPads"),nh=q("#padsHint");
    if(nc)nc.hidden=!cur.pads.length;
    if(nh)nh.hidden=!cur.pads.length;
    layer.innerHTML=cur.pads.map(p=>{
      const sh=shapeOf(p);
      return `<div class="pad" data-pad="${p.id}" style="left:${cx(p.x,p.w)}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;transform:${xform(p)};z-index:${10+Math.min(34,zOf(p))}">
        <div class="padshape ${sh!=="none"?"shaped":""}" style="${padStyle(p.skin)}${sh!=="none"?`;clip-path:url(#pc-${sh})`:""}">
          <div class="padtext" contenteditable="${padWritable()?"true":"false"}" data-ph="Write a note…" style="padding:${shapeInset(sh)}%"></div>
          <svg class="dsvg" preserveAspectRatio="none"></svg>
        </div>
        <div class="pbar ${p.y<46?"below":""}">
          <button class="pskin" title="Change its look and shape">🎨</button>
          <button class="pmore" title="Flip, layer…">⋯</button>
          <button class="pdel" title="Delete this note">✕</button>
        </div>
        <div class="imenu" hidden>
          <button class="pflh">⇄ Flip across</button>
          <button class="pflv">⇅ Flip upside down</button>
          <button class="pfront">⬆ Bring to front</button>
          <button class="pback">⬇ Send to back</button>
        </div>
        <div class="rot" title="Drag to tilt · double-click to straighten"></div>
        <div class="prs"></div>
      </div>`;}).join("");
    qa(".pad",layer).forEach(el=>{
      const p=cur.pads.find(x=>x.id===el.dataset.pad);
      const tx=q(".padtext",el);
      tx.innerHTML=p.html||"";
      tx.addEventListener("input",()=>{p.html=tx.innerHTML;scheduleSave();});
      q(".pdel",el).onclick=e=>{e.stopPropagation();
        cur.pads=cur.pads.filter(x=>x.id!==p.id);renderPads();pageMin();scheduleSave();};
      const pmenu=q(".imenu",el);
      q(".pmore",el).onclick=e=>{e.stopPropagation();closeItemMenus(pmenu);pmenu.hidden=!pmenu.hidden;};
      q(".pflh",el).onclick=e=>{e.stopPropagation();p.flipH=!p.flipH;el.style.transform=xform(p);pmenu.hidden=true;scheduleSave();};
      q(".pflv",el).onclick=e=>{e.stopPropagation();p.flipV=!p.flipV;el.style.transform=xform(p);pmenu.hidden=true;scheduleSave();};
      q(".pfront",el).onclick=e=>{e.stopPropagation();toFront(p);};
      q(".pback",el).onclick=e=>{e.stopPropagation();toBack(p);};
      q(".pskin",el).onclick=e=>{e.stopPropagation();
        const bp=q("#bgPanel");if(bp){bp.hidden=true;bp.innerHTML="";}
        const bgb=q("#edBg");if(bgb)bgb.classList.remove("on");
        const box=q("#padPanel");box.hidden=false;
        drawPadPicker(box,p,()=>{settings.lastPadSkin=p.skin;settings.lastPadShape=p.shape;saveSettings();renderPads();scheduleSave();});
      };
      startRot(q(".rot",el),el,p);
      /* `how` is "drag" or "resize" — do NOT name it `mode`, that's the editor's mode */
      const startDrag=(e,how)=>{
        if(mode!=="arrange")return;
        if(layer.classList.contains("strip"))return;   /* placed on the reading page instead */
        if(e.target.closest(".pbar"))return;
        e.preventDefault();
        const sx=e.clientX,sy=e.clientY,x=cx(p.x,p.w),y=p.y,w=p.w,h=p.h;
        const [loX,hiX]=xRange(p.w);
        /* how far the pointer has travelled, in the page's own pixels rather than
           the screen's — otherwise at 130% a note runs a third ahead of the hand */
        const z=zoomNow();
        const mv=ev=>{
          const mx=(ev.clientX-sx)/z,my=(ev.clientY-sy)/z;
          if(how==="drag"){p.x=Math.min(hiX,Math.max(loX,x+mx));p.y=Math.max(0,y+my);}
          else{p.w=Math.max(90,Math.min(1200,w+mx));p.h=Math.max(70,Math.min(1400,h+my));}
          el.style.left=p.x+"px";el.style.top=p.y+"px";el.style.width=p.w+"px";el.style.height=p.h+"px";};
        const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);pageMin();syncDraw();scheduleSave();};
        window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);};
      el.addEventListener("pointerdown",e=>{
        if(e.target.closest(".prs"))startDrag(e,"resize");else startDrag(e,"drag");});
    });
    pageMin();
    syncDraw();
  }
  const padBtn=q("#edPad");
  if(padBtn)padBtn.onclick=addPad;
  function renderImages(){
    const layer=q("#imgLayer");
    /* In the form a picture sits in the flow, under Pictures, rather than
       floating over it. The two pages are not the same page — the form pushes
       your writing a thousand pixels further down than the reading view does —
       so a picture placed against the text here landed on the text there. On the
       reading page it stands exactly where you put it, which is the whole point
       of putting it there. */
    layer.classList.toggle("strip",!!host.editor);
    const pc=q("#secPics"),ph=q("#picsHint");
    if(pc)pc.hidden=!cur.images.length;
    if(ph)ph.hidden=!cur.images.length;
    layer.innerHTML=cur.images.map(im=>curImgs[im.id]?`
      <div class="scrap ${im.behind?"bh":""}" data-im="${im.id}" style="left:${cx(im.x,im.w)}px;top:${im.y}px;width:${im.w}px;transform:${xform(im)};z-index:${10+Math.min(34,zOf(im))}">
        <img src="${curImgs[im.id]}" draggable="false">
        <svg class="dsvg" preserveAspectRatio="none"></svg>
        <div class="sbar ${im.y<46?"below":""}">

          <button class="smore" title="Flip, layer…">⋯</button>
          <button class="sdel" title="Delete this picture">✕</button>
        </div>
        <div class="imenu" hidden>
          <button class="sflh">⇄ Flip across</button>
          <button class="sflv">⇅ Flip upside down</button>
          <button class="sfront">⬆ Bring to front</button>
          <button class="sback">⬇ Send to back</button>
          <button class="scrop">⬚ Crop — keep part of it</button>
          <button class="scut">✂ Cut out background</button>
        </div>
        <div class="rot" title="Drag to tilt · double-click to straighten"></div>
        <div class="rs"></div>
      </div>`:"").join("");
    qa(".scrap",layer).forEach(el=>{
      const im=cur.images.find(i=>i.id===el.dataset.im);
      q(".sfade",el).onclick=e=>{e.stopPropagation();im.behind=!im.behind;renderImages();scheduleSave();};
      const smenu=q(".imenu",el);
      q(".smore",el).onclick=e=>{e.stopPropagation();closeItemMenus(smenu);smenu.hidden=!smenu.hidden;};
      q(".sflh",el).onclick=e=>{e.stopPropagation();im.flipH=!im.flipH;el.style.transform=xform(im);smenu.hidden=true;scheduleSave();};
      q(".sflv",el).onclick=e=>{e.stopPropagation();im.flipV=!im.flipV;el.style.transform=xform(im);smenu.hidden=true;scheduleSave();};
      q(".sfront",el).onclick=e=>{e.stopPropagation();toFront(im);};
      q(".sback",el).onclick=e=>{e.stopPropagation();toBack(im);};
      q(".scrop",el).onclick=e=>{e.stopPropagation();smenu.hidden=true;openCrop(im);};
      q(".scut",el).onclick=e=>{e.stopPropagation();smenu.hidden=true;openCut(im);};
      startRot(q(".rot",el),el,im);
      q(".sdel",el).onclick=e=>{e.stopPropagation();
        delete curImgs[im.id];
        if(SYNC.on)enqueue({kind:"imgDel",key:cur.id+"|"+im.id});
        cur.images=cur.images.filter(i=>i.id!==im.id);renderImages();scheduleSave();};
      /* `how` is "drag" or "resize" — do NOT name it `mode`, that's the editor's mode */
      const startDrag=(e,how)=>{
        if(mode!=="arrange")return;
        if(layer.classList.contains("strip"))return;   /* placed on the reading page instead */
        if(e.target.closest(".sbar"))return;
        e.preventDefault();
        const sx=e.clientX,sy=e.clientY,x=cx(im.x,im.w),y=im.y,w=im.w;
        const [loX,hiX]=xRange(im.w);
        /* the page's own pixels, not the screen's — see zoomNow */
        const z=zoomNow();
        const mv=ev=>{
          const mx=(ev.clientX-sx)/z,my=(ev.clientY-sy)/z;
          if(how==="drag"){im.x=Math.min(hiX,Math.max(loX,x+mx));im.y=Math.max(0,y+my);}
          else im.w=Math.max(60,Math.min(1400,w+mx));
          el.style.left=im.x+"px";el.style.top=im.y+"px";el.style.width=im.w+"px";};
        const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);pageMin();syncDraw();scheduleSave();};
        window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);};
      el.addEventListener("pointerdown",e=>{
        if(e.target.closest(".rs"))startDrag(e,"resize");else startDrag(e,"drag");});
      const im2=q("img",el);if(im2)im2.addEventListener("load",syncDraw);
    });
    pageMin();
    syncDraw();
  }
  renderImages();
  renderPads();
  applyMode();      /* restore the current mode's look after a re-render */
  applyFit();       /* and the fit-to-screen layout */
  return {renderImages,renderPads,syncDraw,setMode,applyMode,applyFit,pageMin,addPad,addPicture};
}

      genSel.forEach(g=>{

  /* fandoms + characters + link — only for fanfic and AI stories */
  function renderFF(){

    const allF=Object.keys(fandoms).sort((a,b)=>a.localeCompare(b));

    const firstF=cur.fandoms[0];

      <div>${pickable.map(c=>`<button class="rsn ${cur.characters.includes(c)?"on":""}" data-ch="${esc(c)}">${cur.characters.includes(c)?"✓ ":""}${esc(c)}</button>`).join("")}

    });

  /* the mark beside a collection: whose it is, and whether stories still lack one */

  /* a collection's own page count is the sum of its stories, once they all have one */
  function sumEntryPages(){
    const note=q("#pagesNote");
    const ens=isColl(cur)?(cur.entries||[]):[];
    const complete=ens.length&&ens.every(en=>parseInt(en.pages)>0);
    if(note)note.hidden=!complete;
    if(!complete)return;
    const total=ens.reduce((s,en)=>s+parseInt(en.pages),0);

  /* Genres for one story, and the same answer for as many of its neighbours as
     you like. Nothing ticked means the story keeps the collection's genres;
     ticking any replaces them for that story alone, which is what lets it show
     up under a heading the collection does not belong to. */
  function openEntGenres(id){
    const en=(cur.entries||[]).find(x=>x.id===id);if(!en)return;
    if(panelOpen("entGenPanel"))return;
    const wrap=document.createElement("div");
    wrap.id="entGenPanel";wrap.className="ratepanel";
    let sel=new Set(en.genres||[]);
    const also=new Set();
    const all=[...new Set([...Object.keys(genres),...(cur.genres||[])])].sort((a,b)=>a.localeCompare(b));
    /* this one asks to be saved, so closing it any other way is a cancel — the
       same as pressing Cancel, which is what it has always meant */
    let close=()=>wrap.remove();
    const apply=()=>{
      const list=[...sel];
      en.genres=list;
      also.forEach(i=>{const o=(cur.entries||[]).find(x=>x.id===i);if(o)o.genres=[...list];});
      close();renderEntries();scheduleSave();

        <div>${all.map(g=>{const c=genres[g]||"#78716c";
          return `<button class="mg${sel.has(g)?" on":""}" data-eg="${esc(g)}" style="${sel.has(g)?`background:${c};border-color:${c};color:${inkOn(c)}`:""}"><span class="bx">${sel.has(g)?"✓":""}</span>${esc(g)}</button>`;}).join("")
          ||'<span class="none">No genres exist yet — give the collection some first.</span>'}</div>
        ${(cur.entries||[]).length>1?`<div class="lbl" style="display:block;margin:12px 0 4px">Give the same to these as well</div>
          <div>${(cur.entries||[]).filter(x=>x.id!==en.id).map(x=>
            `<button class="mg${also.has(x.id)?" on":""}" data-ea="${esc(x.id)}"><span class="bx">${also.has(x.id)?"✓":""}</span>${esc(x.title)||"Untitled"}</button>`).join("")}</div>`:""}
        <div class="hrow2" style="margin-top:12px">
          <button class="btn pri" id="egSave">Save</button>
          <button class="btn" id="egClear">Back to the collection's</button>
        </div>`;
      q("#egClose",wrap).onclick=()=>close();
      qa("[data-eg]",wrap).forEach(b=>b.onclick=()=>{const g=b.dataset.eg;sel.has(g)?sel.delete(g):sel.add(g);draw();});
      qa("[data-ea]",wrap).forEach(b=>b.onclick=()=>{const i=b.dataset.ea;also.has(i)?also.delete(i):also.add(i);draw();});
      q("#egClear",wrap).onclick=()=>{sel=new Set();apply();};
