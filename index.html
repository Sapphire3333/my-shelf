/* ---- a picture at the head of a library group ---- */
const gartKey=id=>"__gart|"+id;
/* A group's picture is filed under the group's name, so renaming a genre used to
   orphan it. Renames carry it across now; this reunites any stranded earlier,
   matching the name ignoring case. Runs at boot and whenever the library draws,
   so it can't be missed. */
function repairGroupArt(){
  let moved=false;
  try{
    for(const k of Object.keys(groupArt)){
      const i=k.indexOf("|");if(i<0)continue;
      const kind=k.slice(0,i),label=k.slice(i+1);
      if(kind!=="genre"||genres[label])continue;
      const match=Object.keys(genres).find(g=>g.toLowerCase()===label.toLowerCase());
      if(match&&!groupArt[kind+"|"+match]){
        groupArt[kind+"|"+match]=groupArt[k];
        delete groupArt[k];moved=true;
      }
    }
  }catch(e){}
  if(moved)dbPut("meta",{k:"groupArt",v:groupArt});
  return moved;
}
function saveGroupArt(){dbPut("meta",{k:"groupArt",v:groupArt});enqueue({kind:"meta",key:"groupArt"});}
async function setGroupArt(key,file,maxDim){
  if(!file||!file.type.startsWith("image/"))return false;
  let data;try{data=await compressImage(file,maxDim||2000,.88);}catch(e){alert("That image couldn't be read.");return false;}
  const id=uid();
  try{await dbPut("images",{key:gartKey(id),data});}catch(e){alert("That picture couldn't be saved — storage may be full.");return false;}
  const old=groupArt[key];
  if(old&&old.img){await dbDel("images",gartKey(old.img));gartCache.delete(old.img);
    if(SYNC.on)enqueue({kind:"imgDel",key:gartKey(old.img)});}
  groupArt[key]={img:id,w:(old&&old.w)||100};
  unmarkMetaDel("gart:"+key);      /* deliberately back, so stop suppressing it */
  gartCache.set(id,data);saveGroupArt();
  if(SYNC.on)enqueue({kind:"img",key:gartKey(id)});
  return true;
}
async function clearGroupArt(key){
  const a=groupArt[key];if(!a)return;
  if(a.img){await dbDel("images",gartKey(a.img));gartCache.delete(a.img);
    if(SYNC.on)enqueue({kind:"imgDel",key:gartKey(a.img)});}

}

/* =============== the colour chooser, shared by genres and tags =============== */
/* Paints once and then only touches the swatches, so dragging the brightness
   slider or the wheel doesn't rebuild the control under your finger. */
function drawColorPicker(box,start,onChange,allowPlain){
  /* start where it already is: the colour it has now, or no colour at all */
  let base=(start&&/^#[0-9a-f]{3,6}$/i.test(start))?start:(allowPlain?null:PALETTE[0]);
  let muted=false,bright=100;
  /* untouched settings hand back exactly the colour we were given — no round-trip drift */
  const eff=()=>base==null?"":((!muted&&bright===100)?base:shadeOf(muted?mutedOf(base):base,bright));
  box.innerHTML=`
    <div class="hrow2" style="gap:6px;margin-bottom:8px">
      <button class="pill on" data-cpm="0">Bright</button>
      <button class="pill" data-cpm="1">Muted</button>
      ${allowPlain?`<button class="pill" data-cpplain="1">No colour</button>`:""}
      <span class="chip big" id="cpPrev" style="margin-left:auto">Preview</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${PALETTE.map(c=>`<button class="cdot" data-cpc="${c}" style="width:26px;height:26px"></button>`).join("")}
    </div>
    <div class="hrow2" style="margin-top:10px;gap:8px">
      <input type="color" id="cpWheel" value="${eff()}" title="Any colour you like">
      <span class="lbl">or pick any colour at all</span>
    </div>
    <div class="opac" style="margin-top:8px">Brightness
      <input type="range" id="cpB" min="55" max="145" value="100">
      <b id="cpBV" style="width:44px;text-align:right">100%</b></div>`;
  const refresh=()=>{
    const c=eff();
    const pv=q("#cpPrev",box);
    if(pv){
      pv.textContent=c?"Preview":"No colour";
      pv.style.background=c||"#e7e5e4";
      pv.style.color=c?inkOn(c):"#57534e";
    }
    qa("[data-cpc]",box).forEach(b=>{
      const bc=b.dataset.cpc;
      b.style.background=shadeOf(muted?mutedOf(bc):bc,bright);
      b.style.outline=bc===base?"2px solid var(--ink)":"";
      b.style.outlineOffset="2px";
    });
    qa("[data-cpm]",box).forEach(b=>b.classList.toggle("on",base!=null&&(b.dataset.cpm==="1")===muted));
    const pl=q("[data-cpplain]",box);if(pl)pl.classList.toggle("on",base==null);
    const bv=q("#cpBV",box);if(bv)bv.textContent=bright+"%";
    const w=q("#cpWheel",box);if(w&&document.activeElement!==w)w.value=c;
    if(onChange)onChange(c);
  };
  qa("[data-cpm]",box).forEach(b=>b.onclick=()=>{muted=b.dataset.cpm==="1";if(base==null)base=PALETTE[0];refresh();});
  qa("[data-cpc]",box).forEach(b=>b.onclick=()=>{base=b.dataset.cpc;refresh();});
  const plain=q("[data-cpplain]",box);
  if(plain)plain.onclick=()=>{base=null;muted=false;bright=100;
    const s=q("#cpB",box);if(s)s.value=100;refresh();};
  q("#cpWheel",box).oninput=e=>{base=e.target.value;muted=false;bright=100;
    const s=q("#cpB",box);if(s)s.value=100;refresh();};
  q("#cpB",box).oninput=e=>{bright=+e.target.value;refresh();};
  refresh();
  return eff;
}

/* =============== undo / redo =============== */
const HIST={undo:[],redo:[]};
function pushOp(op){HIST.undo.push(op);if(HIST.undo.length>50)HIST.undo.shift();HIST.redo=[];refreshHistBtns();}
function refreshHistBtns(){
  const u=q("#uBtn"),r=q("#rBtn");
  if(u)u.disabled=!HIST.undo.length;
  if(r)r.disabled=!HIST.redo.length;
}
async function applyOp(op,inv){
  if(op.t==="book"||op.t==="del"){
    const body=op.t==="del"?(inv?op.body:null):(inv?op.before:op.after);
    const id=op.t==="del"?op.body.id:op.id;
    const knownKeys=imgKeysOf((op.t==="del"?op.body:op.after)||null);
    if(body){
      const clone=JSON.parse(JSON.stringify(body));
      await dbPut("books",clone);
      const i=books.findIndex(x=>x.id===id);
      if(i>=0)books[i]=clone;else books.unshift(clone);
      if(SYNC.on){if(deletions[id]){delete deletions[id];saveDeletions();}enqueue({kind:"book",id});enqueue({kind:"cover",id});imgKeysOf(clone).forEach(key=>enqueue({kind:"img",key}));}
    }else{
      await dbDel("books",id);
      books=books.filter(x=>x.id!==id);
      if(SYNC.on){deletions[id]=Date.now();saveDeletions();enqueue({kind:"bookDel",id});enqueue({kind:"coverDel",id});knownKeys.forEach(key=>enqueue({kind:"imgDel",key}));}
    }
    if(view==="book"&&cur&&cur.id===id){
      if(!body){view="library";render();}else{openBook(id,false);}
      refreshHistBtns();return;
    }
  }
  if(op.t==="meta"){
    const v=inv?op.before:op.after;
    genres=JSON.parse(JSON.stringify(v.genres));
    dnfCustom=[...v.dnfCustom];audCustom=[...v.audCustom];
    metaSnap=JSON.stringify({genres,dnfCustom,audCustom});
    dbPut("meta",{k:"genres",v:genres});dbPut("meta",{k:"dnfReasons",v:dnfCustom});dbPut("meta",{k:"audiences",v:audCustom});
    enqueue({kind:"meta",key:"genres"});enqueue({kind:"meta",key:"dnfReasons"});enqueue({kind:"meta",key:"audiences"});
    if(view==="book"&&cur){openBook(cur.id,false);refreshHistBtns();return;}
  }
  render();refreshHistBtns();
}
async function doUndo(){const op=HIST.undo.pop();if(!op)return;HIST.redo.push(op);await applyOp(op,true);}
async function doRedo(){const op=HIST.redo.pop();if(!op)return;HIST.undo.push(op);await applyOp(op,false);}

/* =============== router =============== */
/* The phone's back button and the browser's arrow are the same gesture, and both
   used to leave the app outright. Each screen is now a step in the browser's own
   history, so back walks the app: form -> the book -> where you came from. */
let navRestoring=false;
function syncHistory(){
  if(navRestoring)return;
  const st={v:view,b:view==="book"&&cur?cur.id:null,m:view==="book"?bookMode:null};
  const h=history.state;
  if(h&&h.v===st.v&&h.b===st.b&&h.m===st.m)return;
  try{h?history.pushState(st,""):history.replaceState(st,"");}catch(e){}
}

/* what's worth jumping to depends on where you are: a book's parts, or the
   headings of however the library is grouped just now */
function fabSections(){
  const out=[];
  if(view==="book"){
    [["#secDetails","📖 The book itself"],["#entWrap","📚 What's inside"],["#secSummary","📝 Summary"],
     ["#secLists","➕ Liked & didn't"],["#secQuotes","❝ Quotes"],["#secNotes","🗒 Notes"]]

      label:(h.textContent||"").replace(/[▾▸🖼✓]/g," ").replace(/\s+/g," ").trim()}));

async function hydrateCovers(root){
  const els=qa("[data-cover]",root);
  const one=async el=>{
    const id=el.dataset.cover;
    let src=coverCache.get(id);
    if(src===undefined){const r=await dbGet("covers",id);src=r?r.data:null;coverCache.set(id,src);}
    if(src==null&&SYNC.on&&SYNC.user&&navigator.onLine&&!SYNC.triedCover.has(id)){
      SYNC.triedCover.add(id);
      try{const {data,error}=await SYNC.supa.storage.from("shelf").download(coverPath(id));
        if(!error&&data){src=await blobToDataURL(data);await dbPut("covers",{id,data:src});coverCache.set(id,src);}}catch(e){}
    }
    if(src){const overlays=[...el.children].map(c=>c.outerHTML).join("");el.innerHTML=`<img src="${src}">`+overlays;}
  };
  /* a few at a time — strictly one-by-one made big libraries paint covers slowly */
  for(let i=0;i<els.length;i+=6)await Promise.all(els.slice(i,i+6).map(one));
}

/* =============== author panel — see, tidy and group one author's books =============== */
/* Fold several existing books into ONE collection entry. Their notes, ratings,
   pages and covers become the collection's stories; their own pages go to the
   bin (30 days, restorable) so nothing shows up twice. */
/* turn an existing book into a collection entry — cover copied under the collection */
async function bookToEntry(b,collId){
  const en=blankEntry();
  en.title=b.title;en.rating=b.rating;en.pages=b.pages;
  en.summary=b.summary||"";en.notes=b.canvasText||"";
  let coverData=null;
  const cov=await dbGet("covers",b.id);
  if(cov&&cov.data){
    en.cover=true;en.coverV=Date.now();coverData=cov.data;
    try{await dbPut("images",{key:collId+"|"+en.id,data:cov.data,v:en.coverV});
      if(SYNC.on)enqueue({kind:"img",key:collId+"|"+en.id});}catch(e){en.cover=false;coverData=null;}
  }
  return {en,coverData};
}
/* a folded-away book loses its own page: bin (30 days) + synced deletion */
async function retireBook(b){
  await toTrash(b);
  await dbDel("books",b.id);
  books=books.filter(x=>x.id!==b.id);
  if(SYNC.on){deletions[b.id]=Date.now();saveDeletions();
    enqueue({kind:"bookDel",id:b.id});enqueue({kind:"coverDel",id:b.id});
    imgKeysOf(b).forEach(key=>enqueue({kind:"imgDel",key}));}
}
async function makeCollectionFrom(ids,name,author){
  const sel=ids.map(id=>books.find(b=>b.id===id)).filter(Boolean);
  if(!sel.length)return null;
  sel.sort((a,b)=>(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0)
    ||(a.dateFinished||"9999").localeCompare(b.dateFinished||"9999")||(a.created||0)-(b.created||0));
  const nb=blankBook(uid());
  nb.type="collection";nb.title=name;nb.series=name;
  nb.author=author||sel[0].author||"";
  nb.kind=kindOf(sel[0]);
  nb.genres=[...new Set(sel.flatMap(b=>b.genres||[]))];
  nb.keywords=[...new Set(sel.flatMap(b=>b.keywords||[]))].slice(0,20);
  nb.favorite=sel.some(b=>b.favorite);
  nb.status=sel.every(b=>statusOf(b)==="finished")?"finished":sel.some(b=>statusOf(b)==="reading")?"reading":"want";
  nb.dateFinished=sel.map(b=>b.dateFinished||"").sort().pop()||"";
  nb.entries=[];
  for(const b of sel)nb.entries.push((await bookToEntry(b,nb.id)).en);
  nb.modified=Date.now();
  await dbPut("books",nb);
  books.unshift(nb);
  if(SYNC.on)enqueue({kind:"book",id:nb.id});
  for(const b of sel)await retireBook(b);
  if(SYNC.on)flushQueue();
  return nb.id;
}
/* Link several existing books as a named series — each keeps its own page */
async function makeSeriesFrom(ids,name){
  /* a collection is already a named set of books — turning it into a series member
     would overwrite its own name and stop its stories counting individually */
  const sel=ids.map(id=>books.find(b=>b.id===id)).filter(b=>b&&!isColl(b));
  if(!sel.length)return 0;
  sel.sort((a,b)=>(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0)
    ||(a.dateFinished||"9999").localeCompare(b.dateFinished||"9999")||(a.created||0)-(b.created||0));
  let n=1;
  for(const b of sel){
    b.type="series";b.series=name;
    if(!b.seriesNum)b.seriesNum=String(n);
    if(!b.seriesTotal)b.seriesTotal=String(sel.length);
    n++;
    b.modified=Date.now();
    await dbPut("books",b);
    if(SYNC.on)enqueue({kind:"book",id:b.id});
  }
  if(SYNC.on)flushQueue();
  return sel.length;
}

    if(!confirm(`Fold ${authSel.size} books into “${nm.trim()}”?\n\nTheir own pages move to Recently deleted (Overview tab) — notes, ratings, pages and covers carry into the collection.`))return;
    const openId=view==="book"&&cur?cur.id:null;
    const nid=await makeCollectionFrom([...authSel],nm.trim(),name);
    authSel=new Set();
    if(openId&&!books.find(b=>b.id===openId))await openBook(nid,false);else render();
    renderAuthorPanel(name);
  };
  q("#apSer",box).onclick=async()=>{
    if(authSel.size<2)return;
    const nm=prompt("Series name — every ticked book keeps its page, linked under:","");
    if(nm==null||!nm.trim())return;
    const ids=[...authSel];
    await makeSeriesFrom(ids,nm.trim());
    authSel=new Set();
    if(view==="book"&&cur&&ids.includes(cur.id))await openBook(cur.id,false);else render();
    renderAuthorPanel(name);
  };
}

/* =============== library =============== */
const GROUPS=[["none","none"],["genre","genre"],["author","author"],["series","series"],["type","standalone / series / story"],["status","status"]];
const TYPES=[["standalone","Standalone"],["series","Part of a series"],["collection","Collections & their stories"]];
function sortCmp(a,b){
  if(sortBy==="newest")return(b.created||0)-(a.created||0);
  if(sortBy==="rating")return(b.rating??-1)-(a.rating??-1);
  if(sortBy==="title")return(a.title||"").localeCompare(b.title||"");
  if(sortBy==="author")return(a.author||"").localeCompare(b.author||"");
  if(sortBy==="status"){const rk=x=>x.dnf?1:statusOf(x)==="finished"?0:statusOf(x)==="want"?2:3;
    return rk(a)-rk(b)||(a.title||"").localeCompare(b.title||"");}
  if(sortBy==="genre"){const g=x=>((x.genres||[])[0]||"").toLowerCase();const ga=g(a),gb=g(b);
    if(ga&&!gb)return -1;if(!ga&&gb)return 1;
    return ga.localeCompare(gb)||(a.title||"").localeCompare(b.title||"");}
  if(sortBy==="type"){const rk=x=>typeOf(x)==="standalone"?0:typeOf(x)==="series"?1:2;
    return rk(a)-rk(b)||(a.series||"").localeCompare(b.series||"")
      ||(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0)||(a.title||"").localeCompare(b.title||"");}
  return 0;
}
/* -> [{label,color?,items[]}] in display order */
function groupsFor(list){
  const out=[];
  if(groupBy==="genre"){
    const map={},none=[];
    list.forEach(b=>{const gs=b.genres||[];if(!gs.length)none.push(b);gs.forEach(g=>(map[g]=map[g]||[]).push(b));});
    Object.keys(map).sort((a,b)=>a.localeCompare(b)).forEach(k=>out.push({label:k,color:genres[k]||"#78716c",items:map[k]}));
    if(none.length)out.push({label:"No genre yet",color:"#a8a29e",items:none});
  }else if(groupBy==="author"){
    const map={};
    list.forEach(b=>{const a=(b.author||"").trim()||"Unknown author";(map[a]=map[a]||[]).push(b);});
    Object.keys(map).sort((a,b)=>lastName(a).localeCompare(lastName(b))||a.localeCompare(b)).forEach(k=>out.push({label:k,items:map[k]}));
  }else if(groupBy==="series"){
    const map={},none=[];
    list.forEach(b=>{const s=(b.series||"").trim();if(s)(map[s]=map[s]||[]).push(b);else none.push(b);});
    Object.keys(map).sort((a,b)=>a.localeCompare(b)).forEach(k=>{
      const items=map[k].slice().sort((x,y)=>(parseFloat(x.seriesNum)||0)-(parseFloat(y.seriesNum)||0));
      /* how much of the series is on the shelf, and which numbers are absent */
      const total=Math.max(0,...items.map(b=>parseInt(b.seriesTotal)||0));
      let note="";
      if(total){
        const have=new Set(items.map(b=>parseFloat(b.seriesNum)).filter(n=>!isNaN(n)));
        const missing=[];
        for(let i=1;i<=total;i++)if(!have.has(i))missing.push(i);
        note=`${items.length} of ${total}`+(missing.length&&missing.length<=6?` · missing #${missing.join(", #")}`:"");
      }
      out.push({label:k,items,note});
    });
    if(none.length)out.push({label:"Not in a series",items:none});
  }else if(groupBy==="type"){
    TYPES.forEach(([k,l])=>{const items=list.filter(b=>typeOf(b)===k);if(items.length)out.push({label:l,items});});
  }else if(groupBy==="status"){
    STATUSES.forEach(([k,l])=>{const items=list.filter(b=>statusOf(b)===k);if(items.length)out.push({label:l,items});});
  }
  return out;
}
function booksHtml(list,withDel){
  return layout==="list"?list.map(b=>rowHtml(b,withDel)).join(""):`<div class="grid">${list.map(gridHtml).join("")}</div>`;
}

        unmarkMetaDel("genre:"+g);saveMeta();}
      applyToSel(b=>{b.genres=b.genres||[];if(!b.genres.includes(g))b.genres.push(g);});
    },true);

      /* a collection can't be folded into a collection — it would lose its stories */

      await makeCollectionFrom(ids,nm.trim(),first?first.author:"");
      libSel.clear();render();
    };
  }
  wireOpen(m,true);
  hydrateCovers(m);
}

/* ---- loose pictures on the library page ---- */
async function addLibArt(file,at){
  if(!file||!file.type.startsWith("image/"))return null;
  let data;try{data=await compressImage(file,1800,.86);}catch(e){alert("That image couldn't be read.");return null;}
  const id=uid();
  try{await dbPut("images",{key:libArtKey(id),data});}catch(e){alert("That picture couldn't be saved — storage may be full.");return null;}
  libArt.push({id,x:(at&&at.x)||24,y:(at&&at.y)||24,w:230,group:""});
  libArtCache.set(id,data);saveLibArt();
  if(SYNC.on){enqueue({kind:"img",key:libArtKey(id)});flushQueue();}
  return id;
}
async function removeLibArt(id){
  libArt=libArt.filter(a=>a.id!==id);libArtCache.delete(id);
  await dbDel("images",libArtKey(id));
  markMetaDel("libart:"+id);saveLibArt();
  if(SYNC.on){enqueue({kind:"imgDel",key:libArtKey(id)});flushQueue();}
}

    const cl=v=>Math.max(0,Math.min(1,v));
    const x0=cl((e.clientX-r.left)/r.width),y0=cl((e.clientY-r.top)/r.height);
    const mv=ev=>{const x1=cl((ev.clientX-r.left)/r.width),y1=cl((ev.clientY-r.top)/r.height);
      sel={x:Math.min(x0,x1),y:Math.min(y0,y1),w:Math.abs(x1-x0),h:Math.abs(y1-y0)};paint();};
    const up=()=>{
      window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
      const ok=sel&&sel.w>.02&&sel.h>.02;
      if(!ok){sel=null;paint();}
      q("#lcDo",box).disabled=!ok;
      msg.textContent=ok?`Keeping about ${Math.round(sel.w*100)}% across and ${Math.round(sel.h*100)}% down.`:"Drag a bigger box.";
    };
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  });
  q("#lcX",box).onclick=()=>{box.hidden=true;box.innerHTML="";};
  q("#lcDo",box).onclick=()=>{
    if(!sel)return;
    const img=new Image();
    img.onload=async()=>{
      const W=img.naturalWidth,H=img.naturalHeight;
      const sx=Math.round(sel.x*W),sy=Math.round(sel.y*H);
      const sw=Math.max(1,Math.round(sel.w*W)),sh=Math.max(1,Math.round(sel.h*H));
      const c=document.createElement("canvas");c.width=sw;c.height=sh;
      c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
      const png=/^data:image\/png/i.test(orig);
      const data=png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.88);
      try{await dbPut("images",{key:libArtKey(a.id),data,v:Date.now()});}
      catch(err){alert("That didn't fit — storage may be full.");return;}
      libArtCache.set(a.id,data);
      if(SYNC.on){enqueue({kind:"img",key:libArtKey(a.id)});flushQueue();}
      box.hidden=true;box.innerHTML="";
      renderLibrary();
    };
    img.onerror=()=>{msg.textContent="That picture couldn't be read.";};
    img.src=orig;
  };
}

/* deleted books wait in the bin for 30 days before they're really gone */
const TRASH_DAYS=30;
async function purgeTrash(){
  const cutoff=Date.now()-TRASH_DAYS*864e5;
  try{for(const t of await dbAll("trash"))if((t.at||0)<cutoff)await dbDel("trash",t.id);}catch(e){}
  /* the 30 days are up: now the cloud copies of its pictures can go too */
  let changed=false;
  for(const id of Object.keys(trashCloud)){
    const e=trashCloud[id];
    if(!e||(e.at||0)>=cutoff)continue;
    if(SYNC.on){
      enqueue({kind:"coverDel",id});
      imgKeysOf(e.book).forEach(key=>enqueue({kind:"imgDel",key}));
    }
    delete trashCloud[id];changed=true;
  }
  if(changed)saveTrashCloud();
}
async function toTrash(b){
  if(!b)return;
  try{
    const cov=await dbGet("covers",b.id);
    const images={};
    for(const k of imgKeysOf(b)){const r=await dbGet("images",k);if(r)images[k]=r.data;}
    await dbPut("trash",{id:b.id,at:Date.now(),book:JSON.parse(JSON.stringify(b)),cover:cov?cov.data:null,images});
  }catch(e){console.warn("[shelf] couldn't put that in the bin",e);}
}
async function restoreTrash(tid){
  /* the copy kept here if this is the device that deleted it, otherwise the one
     the cloud carries — with its pictures fetched back down */
  let t=await dbGet("trash",tid);
  let fromCloud=false;
  if(!t||!t.book){
    const c=trashCloud[tid];
    if(!c||!c.book)return;
    t={id:tid,at:c.at,book:c.book,cover:null,images:{}};
    fromCloud=true;
  }
  const b=t.book;
  await dbPut("books",b);
  if(t.cover){await dbPut("covers",{id:b.id,data:t.cover});coverCache.delete(b.id);SYNC.triedCover.delete(b.id);}
  for(const[k,d]of Object.entries(t.images||{}))await dbPut("images",{key:k,data:d});
  if(fromCloud){coverCache.delete(b.id);SYNC.triedCover.delete(b.id);
    if(SYNC.on&&SYNC.user&&navigator.onLine)try{await syncBookAssets(b);}catch(e){}}
  const i=books.findIndex(x=>x.id===b.id);
  if(i>=0)books[i]=b;else books.unshift(b);
  if(SYNC.on){
    if(deletions[b.id]){delete deletions[b.id];saveDeletions();}
    enqueue({kind:"book",id:b.id});enqueue({kind:"cover",id:b.id});
    imgKeysOf(b).forEach(key=>enqueue({kind:"img",key}));
  }
  await dbDel("trash",tid);
  if(trashCloud[tid]){delete trashCloud[tid];saveTrashCloud();}
  render();
}

async function deleteBookById(id){
  const b=books.find(x=>x.id===id);
  if(!confirm(`Delete “${(b&&b.title)||"Untitled"}” and all its pictures?\n\nIt waits in Recently deleted (on the Overview tab) for ${TRASH_DAYS} days, so you can get it back.`))return;
  if(b)pushOp({t:"del",body:JSON.parse(JSON.stringify(b))});
  await toTrash(b);
  await dbDel("books",id);
  books=books.filter(x=>x.id!==id);
  if(SYNC.on){
    deletions[id]=Date.now();saveDeletions();
    enqueue({kind:"bookDel",id});
    /* the cover and pictures are left where they are — they're what makes putting
       it back possible from another device. purgeTrash clears them at 30 days. */
    if(b){trashCloud[id]={at:Date.now(),book:JSON.parse(JSON.stringify(b))};saveTrashCloud();}
  }
  if(view==="book"){view="library";}
  render();
}

      </div>`).join("")}
      ${all.length>Math.max(IMP_SHOW,all.filter(it=>impSel.has(it.id)).length)
        ?`<div class="none" style="margin-top:5px">…and ${all.length-Math.max(IMP_SHOW,all.filter(it=>impSel.has(it.id)).length)} more — anything you tick jumps up here. Search to narrow the list, or “Add all”.</div>`:""}
    </div>`;
  }
  if(!shown)html+='<div class="none" style="margin-top:10px">Nothing in the list matches that search.</div>';

  const se=q("#impSearch",box);
  se.oninput=()=>{impQ=se.value;refreshImport();

  qa("[data-impc]",box).forEach(c=>c.onchange=()=>{
    c.checked?impSel.add(c.dataset.impc):impSel.delete(c.dataset.impc);refreshImport();});
  qa("[data-impa]",box).forEach(b=>b.onclick=()=>{
    const a=b.dataset.impa;
    const ids=importQueue.filter(it=>!it.dupe&&(it.author||"")===a).map(it=>it.id);
    if(!ids.length)return;

  const doneSel=()=>{impSel.clear();saveImportQueue();if(SYNC.on)flushQueue();render();};

/* A keyword that repeats one of your genres says nothing the genre didn't. Exact
   repeats are ticked for you; near ones are only offered, since "God/Jesus" may
   well be a finer thing than the genre "God". */
function refreshKwDupes(){
  const box=q("#kwDupBox");if(!box)return;
  const gs=Object.keys(genres);
  const kws=[...new Set(books.flatMap(b=>b.keywords||[]))];
  const hits=[];
  kws.forEach(k=>{
    const kl=k.toLowerCase();
    const exact=gs.find(g=>g.toLowerCase()===kl);
    if(exact){hits.push({k,g:exact,exact:true});return;}
    /* three letters is enough — "God" ought to catch "God/Jesus". Near matches are
       only ever offered, never ticked for you, so a stray one costs nothing. */
    const near=gs.find(g=>g.length>=3&&kl.includes(g.toLowerCase()));
    if(near)hits.push({k,g:near,exact:false});
  });
  if(!hits.length){box.innerHTML="";return;}
  const count=k=>books.filter(b=>(b.keywords||[]).includes(k)).length;
  box.innerHTML=`<div class="grouphead" style="margin:16px 0 8px"><h2 class="serif" style="margin:0;font-size:15px">Keywords that repeat a genre</h2>
      <span class="n">${hits.length}</span><span class="ghline"></span></div>
    <div class="hint" style="margin:0 0 8px">Tick the ones the genre already covers and remove them from every book at once. The genres themselves aren't touched.</div>
    ${hits.map((h,i)=>`<label class="snap" style="padding:6px 10px;cursor:pointer">
      <input type="checkbox" data-kdup="${i}" ${h.exact?"checked":""}>
      <div style="flex:1;min-width:0"><div class="when" style="font-size:13px">${esc(h.k)}</div>
        <div class="meta">on ${count(h.k)} book${count(h.k)===1?"":"s"} · ${h.exact?"the same as":"looks like"} your genre “${esc(h.g)}”</div></div>
    </label>`).join("")}
    <button class="btn danger" id="kdupGo" style="margin-top:8px">🗑 Remove the ticked keywords everywhere</button>`;
  q("#kdupGo",box).onclick=async()=>{
    const chosen=[...box.querySelectorAll("[data-kdup]:checked")].map(c=>hits[+c.dataset.kdup].k);
    if(!chosen.length)return;
    if(!confirm(`Remove ${chosen.length} keyword${chosen.length===1?"":"s"} from every book?\n\n${chosen.join(", ")}\n\nThe genres stay as they are.`))return;
    const gone=new Set(chosen);
    for(const b of books){
      if(!(b.keywords||[]).some(k=>gone.has(k)))continue;
      b.keywords=b.keywords.filter(k=>!gone.has(k));
      b.kwBreaks=(b.kwBreaks||[]).filter(k=>!gone.has(k));
      b.modified=Math.max(Date.now(),(b.modified||0)+1,(SYNC.seen[b.id]||0)+1);
      await dbPut("books",b);
      if(SYNC.on)enqueue({kind:"book",id:b.id});
    }
    chosen.forEach(k=>{delete kwColors[k];delete kwCats[k];markMetaDel("kw:"+k);});
    saveKwColors();saveKwCats();
    if(SYNC.on)flushQueue();
    render();
  };
}

async function refreshTrash(){
  const box=q("#trashList");if(!box)return;
  const local=await dbAll("trash");
  const have=new Set(local.map(t=>t.id));
  /* books binned on another device show up here too */
  const remote=Object.keys(trashCloud).filter(id=>!have.has(id))
    .map(id=>({id,at:trashCloud[id].at,book:trashCloud[id].book,elsewhere:true}));
  const list=[...local,...remote].sort((a,b)=>b.at-a.at);
  if(!q("#trashList"))return;
  const n=q("#trashN");if(n)n.textContent=list.length?`(${list.length})`:"";
  q("#trashList").innerHTML=list.length?list.map(t=>{
    const left=Math.max(0,TRASH_DAYS-Math.floor((Date.now()-(t.at||0))/864e5));
    return `<div class="snap">
      <div><div class="when">${esc((t.book&&t.book.title)||"Untitled")}</div>
        <div class="meta">${esc((t.book&&t.book.author)||"Unknown author")} · deleted ${fmtWhen(t.at)} · ${left} day${left===1?"":"s"} left${t.elsewhere?" · from another device":""}</div></div>
      <div class="sp">
        <button class="btn" data-tr="${t.id}">Put back</button>
        <button class="btn danger" data-tx="${t.id}" title="Delete for good">✕</button>
      </div>
    </div>`;}).join(""):'<div class="none" style="margin-top:9px">Nothing deleted lately.</div>';
  qa("[data-tr]",box).forEach(b=>b.onclick=async()=>{await restoreTrash(b.dataset.tr);});
  qa("[data-tx]",box).forEach(b=>b.onclick=async()=>{
    const id=b.dataset.tx;
    const t=(await dbGet("trash",id))||(trashCloud[id]?{id,book:trashCloud[id].book}:null);
    if(!t)return;
    if(!confirm(`Delete “${(t.book&&t.book.title)||"Untitled"}” for good? This can't be undone.`))return;
    await dbDel("trash",id);
    if(trashCloud[id]){
      /* its pictures were being kept only so it could come back — let them go */
      if(SYNC.on){enqueue({kind:"coverDel",id});imgKeysOf(trashCloud[id].book).forEach(key=>enqueue({kind:"imgDel",key}));}
      delete trashCloud[id];saveTrashCloud();
      if(SYNC.on)flushQueue();
    }
    refreshTrash();refreshStorage();
  });
}

/* =============== search & stats =============== */
function bodyText(b){return stripHtml([b.summary,b.canvasText,...(b.quotes||[]),...(b.pros||[]),...(b.cons||[]),...(b.meh||[]),...(b.keywords||[])].join(" ")).toLowerCase();}
/* "dragons, found family" — a comma means “or”, and every word inside one phrase
   has to turn up somewhere in the book's writing */
function textMatches(b,qstr){
  const groups=String(qstr||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(!groups.length)return true;
  const hay=(bodyText(b)+" "+(b.title||"")+" "+(b.author||"")+" "+(b.genres||[]).join(" ")+" "
    +(b.series||"")+" "+(b.fandoms||[]).join(" ")+" "+(b.characters||[]).join(" ")+" "
    +(b.entries||[]).map(en=>(en.title||"")+" "+stripHtml(en.summary||"")+" "+stripHtml(en.notes||"")).join(" ")
    ).toLowerCase();
  return groups.some(g=>g.split(/\s+/).filter(Boolean).every(w=>hay.indexOf(w)>=0));
}

function renderSearchBody(){
  const m=q("#sbody");
  const qlc=S.q.trim().toLowerCase();
  const authors={};books.forEach(b=>{const a=(b.author||"").trim();if(a)authors[a]=(authors[a]||0)+1;});
  const authorList=Object.entries(authors).sort((x,y)=>lastName(x[0]).localeCompare(lastName(y[0]))||x[0].localeCompare(y[0]));
  const topAuthor=Object.entries(authors).sort((x,y)=>y[1]-x[1])[0]||null;
  const gcount={};books.forEach(b=>(b.genres||[]).forEach(g=>gcount[g]=(gcount[g]||0)+1));
  const allG=Object.keys(genres).sort((a,b)=>a.localeCompare(b));
  const seriesMap={};books.forEach(b=>{const s=(b.series||"").trim();if(s)(seriesMap[s]=seriesMap[s]||[]).push(b);});
  const buckets=[];for(let i=1;i<=9;i++)buckets.push({label:`${i}.0 – ${i}.9`,min:i,max:i+.999});buckets.push({label:"10",min:10,max:10});
  const bCount=b=>books.filter(e=>e.rating!=null&&e.rating>=b.min&&e.rating<=b.max).length;
  const unrated=books.filter(e=>e.rating==null).length;
  const favN=books.filter(b=>b.favorite).length,dnfN=books.filter(b=>b.dnf).length;
  const readN=books.filter(b=>statusOf(b)==="reading").length,wantN=books.filter(b=>statusOf(b)==="want").length;

  let results=null,heading="";
  const matchScope=(b,s)=>{switch(s){
    case "title":return (b.title||"").toLowerCase().includes(qlc)||(b.entries||[]).some(en=>(en.title||"").toLowerCase().includes(qlc));
    case "author":return (b.author||"").toLowerCase().includes(qlc);
    case "series":return (b.series||"").toLowerCase().includes(qlc);
    case "genre":return (b.genres||[]).some(g=>g.toLowerCase().includes(qlc));
    case "keyword":return (b.keywords||[]).some(k=>k.toLowerCase().includes(qlc));
    case "quotes":return stripHtml((b.quotes||[]).join(" ")).toLowerCase().includes(qlc);
    case "summary":return stripHtml((b.summary||"")+" "+(b.entries||[]).map(en=>en.summary||"").join(" ")).toLowerCase().includes(qlc);
    case "notes":return stripHtml((b.canvasText||"")+" "+(b.entries||[]).map(en=>en.notes||"").join(" ")+" "+(b.pads||[]).map(p=>p.html||"").join(" ")).toLowerCase().includes(qlc);
    case "lists":return stripHtml([...(b.pros||[]),...(b.cons||[]),...(b.meh||[])].join(" ")).toLowerCase().includes(qlc);
    case "fandom":return [...(b.fandoms||[]),...(b.characters||[])].some(x=>x.toLowerCase().includes(qlc));
  }return false;};
  if(qlc){
    results=books.filter(b=>S.scopes.some(s=>matchScope(b,s)));
    heading=`“${esc(S.q)}” in ${SCOPES.filter(([id])=>S.scopes.includes(id)).map(([,l])=>l).join(", ")}`;
  }else if(S.filter){
    const f=S.filter;
    if(f.type==="author")results=books.filter(b=>(b.author||"").trim()===f.value);
    if(f.type==="genre")results=books.filter(b=>(b.genres||[]).includes(f.value));
    if(f.type==="favorite")results=books.filter(b=>b.favorite);
    if(f.type==="dnf")results=books.filter(b=>b.dnf);
    if(f.type==="status")results=books.filter(b=>statusOf(b)===f.value);
    if(f.type==="audience")results=books.filter(b=>audsOf(b).indexOf(f.value)>=0);
    if(f.type==="pages")results=f.value==="none"?books.filter(b=>!isColl(b)&&!parseInt(b.pages))
      :books.filter(b=>{if(isColl(b))return false;const p=parseInt(b.pages);return p&&p>=f.value.min&&p<=f.value.max;});
    if(f.type==="series")results=books.filter(b=>(b.series||"").trim()===f.value).sort((a,b)=>(parseFloat(a.seriesNum)||0)-(parseFloat(b.seriesNum)||0));
    if(f.type==="rating")results=f.value==="unrated"?books.filter(b=>b.rating==null):books.filter(b=>b.rating!=null&&b.rating>=f.value.min&&b.rating<=f.value.max);
    heading=esc(f.label);
  }else if(S.multi.length){
    results=books.filter(b=>S.multi.every(g=>(b.genres||[]).includes(g)));
    heading="Tagged: "+S.multi.map(esc).join(" + ");
  }

  let html="",tailHtml="";
  if(results){
    html+=`<div class="sec"><div class="heading"><h2 class="serif">${heading}</h2><span class="n">(${results.length})</span>${S.filter&&S.filter.type==="author"?`<button class="btn" id="sgrp" style="padding:3px 10px;font-size:12px" title="Link as a series, fold into a collection, or merge duplicate spellings">📚 Group / tidy…</button>`:""}<button class="clearbtn" id="sclear">✕ Clear</button></div>
      ${results.length?results.map(b=>rowHtml(b,false)).join(""):'<div class="none" style="text-align:center;padding:30px 0">Nothing here yet.</div>'}</div>`;
  }
  if(!results||S.multi.length){
    if(!results){
      html+=`<div class="sec"><h2 class="serif">Collections</h2>
        <button class="colbtn f" data-cf="favorite" ${favN?"":"disabled"}>♥ Favorites <b>${favN}</b></button>
        <button class="colbtn r" data-cf="reading" ${readN?"":"disabled"}>📖 Reading now <b>${readN}</b></button>
        <button class="colbtn w" data-cf="want" ${wantN?"":"disabled"}>★ Want to read <b>${wantN}</b></button>
        <button class="colbtn d" data-cf="dnf" ${dnfN?"":"disabled"}><span class="bdnf" style="background:#57534e;color:#fff">DNF</span> Did not finish <b>${dnfN}</b></button>
      </div>`;
      const audCounts={};books.forEach(b=>audsOf(b).forEach(a=>audCounts[a]=(audCounts[a]||0)+1));
      const audAll=[...new Set([...DEFAULT_AUD,...audCustom,...Object.keys(audCounts)])];
      html+=`<div class="sec"><h2 class="serif">Who it's for</h2>${audAll.map(a=>{const n=audCounts[a]||0;return `<button class="aut" data-aud="${esc(a)}" ${n?"":'disabled style="opacity:.4;cursor:default"'}>${esc(a)} <b>${n}</b></button>`;}).join("")}</div>`;
      /* these two grow without limit, so they wait at the bottom and can be folded
         away — and stay folded until you open them again */
      const shutS=new Set(settings.searchShut||[]);
      const secHead=(id,title,count)=>`<div class="heading" data-ssec="${id}" style="cursor:pointer">
        <button class="gcar">${shutS.has(id)?"▸":"▾"}</button>
        <h2 class="serif" style="margin:0;font-size:17px">${title}</h2>
        <span class="n">${count}</span><span class="ghline"></span></div>`;
      tailHtml+=`<div class="sec">${secHead("authors","Authors",authorList.length)}
        ${shutS.has("authors")?"":`<input class="field" id="aq" placeholder="Filter authors…" value="${esc(S.authorQ)}" style="margin-bottom:8px;font-size:13px;padding:7px 11px">
        <div id="authChips"></div>`}</div>`;
      if(Object.keys(seriesMap).length){
        tailHtml+=`<div class="sec">${secHead("series","Series",Object.keys(seriesMap).length)}
          ${shutS.has("series")?"":Object.entries(seriesMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,arr])=>{
            const total=Math.max(0,...arr.map(b=>parseInt(b.seriesTotal)||0));
            return `<button class="aut" data-ser="${esc(s)}">${esc(s)} <b>${arr.length}${total?` of ${total}`:""}</b></button>`;}).join("")}</div>`;
      }
      html+=`<div class="sec"><h2 class="serif">Genres</h2>${Object.entries(gcount).sort((a,b)=>a[0].localeCompare(b[0])).map(([g,n])=>`<button data-gen="${esc(g)}" style="border:none;background:none;padding:0"><span class="chip big" style="background:${genres[g]||"#78716c"}">${esc(g)} <b>${n}</b></span></button>`).join("")||'<span class="none">No genres yet.</span>'}</div>`;
    }
    html+=`<div class="sec"><h2 class="serif">Combine genres</h2><div class="hint">Check several — shows only books that carry <b>all</b> of them.</div>
      ${allG.map(g=>{const on=S.multi.includes(g);return `<button class="mg ${on?"on":""}" data-mg="${esc(g)}" style="${on?`background:${genres[g]};border-color:${genres[g]}`:""}"><span class="bx">${on?"✓":""}</span>${esc(g)}</button>`;}).join("")||'<span class="none">No genres yet.</span>'}</div>`;
    if(!results){
      html+=`<div class="sec"><h2 class="serif">Ratings</h2><div class="rbuckets">
        ${buckets.map(b=>{const n=bCount(b);return `<button class="rb ${n?"has":"no"}" ${n?`data-rb="${b.min}"`:""}><span>★ ${b.label}</span><b>${n}</b></button>`;}).join("")}
        <button class="rb ${unrated?"has":"no"}" ${unrated?'data-rb="unrated"':""} style="${unrated?"border-color:#d6d3d1;background:#fff":""}"><span>Unrated</span><b>${unrated}</b></button>
      </div></div>`;
      /* collections hold many books; their combined length isn't a book length */
      const lenBooks=books.filter(b=>!isColl(b));
      const lenCounts=LEN_BUCKETS.map(bk=>lenBooks.filter(b=>{const p=parseInt(b.pages);return p&&p>=bk.min&&p<=bk.max;}).length);
      const noPages=lenBooks.filter(b=>!parseInt(b.pages)).length;
      html+=`<div class="sec"><h2 class="serif">Length</h2><div class="rbuckets">
        ${LEN_BUCKETS.map((bk,i)=>`<button class="rb ${lenCounts[i]?"has":"no"}" ${lenCounts[i]?`data-len="${i}"`:""} style="${lenCounts[i]?"border-color:#bae6fd;background:#f0f9ff":""}"><span>📄 ${bk.label}</span><b>${lenCounts[i]}</b></button>`).join("")}
        <button class="rb ${noPages?"has":"no"}" ${noPages?'data-len="none"':""} style="${noPages?"border-color:#d6d3d1;background:#fff":""}"><span>No page count</span><b>${noPages}</b></button>
      </div></div>`;
      if(books.length){
        const rated=books.filter(b=>b.rating!=null);
        const avg=rated.length?rated.reduce((s,b)=>s+b.rating,0)/rated.length:null;
        const topA=topAuthor;
        let topG=null;
        Object.keys(gcount).forEach(g=>{const gr=books.filter(b=>(b.genres||[]).includes(g)&&b.rating!=null);
          if(gr.length){const a=gr.reduce((s,b)=>s+b.rating,0)/gr.length;if(!topG||a>topG.avg)topG={name:g,avg:a};}});
        const mr=[...books].sort((a,b)=>(b.rereads||0)-(a.rereads||0))[0];
        const years={};books.forEach(b=>{const y=(b.dateFinished||"").slice(0,4);if(y.length===4)years[y]=(years[y]||0)+1;});
        const yl=Object.entries(years).sort((a,b)=>b[0].localeCompare(a[0]));
        const maxB=Math.max(1,...buckets.map(bCount));
        html+=`<div class="sec"><h2 class="serif">Stats corner</h2><div class="stats">
          <div class="stat"><div class="v">${books.length}</div><div class="k">books on the shelf</div></div>
          <div class="stat"><div class="v">${avg!=null?avg.toFixed(2):"–"}</div><div class="k">average rating (${rated.length} rated)</div></div>
          <div class="stat"><div class="v" style="font-size:16px">${topA?esc(topA[0]):"–"}</div><div class="k">most-read author${topA?` (${topA[1]} books)`:""}</div></div>
          <div class="stat"><div class="v" style="font-size:16px">${topG?esc(topG.name):"–"}</div><div class="k">highest-rated genre${topG?` (avg ${topG.avg.toFixed(1)})`:""}</div></div>
          <div class="stat"><div class="v" style="font-size:16px">${mr&&(mr.rereads||0)>0?esc(mr.title):"–"}</div><div class="k">most reread${mr&&(mr.rereads||0)>0?` (×${mr.rereads+1})`:""}</div></div>
          <div class="stat">${yl.length?yl.slice(0,3).map(([y,n])=>`<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--mut)">${y}</span><b>${n}</b></div>`).join(""):'<div class="v">–</div>'}<div class="k">finished per year</div></div>
        </div>
        <div class="spread"><div class="k" style="font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px">Rating spread</div>
          <div class="bars">${buckets.map(b=>{const n=bCount(b);return `<div class="bcol">${n?`<span class="bn">${n}</span>`:""}<div class="bar" style="height:${n?Math.max(3,n/maxB*42):0}px"></div></div>`;}).join("")}</div>
          <div class="axis"><span>1</span><span>5</span><span>10</span></div>
        </div></div>`;
      }
    }
  }
  m.innerHTML=html+tailHtml;
  qa("[data-ssec]",m).forEach(h=>h.onclick=()=>{
    const s=new Set(settings.searchShut||[]);
    const id=h.dataset.ssec;
    s.has(id)?s.delete(id):s.add(id);
    settings.searchShut=[...s];saveSettings();renderSearchBody();
  });

  const clear=q("#sclear",m);if(clear)clear.onclick=()=>{S.q="";S.filter=null;S.multi=[];q("#sq").value="";renderSearchBody();};
  const sg=q("#sgrp",m);if(sg)sg.onclick=()=>openAuthorPanel(S.filter.value);
  const pick=f=>{S.q="";S.multi=[];S.filter=f;q("#sq").value="";renderSearchBody();};
  qa("[data-cf]",m).forEach(b=>b.onclick=()=>{const t=b.dataset.cf;
    if(t==="favorite")pick({type:"favorite",label:"Favorites"});
    else if(t==="dnf")pick({type:"dnf",label:"Did not finish"});
    else pick({type:"status",value:t,label:t==="reading"?"Reading now":"Want to read"});});
  qa("[data-ser]",m).forEach(b=>b.onclick=()=>pick({type:"series",value:b.dataset.ser,label:"Series: "+b.dataset.ser}));
  qa("[data-aud]",m).forEach(b=>b.onclick=()=>pick({type:"audience",value:b.dataset.aud,label:"For: "+b.dataset.aud}));
  qa("[data-gen]",m).forEach(b=>b.onclick=()=>pick({type:"genre",value:b.dataset.gen,label:"Genre: "+b.dataset.gen}));
  qa("[data-mg]",m).forEach(b=>b.onclick=()=>{const g=b.dataset.mg;S.filter=null;S.q="";q("#sq").value="";
    S.multi=S.multi.includes(g)?S.multi.filter(x=>x!==g):[...S.multi,g];renderSearchBody();});
  qa("[data-rb]",m).forEach(b=>b.onclick=()=>{const v=b.dataset.rb;
    if(v==="unrated")pick({type:"rating",value:"unrated",label:"Not rated yet"});
    else{const min=parseInt(v);pick({type:"rating",value:{min,max:min===10?10:min+.999},label:min===10?"Rated 10":`Rated ${min}.0 – ${min}.9`});}});
  qa("[data-len]",m).forEach(b=>b.onclick=()=>{const v=b.dataset.len;
    if(v==="none")pick({type:"pages",value:"none",label:"No page count"});
    else{const bk=LEN_BUCKETS[+v];pick({type:"pages",value:bk,label:`Length: ${bk.label} pages`});}});
  const aq=q("#aq",m);
  if(aq){
    const renderAuth=()=>{const box=q("#authChips",m);
      const fl=S.authorQ?authorList.filter(([a])=>a.toLowerCase().includes(S.authorQ.toLowerCase())):authorList;
      box.innerHTML=fl.map(([a,n])=>`<button class="aut" data-au="${esc(a)}">${esc(a)} <b>${n}</b></button>`).join("")||'<span class="none">No authors yet.</span>';
      qa("[data-au]",box).forEach(b=>b.onclick=()=>pick({type:"author",value:b.dataset.au,label:"Books by "+b.dataset.au}));};
    aq.oninput=()=>{S.authorQ=aq.value;renderAuth();};
    renderAuth();
  }
  wireOpen(m,false);
  hydrateCovers(m);
}

/* =============== pick for me — its own tab =============== */
function renderPick(){
  const m=q("#main");
  if(!books.length){m.innerHTML='<div class="empty">📖<br>Add some books first — then I can pick one for you.</div>';return;}
  const allG=Object.keys(genres).sort((a,b)=>a.localeCompare(b));
  const allKw=[...new Set(books.flatMap(b=>b.keywords||[]))].sort((a,b)=>a.localeCompare(b));
  m.innerHTML=`<div class="sec pickbox"><h2 class="serif" style="margin-bottom:8px">🎲 Pick for me</h2>
    <div class="hint" style="margin:0 0 8px">Can't decide? Narrow the mood below (or don't) and let the dice choose. DNF books are never picked.</div>
    <input class="field" id="pkq" placeholder="Words to look for — e.g. dragons, found family" value="${esc(S.pickText||"")}" style="margin-bottom:4px">
    <div class="hint" style="margin:0 0 10px">Searches your summaries, notes, quotes, tags, titles and fandoms. A comma means “or”; several words in one phrase must all appear.</div>
    ${allG.length?`<div class="lbl" style="display:block;margin-bottom:4px">Genres — tick any; a book counts if it carries one of them</div>
    <div>${allG.map(g=>{const on=S.pickGenres.includes(g);
      return `<button class="mg ${on?"on":""}" data-pg="${esc(g)}" style="${on?`background:${genres[g]};border-color:${genres[g]}`:""}"><span class="bx">${on?"✓":""}</span>${esc(g)}</button>`;}).join("")}</div>`:""}
    ${allKw.length?`<button class="btn" id="pkTagTog" style="margin-top:8px;padding:4px 10px;font-size:12px">${S.pickKwOpen?"▾":"▸"} Tags${S.pickKws.length?` · ${S.pickKws.length} ticked`:""} (${allKw.length})</button>
    ${S.pickKwOpen?`<div style="margin-top:6px">${allKw.map(k=>{const on=S.pickKws.includes(k);
      return `<button class="mg ${on?"on":""}" data-pk="${esc(k)}" style="${on?"background:var(--teal);border-color:var(--teal);color:#fff":""}"><span class="bx">${on?"✓":""}</span>${esc(k)}</button>`;}).join("")}</div>`:""}`:""}
    <div class="inrow" style="margin-top:10px">
      <label style="font-size:13px;color:var(--mut);display:flex;gap:5px;align-items:center"><input type="checkbox" id="pkw" ${S.pickWant?"checked":""}> from my want-to-read pile</label>
      <button class="pickbtn" id="pkb">${S.picked&&S.picked!=="none"?"Pick again":"Pick"}</button>
    </div>
    <div id="pkres" style="margin-top:10px">${S.picked==="none"?'<span class="none">Nothing matches — untick a filter or two.</span>':S.picked?rowHtml(S.picked,false):""}</div>
  </div>`;
  qa("[data-pg]",m).forEach(b=>b.onclick=()=>{const g=b.dataset.pg;
    S.pickGenres=S.pickGenres.includes(g)?S.pickGenres.filter(x=>x!==g):[...S.pickGenres,g];renderPick();});
  qa("[data-pk]",m).forEach(b=>b.onclick=()=>{const k=b.dataset.pk;
    S.pickKws=S.pickKws.includes(k)?S.pickKws.filter(x=>x!==k):[...S.pickKws,k];renderPick();});
  const ptt=q("#pkTagTog",m);if(ptt)ptt.onclick=()=>{S.pickKwOpen=!S.pickKwOpen;renderPick();};
  q("#pkw",m).onchange=e=>S.pickWant=e.target.checked;
  q("#pkq",m).oninput=e=>{S.pickText=e.target.value;};   /* no redraw — keep the cursor */
  q("#pkq",m).addEventListener("keydown",e=>{if(e.key==="Enter")q("#pkb",m).click();});
  q("#pkb",m).onclick=()=>{
    let pool=books.filter(b=>!b.dnf);
    if(S.pickWant)pool=pool.filter(b=>statusOf(b)==="want");
    if(S.pickGenres.length)pool=pool.filter(b=>(b.genres||[]).some(g=>S.pickGenres.includes(g)));
    if(S.pickKws.length)pool=pool.filter(b=>(b.keywords||[]).some(k=>S.pickKws.includes(k)));
    if((S.pickText||"").trim())pool=pool.filter(b=>textMatches(b,S.pickText));
    S.picked=pool.length?pool[Math.floor(Math.random()*pool.length)]:"none";
    renderPick();
  };
  wireOpen(m,false);
  hydrateCovers(m);
}

/* =============== insights — what your whole shelf says about you =============== */
function renderInsights(){
  const m=q("#main");
  if(!books.length){m.innerHTML='<div class="empty">📖<br>Add a few books first — then this page can tell you something about your reading.</div>';return;}
  const fin=books.filter(b=>statusOf(b)==="finished"&&!b.dnf);
  const dnf=books.filter(b=>b.dnf);
  const want=books.filter(b=>statusOf(b)==="want");
  const rated=books.filter(b=>b.rating!=null);
  const avg=rated.length?rated.reduce((s,b)=>s+b.rating,0)/rated.length:null;
  const sd=rated.length>1?Math.sqrt(rated.reduce((s,b)=>s+Math.pow(b.rating-avg,2),0)/rated.length):0;
  const gcount={},gsum={},gn={};
  books.forEach(b=>(b.genres||[]).forEach(g=>{gcount[g]=(gcount[g]||0)+1;
    if(b.rating!=null){gsum[g]=(gsum[g]||0)+b.rating;gn[g]=(gn[g]||0)+1;}}));
  const topG=Object.entries(gcount).sort((a,b)=>b[1]-a[1]);
  const bestG=Object.keys(gsum).filter(g=>gn[g]>=2).map(g=>[g,gsum[g]/gn[g]]).sort((a,b)=>b[1]-a[1]);
  const aCount={};books.forEach(b=>{const a=(b.author||"").trim();if(a)aCount[a]=(aCount[a]||0)+1;});
  const topA=Object.entries(aCount).sort((a,b)=>b[1]-a[1]);
  /* A collection is a shelf entry, not a book: counting its combined page count as
     one title made every "how long a book do you read" number nonsense. Its stories
     count one by one instead — while total pages read still adds up the same. */
  const unitPages=b=>isColl(b)
    ?(b.entries||[]).map(en=>parseInt(en.pages)||0).filter(Boolean)
    :(parseInt(b.pages)?[parseInt(b.pages)]:[]);
  const totalPagesOf=b=>{const u=unitPages(b);
    return u.length?u.reduce((s,x)=>s+x,0):(isColl(b)?(parseInt(b.pages)||0):0);};
  const pagesRead=fin.reduce((s,b)=>s+totalPagesOf(b)*(1+(b.rereads||0)),0);
  const rereads=books.reduce((s,b)=>s+(b.rereads||0),0);
  const years={};fin.forEach(b=>{const y=(b.dateFinished||"").slice(0,4);if(y.length===4)years[y]=(years[y]||0)+1;});
  const yl=Object.entries(years).sort((a,b)=>b[0].localeCompare(a[0]));
  const thisYear=String(new Date().getFullYear());
  const pace=yl.length?Math.round(yl.reduce((s,x)=>s+x[1],0)/yl.length):0;
  const finRate=(fin.length+dnf.length)?fin.length/(fin.length+dnf.length):null;
  const dnfReasons={};dnf.forEach(b=>(b.dnfReasons||[]).forEach(r=>dnfReasons[r]=(dnfReasons[r]||0)+1));
  const topDnf=Object.entries(dnfReasons).sort((a,b)=>b[1]-a[1])[0];
  const kwCount={};books.forEach(b=>(b.keywords||[]).forEach(k=>kwCount[k]=(kwCount[k]||0)+1));
  const topKw=Object.entries(kwCount).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const finLens=fin.flatMap(unitPages);
  const avgLen=finLens.length?Math.round(finLens.reduce((s,x)=>s+x,0)/finLens.length):null;
  const fandomCount={};books.forEach(b=>(b.fandoms||[]).forEach(f=>fandomCount[f]=(fandomCount[f]||0)+1));
  const topF=Object.entries(fandomCount).sort((a,b)=>b[1]-a[1])[0];
  const kinds={};books.forEach(b=>kinds[kindOf(b)]=(kinds[kindOf(b)]||0)+1);
  const ratedUnits=books.flatMap(b=>isColl(b)
    ?(b.entries||[]).filter(en=>en.rating!=null&&parseInt(en.pages)).map(en=>({p:parseInt(en.pages),r:en.rating}))
    :(b.rating!=null&&parseInt(b.pages)?[{p:parseInt(b.pages),r:b.rating}]:[]));
  const lenLove=LEN_BUCKETS.map(bk=>{const g=ratedUnits.filter(u=>u.p>=bk.min&&u.p<=bk.max);
    return g.length>=2?[bk.label,g.reduce((s,u)=>s+u.r,0)/g.length,g.length]:null;}).filter(Boolean).sort((a,b)=>b[1]-a[1]);

  const say=[];
  if(topG.length){
    say.push(`Your shelf leans <b>${esc(topG[0][0])}</b>${topG[1]?` with a strong side of <b>${esc(topG[1][0])}</b>`:""} — ${topG[0][1]} book${topG[0][1]===1?"":"s"} carry that tag.`);
    if(bestG.length&&bestG[0][0]!==topG[0][0])say.push(`But the genre you actually <i>rate</i> highest is <b>${esc(bestG[0][0])}</b> (★ ${bestG[0][1].toFixed(1)} average) — maybe your shelf wants more of it.`);
    else if(bestG.length)say.push(`And it's not just volume — <b>${esc(bestG[0][0])}</b> is also your highest-rated genre (★ ${bestG[0][1].toFixed(1)} average). You know what you like.`);
  }
  if(finRate!=null){
    if(finRate>=.9)say.push(`You finish what you start — ${Math.round(finRate*100)}% of the books you open get finished.`);
    else if(finRate>=.7)say.push(`You mostly see books through (${Math.round(finRate*100)}%), but you're willing to walk away.`);
    else say.push(`Life's too short for the wrong book — you put down ${Math.round((1-finRate)*100)}% of what you start.`);
    if(topDnf)say.push(`When you do give up, it's usually: <i>${esc(topDnf[0])}</i>.`);
  }
  if(avg!=null){
    if(avg>=8)say.push(`You rate generously — ★ ${avg.toFixed(1)} on average. Either you pick well or you love easily${sd>=2?"; though when a book misses, it really misses — your scores swing widely":""}.`);
    else if(avg>=6.5)say.push(`Your average is a level-headed ★ ${avg.toFixed(1)}${sd>=2?", but your scores swing hard — love-it-or-hate-it reading":", and your scores stay near it — an even-handed judge"}.`);
    else say.push(`You're a tough critic — ★ ${avg.toFixed(1)} average. A high score from you means something.`);
  }
  if(topA.length&&topA[0][1]>=3)say.push(`You're author-loyal: when a voice clicks, you stay — <b>${esc(topA[0][0])}</b> alone accounts for ${topA[0][1]} books.`);
  if(avgLen!=null){
    if(avgLen>=450)say.push(`Big books don't scare you — your finished books average <b>${avgLen} pages</b>.`);
    else if(avgLen<=250)say.push(`You favour lean books — around <b>${avgLen} pages</b>. In and out, no padding.`);
    else say.push(`Your comfortable length sits around <b>${avgLen} pages</b>.`);
  }
  if(lenLove.length>=2&&lenLove[0][1]-lenLove[lenLove.length-1][1]>=1)
    say.push(`Your highest marks go to <b>${esc(lenLove[0][0])}-page</b> books (★ ${lenLove[0][1].toFixed(1)} average) — worth remembering when you pick the next one.`);
  if(rereads>0)say.push(`You're a re-reader — ${rereads} re-read${rereads===1?"":"s"} logged. Comfort books count double.`);
  if(topF)say.push(`Deepest fandom: <b>${esc(topF[0])}</b> (${topF[1]} entr${topF[1]===1?"y":"ies"}).`);
  if((kinds.fanfic||0)+(kinds.ai||0)>0)say.push(`Your shelf isn't only print — ${kinds.fanfic||0} fanfic${(kinds.fanfic||0)===1?"":"s"} and ${kinds.ai||0} AI stor${(kinds.ai||0)===1?"y":"ies"} live here too.`);
  if(topKw.length)say.push(`Themes that keep following you: ${topKw.map(x=>`<span class="kw">${esc(x[0])}</span>`).join(" ")}`);
  if(want.length&&pace)say.push(`Your want-to-read pile holds <b>${want.length}</b> — at your usual pace (~${pace}/year), that's about <b>${Math.max(1,Math.round(want.length/pace*12))} month${Math.round(want.length/pace*12)===1?"":"s"}</b> of reading already queued.`);
  else if(want.length)say.push(`Your want-to-read pile holds <b>${want.length}</b> book${want.length===1?"":"s"}.`);
  if(years[thisYear])say.push(`This year so far: <b>${years[thisYear]}</b> finished.`);
  /* what the page-by-page records say about the last month */
  const cut=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  let recentPages=0;const activeDays=new Set();
  books.forEach(b=>{
    const log=(b.progLog||[]).filter(e2=>e2.d>=cut).sort((x,y)=>x.d.localeCompare(y.d));
    for(let i=1;i<log.length;i++){
      const d=(log[i].p||0)-(log[i-1].p||0);
      if(d>0){recentPages+=d;activeDays.add(log[i].d);}
    }
  });
  if(recentPages>0)say.push(`In the last month you've turned about <b>${recentPages.toLocaleString()} pages</b> across <b>${activeDays.size}</b> day${activeDays.size===1?"":"s"} — roughly ${Math.round(recentPages/Math.max(1,activeDays.size))} pages on a day you read.`);

  /* the same figures, written out at length — something you can keep or paste */
  function buildAnalysis(){
    const P=[],n=(x,one,many)=>`${x} ${x===1?one:(many||one+"s")}`;
    const pct=x=>Math.round(x*100)+"%";
    P.push(`YOUR READING, IN FULL\nWorked out from ${n(books.length,"entry","entries")} on your shelf on ${new Date().toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})}. Everything below comes from your own records — nothing was looked up or sent anywhere.`);
    const kindBits=[];
    if(kinds.book)kindBits.push(n(kinds.book,"published book"));
    if(kinds.fanfic)kindBits.push(n(kinds.fanfic,"fanfic"));
    if(kinds.ai)kindBits.push(n(kinds.ai,"AI story"));
    P.push(`THE SHELF\nYou have ${n(fin.length,"finished book")}, ${want.length} waiting to be read, ${books.filter(b=>statusOf(b)==="reading").length} on the go and ${n(dnf.length,"you set aside")}.${kindBits.length>1?` By kind: ${kindBits.join(", ")}.`:""}${pagesRead?` Across everything finished you've read about ${pagesRead.toLocaleString()} pages${rereads?`, re-reads counted — and there have been ${n(rereads,"re-read")}`:""}.`:""}`);
    if(avg!=null){
      const spread=sd<1?"You rate consistently; most books land close to your average"
        :sd<2?"Your scores vary a fair amount, but not wildly"
        :"Your scores swing hard — you either love a book or you don't";
      P.push(`HOW YOU RATE\nYour average is ${avg.toFixed(2)} out of 10 across ${n(rated.length,"rated book")}${books.length-rated.length?`, with ${books.length-rated.length} left unrated`:""}. ${spread}. ${avg>=8?"You're a generous marker, so a low score from you is worth paying attention to."
        :avg>=6.5?"That's an even-handed middle, which makes your high scores meaningful."
        :"You're a demanding reader; anything you rate highly has genuinely earned it."}`);
    }
    if(topG.length){
      const list=topG.slice(0,5).map(x=>`${x[0]} (${x[1]})`).join(", ");
      let s=`WHAT YOU READ\nBy volume: ${list}.`;
      if(bestG.length){
        s+=` Rated by you, the strongest are ${bestG.slice(0,3).map(x=>`${x[0]} (${x[1].toFixed(1)} average)`).join(", ")}.`;
        const worst=bestG[bestG.length-1];
        if(bestG.length>2&&worst[1]<avg)s+=` ${worst[0]} sits lowest at ${worst[1].toFixed(1)} — worth asking whether you keep reading it out of habit.`;
        if(bestG[0][0]!==topG[0][0])s+=` Note that what you read most (${topG[0][0]}) isn't what you rate highest (${bestG[0][0]}).`;
      }
      P.push(s);
    }
    if(topA.length){
      const loyal=topA.filter(a=>a[1]>1).length;
      P.push(`AUTHORS\nYou've read ${n(topA.length,"different author")}${loyal?`, and gone back for more from ${loyal} of them`:""}. Most read: ${topA.slice(0,5).map(a=>`${a[0]} (${a[1]})`).join(", ")}.${topA[0][1]>=3?` ${topA[0][0]} alone accounts for ${pct(topA[0][1]/books.length)} of your shelf.`:""}`);
    }
    if(avgLen!=null){
      let s=`LENGTH\nYour finished books average ${avgLen} pages${finLens.length!==fin.length?" (counting the books inside collections one by one)":""}. The shortest was ${Math.min(...finLens)} pages and the longest ${Math.max(...finLens)}.`;
      if(lenLove.length>=2)s+=` You rate ${lenLove[0][0]}-page books highest (${lenLove[0][1].toFixed(1)} average over ${lenLove[0][2]}), and ${lenLove[lenLove.length-1][0]}-page ones lowest (${lenLove[lenLove.length-1][1].toFixed(1)}).`;
      P.push(s);
    }
    if(finRate!=null){
      let s=`STICKING WITH A BOOK\nYou finish ${pct(finRate)} of what you start.`;
      const rs=Object.entries(dnfReasons).sort((a,b)=>b[1]-a[1]).slice(0,3);
      if(rs.length)s+=` When you stop, the reasons you give are: ${rs.map(x=>`${x[0]} (${x[1]})`).join(", ")}.`;
      if(dnf.length&&rated.length){
        const dr=dnf.filter(b=>b.rating!=null);
        if(dr.length)s+=` The books you abandoned still averaged ${(dr.reduce((a,b)=>a+b.rating,0)/dr.length).toFixed(1)}, so it isn't only quality that decides it.`;
      }
      P.push(s);
    }
    if(yl.length){
      const total=yl.reduce((s2,x)=>s2+x[1],0);
      P.push(`PACE\nBy year finished: ${yl.slice(0,6).map(x=>`${x[0]} — ${x[1]}`).join(", ")}. That's about ${pace} a year over ${n(yl.length,"year")}, ${total} in all with a date recorded.${years[thisYear]?` So far in ${thisYear} you've finished ${years[thisYear]}.`:""}${want.length&&pace?` At that rate your ${want.length}-book want-to-read pile is roughly ${(want.length/pace).toFixed(1)} years of reading.`:""}`);
    }
    const themes=[];
    if(topKw.length)themes.push(`Tags that keep recurring: ${topKw.map(x=>`${x[0]} (${x[1]})`).join(", ")}.`);
    if(Object.keys(fandomCount).length)themes.push(`Fandoms: ${Object.entries(fandomCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>`${x[0]} (${x[1]})`).join(", ")}.`);
    const favs=books.filter(b=>b.favorite);
    if(favs.length)themes.push(`You've marked ${n(favs.length,"favourite")}${favs.length<=6?`: ${favs.map(b=>b.title||"Untitled").join(", ")}`:""}.`);
    if(themes.length)P.push("THREADS\n"+themes.join(" "));
    const advice=[];
    if(want.length>pace*2&&pace)advice.push("your want-to-read pile is growing faster than you can read it — worth a prune");
    if(bestG.length&&topG.length&&bestG[0][0]!==topG[0][0])advice.push(`you could read more ${bestG[0][0]}, which you rate above what you read most`);
    if(books.length-rated.length>books.length*.3)advice.push("a lot of books are unrated, which is why some of the figures above are thinner than they could be");
    if(avgLen!=null&&lenLove.length>=2&&lenLove[0][0]!==null)advice.push(`when in doubt, reach for something around ${lenLove[0][0]} pages`);
    if(advice.length)P.push("IF YOU WANT A STEER\nOn this evidence: "+advice.join("; ")+".");
    return P.join("\n\n");
  }

  /* say plainly what's missing rather than quietly producing thinner answers */
  const gaps=[];
  const noRate=books.length-rated.length;
  const noDate=fin.filter(b=>!b.dateFinished).length;
  const noPages=books.filter(b=>!isColl(b)&&!parseInt(b.pages)).length;
  const noGenre=books.filter(b=>!(b.genres||[]).length).length;
  if(noRate)gaps.push(`${noRate} unrated`);
  if(noDate)gaps.push(`${noDate} finished without a date`);
  if(noPages)gaps.push(`${noPages} with no page count`);
  if(noGenre)gaps.push(`${noGenre} with no genre`);

  const bigYear=yl.length?yl.slice().sort((a,b)=>b[1]-a[1])[0]:null;
  const cards=[
    [String(books.length),"on the shelf"],[String(fin.length),"finished"],
    [pagesRead?pagesRead.toLocaleString():"–","pages read (re-reads counted)"],
    [avg!=null?"★ "+avg.toFixed(2):"–",`average rating (${rated.length} rated)`],
    [finRate!=null?Math.round(finRate*100)+"%":"–","finish rate"],
    [String(want.length),"waiting to be read"],
    [topA.length?topA[0][0]:"–","most-read author"],
    [bestG.length?bestG[0][0]:"–","best-rated genre"],
    [bigYear?bigYear[0]+" ("+bigYear[1]+")":"–","biggest reading year"]];
  m.innerHTML=`
    <div class="sec"><div class="hcard">
      <div class="hrow2"><button class="btn pri" id="anaGo">📝 Write me a full analysis</button>
        <span class="none" style="font-size:12px">A long read-through of everything below — yours to keep or paste.</span></div>
      <div id="anaOut"></div>
    </div></div>
    <div class="sec"><div class="heading"><h2 class="serif">You, as a reader</h2></div>
      <div class="hcard">${say.map(s=>`<div class="li"><span class="dot" style="background:var(--teal)"></span><div>${s}</div></div>`).join("")||'<span class="none">Add ratings, genres, page counts and finish dates — the more you log, the sharper this gets.</span>'}
        ${gaps.length?`<div class="hint" style="margin:10px 0 0;color:var(--amber)">This page reads your records, so gaps in them show up here: ${gaps.join(", ")}. Filling those in sharpens everything above.</div>`:""}
        <div class="hint" style="margin:10px 0 0">Worked out entirely from your own shelf, on this device — nothing is sent anywhere.</div>
      </div>
    </div>
    <div class="sec"><div class="heading"><h2 class="serif">The numbers</h2></div>
      <div class="stats">${cards.map(c=>`<div class="stat"><div class="v" ${String(c[0]).length>8?'style="font-size:16px"':""}>${esc(String(c[0]))}</div><div class="k">${esc(c[1])}</div></div>`).join("")}</div>
    </div>
    <div class="sec"><div class="heading"><h2 class="serif">Genres, honestly rated</h2></div>
      <div class="hcard">${topG.length?topG.map(x=>{
        const g=x[0],a=gn[g]?gsum[g]/gn[g]:null;
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="chip" style="background:${genres[g]||"#78716c"}">${esc(g)}</span>
          <span class="prog" style="flex:1"><i style="width:${a!=null?a*10:0}%"></i></span>
          <span class="rr" style="width:120px;text-align:right">${a!=null?"★ "+a.toFixed(1)+" avg":"unrated"} · ${x[1]} book${x[1]===1?"":"s"}</span></div>`;}).join(""):'<span class="none">No genres yet.</span>'}
      </div>
    </div>`;

  q("#anaGo").onclick=()=>{
    const text=buildAnalysis();
    const out=q("#anaOut");
    out.innerHTML=`<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.5;border:1px solid var(--line);
        border-radius:12px;padding:13px;margin-top:11px;max-height:460px;overflow:auto;background:var(--card)" id="anaText"></div>
      <div class="hrow2" style="margin-top:8px"><button class="btn" id="anaCopy">Copy it</button>
        <button class="btn" id="anaSave">Save as a file</button>
        <button class="btn" id="anaHide">Hide</button><span class="none" id="anaMsg"></span></div>`;
    q("#anaText").textContent=text;
    q("#anaCopy").onclick=async()=>{
      try{await navigator.clipboard.writeText(text);q("#anaMsg").textContent="Copied ✓";}
      catch(e){
        const r=document.createRange();r.selectNodeContents(q("#anaText"));
        const s=window.getSelection();s.removeAllRanges();s.addRange(r);
        q("#anaMsg").textContent="Selected — press Ctrl+C";
      }
      setTimeout(()=>{const el=q("#anaMsg");if(el)el.textContent="";},4000);
    };
    q("#anaSave").onclick=()=>{
      const blob=new Blob([text],{type:"text/plain"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download=`my-reading-${new Date().toISOString().slice(0,10)}.txt`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    };
    q("#anaHide").onclick=()=>{out.innerHTML="";};
  };
}

/* =============== editor =============== */
/* The colour wheel opens a dialog, which drops focus and clears the text selection.
   Track the last selection inside an editable so we can put it back. */
let savedRange=null,savedEd=null;
function saveSel(){
  const s=window.getSelection();
  if(!s||!s.rangeCount)return;
  const n=s.getRangeAt(0).commonAncestorContainer;
  const el=n.nodeType===1?n:n.parentElement;
  const ed=el&&el.closest&&el.closest('[contenteditable="true"]');
  if(ed){savedRange=s.getRangeAt(0).cloneRange();savedEd=ed;}
}
document.addEventListener("selectionchange",saveSel);

/* "view" shows only what's filled in; "edit" is the form. A book you've never
   touched opens in the form, since it's waiting to be filled in. */
let bookMode="view";
function renderBook(){bookMode==="edit"?renderEditor():renderBookView();syncHistory();}
function setBookMode(m){bookMode=m;renderBook();}
async function openBook(id,fresh){
  const found=books.find(b=>b.id===id);
  isNew=!found;
  bookMode=(!found||isRaw(found))?"edit":(settings.bookEdit?"edit":"view");
  cur=Object.assign(blankBook(id),found?JSON.parse(JSON.stringify(found)):{});
  const c=await dbGet("covers",id);curCover=c?c.data:null;
  curImgs={};
  for(const im of cur.images||[]){const d=await loadImgData(id+"|"+im.id);if(d)curImgs[im.id]=d;}
  curEnt={};
  for(const en of cur.entries||[]){if(!en.cover)continue;const d=await loadImgData(id+"|"+en.id);if(d)curEnt[en.id]=d;}
  await preloadPads();
  mode="write";
  fitScreen=(settings.fit==null)?window.innerWidth<700:!!settings.fit;   /* auto on phones, else your choice */
  view="book";renderBook();
}

function setSaved(ok){const el=q("#saveMsg");if(el){el.textContent=ok?"Saved":"Saving…";el.className="savemsg "+(ok?"ok":"no");}}
async function commitCur(){
  const after=JSON.parse(JSON.stringify(cur));
  const i=books.findIndex(b=>b.id===cur.id);
  const before=i>=0?JSON.parse(JSON.stringify(books[i])):null;
  const strip=o=>{const c={...o};delete c.modified;return JSON.stringify(c);};
  if(before&&strip(before)===strip(after)){setSaved(true);return;}
  /* beat our previous save AND anything the cloud has shown us, so a device whose
     clock runs fast can't have its older copy win forever */
  after.modified=Math.max(Date.now(),((before&&before.modified)||0)+1,(SYNC.seen[cur.id]||0)+1);
  after.touched=true;cur.touched=true;   /* you've worked on it — no longer a raw import */
  cur.modified=after.modified;
  try{await dbPut("books",after);}
  catch(e){
    const el=q("#saveMsg");if(el){el.textContent="Couldn't save!";el.className="savemsg no";}
    if(Date.now()-(commitCur.warned||0)>60000){commitCur.warned=Date.now();
      alert("This couldn't be saved — storage may be full.\n\nExport a backup from the Overview tab, then delete some pictures or old backups.");}
    return;
  }
  pushOp({t:"book",id:cur.id,before,after:JSON.parse(JSON.stringify(after))});
  if(i>=0)books[i]=after;else books.unshift(after);
  if(SYNC.on){if(deletions[cur.id]){delete deletions[cur.id];saveDeletions();}enqueue({kind:"book",id:cur.id});}
  isNew=false;setSaved(true);
}
function scheduleSave(){
  setSaved(false);clearTimeout(saveTimer);
  saveTimer=setTimeout(commitCur,700);
}

/* ---------- the book, read rather than edited ----------
   Everything empty simply isn't here: no pickers, no "Add… (Enter)", no boxes
   waiting to be filled. What you did fill in is gathered close together. */
let vStatusOpen=false;
/* the two things worth changing without opening the form. Saved and undoable
   exactly like an edit made inside it. */
async function quickEdit(mut){
  const stored=books.find(x=>x.id===cur.id);
  const before=stored?JSON.parse(JSON.stringify(stored)):null;
  mut(cur);
  cur.touched=true;
  cur.modified=Math.max(Date.now(),(cur.modified||0)+1,(SYNC.seen[cur.id]||0)+1);
  const after=JSON.parse(JSON.stringify(cur));
  pushOp({t:"book",id:cur.id,before,after:JSON.parse(JSON.stringify(after))});
  try{await dbPut("books",after);}catch(e){alert("Couldn't save — storage may be full.");return;}
  const i=books.findIndex(x=>x.id===cur.id);
  if(i>=0)books[i]=after;else books.unshift(after);
  if(SYNC.on){enqueue({kind:"book",id:cur.id});flushQueue();}
  renderBookView();
}

          ${L?`<a class="tlink" href="${esc(L.url)}" target="_blank" rel="noopener" title="Read it — ${esc(L.name)}">📖</a>`:""}</div>
        ${(b.fandoms||[]).length?`<div class="vline2">${(b.fandoms||[]).map(esc).join(", ")}${(b.characters||[]).length?" · "+(b.characters||[]).map(esc).join(", "):""}</div>`:""}

            ${STATUSES.map(([k,l])=>`<button data-vst="${k}" class="${!b.dnf&&statusOf(b)===k?"on":""}">${k==="finished"?"✓":k==="reading"?"📖":"★"} ${l}</button>`).join("")}

    if(hs.length&&!fitScreen)page.style.minHeight=Math.max(...hs)+"px";

  function clearHighlight(range,ed){

    if(p.hidden){
      q("#padPanel").hidden=true;q("#padPanel").innerHTML="";
      p.hidden=false;btn.classList.add("on");
      drawBgPicker(p,()=>cur.bg||{id:"default",opacity:100},v=>{cur.bg=v;scheduleSave();},true,closeBgPanel);
    }else closeBgPanel();

  /* simple fields */
  const bind=(id,key,filter)=>{const el=q(id);el.addEventListener("input",()=>{cur[key]=filter?filter(el.value):el.value;scheduleSave();});};
  bind("#fTitle","title");
  bind("#fDate","dateFinished");
  q("#fRate").addEventListener("input",e=>{const v=e.target.value;cur.rating=v===""?null:Math.min(10,Math.max(0,parseFloat(v)||0));scheduleSave();});
  q("#fPages").addEventListener("input",e=>{const v=e.target.value;cur.pages=v===""?"":Math.max(1,parseInt(v)||0);renderProgress();scheduleSave();});
  q("#fFav").onclick=e=>{cur.favorite=!cur.favorite;e.currentTarget.classList.toggle("favon",cur.favorite);scheduleSave();};
  q("#fDnf").onclick=e=>{cur.dnf=!cur.dnf;e.currentTarget.classList.toggle("dnfon",cur.dnf);renderDnf();scheduleSave();};
  q("#rrUp").onclick=()=>{cur.rereads=(cur.rereads||0)+1;q("#rrN").textContent=cur.rereads;scheduleSave();};
