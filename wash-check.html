<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Shelf — the covers wash, four ways</title>
<style>
  :root{ --bg:#faf7f2; --card:#fff; --ink:#292524; --mut:#78716c; --line:#e7e5e4; --teal:#2dd4bf; }
  @media(prefers-color-scheme:dark){
    :root{ --bg:#1c1917; --card:#292524; --ink:#e8e6e3; --mut:#a8a29e; --line:#44403c; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:18px;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:22px;margin:0 0 4px}
  .lede{color:var(--mut);max-width:62ch;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
  button{font:inherit;padding:8px 16px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer}
  button.pri{background:var(--teal);border-color:var(--teal);color:#06302b;font-weight:600}
  .counts{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0}
  .stat{border:1px solid var(--line);border-radius:11px;padding:9px 13px;min-width:120px}
  .stat b{display:block;font-size:23px;line-height:1.15}
  .stat span{color:var(--mut);font-size:12px}
  .big{border-color:var(--teal)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
  .opt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .opt.rec{border-color:var(--teal);border-width:2px}
  .opt h2{font-family:Georgia,serif;font-size:16px;margin:0;padding:11px 13px 0}
  .opt .why{color:var(--mut);font-size:12.5px;padding:3px 13px 10px;margin:0;min-height:52px}
  .opt .tag{display:inline-block;background:var(--teal);color:#06302b;font-size:11px;
    font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
  .wash{height:150px;background-size:cover;background-position:center;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line)}
  .real{height:150px;position:relative;background:var(--bg);border-bottom:1px solid var(--line)}
  .real .lay{position:absolute;inset:0;background-size:cover;background-position:center}
  .real .demo{position:absolute;inset:0;padding:12px 14px;font-size:13px}
  .real .demo .row{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;margin:0 0 7px;box-shadow:0 1px 2px #0001}
  .cap{padding:9px 13px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
  .ctrls{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
  .ctrl{flex:1 1 250px}
  .ctrl label{display:block;font-size:13px;margin:0 0 3px}
  .ctrl input{width:100%}
  .ctrl .n{font-weight:700;color:var(--teal)}
  .note{font-size:12.5px;color:var(--mut)}
  .err{color:#b91c1c}
</style>
</head>
<body>

<h1>The covers wash, four ways</h1>
<p class="lede">This reads the shelf stored in <em>this</em> browser, at <em>this</em> address —
open it at the same address you use the app, or it will find nothing. It only ever reads;
it never writes anything back.</p>

<div class="card">
  <button class="pri" id="go">Read my shelf and draw them</button>
  <span class="note" id="say" style="margin-left:10px"></span>
  <div class="counts" id="counts"></div>
</div>

<div class="card" id="ctrlCard" hidden>
  <div class="ctrls">
    <div class="ctrl">
      <label>At most <span class="n" id="capN">6</span> covers from any one collection
        <span class="note">(only affects the capped option)</span></label>
      <input type="range" id="cap" min="1" max="40" value="6">
    </div>
    <div class="ctrl">
      <label><span class="n" id="totN">24</span> covers go into the wash
        <span class="note">(the app uses 24 today)</span></label>
      <input type="range" id="tot" min="4" max="60" value="24">
    </div>
    <div class="ctrl">
      <label>Shown over the page at <span class="n" id="opN">12</span>%
        <span class="note">(what the app starts at)</span></label>
      <input type="range" id="op" min="4" max="60" value="12">
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
/* ---- read-only helpers over the app's own database ---- */
let db=null;
function openDb(){return new Promise((res,rej)=>{
  const r=indexedDB.open("myShelf");        /* no version: never upgrade, never create stores */
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error||new Error("could not open the database"));
});}
const dbAll=s=>new Promise(res=>{
  try{const g=db.transaction(s,"readonly").objectStore(s).getAll();
    g.onsuccess=()=>res(g.result||[]);g.onerror=()=>res([]);}catch(e){res([]);}
});
const dbGet=(s,k)=>new Promise(res=>{
  try{const g=db.transaction(s,"readonly").objectStore(s).get(k);
    g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);}catch(e){res(null);}
});
const isColl=b=>(b.type||((b.series||"").trim()?"series":"standalone"))==="collection";

/* ---- the app's own wash, lifted exactly: 90x126 tiles, blur 38, drawn oversized ---- */
async function wash(srcs,total){
  if(!srcs.length)return null;
  /* the same even spread the app now uses: the picks are laid across the whole
     list with the first and last included, instead of stepping by a floored
     fraction and running out before the end */
  let picked;
  if(srcs.length<=total)picked=srcs.slice();
  else if(total===1)picked=[srcs[Math.floor(srcs.length/2)]];
  else{picked=[];for(let i=0;i<total;i++)picked.push(srcs[Math.round(i*(srcs.length-1)/(total-1))]);}
  const imgs=await Promise.all(picked.map(s=>new Promise(r=>{
    const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=s;})));
  const live=imgs.filter(Boolean);
  if(!live.length)return null;
  const cols=Math.ceil(Math.sqrt(live.length)),rows=Math.ceil(live.length/cols);
  const CW=90,CH=126;
  const a=document.createElement("canvas");a.width=cols*CW;a.height=rows*CH;
  const ax=a.getContext("2d");
  live.forEach((im,i)=>{try{ax.drawImage(im,(i%cols)*CW,Math.floor(i/cols)*CH,CW,CH);}catch(e){}});
  const b=document.createElement("canvas");b.width=a.width;b.height=a.height;
  const bx=b.getContext("2d");
  bx.filter="blur(38px)";
  const over=90;
  bx.drawImage(a,-over,-over,a.width+over*2,a.height+over*2);
  bx.filter="none";
  try{return b.toDataURL("image/jpeg",0.72);}catch(e){return null;}
}

/* ---- gather ---- */
let SHELF=null;
async function gather(){
  const books=await dbAll("books");
  const bookCovers=[],perColl=[];
  let collN=0,storyCoverN=0,bookCoverN=0,ownCoverColls=0;
  for(const b of books){
    const r=await dbGet("covers",b.id);
    const own=r&&r.data?r.data:null;
    if(own){bookCovers.push({src:own,from:b.id});bookCoverN++;}
    if(isColl(b)){
      collN++;
      if(own)ownCoverColls++;
      const mine=[];
      for(const en of (b.entries||[])){
        if(!en||!en.cover)continue;
        const im=await dbGet("images",b.id+"|"+en.id);
        if(im&&im.data){mine.push(im.data);storyCoverN++;}
      }
      if(mine.length||own)perColl.push({id:b.id,own,stories:mine});
    }
  }
  return {books,bookCovers,perColl,collN,storyCoverN,bookCoverN,ownCoverColls,
    plainBookCovers:bookCovers.length-ownCoverColls};
}

/* ---- the four pools ---- */
function poolToday(S){ return S.bookCovers.map(x=>x.src); }
function poolFlat(S){
  /* every cover there is, kept in shelf order so the even sampling still spreads */
  const out=[];
  const byColl=new Map(S.perColl.map(c=>[c.id,c]));
  for(const b of S.books){
    const c=byColl.get(b.id);
    const own=S.bookCovers.find(x=>x.from===b.id);
    if(own)out.push(own.src);
    if(c)for(const s of c.stories)out.push(s);
  }
  return out;
}
function poolCapped(S,cap){
  const out=[];
  const byColl=new Map(S.perColl.map(c=>[c.id,c]));
  for(const b of S.books){
    const c=byColl.get(b.id);
    const own=S.bookCovers.find(x=>x.from===b.id);
    if(own)out.push(own.src);
    if(c&&c.stories.length){
      /* spread the allowance across the collection instead of taking its first few */
      if(c.stories.length<=cap)out.push(...c.stories);
      else if(cap===1)out.push(c.stories[Math.floor(c.stories.length/2)]);
      else for(let i=0;i<cap;i++)out.push(c.stories[Math.round(i*(c.stories.length-1)/(cap-1))]);
    }
  }
  return out;
}
function poolOnePer(S){
  const out=[];
  const byColl=new Map(S.perColl.map(c=>[c.id,c]));
  for(const b of S.books){
    const c=byColl.get(b.id);
    const own=S.bookCovers.find(x=>x.from===b.id);
    if(!isColl(b)){ if(own)out.push(own.src); continue; }
    if(own)out.push(own.src);
    else if(c&&c.stories.length)out.push(c.stories[0]);
  }
  return out;
}

const OPTS=[
  {k:"today", t:"Today", rec:false,
   why:"Only covers that belong to a book in its own right. A story's picture inside a collection is never asked for.",
   pool:S=>poolToday(S)},
  {k:"flat", t:"Everything, flat", rec:false,
   why:"Every cover you own, in shelf order. Honest, but a collection holding most of your pictures paints most of the wash.",
   pool:S=>poolFlat(S)},
  {k:"cap", t:"Everything, capped", rec:true,
   why:"Every collection joins in, none of them takes over. The slider is the allowance each one gets. This is what the app now does, with the allowance set to 8.",
   pool:(S,cap)=>poolCapped(S,cap)},
  {k:"one", t:"One per collection", rec:false,
   why:"A collection counts once, like a single book. Closest to today — barely changes anything if your pictures live inside collections.",
   pool:S=>poolOnePer(S)}
];

const $=id=>document.getElementById(id);
function stat(n,l,big){return `<div class="stat${big?" big":""}"><b>${n}</b><span>${l}</span></div>`;}

async function draw(){
  const S=SHELF; if(!S)return;
  const cap=+$("cap").value, tot=+$("tot").value, op=+$("op").value;
  $("capN").textContent=cap; $("totN").textContent=tot; $("opN").textContent=op;
  const g=$("grid");
  if(!g.children.length){
    g.innerHTML=OPTS.map(o=>`<div class="opt${o.rec?" rec":""}" id="opt-${o.k}">
      <h2>${o.t}${o.rec?'<span class="tag">suggested</span>':""}</h2>
      <p class="why">${o.why}</p>
      <div class="wash" id="w-${o.k}"></div>
      <div class="real" id="r-${o.k}">
        <div class="lay" id="l-${o.k}"></div>
        <div class="demo"><div class="row">A book on your shelf</div>
          <div class="row">Another one</div><div class="row">And a third</div></div>
      </div>
      <div class="cap" id="c-${o.k}">…</div></div>`).join("");
  }
  for(const o of OPTS){
    const pool=o.pool(S,cap);
    const img=await wash(pool,tot);
    $("w-"+o.k).style.backgroundImage=img?`url("${img}")`:"none";
    const lay=$("l-"+o.k);
    lay.style.backgroundImage=img?`url("${img}")`:"none";
    lay.style.opacity=op/100;
    const used=Math.min(pool.length,tot);
    $("c-"+o.k).textContent=pool.length
      ? `${pool.length} cover${pool.length===1?"":"s"} to choose from — ${used} used. Top strip is the wash itself; below it, the same thing at ${op}% behind rows.`
      : "No covers at all in this one.";
  }
}

$("go").onclick=async()=>{
  const say=$("say");
  say.textContent="reading…"; say.className="note";
  try{
    db=await openDb();
    if(!db.objectStoreNames.contains("books")){
      say.textContent="There is no shelf saved at this address. Open this page where you actually use the app.";
      say.className="note err"; return;
    }
    SHELF=await gather();
    const S=SHELF;
    $("counts").innerHTML=
      stat(S.books.length,"things on the shelf")+
      stat(S.plainBookCovers,"covers on plain books")+
      stat(S.ownCoverColls,"collections with a cover of their own")+
      stat(S.storyCoverN,"covers on stories inside collections",true)+
      stat(S.bookCoverN,"the wash can see today")+
      stat(S.bookCoverN+S.storyCoverN,"it could see",true);
    say.textContent=S.storyCoverN
      ? `${S.storyCoverN} of your covers are invisible to the wash today.`
      : "Every cover you have is already visible to the wash.";
    say.className="note";
    $("ctrlCard").hidden=false;
    await draw();
  }catch(e){
    say.textContent="Could not read the shelf: "+e.message;
    say.className="note err";
  }
};
["cap","tot","op"].forEach(id=>{
  $(id).oninput=()=>{ $("capN").textContent=$("cap").value;
    $("totN").textContent=$("tot").value; $("opN").textContent=$("op").value; };
  $(id).onchange=draw;
});
</script>
</body>
</html>
